<tr rel="{{:index}}">
    <td > 
        <span class="block">
            <a href="#" class="detalle-sistema">{{:codigoGrupo}}</a>	
        </span>
    </td>
    <td class="text-left v-middle">
        <span class="block">{{:nombreCurso}}</span>
    </td>
    <td>
        <span class="block">{{:docenteNombre}}</span>
    </td>
    <td class="text-left v-middle">
        <span class="block">{{:version}}</span>
    </td>

    <td class="text-center v-middle">
        <span class="block">{{:estadoPlanValue}}</span>
    </td>
    <td class="text-center v-middle">
        <span class="block">{{:estadoGrupoValue}}</span>
    </td>
    <td>
        {{if estadoGrupoCerrado==true}}     
        {{if estadoPlanAceptado==true}}  
        <div class="dropdown actions">
            <a class="dropdown-toggle" href="#" data-toggle="dropdown"><i class="glyphicon glyphicon-cog"></i></a>
            <ul class="dropdown-menu pull-right" >
                <li role="presentation">
                    <a class="reabrir" rel="{{:idGrupo}}" href="#">Reabrir</a>
                </li>
            </ul>
        </div>
        {{/if}}
        {{/if}}  
    </td>

</tr>
