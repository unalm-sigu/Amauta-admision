<input  id="txtPlanCalificacion" type="hidden" th:value="${planCalificacion.id}"/>
<input  id="txtCurso" type="hidden" th:value="${curso.id}"/>
<input  id="txtGrupo" type="hidden" th:value="${grupoSeccion.id}"/>


<table class="table table-striped">
    <thead>
        <tr class=""> 
            <th class="col-md-1">Código</th>
            <th class="col-md-4">Tipo Calificación</th>
            <th class="col-md-2 text-center">Cantidad</th>
            <th class="col-md-2 text-center">Peso</th>
            <th class="col-md-2 text-center">Porcentaje Var.</th>
            <th class="col-md-3 text-center">Profesor</th>
        </tr>
    </thead>

    <tbody>
        <tr th:each="evas : ${planCalificacion.evaluacionPlan}">
            <td  class="v-middle"><span th:text="${evas.tipoEvaluacion.codigo}">EP</span></td>

            <td  class="v-middle">
                <span th:text="${evas.tipoEvaluacion.nombre}">Examen Parcial</span>
            </td>
            <td class="text-center v-middle">
                <span class="block" th:text="${evas.cantidadEvaluaciones}" >1</span>
            </td>
            <td class="text-center v-middle">
                <span class="block"  th:text="${evas.pesoTotal + ' %'}"  >20 %</span>
            </td>
            <td class="text-center v-middle">
                <span class="block"  th:if='${evas.indPorcentajeVariable==1}'>Si</span>
                <span class="block"  th:if='${evas.indPorcentajeVariable==0}'>No</span>
            </td>
            <td class="text-center v-middle">
                <span class="label label-default" th:text="${evas.tipoSeccionEnum.value}">Teoria</span>
            </td>
        </tr>

    </tbody>
</table>

<div class="">	
    <span class="block"><strong>Descripcion:</strong> <span th:text="${planCalificacion.descripcion}">100</span></span>
    <span class="block"><strong>Nota Base:</strong> <span th:text="${planCalificacion.notaBase}">100</span></span>
    <span class="block"><strong>Formula:</strong> <span th:text="${planCalificacion.formula}">1EP(20) + 1EF(30) + 5(1)PC(40) + 3(1)TA(10)</span></span>
    <span class="block"><strong>Sistema de Notas:</strong> <span th:text="${planCalificacion.sistemaNotas.nombre}">1 al 20</span></span>

    <span class="block" th:if="${planCalificacion.estadoObservado || planCalificacion.estadoRechazado}">
        <strong>Observación:</strong> <span  th:text="${planCalificacion.observacion}">1 al 20</span>
    </span>
    <span class="block" th:if="${planCalificacion.estadoSolicitado}">
        <strong>Sustento</strong> <span  th:text="${planCalificacion.sustento}">1 al 20</span>
    </span>
</div>


<span class="block m-b" th:if="${tieneCursos}">Cursos </span>



<table th:if="${tieneCursos}" class="table table-striped" id="dynaTable">
    <thead>
        <tr class=""> 
            <th class="col-md-1 v-middle text-center">Código</th>
            <th class="col-md-8 v-middle">Curso</th>
            <th class="col-md-2 v-middle text-center">Fecha de Inclusión</th>
            <th class="col-md-1 v-middle text-center">TPC</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="curso : ${cursosByPlan}">
            <td class="v-middle text-center">
                <span th:text="${curso.codigo}"></span>
            </td>
            <td class="v-middle">
                <span th:text="${curso.nombre}"></span>
            </td>
            <td class="v-middle text-center">
                <span th:text="${#dates.format(curso.fechaPlanCalificacion, 'dd/MM/yyyy')}"></span>
            </td>
            <td class="v-middle text-center">
                <span th:text="${curso.tpc}"></span>
            </td>
        </tr>

    </tbody>
</table>
