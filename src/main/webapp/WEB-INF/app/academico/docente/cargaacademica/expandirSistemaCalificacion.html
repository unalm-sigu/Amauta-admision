<html layout:decorator="zlayout/layout">
    <head>
        <title>Carga Academica</title>
    <div th:substituteby="zlayout/includes :: styles-dynatable"></div>
</head>

<body> 
    <div layout:fragment="main">
        <header class="page-header">      
            <h2>Evaluadores - <span th:text="${ciclo.descripcion}">Sistema de Calificación SC-33</span></h2>
            <span class="block"><strong>Curso:</strong> <span th:text="${curso.nombre}">Matemática Básica</span></span>
            <span class="block"><strong>Claves:</strong > <span th:text="${claves}">2020, 2021, 2022</span></span>
            <span class="block"><strong>Sist. Calificación:</strong > <span th:text="${planCalificacion.codigo}">2020, 2021, 2022</span></span>
            <span class="block"><strong>Fórmula:</strong > <span th:text="${planCalificacion.formula}">2020, 2021, 2022</span></span>
            
            <input id="txtPlanCalificaId" type="hidden" th:value="${planCalificacion.id}"/>
            <input id="txtEvalSeccionId" name="evaluacionSeccionId" type="hidden" th:value="${evaluacionSeccion.id}"/>
            <input id="txtGrupoSeccionId" type="hidden" th:value="${grupoSeccion.id}"/>
            <input id="txtPermiteAsig" type="hidden" th:value="${permiteAsignar}"/>

        </header>

        <section class="panel">
            <section class="panel-body">
                <table id="dynaTable" class="table table-striped">
                    <thead> 
                        <tr class=""> 
                            <!--th class="col-md-1">Código</th-->
                            <th class="col-md-6">Evaluación</th>
                            <th class="col-md-3 text-center">Tipo</th>
                            <th class="col-md-1 text-center">Numero</th>
                            <th class="col-md-2 text-center">Peso</th>
                            <th th:if="${permiteAsignar}" class="v-middle">Asign Doc</th>
                            <th class="v-middle">Expandir</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </section>
        </section>

        <div class="line line-dashed b-b line-lg pull-in"></div>

        <div class="form-group">
            <div class="text-center">

                <button id="btnAceptarExp" class="btn btn-sm btn-primary" style="display:none;">Aceptar</button>

                <a th:href="@{/academico/docente/cargaacademica}" class="btn btn-sm btn-link">Regresar</a>
            </div>
        </div>

        <div th:substituteby="app/templates/modal"/>

        <script id="templateEvaluacionPlan" type="text/x-jsrender" class="hide"><div th:substituteby="app/academico/docente/cargaacademica/templateEvaluacionPlan"/></script>
    </div>
    <div layout:fragment="js">
        <div th:substituteby="zlayout/includes :: javascript-dynatable"/>
        <script th:src="@{/app/academico/docente/cargaacademica/expandirSistemaCalificacion.js}" charset="utf-8"></script>
    </div>
</body>
</html>
