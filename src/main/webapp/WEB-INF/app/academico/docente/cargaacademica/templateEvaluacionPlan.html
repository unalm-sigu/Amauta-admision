<tr  rel="{{:evaPlanId}}">

    <!--td class="v-middle" style="{{:styleHijo}}">
        <span class="block">{{:tipoEvalCod}}</span>
    </td-->
    <td class="v-middle" style="{{:styleHijo}}">
        <span class="block text-primary" >{{:tipoEvalCod}} - {{:tipoEvalNombre}}</span>
        {{:docentes}}
    </td>
    <td class="v-middle">

        {{if desagregado==false}}
        <select class="select2 cboTipoSecEval"
                rel="{{:evaPlanId}}">
            {{for tipoSeccionesEval}}
            {{if #data.selected==true}}
            <option selected="true" value="{{:#data.codigo}}">{{:#data.nombre}}</option>
            {{/if}}
            {{if #data.selected==false}}
            <option  value="{{:#data.codigo}}">{{:#data.nombre}}</option>
            {{/if}}
            {{/for}}
            {{/if}}
        </select>
    </td>
    <td class="v-middle">
        <span class="block text-center">{{:numero}}</span>
    </td>
    <td class="v-middle text-center">
        <span class="block" >{{:pesoEvaluacion}} %</span>
    </td>
    {{if permiteAsign==true}}
    <td class="v-middle text-center">
        {{if desagregado==false}}
        <a href="#"  rel="{{:evaPlanId}}" 
           class="btn btn-default asignar-docente"><i class="fa fa-paperclip text-primary"></i></a>
        {{/if}}
    </td>
    <td class="v-middle text-center">
        {{if esHijo==false}}
        {{if notasIngresadas==false}}
        <a href="#"  rel="{{:evaPlanId}}" 
           class="btn btn-default expandir-evaluacion"><i class="fa fa-expand text-primary"></i></a>
        {{/if}}
        {{/if}}
        {{if esHijo==true}}
        <!--
        <a href="#" rel="{{:evaPlanId}}"  class="btn btn-default delete-expansion"><i class="fa fa-times text-danger"></i></a> -->
        {{/if}}
    </td>
    {{/if}}

</tr>
