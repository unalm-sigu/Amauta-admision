<html layout:decorator="zlayout/layout">
    <head>
        <title>Registro de Notas</title>
    <div th:substituteby="zlayout/includes :: styles-dynatable"></div>
</head>

<body>
    <div layout:fragment="main">
        <header class="page-header">        
            <div class="pull-right" >
                <!--
                <a class="btn btn-primary activar-evaluacion" href="#" >Activar evaluación</a>
                -->
            </div>

            <h2>Registro de Notas - <span>2016-II</span></h2>
            <span class="block"><strong>Curso:</strong> <span th:text="${curso.nombre}">Fitomejoramiento Genético</span></span>
            <span class="block"><strong>Tipo sección:</strong>
                <span th:text="${docenteSeccion.seccion.tipoSeccionEnum.value}">Teoría</span>
            </span>
            <span class="block"><strong>Clave:</strong> <span th:text="${seccion.codigo}">2130</span></span>
            <span class="block"><strong>Sistema Notas:</strong> <span th:text="${sistemaNotas.nombre}">2130</span></span>
            <input id="txtSistemaNotas" type="hidden" th:value="${sistemaNotas.id}"/>

            <button href="#" id="cmbReporteNotas" >Reporte</button>

            <style>
                body    {overflow-x:scroll;}
                table { 
                    border-collapse: separate; 
                }
                div.notas { 
                    width: auto; 
                    overflow-x:scroll;  
                    margin-left:195px; 
                    overflow-y:visible;
                }
                .headcol {
                    position:absolute; 
                    width: 236px;
                    left:15px;
                }
            </style>

        </header>

        <section class="panel">
            <section class="panel-body">
                <input id="txtCodeSel" type="hidden"/>
                <input id="txtDocSec" type="hidden" th:value='${docenteSeccion.id}'/>
                <form id="frmNotas">
                    <div class="notas">
                        <table class="table table-striped" id="tableNotas">
                            <thead> 
                                <tr class=""> 
                                    <th class="col-md-3 headcol"></th>

                                    <th class="text-center v-middle"  
                                        th:each="evaluacion : ${evaluacionesByTipoSeccion}" 
                                        style="width: 100px;">
                                        <span href="#" vclass="detalle-reporte"
                                              th:unless="${seccion.id==evaluacion.seccionResponsable.id}"
                                              th:rel="${evaluacion.id}"
                                              th:text="${evaluacion.tipoEvaluacion.codigo}+${evaluacion.numero}">EP</span>	
                                        <a href="#" class="detalle-reporte"
                                           style="color: #3366ff !important;"
                                           th:if="${seccion.id==evaluacion.seccionResponsable.id}"
                                           th:rel="${evaluacion.id}"
                                           th:text="${evaluacion.tipoEvaluacion.codigo}+${evaluacion.numero}">EP</a>	

                                    </th>
                                    <th class="text-center v-middle">Avance NF</th>
                                    <th class="text-center v-middle">NF</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody> 
                                <tr th:each="matSeccion : ${matriculasSeccion}" style="height: 50px;">
                                    <td class="v-middle headcol">
                                        <span class="block text-primary" th:text="${matSeccion.matriculaResumen.alumno.persona.apellidosNombres}">Alvarez Perez Juan</span>
                                        <span class="block" th:text="${matSeccion.matriculaResumen.alumno.codigo}">Alvarez Perez Juan</span>
                                    </td>
                                    <td class="text-center v-middle" th:each="evaluacion : ${evaluacionesByTipoSeccion}" >

                                        <div th:class="${evaluacion.tipoEvaluacion.codigo}+${evaluacion.numero}" >
                                            <span style="display: ''" 
                                                  th:name="${evaluacion.id}" 
                                                  th:class="${matSeccion.matriculaResumen.alumno.id}"
                                                  >
                                                <span  th:if="${notas[matSeccion.matriculaResumen.alumno.id+'-'+evaluacion.id]}" >
                                                    <span class="nota-academica" th:text="${notas[matSeccion.matriculaResumen.alumno.id+'-'+evaluacion.id]}" > 04.18 </span>
                                                </span>
                                            </span>
                                        </div>
                                        <input th:name="${evaluacion.tipoEvaluacion.codigo}+${evaluacion.numero}" 
                                               th:rel="${matSeccion.matriculaResumen.alumno.id}"
                                               th:title="${evaluacion.id}" 
                                               type="text" 
                                               class="form-control"
                                               style="display: none; width:50px; padding: 3px !important;"
                                               size="3"/>

                                    </td>
                                    <td class="text-center v-middle">

                                        <span  th:if="${matriculaCursoMap[matSeccion.matriculaResumen.alumno.id]}" >
                                            <span class="nota-academica" th:text="${matriculaCursoMap[matSeccion.matriculaResumen.alumno.id].notaAvance}" > 04.18 </span>
                                        </span>

                                    </td>
                                    <td class="text-center v-middle">

                                        <span  th:if="${matriculaCursoMap[matSeccion.matriculaResumen.alumno.id]}" >
                                            <span class="nota-academica" th:text="${matriculaCursoMap[matSeccion.matriculaResumen.alumno.id].notaAcumulada}" > 04.18 </span>
                                        </span>

                                    </td>

                                    <td class="text-center v-middle">
                                        <div class="dropdown actions">
                                            <a class="dropdown-toggle" href="#" data-toggle="dropdown"><i class="glyphicon glyphicon-cog"></i></a>
                                            <ul class="dropdown-menu pull-right" >
                                                <li role="presentation">
                                                    <a class="solicitar-cambio-nota" 
                                                       href="#"
                                                       th:rel="${matSeccion.id}">Cambio nota</a>
                                                </li>
                                            </ul>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </form>


            </section>
            <section class="panel-footer pull-right">
                <!-- 
                <a href="#" class="btn btn-link cancelar">Cancelar</a>
                -->
                <a href="#" id="cmbSaveNotas" class="btn btn-success">Grabar Notas</a>


            </section>


        </section>

        <div th:substituteby="app/templates/modal"/>
        <div th:substituteby="app/academico/docente/cargaacademica/detalleNotasAcademicas"/>
        <div th:substituteby="app/academico/docente/cargaacademica/modalNotasAcademicas"/>
        <script id="templateCargaAcademica" type="text/x-jsrender" class="hide"><div th:substituteby="app/academico/docente/cargaacademica/templateCargaAcademica"/></script>
    </div>
    <div layout:fragment="js">
        <div th:substituteby="zlayout/includes :: javascript-dynatable"/>
        <script th:src="@{/app/academico/docente/cargaacademica/notasAcademicas.js}" charset="utf-8"></script>
    </div>


</body>
</html>
