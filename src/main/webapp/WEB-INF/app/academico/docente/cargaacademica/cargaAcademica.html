<html layout:decorator="zlayout/layout">
    <head>
        <title>Carga Academica</title>
    <div th:substituteby="zlayout/includes :: styles-dynatable"></div>
</head>

<body>
    <div layout:fragment="main">
        <header class="page-header">        
            <h2>Carga Académica - <span>2016-II</span></h2>
            <span class="block"><strong>Docente:</strong> <span  th:text="${docente.persona.nombreCompleto}">Juan Perez</span></span>
            <span class="block"><strong th:text="${dptoAcad.nombre}">Departamento Academico:</strong> Matematicas</span>
        </header>

        <section class="panel">
            <section class="panel-body">
                <table class="table table-striped" id="dynaTable">
                    <thead> 
                        <tr class=""> 
                            <th class="col-md-5">Curso</th>
                            <th class="col-md-2 text-center">Clave</th>
                            <th class="col-md-2 text-center">Carga</th>
                            <th class="col-md-2 text-center">Sistema de calificación</th>
                            <th class="col-md-1 text-center">Estado</th>
                            <th class="v-middle"></th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </section>
        </section>

        <div th:substituteby="app/templates/modal"/>
        <script id="templateCargaAcademica" type="text/x-jsrender" class="hide"><div th:substituteby="app/academico/docente/cargaacademica/templateCargaAcademica"/></script>
    </div>
    <div layout:fragment="js">
        <div th:substituteby="zlayout/includes :: javascript-dynatable"/>
        <script th:src="@{/app/academico/docente/cargaacademica/cargaAcademica.js}" charset="utf-8"></script>
    </div>
</body>
</html>
