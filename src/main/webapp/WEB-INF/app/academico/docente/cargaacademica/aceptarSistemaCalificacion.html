<input  id="txtPlanCalificacion" type="hidden" th:value="${planCalificacion.id}"/>
<input  id="txtCurso" type="hidden" th:value="${curso.id}"/>
<input  id="txtGrupo" type="hidden" th:value="${grupoSeccion.id}"/>




    <div class="row">
        <div class="col-md-6">
            <div class="block">
                <strong>Descripcion:</strong> 
                <span th:text="${planCalificacion.descripcion}">100</span>
            </div>

            <div>
                <strong>Nota Base:</strong> 
                <span th:text="${planCalificacion.notaBase}">100</span>
            </div>
        </div>
        <div class="col-md-6">
            <div class="block">
                <strong>Formula:</strong> 

                <span th:text="${planCalificacion.formula}">1EP(20) + 1EF(30) + 5(1)PC(40) + 3(1)TA(10)</span>
            </div>
            <div>
                <strong>Sistema de Notas:</strong>

                <span th:text="${planCalificacion.sistemaNotas.nombre}">1 al 20</span>
            </div>
        </div>
    </div>

    <div class="row" th:if="${planCalificacion.estadoObservado || planCalificacion.estadoRechazado}">
        <div class="col-md-2" >
            <strong>Observación:</strong>
        </div>
        <div class="col-md-10" >
            <span  th:text="${planCalificacion.observacion}">1 al 20</span>
        </div>
    </div>


    <div class="row"  th:if="${planCalificacion.estadoSolicitado}">
        <div class="col-md-2" >
            <strong>Sustento</strong> 
        </div>
        <div class="col-md-10" >
            <span  th:text="${planCalificacion.sustento}">1 al 20</span>
        </div>
    </div>


<table class="table table-striped m-t-lg">
    <thead>
        <tr class=""> 
            <th class="col-md-1">Código</th>
            <th class="col-md-4">Tipo Calificación</th>
            <th class="col-md-2 text-center">Cantidad</th>
            <th class="col-md-1 text-center">Peso</th>
            <th class="col-md-2 text-center">Nota Min. Anulable</th>
            <th class="col-md-1 text-center">Porcentaje Var.</th>
            <th class="col-md-3 text-center">Profesor</th>
        </tr>
    </thead>

    <tbody>
        <tr th:each="evas : ${planCalificacion.evaluacionPlan}">
            <td  class="v-middle"><span th:text="${evas.tipoEvaluacion.codigo}">EP</span></td>

            <td  class="v-middle">
                <span th:text="${evas.tipoEvaluacion.nombre}">Examen Parcial</span>
            </td>
            <td class="text-center v-middle">

                <input class="form-control" type="text" th:value="${evas.cantidadEvaluaciones}" style="width: 100px;" min="0"/>
            </td>
            <td class="text-center v-middle">

                <input class="form-control" type="text" th:value="${evas.pesoTotal}" style="width: 100px;" min="0"/>

            </td>
            <td class="text-center v-middle">

                <label class="switch">
                    <input  type="checkbox" th:value='${evas.notaMinimaAnulable}'
                            rel="0"   class="calcular-peso-eva-chk" />
                    <span></span>
                </label>
            </td>
            <td class="text-center v-middle">

                <label class="switch">
                    <input  type="checkbox" th:value='${evas.indPorcentajeVariable}'
                            rel="0"   class="calcular-peso-eva-chk" />
                    <span></span>
                </label>
            </td>
            <td class="text-center v-middle">
                <span class="label label-default" th:text="${evas.tipoSeccionEnum.value}">Teoria</span>
            </td>
        </tr>

    </tbody>
</table>




<span class="block m-b" th:if="${tieneCursos}" style="display: none;">Cursos </span>



<table th:if="${tieneCursos}" class="table table-striped" id="dynaTable" style="display: none;">
    <thead>
        <tr class=""> 
            <th class="col-md-1 v-middle text-center">Código</th>
            <th class="col-md-8 v-middle">Curso</th>
            <th class="col-md-2 v-middle text-center">Fecha de Inclusión</th>
            <th class="col-md-1 v-middle text-center">TPC</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="curso : ${cursosByPlan}">
            <td class="v-middle text-center">
                <span th:text="${curso.codigo}"></span>
            </td>
            <td class="v-middle">
                <span th:text="${curso.nombre}"></span>
            </td>
            <td class="v-middle text-center">
                <span th:text="${#dates.format(curso.fechaPlanCalificacion, 'dd/MM/yyyy')}"></span>
            </td>
            <td class="v-middle text-center">
                <span th:text="${curso.tpc}"></span>
            </td>
        </tr>

    </tbody>
</table>
