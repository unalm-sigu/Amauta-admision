 
<tr th:each="matSeccion : ${matriculasSeccion}" style="height: 50px;">

    <td class="text-center v-middle" th:each="evaluacion : ${evaluacionesByTipoSeccion}" >

        <div th:class="${evaluacion.tipoEvaluacion.codigo}+${evaluacion.numero}" >
            <span style="display: ''" 
                  th:name="${evaluacion.id}" 
                  th:class="${matSeccion.matriculaResumen.alumno.id}"
                  >
                <span  th:if="${notas[matSeccion.matriculaResumen.alumno.id+'-'+evaluacion.id]}" >
                    <span class="nota-academica" th:text="${notas[matSeccion.matriculaResumen.alumno.id+'-'+evaluacion.id]}" > 04.18 </span>
                </span>
            </span>
        </div>
        <input th:name="${evaluacion.tipoEvaluacion.codigo}+${evaluacion.numero}" 
               th:rel="${matSeccion.matriculaResumen.alumno.id}"
               th:title="${evaluacion.id}" 
               type="text" 
               class="form-control"
               style="display: none; padding: 3px !important;"
               size="3"/>

    </td>
    <td class="text-center v-middle">

        <span  th:if="${matriculaCursoMap[matSeccion.matriculaResumen.alumno.id]}" >
            <span class="nota-academica" th:text="${matriculaCursoMap[matSeccion.matriculaResumen.alumno.id].notaAvance}" > 04.18 </span>
        </span>

    </td>
    <td class="text-center v-middle">

        <span  th:if="${matriculaCursoMap[matSeccion.matriculaResumen.alumno.id]}" >
            <span class="nota-academica" th:text="${matriculaCursoMap[matSeccion.matriculaResumen.alumno.id].notaAcumulada}" > 04.18 </span>
        </span>

    </td>

    <td class="text-center v-middle">
        <div class="dropdown actions">
            <a class="dropdown-toggle" href="#" data-toggle="dropdown"><i class="glyphicon glyphicon-cog"></i></a>
            <ul class="dropdown-menu pull-right" >

                <li role="presentation">
                    <a class="solicitar-cambio-nota" 
                       title="false"
                       href="#"
                       th:rel="${matSeccion.id}">Cambio nota</a>
                </li>
                <li role="presentation">
                    <a class="solicitar-cambio-nota" 
                       title="true"
                       href="#"
                       th:rel="${matSeccion.id}">Cambio nota NSP</a>
                </li>

            </ul>
        </div>
    </td>
    <td class="v-middle headcolNumber">
        <!--<span class="block text-primary" th:text="${(itrStat.index+1) + ')'}"></span>-->
    </td>
    <td class="v-middle headcol">
        <span class="block text-primary" th:text="${matSeccion.matriculaResumen.alumno.persona.apellidosNombres}">Alvarez Perez Juan</span>
        <span class="block" th:text="${matSeccion.matriculaResumen.alumno.codigo}">Alvarez Perez Juan</span>
    </td>
</tr>
