<tr >
    <td  class="v-middle">
        <select name="evaluacionesExpandidas[{{:index}}].tipoEvaluacion.id"  
                class="form-control item-select2">
            <option  th:each="item : ${tipoEvaluaciones}" th:value="${item.id}" th:text="${item.codigo +' - '+ item.nombre}"></option>
        </select>
    </td>
    <td  class="v-middle">
        <input name="evaluacionesExpandidas[{{:index}}].peso" 
               class="form-control" type="text"
               required="true"
               data-parsley-pattern="[0-9]{0,3}\.?[0-9]{0,2}"
               max="{{:max}}"
               data-parsley-max-message="El total de pesos no debe ser mayor que %s"
               />
    </td>
    <td class="text-center">
        <a href="#" class="btn btn-default delete-tipo-evaluacion"><i class="fa fa-times text-danger"></i></a>
    </td>
</tr>
