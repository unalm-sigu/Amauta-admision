<html layout:decorator="zlayout/layout">
    <head>
        <title>Carga Academica</title>
    </head>

    <body>
        <div layout:fragment="main">
            <header class="page-header">        
                <h2>Sistema Calificación SC - 33</h2>
            </header>

            <section class="panel">
                <section class="panel-body">
                    <table class="table table-striped">
                        <thead> 
                            <tr class=""> 
                                <th class="col-md-2">Tipo Evaluación</th>
                                <th class="col-md-3 text-center">Cantidad</th>
                                <th class="col-md-3 text-center">Peso</th>
                                <th class="col-md-2 text-center">Profesor</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="v-middle">
                                    <span class="block">Examen Parcial</span>
                                </td>
                                <td class="v-middle text-center">
                                    <span class="block">1</span>
                                </td>
                                <td class="text-center v-middle">
                                    <span class="block">30%</span>
                                </td>
                                <td class="text-center v-middle">
                                    <span class="block">Teoria</span>
                                </td>
                            </tr>
                            <tr>
                                <td class="v-middle">
                                    <span class="block">Examen Final</span>
                                </td>
                                <td class="v-middle text-center">
                                    <span class="block">1</span>
                                </td>
                                <td class="text-center v-middle">
                                    <span class="block">30%</span>
                                </td>
                                <td class="text-center v-middle">
                                    <span class="block">Teoria</span>
                                </td>
                            </tr>
                            <tr>
                                <td class="v-middle">
                                    <span class="block">Practicas Calificadas</span>
                                </td>
                                <td class="v-middle text-center">
                                    <span class="block">5(1)</span>
                                </td>
                                <td class="text-center v-middle">
                                    <span class="block">40%</span>
                                </td>
                                <td class="text-center v-middle">
                                    <span class="block">Práctica</span>
                                </td>
                            </tr>
                            <tr>
                                <td class="v-middle">
                                    <span class="block">Tareas</span>
                                </td>
                                <td class="v-middle text-center">
                                    <span class="block">3(1)</span>
                                </td>
                                <td class="text-center v-middle">
                                    <span class="block">10%</span>
                                </td>
                                <td class="text-center v-middle">
                                    <span class="block">Toria</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <div class="text-left">
                        <span class="block"><strong>Nota Base:</strong> <span>100</span></span>
                    </div>
                    <div class="text-right">
                        <a class="btn btn-link">Cancelar</a>
                        <a class="btn btn-primary">Aceptar</a>
                        <a class="btn btn-success">Expandir</a>
                        <a class="btn btn-warning">Solicita modificación</a>
                    </div>
                </section>
            </section>
        </div>

        <div layout:fragment="js">
            <script th:src="@{/app/academico/docente/cargaAcademica/cargaAcademica.js}" charset="utf-8"></script>
        </div>
    </body>
</html>
