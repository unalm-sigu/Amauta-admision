<tr>
    <td>
        <select name="evaluacionPlan[{{:index}}].tipoEvaluacion.id" class="form-control item-select2">
            <option>EP - Examen Parcial</option>
            <option>EF - Examen Final</option>
            <option>PC - Practica Calificada</option>
        </select>
    </td>
    <td>
        <input name="evaluacionPlan[{{:index}}].cantidadEvaluaciones" type="text" class="form-control" />
    </td>    
    <td>
        <input name="evaluacionPlan[{{:index}}].pesoTotal" type="text" class="form-control" />
    </td>
    <td>
        <label class="switch">
            <input type="checkbox" value="1" checked="yes"/>
            <span></span>
        </label>
    </td>
    <td>
        <input name="evaluacionPlan[{{:index}}].pesoEvaluacion" type="text" class="form-control" />
    </td>
    <td>
        <label class="switch">
            <input type="checkbox" value="1"/>
            <span></span>
        </label>
    </td>
    <td>
        <select name="evaluacionPlan[{{:index}}].tipoSeccion"  class="form-control item-select2">
            <option value="TEORIA">Teoría</option>
            <option value="PRACTICA">Práctica</option>
        </select>
    </td>
    <td class="v-middle text-center">
        <a class="btn btn-default delete-tipo-evaluacion"><i class="fa fa-times text-danger"></i></a>
    </td>
</tr>
