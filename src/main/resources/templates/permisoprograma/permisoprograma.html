<html layout:decorator="_layout/layout">
    <head>
        <title>Permisos para programación de horarios</title>
        <style>
            .multiselect__tags{
                min-height: 40px;
                display: block;
                padding: 8px 40px 0 8px;
                border-radius: 5px;
                border: none !important;
                background: none !important;
                font-size: 14px;
            }
        </style>
    </head>

    <body>
        <div layout:fragment="main">
            <div id="permisoProgramacionVUE" v-cloak="">
                <header class="header b-b padder-lg">        
                    <h2>Permisos para programación de horarios -</h2>
                </header>
                <div class="tab-content">

                    <div role="tabpanel" class="tab-pane active" id="lista">
                        <section class="panel">
                            <section class="panel-body">
                                <div class="col-md-12 col-md-offset-0">
                                    <raptor-table v-bind:url="colaboradorURL" ref="load">
                                        <template  scope="props" >
                                            <table  class="table table-striped table-hover">
                                                <thead>
                                                    <tr>
                                                        <th class="col-md-2 text-left">Colaborador</th>
                                                        <th class="col-md-2 text-left">Anexo Boletin</th>
                                                        <th class="col-md-2 text-left">Cursos</th>
                                                        <th class="col-md-2 text-left">Grupo Seccion</th>
                                                        <th class="col-md-2 text-left">Seccion</th>
                                                        <th class="col-md-2 text-left">Docentes</th>
                                                        <th ></th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    <tr v-for="item in props.data"
                                                        v-on:mouseover="seleccionar(item)"
                                                        v-on:mouseleave="deseleccionar()">
                                                        <td class="v-middle text-left"
                                                            v-if="item.rows>0"
                                                            v-bind:rowspan="item.rows">
                                                            <span class="block bold "> <a>{{item.colaborador.persona.apellidosNombres}}</a> </span> 
                                                            <span class="block bold " > {{item.colaborador.cargo.nombre}} </span> 
                                                        </td>                                                       
                                                        <td class="v-middle text-left" 
                                                            v-bind:rowspan="item.row"
                                                            v-bind:class="classTable(item)">
                                                            <span class="block bold ">{{item.anexoBoletin.nombre}} </span> 
                                                        </td>                                                       
                                                        <td class="v-middle text-left" v-bind:class="classTable(item)">
                                                            <div class="col-sm-12" >
                                                                <div class="form-group" v-if="item.anexoBoletin.id!=null">
                                                                    <multiselect 
                                                                        v-model="item.permisosCurso"
                                                                        v-bind:options='programaCurso'
                                                                        label="nombre"
                                                                        track-by='id'
                                                                        :multiple="true" 
                                                                        :taggable="true"
                                                                        :hide-selected="true"
                                                                        :show-labels="false"
                                                                        required="true"
                                                                        placeholder=""
                                                                        v-on:remove="removePermiso"
                                                                        v-on:input="input(item,'CUR')"
                                                                        v-on:select="selectPermiso"
                                                                        >
                                                                    </multiselect>
                                                                </div>
                                                            </div>

                                                        </td>                                                       
                                                        <td class="text-left" v-bind:class="classTable(item)">
                                                            <div class="col-sm-12" >
                                                                <div class="form-group" v-if="item.anexoBoletin.id!=null">
                                                                    <multiselect 
                                                                        v-model="item.permisosGpoSec"
                                                                        v-bind:options='programaGpoSeccion'
                                                                        :custom-label='customLabel'
                                                                        track-by='id'
                                                                        :taggable="true"
                                                                        :multiple="true" 
                                                                        :hide-selected="true"
                                                                        :show-labels="false"
                                                                        required="true"
                                                                        placeholder=""
                                                                        v-on:input="input(item,'GpoSec')"
                                                                        v-on:remove="removePermiso"
                                                                        v-on:select="selectPermiso">
                                                                    </multiselect>
                                                                </div>
                                                            </div>
                                                        </td>                                                       
                                                        <td class=" text-left" v-bind:class="classTable(item)">
                                                            <div class="col-sm-12" >
                                                                <div class="form-group" v-if="item.anexoBoletin.id!=null">
                                                                    <multiselect 
                                                                        v-model="item.permisosSecc"
                                                                        v-bind:options='programaSeccion'
                                                                        label="nombre"
                                                                        track-by='id'
                                                                        :multiple="true" 
                                                                        :hide-selected="true"
                                                                        :show-labels="false"
                                                                        :taggable="true"
                                                                        required="true" 
                                                                        placeholder=""
                                                                        v-on:remove="removePermiso">      
                                                                        <template slot="option" slot-scope="props">
                                                                            <span class="block" v-text="props.option.nombre" v-on:click="modal(item,props.option)"></span>                                                                          
                                                                        </template>
                                                                        <template slot="tag" slot-scope="props">
                                                                            <span class="multiselect__tag " >
                                                                                <span v-text="props.option.nombre" v-on:click="modifySecc(item,props.option)"></span>
                                                                                <i class=" multiselect__tag-icon" aria-hidden="true" v-on:click="props.remove(props.option)"></i>
                                                                            </span>
                                                                        </template>
                                                                    </multiselect>
                                                                </div>
                                                            </div>
                                                        </td>                                                       
                                                        <td class=" text-left" v-bind:class="classTable(item)">
                                                            <div class="col-sm-12" >
                                                                <div class="form-group" v-if="item.anexoBoletin.id!=null">
                                                                    <multiselect                                                                        
                                                                        v-model="item.permisosDocente"
                                                                        v-bind:options='programaDocente'
                                                                        :custom-label='customLabel'
                                                                        track-by='id'
                                                                        :multiple="true" 
                                                                        :hide-selected="true"
                                                                        :show-labels="false"
                                                                        :taggable="true"
                                                                        required="true"
                                                                        v-on:remove="removePermiso"
                                                                        v-on:input="input(item,'DOC')"
                                                                        placeholder=""
                                                                        v-on:select="selectPermiso">
                                                                        <template slot="tag" slot-scope="props"  class="back">
                                                                            <span class="multiselect__tag " >
                                                                                <span v-text="props.option.nombre" ></span>
                                                                                <i class=" multiselect__tag-icon" aria-hidden="true" v-on:click="props.remove(props.option)"></i>
                                                                            </span>
                                                                        </template>
                                                                    </multiselect>
                                                                </div>
                                                            </div>
                                                        </td>                                                       
                                                        <td class="text-left" v-bind:class="classTable(item)">
                                                            <div class="dropdown actions">
                                                                <a class="dropdown-toggle" data-toggle="dropdown">
                                                                    <i class="glyphicon glyphicon-option-vertical"></i>
                                                                </a> 

                                                                <ul class="dropdown-menu pull-right">
                                                                    <li ><a v-on:click="modal(item)">Agregar Permiso</a></li>
                                                                </ul>
                                                            </div>
                                                        </td>                                                       
                                                    </tr>                                                   
                                                </tbody>
                                            </table>
                                        </template>
                                    </raptor-table>
                                </div>
                            </section>
                        </section>
                    </div>
                </div>
                <th:block  th:replace="permisoprograma/addPermisoModal"/>
                <th:block  th:replace="permisoprograma/modifiSeccModal"/>
            </div>
        </div>
        <div layout:fragment="js">
            <script th:inline="javascript">
                /*<![CDATA[*/
                var cicloacademico = /*[[${cicloacademico.toString()}]]*/ 'json';
                var anexoBoletin = /*[[${anexoBoletin.toString()}]]*/ 'json';
                var programaCurso = /*[[${programaCurso.toString()}]]*/ 'json';
                var programaSeccion = /*[[${programaSeccion.toString()}]]*/ 'json';
                var programaGpoSeccion = /*[[${programaGpoSeccion.toString()}]]*/ 'json';
                var programaDocente = /*[[${programaDocente.toString()}]]*/ 'json';
                var eventos = /*[[${eventos.toString()}]]*/ 'json';
                /*]]>*/
            </script>
            <div th:substituteby="_modules/vue-modal"/>
            <div th:substituteby="_modules/vue-raptor-table"></div>
            <script th:src="@{/app/permisoprograma/permisoprograma.js}" charset="utf-8"></script>
        </div>
    </body>
</html>
