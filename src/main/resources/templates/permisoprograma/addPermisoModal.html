<modal-vik ref="modalAddPermiso"
           v-bind="modalAddPermiso"
           v-bind:okaction="save" >

    <div slot="body">

        <form id="formEnviarRevision"  data-parsley-validate="true">
            <div class="step1">
                <div class=" row">
                    <div class="col-sm-12" >
                        <div class="form-group" v-if="colaboradorAnexo.id == null">
                            <label >Anexo Boletin  </label>
                            <multiselect 
                                v-model="colaboradorAnexo.anexoBoletin"
                                v-bind:options='anexoBoletin'
                                label='nombre'
                                track-by='id'
                                placeholder="Seleccines un anexo"
                                required="true" >
                                <template slot="option" slot-scope="props">
                                    <span class="block" v-text="props.option.nombre"></span>
                                    <small v-if="props.option.anexoSuperior != null" v-text="props.option.anexoSuperior.nombre"></small>
                                </template>
                            </multiselect>
                        </div>
                        <div class="form-group" v-else="">
                            <label >Anexo Boletin  </label>
                            <div class="col-sm-12" >
                                <span class="bold" v-text="colaboradorAnexo.anexoBoletin.nombre"></span>
                                <small v-if="colaboradorAnexo.anexoBoletin.anexoSuperior != null" v-text="colaboradorAnexo.anexoBoletin.anexoSuperior.nombre"></small>
                            </div>
                        </div>
                    </div>
                </div>
                <div class=" row">
                    <div class="col-sm-12" >
                        <div class="form-group" v-if="colaboradorAnexo.id == null">
                            <label >Eventos  </label>
                            <multiselect 
                                v-model="colaboradorAnexo.permisoProgramacion"
                                v-bind:options='eventos'
                                label='nombre'
                                placeholder="Selecciones un evento"
                                track-by='id'
                                required="true" 
                                v-on:select="eventoSelect">
                                <template slot="option" slot-scope="props">
                                    <span v-text="props.option.nombre"></span>
                                </template>
                            </multiselect>
                        </div>
                        <div class="form-group" v-else="">
                            <label >Evento </label>
                            <div class="col-sm-12" >
                                <span class="bold" v-text="colaboradorAnexo.permisoProgramacion.nombre"></span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class=" row">
                    <div class="col-sm-12" >
                        <div class="form-group">
                            <div v-if="objCrud.textoAgregar!=null" class="col-sm-4">
                                <span v-text="objCrud.textoAgregar"></span>
                                <input v-model="colaboradorAnexo.puedeAgregar" type="checkbox" class="form-check-input" id="exampleCheck1"/>
                            </div>
                            <div v-if="objCrud.textoEliminar!=null" class="col-sm-4">
                                <span v-text="objCrud.textoEliminar"></span>
                                <input v-model="colaboradorAnexo.puedeEliminar" type="checkbox" class="form-check-input" id="exampleCheck1"/>
                            </div>
                            <div v-if="objCrud.textoModificar!=null" class="col-sm-4">
                                <span v-text="objCrud.textoModificar"></span>
                                <input v-model="colaboradorAnexo.puedeModificar" type="checkbox" class="form-check-input" id="exampleCheck1"/>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>

    </div>
</modal-vik>
