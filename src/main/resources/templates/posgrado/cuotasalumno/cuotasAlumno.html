<html layout:decorator="_layout/layout">
    <head>
        <title>Cuotas Alumno</title>
        <style>
            .td-vacio {
                padding-right: 4px !important;
                padding-left: 4px !important;
            }
            .bg-row {
                background-color: #f9fafc;
            }

        </style>
    </head>

    <body>
        <div layout:fragment="main">
            <div id="gpoSeccionesVUE" v-cloak="">

                <header class="header b-b padder-lg">

                    <div class="pull-right m-t-md">                 
                        <div class="btn-group">
                            <a type="button" class="btn btn-success nuevo-grupo-sec">Nuevo Grupo</a>
                        </div>
                    </div> 
                    <h2 th:text="|Cuotas Alumnos ${ciclo.descripcion}|">Grupo Sección</h2>
                </header>
                <section class="wrapper-lg">

                        <section class="panel-body">
                            <div class="col-md-12">
                                <div class="row">
                                    registros basicos
                                </div>
                            </div>
                        </section>
                    </section>

                    <section class="panel">
                        <section class="panel-body">
                            Tabla
                        </section>
                    </section>
                </section>

                <!-- modals -->

                <!--<script id="gpoSeccionTemplate" type="text/x-jsrender" class="hide"><div th:substituteby="academico/gposeccion/gpoSeccionTemplate"/></script>-->
            </div>
            <div th:substituteby="_modules/vue-modal"/>
            <div th:substituteby="templates/modal"/>
        </div>

        <div layout:fragment="js">
            <div th:substituteby="_modules/vue-raptor-table"></div>
            <script type="text/javascript" th:src="@{/phobos/modules/vue-modal.js}"></script>
            <script th:src="@{/app/posgrado/cuotasalumno/cuotasAlumno.js}" charset="utf-8"></script>
        </div>
