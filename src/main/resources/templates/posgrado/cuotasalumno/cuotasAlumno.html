<html layout:decorator="_layout/layout">
    <head>
        <title>Cuotas Alumno</title>
        <style>
            .td-vacio {
                padding-right: 4px !important;
                padding-left: 4px !important;
            }
            .bg-row {
                background-color: #f9fafc;
            }

        </style>
    </head>

    <body>
        <div layout:fragment="main">
            <div id="cuotasMain" > <!-- v-cloak=""-->

                <header class="header b-b padder-lg">

                    <div class="pull-right m-t-md">                 
                        <div class="btn-group">
                            <a type="button" class="btn btn-success nuevo-grupo-sec">Nuevo Grupo</a>
                        </div>
                    </div> 
                    <h2 th:text="|Cuotas Alumnos ${ciclo.descripcion}|">Cuotas Alumno</h2>
                </header>
                <section class="wrapper-lg">
                    <section class="panel m-b-xs">
                        <section class="panel-body">
                            <div class="row">
                                <div class="form-group">
                                    <label for="docIdentidad" class="col-md-2 bold">Tarifo</label>

                                    <div class="col-md-10">
                                        Tarifa
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="form-group">
                                    <label  class="col-md-2 bold">Creditos</label>

                                    <div class="col-md-2">
                                        cred
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-md-2 bold">Exceso</label>

                                    <div class="col-md-2">
                                        exceso
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-md-2 bold">Pago Al Cash</label>
                                    <div class="col-md-2">
                                        pago
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="form-group">
                                    <label  class="col-md-2 bold">Monto Inicial</label>

                                    <div class="col-md-2">
                                        mini
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-md-2 bold">Cuotas</label>

                                    <div class="col-md-2">
                                        cuot
                                    </div>
                                </div>
                            </div>
                        </section>
                    </section>
                    <section class="panel m-b-xs">
                        <section class="panel-body">
                            tablita
                        </section>
                    </section>
                    <section class="panel m-b-xs">
                        <section class="panel-body">
                            Cronograma
                        </section>
                    </section>
                </section>

                <!-- modals -->

                <!--<script id="gpoSeccionTemplate" type="text/x-jsrender" class="hide"><div th:substituteby="academico/gposeccion/gpoSeccionTemplate"/></script>-->
            </div>
            <div th:substituteby="_modules/vue-modal"/>
            <div th:substituteby="templates/modal"/>
        </div>

        <div layout:fragment="js">
            <div th:substituteby="_modules/vue-raptor-table"></div>
            <script type="text/javascript" th:src="@{/phobos/modules/vue-modal.js}"></script>
            <script th:src="@{/app/posgrado/cuotasalumno/cuotasAlumno.js}" charset="utf-8"></script>
        </div>


    </body>
</html>
