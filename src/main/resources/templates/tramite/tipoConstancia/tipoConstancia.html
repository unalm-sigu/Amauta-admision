<html layout:decorator="_layout/layout">
    <head>
        <title>Administración de Oficinas</title>
    <div th:substituteby="_layout/includes :: styles-dynatable"></div>
</head>
<body>
    <div layout:fragment="main">
        <div id="tipoConstanciaVue">

            <header class="header b-b padder-lg">

                <div class="btn-group pull-right">
                    <a type="button" class="btn btn-success btn-sm dropdown-toggle" v-on:click="nuevo">
                        &nbsp; Nuevo &nbsp; 
                    </a>

                </div>

                <h2>Tipo Constancia</h2>

            </header>
            <section class="wrapper-lg m-b-xs">
                <section class="panel  ">           
                    <section class="panel-body ">
                        <dynatable/>
                    </section>
                </section>
            </section>

            <!--MODAL INICIO-->
            <div class="modal fade" id="myModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
                <div class="modal-dialog" role="document">
                    <form data-parsley-validate="true" id="formConfig"  method="post">
                        <div class="modal-content">
                            <div class="modal-header">
                                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                                <h4 class="modal-title" id="myModalLabel"> Tipo Constancia </h4>
                            </div>
                            <div class="modal-body">
                                <div class="col-md-offset-1 ">

                                    <div class='form-group row'>
                                        <label class="col-sm-3 control-label">Nombre:</label>
                                        <div class="col-sm-6">
                                            <input  required="true" v-model="tipoConstancia.nombre" type="text" class="form-control " placeholder="Ingrese un nombre"/>
                                        </div>
                                    </div>  
                                    <div class='form-group row'>
                                        <label class="col-sm-3 control-label">Tipo:</label>
                                        <div class="col-sm-8">
                                            <div class="form-group" >                                
                                                <multiselect v-model="tipoConstancia.tipo" 
                                                             v-bind:options='tipos'
                                                             label='value'
                                                             track-by='name'
                                                             placeholder="Seleccione un tipo de constancia"
                                                             >
                                                </multiselect>

                                            </div>
                                        </div>  
                                    </div>   
                                    <div class='form-group row' >
                                        <label class="col-sm-3 control-label">Costo ciclo:</label>
                                        <div class="col-sm-8">
                                            <div class="form-group" >  
                                                <label class="switch">  
                                                    <input type="checkbox" v-model="tipoConstancia.costoCiclo" ></input>                                               
                                                    <span></span>
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="modal-footer">
                                        <button type="button" class="btn btn-link" data-dismiss="modal">Close</button>
                                        <button type="button" class="btn btn-success" v-on:click.prevent="save" v-if="isNew" v-text="'Guardar'"></button>
                                        <button type="button" class="btn btn-success" v-on:click.prevent="update" v-if="!isNew" v-text="'Actualizar'"></button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
            <!--MODAL FIN -->
        </div>
        <th:block th:replace="tramite/tipoConstancia/tipoConstanciaDynatable"/>
    </div>

    <div layout:fragment="js">
        <script th:inline="javascript">
            /*<![CDATA[*/
            var tiposJson = /*[[${tipos.toString()}]]*/ 'json';
            /*]]>*/
        </script>
        <div th:substituteby="_layout/includes :: javascript-dynatable"/>
        <script th:src="@{/app/tramite/tipoConstancia/tipoConstancia.js}" charset="utf-8"></script>
    </div>

</body>
</html>
