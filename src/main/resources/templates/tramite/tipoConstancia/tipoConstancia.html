<html layout:decorator="_layout/layout">
    <head>
        <title>Administración de Oficinas</title>
        <link th:substituteby="_layout/includes :: styles-dynatable"/>
    </head>
    <body>
        <div layout:fragment="main">
            <div id="main" v-cloak="">

                <header class="header b-b padder-lg">

                    <a type="button" class="pull-right btn btn-success btn-sm" href="#"  v-on:click.prevent="nuevo">
                        &nbsp; Nuevo &nbsp;
                    </a>

                    <h2>Tipo Constancia</h2>

                </header>

                <tipo-constancia-form ref="tipoconstanciaform" />

                <section class="wrapper-lg m-b-xs">

                    <tipo-constancia-list ref="tipoconstancialist"/>

                </section>

            </div>

        </div>

        <div layout:fragment="js">

            <script th:inline="javascript">
                /*<![CDATA[*/
                var tiposJson = /*[[${tipos.toString()}]]*/ '';
                /*]]>*/
            </script>

            <div th:substituteby="_modules/vue-raptor-table"/>
            <div th:substituteby="_modules/vue-modal_v1"/>

            <script>

                Vue.component("multiselect", window.VueMultiselect.default);

                const TipoConstanciaList = httpVueLoader('/app/tramite/tipoConstancia/TipoConstanciaList.vue');
                const TipoConstanciaForm = httpVueLoader('/app/tramite/tipoConstancia/TipoConstanciaForm.vue');

                var root = new Vue({
                    el: '#main',
                    components: {
                        tipoConstanciaList: TipoConstanciaList,
                        tipoConstanciaForm: TipoConstanciaForm,
                    },
                    data: {
                        tipoConstancia: {},
                    },
                    methods: {
                        nuevo() {
                            this.setTipoConstancia({});
                            this.$refs.tipoconstanciaform.nuevo();
                        },
                        update() {
                            this.$refs.tipoconstanciaform.updateTipo(this.tipoConstancia);
                        },
                        reload() {
                            this.$refs.tipoconstancialist.reload();
                        },
                        setTipoConstancia(tipoConstancia) {
                            this.tipoConstancia = tipoConstancia;
                        }
                    }
                });

            </script>

        </div>

    </body>
</html>
