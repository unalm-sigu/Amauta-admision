<html layout:decorator="_layout/layout">
    <head>
        <title>Administración de Oficinas</title>
        <link th:substituteby="_layout/includes :: styles-dynatable"/>
    </head>
    <body>
        <div layout:fragment="main">
            <div id="main">

                <header class="header b-b padder-lg">

                    <a type="button" class="pull-right btn btn-success btn-sm" href="#"  v-on:click.prevent="nuevo">
                        &nbsp; Nuevo &nbsp;
                    </a>

                    <h2>Tipo Constancia</h2>

                </header>

                <section class="wrapper-lg m-b-xs">
                    <section class="panel  ">
                        <section class="panel-body ">
                            <dynatable/>
                        </section>
                    </section>
                </section>

                <div th:substituteby="tramite/tipoConstancia/tipoConstanciaModal"></div>

            </div>

            <div th:substituteby="_modules/vue-modal"/>

            <th:block th:replace="tramite/tipoConstancia/tipoConstanciaDynatable"/>

        </div>

        <div layout:fragment="js">
            <script th:inline="javascript">
                /*<![CDATA[*/
                var tiposJson = /*[[${tipos.toString()}]]*/ 'json';
                /*]]>*/
            </script>
            <div th:substituteby="_layout/includes :: javascript-dynatable"/>
            <div th:substituteby="_layout/includes :: vuemodal"/>
            <script th:src="@{/app/tramite/tipoConstancia/tipoConstanciaDynatable.js}" charset="utf-8"></script>
            <script th:src="@{/app/tramite/tipoConstancia/tipoConstancia.js}" charset="utf-8"></script>
        </div>

    </body>
</html>
