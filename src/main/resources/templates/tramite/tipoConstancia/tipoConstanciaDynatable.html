<template id="dynatableTemplate">
    <transition >
        <table id="dynaTable" class="table table-striped table-hover ">
            <thead>
                <tr>
                    <th class="text-center v-middle col-xs-1"></th>
                    <th class="v-middle  col-xs-8">Nombre</th>
                    <th class="text-center  col-xs-1 v-middle">Costo por ciclo</th>
                    <th class="v-middle col-xs-2">Tipo</th>
                    <th class="v-middle"></th>
                </tr>
            </thead>
            <tbody id="dynaTbody"></tbody>
        </table>

    </transition>
</template>

<template id="dynatableRowTemplate">
    <tr>
        <td class="v-middle text-center  col-xs-1">
            <p class="block"  v-text="tipoConstancia.index+1" ></p>
        </td>
        <td class="v-middle  col-xs-8">
            <p v-text="tipoConstancia.nombre" ></p>
        </td>
        <td class="v-middle text-center   col-xs-1">
            <i v-if="tipoConstancia.costoCiclo!='' " class="fa fa-check text-success"></i>
            <i v-if="tipoConstancia.costoCiclo=='' " class="fa fa-times text-danger"></i>
        </td>
        <td class="v-middle col-xs-2 ">
            <p v-text="tipoConstancia.tipo.value"></p>
        </td>
        <td class="v-middle">

            <div class="dropdown actions">
                <a class="dropdown-toggle" data-toggle="dropdown">
                    <i class="glyphicon glyphicon-option-vertical"></i>
                </a>
                <ul class="dropdown-menu pull-right" >
                    <li><a href="#"  class="" v-on:click.prevent="updateTipo(tipoConstancia)">Actualizar</a></li>
                    <li class="divider"></li>
                    <li><a href="#"  class="" v-on:click.prevent="eliminar(tipoConstancia)">Eliminar</a></li>
                </ul>
            </div>

        </td>
    </tr>
</template>
