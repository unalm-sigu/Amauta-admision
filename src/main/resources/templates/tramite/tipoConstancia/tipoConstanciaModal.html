<modal-vik ref="modalAddTipoConstancia"
           v-bind="addTipoConstanciaModal"
           v-bind:okaction="save">

    <div slot="body">

        <form id="formTipoConstancia" class="form-horizontal"  data-parsley-validate="true">

            <div class='form-group row'>
                <label class="col-sm-3 control-label">Nombre:</label>
                <div class="col-sm-6">
                    <input  required="true" v-model="tipoConstancia.nombre" type="text" class="form-control " />
                </div>
            </div>

            <div class='form-group'>
                <label class="col-sm-3 control-label">Tipo:</label>
                <div class="col-sm-6">
                    <select name="tipo" class="form-control"   v-model="tipoConstancia.tipo">
                        <option v-for="tipo in tipos"   v-bind:value="tipo.name" v-text="tipo.value"  ></option>
                    </select>
                </div>
            </div>


            <div class='form-group' >
                <label class="col-sm-3 control-label">Costo ciclo:</label>
                <div class="col-sm-9">
                    <label class="switch">
                        <input type="checkbox" v-model="tipoConstancia.costoCiclo" ></input>
                        <span></span>
                    </label>
                </div>
            </div>



            <table class="table table-condensed">
                <thead>
                    <tr>
                        <th>Orden</th>
                        <th>Oficina</th>
                        <th>Tipo Oficina</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr   v-for="( firma , index  ) in firmasDocumento">
                        <td class="v-middle text-center" v-text="firma.orden"></td>
                        <td class="v-middle col-xs-6" >

                            <input name="configuracionFirmaDocumento[0].oficina.id"
                                   required="true"
                                   type="text"
                                   v-model="firma.oficina"
                                   v-bind:value="firma.oficina.id"
                                   v-bind:rev="index"
                                   v-bind:rel="firma.oficina.nombre"
                                   class="form-control oficina" />

                            <p>{{firma.oficina}}</p>
                        </td>

                        <td class="v-middle col-xs-6" >

                            <input name="configuracionFirmaDocumento[0].tipoOficina.id"
                                   required="true"
                                   type="text"
                                   v-model="firma.tipoOficina"
                                   v-bind:value="firma.tipoOficina.id"
                                   v-bind:rev="index"
                                   v-bind:rel="firma.tipoOficina.nombre"
                                   class="form-control tipoOficina" />

                            <p>{{firma.tipoOficina}}</p>

                        </td>

                        <td class="v-middle">
                            <div class="dropdown actions">
                                <a class="dropdown-toggle" data-toggle="dropdown">
                                    <i class="glyphicon glyphicon-option-vertical pointer"></i>
                                </a>
                                <ul class="dropdown-menu pull-right" >
                                    <li><a href="#"   v-on:click.prevent="eliminarFirma(firma)">Eliminar</a></li>
                                </ul>
                            </div>
                        </td>

                    </tr>
                </tbody>
            </table>

            <div class='form-group' >
                <div class="text-center">
                    <button type="button" class="btn btn-info btn-sm" v-on:click.prevent="agregar($event)">Agregar firmante</button>
                </div>
            </div>

        </form>
    </div>
</modal-vik>
