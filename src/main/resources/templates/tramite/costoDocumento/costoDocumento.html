<html layout:decorator="_layout/layout">
    <head>
        <title>Costo Documento</title>
    <div th:substituteby="_layout/includes :: styles-dynatable"></div>
</head>
<body>
    <div layout:fragment="main">
        <div id="tipoConstanciaVue">

            <header class="header b-b padder-lg">

                <div class="btn-group pull-right">
                    <a type="button" class="btn btn-success btn-sm dropdown-toggle" v-on:click="nuevo">
                        &nbsp; Nuevo &nbsp; 
                    </a>

                </div>

                <h2>Costo Documento</h2>

            </header>
            <section class="wrapper-lg m-b-xs">
                <section class="panel  ">           
                    <section class="panel-body ">
                        <dynatable/>
                    </section>
                </section>
            </section>

            <!--MODAL INICIO-->
            <div class="modal fade" id="myModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
                <div class="modal-dialog" role="document">
                    <form data-parsley-validate="true" id="formConfig"  method="post">
                        <div class="modal-content">
                            <div class="modal-header">
                                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                                <h4 class="modal-title" id="myModalLabel"> Tipo Constancia </h4>
                            </div>
                            <div class="modal-body">
                                <div class="col-md-offset-1 ">
                                    <div class='form-group row'>
                                        <label class="col-sm-3 control-label">Tipo constancia</label>
                                        <div class="col-sm-8">
                                            <div class="form-group" v-if="isNew">                                
                                                <multiselect v-model="costoDocumento.tipoDocumento" 
                                                             v-bind:options='tipoConstancia'
                                                             label='nombre'
                                                             track-by='id'
                                                             v-bind:searchable="false" v-bind:allow-empty="false"
                                                             placeholder="Seleccione un tipo de constancia"
                                                             v-bind:close-on-select="true"
                                                             v-bind:preserve-search="false"
                                                             v-bind:custom-label="nameWithCodeEspecial" 
                                                             class="tipoDocumento"
                                                             >
                                                    <template slot="option" slot-scope="props">    
                                                        <div class="option__desc">
                                                            <div >
                                                                <span class="bold option__title">
                                                                    {{ props.option.tipo.value }}
                                                                </span>
                                                                <span class="bold  option__small">
                                                                    {{ props.option.nombre }}
                                                                </span>
                                                            </div>                                                       
                                                        </div>
                                                    </template>
                                                </multiselect>
                                            </div>
                                            <div class="form-group" v-if="!isNew">   
                                                <span class="form-control ">
                                                    {{costoDocumento.tipoDocumento.tipo.value}}
                                                    {{costoDocumento.tipoDocumento != undefined ? costoDocumento.tipoDocumento.nombre : ''}}
                                                </span>
                                            </div>
                                        </div>  
                                    </div>          
                                    <div class='form-group row'>
                                        <label class="col-sm-3 control-label">Idioma</label>
                                        <div class="col-sm-8">
                                            <div class="form-group" v-if="isNew">                                
                                                <multiselect v-model="costoDocumento.idioma" 
                                                             v-bind:options='idiomas'
                                                             label='nombre'
                                                             track-by='id'
                                                             placeholder="Seleccione un tipo de constancia"
                                                             >
                                                </multiselect>

                                            </div>
                                            <div class="form-group" v-if="!isNew">   
                                                <span v-text="costoDocumento.idioma != undefined ? costoDocumento.idioma.nombre : ''" class="form-control "></span>
                                            </div>
                                        </div>  
                                    </div>              
                                    <div class='form-group row'>
                                        <label class="col-sm-3 control-label">Precio</label>
                                        <div class="col-sm-8">
                                            <input  required="true" v-model="costoDocumento.precio" type="text" class="form-control " placeholder="Ingrese un precio"/>
                                        </div>
                                    </div>
                                    <div class="modal-footer">
                                        <button type="button" class="btn btn-link" data-dismiss="modal">Close</button>
                                        <button type="button" class="btn btn-success" v-on:click.prevent="save" v-if="isNew" v-text="'Guardar'"></button>
                                        <button type="button" class="btn btn-success" v-on:click.prevent="update" v-if="!isNew" v-text="'Actualizar'">></button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
            <!--MODAL FIN -->

        </div>
        <th:block th:replace="tramite/costoDocumento/costoDocumentoDynatable"/>
    </div>

    <div layout:fragment="js">
        <script th:inline="javascript">
            /*<![CDATA[*/
            var tipoDocumentoJson = /*[[${tipoDocumento.toString()}]]*/ 'json';
            var idiomasJson = /*[[${idiomas.toString()}]]*/ 'json';
            /*]]>*/
        </script>
        <div th:substituteby="_layout/includes :: javascript-dynatable"/>
        <script th:src="@{/app/tramite/costoDocumento/costoDocumento.js}" charset="utf-8"></script>
    </div>

</body>
</html>
