<template id="dynatableTemplate">
    <transition >
        <div class="panel padder-v col-md-8 col-md-offset-2">
            <table id="dynaTable" class="table table-striped table-hover ">
                <thead> 
                    <tr>
                        <th class="text-left v-middle">Documento</th>
                        <th class="text-left v-middle">Idioma</th>
                        <th class="text-left v-middle">Costo por Ciclo</th>
                        <th class="text-left v-middle">Precio</th>
                        <th class="text-left v-middle">Editar</th>
                    </tr> 
                </thead>
                <tbody></tbody>
            </table>
        </div>

    </transition>
</template>

<template id="dynatableRowTemplate">

    <tr>
        <td class="v-middle">
            <span class="block">{{:tipoDocumento.tipo.value}} {{:tipoDocumento.nombre}}</span> 
        </td>
        <td class="v-middle ">
            <span >{{:idioma.nombre}}</span> 
        </td>
        <td class="v-middle ">

            <label class="switch">     
                {{if tipoDocumento.costo}}
                <input type="checkbox"  checked="" disabled=""></input>    
                {{else}}
                <input type="checkbox"  disabled=""></input>    
                {{/if}}
                <span></span>
            </label>

        </td>
        <td class="v-middle ">
            <span >{{:precio}}</span> 
        </td>
        <td class="v-middle "> 

            <div class="dropdown actions">
                <a class="dropdown-toggle" data-toggle="dropdown">
                    <i class="glyphicon glyphicon-option-vertical"></i>
                </a> 
                <ul class="dropdown-menu pull-right" >                
                    <li><a  rel="{{:id}}" class="modalUpdate">Actualizar</a></li>
                </ul>
            </div>

        </td>
    </tr>
</template>
