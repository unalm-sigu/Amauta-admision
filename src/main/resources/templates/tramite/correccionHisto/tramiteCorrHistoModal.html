
<modal-vik ref="tramiteModal"
           v-bind="tramiteModal"
           v-bind:okaction="save">

    <div slot="body">
        <form  id="form">
            <div class="form-group">
                <label>Alumno</label>
                <multiselect                                                   
                    v-model='correccionhisto.alumno'
                    v-bind:internal-search='false'
                    v-bind:limit='15'
                    v-on:search-change="searchAlumnos"
                    v-bind:options='alumnos'
                    placeholder="Ingrese un digito"
                    v-bind:custom-label="customLabel"
                    v-bind:show-labels="false"
                    v-bind:allow-empty="false"
                    track-by="id"
                    :loading="isLoading"
                    :searchable="true"
                    >
                    <template slot="option" slot-scope="props">
                        <div class="option__desc"><span class="option__title bold">{{ props.option.persona.apellidosNombres }}</span></div>
                        <div class="option__small"><span class="option__title">{{ props.option.codigo }}</span></div>
                        <div class="option__small"><span class="option__title">Carrera: {{ props.option.carrera.nombre }}</span></div>
                    </template>
                </multiselect>
                <input required="" v-model="correccionhisto.alumno" class="hidden"/>
            </div>
            <div class="form-group">
                <label>Tipo Documento</label>
                <multiselect                                                   
                    v-model='correccionhisto.tipoDocumento'
                    v-bind:limit='15'
                    v-bind:options='tipoDocumento'
                    placeholder="Seleccione un tipo Documento"
                    label='value'
                    v-bind:show-labels="false"
                    v-bind:allow-empty="true"
                    track-by="name"
                    >
                </multiselect>
                <input required="" v-model="correccionhisto.tipoDocumento" class="hidden"/>
            </div>
            <div class="form-group">
                <label>Descripción</label>
                <input type="text" class="form-control" v-model='correccionhisto.descripcion' required=""/>
            </div>
            <!--            <div class="form-group">
                            <input type="file" id="file" ref="myFiles" class="custom-file-input"   v-on:change="previewFiles" />
                        </div>-->
        </form>
    </div>
</modal-vik>
