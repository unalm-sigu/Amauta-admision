<modal-vik ref="modalIncrustacion"
           v-bind="modalIncrustacion"
           v-bind:okaction="incrustacion.id == null ? save : update">

    <div slot="body" >

        <form id="form" class="form-horizontal"  data-parsley-validate="true">
            <div class='form-group row'>
                <label class="col-sm-3 control-label">Nombre:</label>
                <div class="col-sm-6">
                    <input name="nombre"  required="true" v-model="incrustacion.nombre" type="text" class="form-control " />
                </div>
            </div>
            <div class='form-group row'>
                <label class="col-sm-3 control-label">Idioma:</label>
                <div class="col-sm-6">
                    <multiselect 
                        v-model="incrustacion.idioma"
                        v-bind:options="idiomas"
                        label="nombre"
                        placeholder="Seleccione un idioma"
                        v-bind:limit="15"
                        track-by="id"
                        v-bind:show-labels="false"
                        v-bind:internal-search="true">
                    </multiselect>
                </div>
            </div>


        </form>
    </div>
</modal-vik>
