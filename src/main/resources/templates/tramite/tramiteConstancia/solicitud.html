<html layout:decorator="_layout/layout">
    <head>
        <title> Solicitud Constancia </title>
    </head>
    <body>

        <div layout:fragment="main">
            <div id="main" v-cloak="">

                <header class="header b-b padder-lg">

                    <a class="pull-right btn btn-default  btn-sm"
                       th:href="@{/tramite/solicitudconstancia}" >
                        Regresar
                    </a>

                    <h1 v-text="solicitud.id!=null?'Edicion de Solicitud de Constancia':'Nueva Solicitud de Constancia'">Nueva Solicitud de Constancia</h1>
                    <div class="tabbable-line" v-if='tramite.alumno != null'>
                        <ul class="nav nav-tabs" >
                            <li v-for="tab in tabs" v-bind:class="styleMenu(tab.id)">
                                <a href="#" data-toggle="tab" v-on:click="updateTabs(tab)" v-text="tab.name"></a>
                            </li>
                        </ul>
                    </div>
                </header>

                <section class="wrapper-lg m-b-xs">
                    <section class="panel">
                        <section class="panel-body m-t-sm">

                            <div class="wrapper-md" v-if='tramite.alumno != null'>
                                <section class="panel">
                                    <section class="panel-body">
                                        <div v-show="1 == tabId"  >
                                            <inicio-component v-bind:alumno="tramite.alumno" ></inicio-component>
                                        </div>
                                        <div v-show="1 == tabId"  >
                                            <inicio-component v-bind:alumno="tramite.alumno" ></inicio-component>
                                        </div>
                                        <div v-show="2 == tabId" >
                                            <historial-component v-bind:alumno="tramite.alumno" ref="loadHistorial" v-bind:showactions="false"></historial-component>
                                        </div>                                      
                                        <div v-show="3 == tabId" >
                                            <matricula-component v-bind:alumno="tramite.alumno" ref="loadMatricula"></matricula-component>
                                        </div>
                                        <div v-show="4 == tabId"  >
                                            <horario-component v-bind:alumno="tramite.alumno" v-bind:ciclo="ciclo" ref="loadHorario"></horario-component>
                                        </div>
                                    </section>
                                </section> 
                            </div>

                            

                        </section>
                    </section>
                </section>
                <th:block th:replace="tramite/tramiteConstancia/solicitudConstanciaModals"/>
                <th:block th:replace="tramite/tramiteConstancia/ciclosModal"/>

            </div>
            <div th:substituteby="tramite/tramiteConstancia/inicioTramite"/>
            <div th:substituteby="academico/alumno/includes/inicio"/>
            <div th:substituteby="academico/alumno/includes/historial"/>
            <div th:substituteby="academico/alumno/includes/horario"/>
            <div th:substituteby="academico/alumno/includes/matricula"/>

        </div>

        <div layout:fragment="js">
            <script th:inline="javascript">
                /*<![CDATA[*/
                var tiposDocumentoAcademicoJson = /*[[${tiposDocumentoAcademico.toString()}]]*/ 'json';
                var solicitudJson = /*[[${solicitud.toString()}]]*/ 'json';
                /*]]>*/
            </script>
            <div th:substituteby="_modules/vue-modal"/>
            <div th:substituteby="_layout/includes :: vuejs"/>
            <script th:src="@{/app/academico/alumno/inicioComponent.js}" charset="utf-8"></script>
            <script th:src="@{/app/academico/alumno/historialComponent.js}" charset="utf-8"></script>
            <script th:src="@{/app/academico/alumno/horarioComponent.js}" charset="utf-8"></script>
            <script th:src="@{/app/academico/alumno/matriculaComponent.js}" charset="utf-8"></script>
            <script th:src="@{/app/tramite/tramiteConstancia/inicioTramiteComponent.js}" charset="utf-8"></script>
            <!--<div th:substituteby="_layout/includes :: javascript-upload"/>-->
            <script th:src="@{/app/tramite/tramiteConstancia/solicitud.js}" charset="utf-8"></script>
        </div>
    </body>
</html>
