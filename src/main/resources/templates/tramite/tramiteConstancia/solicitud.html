<html layout:decorator="_layout/layout">
    <head>
        <title> Solicitud Constancia </title>
    </head>
    <body>

        <div layout:fragment="main">
            <div id="main" v-cloak="">

                <header class="header b-b padder-lg">

                    <a class="pull-right btn btn-default  btn-sm"
                       th:href="@{/tramite/solicitudconstancia}" >
                        Regresar
                    </a>

                    <h1 >Tramite de Constancias y Certificados</h1>
                    
                    
                    <p class="block text-primary h4" v-if="solicitud.id">
                        <span v-if="solicitud.tipoDocumentoAcademico">{{solicitud.tipoDocumentoAcademico.nombre}}</span>
                    </p>
                    
                   <div v-if="solicitud.id" class="tabbable-line">
                        <ul class="nav nav-tabs" >
                            <li v-for="tab in tabs" v-bind:class="styleMenu(tab.id)">
                                <a href="#" data-toggle="tab" v-on:click="updateTabs(tab)" v-text="tab.name"></a>
                            </li>
                        </ul>
                    </div>

                </header>

                <section class="wrapper-lg m-b-xs">
                    
                    <section class="panel">
                        
                        <section class="panel-body m-t-sm">
                            <div class="wrapper-md" >
                                <section class="panel">
                                    <section class="panel-body">
                                        <div v-show="1 == tabId">
                                            <inicio-component  v-if="alumno.id" v-bind:alumno="alumno"  v-bind:showactions="false"></inicio-component>
                                        </div>
                                        <div v-show="2 == tabId">
                                            <inicio-tram-component v-bind:tramite="tramite" ref="loadTramite"></inicio-tram-component>
                                        </div>
                                        <div v-show="3 == tabId">
                                            <alumno-merito-component v-bind:alumno="alumno"  ></alumno-merito-component>
                                        </div>
                                        <div v-show="4 == tabId" >
                                            <historial-component v-bind:alumno="alumno" ref="loadHistorial" v-bind:showactions="true"></historial-component>
                                        </div>
                                        <div v-show="5 == tabId" >
                                            <matricula-component v-bind:alumno="alumno" ref="loadMatricula"></matricula-component>
                                        </div>
                                        <div v-show="6 == tabId">
                                            <retiro-ciclo-component v-bind:alumno="alumno" ref="compRetiroCiclo"></retiro-ciclo-component>
                                        </div>
                                    </section>
                                </section> 
                            </div>
                        </section>
                    </section>
                </section>
                <th:block th:replace="tramite/tramiteConstancia/ciclosModal"/>

            </div>
            <div th:replace="tramite/tramiteConstancia/inicioTramite"/>
            <div th:replace="academico/alumno/includes/inicio"/>
            <div th:replace="academico/alumno/includes/alumnoMeritos"/>
            <div th:replace="academico/alumno/includes/historial"/>
            <div th:replace="academico/alumno/includes/matricula"/>
            <div th:replace="academico/alumno/includes/retiroCiclo"/>
        </div>

        <div layout:fragment="js">
            <script th:inline="javascript">
                /*<![CDATA[*/
                var tiposDocumentoAcademicoJson = /*[[${tiposDocumentoAcademico.toString()}]]*/ 'json';
                var solicitudJson = /*[[${solicitud.toString()}]]*/ 'json';
                var ID_ALUMNO = /*[[${idAlumno}]]*/ '';
                var IS_EDICION = /*[[${IS_EDICION}]]*/ '';
                /*]]>*/
            </script>

            <div th:replace="_layout/includes :: vuejs"/>
            <script th:src="@{/app/tramite/tramiteConstancia/inicioTramiteComponent.js}" charset="utf-8"></script>
            <script th:src="@{/app/academico/alumno/inicioComponent.js}" charset="utf-8"></script>
            <script th:src="@{/app/academico/alumno/historialComponent.js}" charset="utf-8"></script>
            <script th:src="@{/app/academico/alumno/matriculaComponent.js}" charset="utf-8"></script>
            <script th:src="@{/app/academico/alumno/retiroCicloComponent.js}" charset="utf-8"></script>
            <script th:src="@{/app/academico/alumno/alumnoMeritos.js}" charset="utf-8"></script>
            <script th:src="@{/app/tramite/tramiteConstancia/solicitud.js}" charset="utf-8"></script>
        </div>
    </body>
</html>
