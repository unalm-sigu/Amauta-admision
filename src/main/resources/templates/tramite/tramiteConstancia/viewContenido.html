<html layout:decorator="_layout/layout">
    <head>
        <title> Solicitud Constancia </title>
    </head>
    <body>

        <div layout:fragment="main">
            <div id="main" v-cloak="">
                <header class="header b-b padder-lg">

                    <a class="pull-right btn btn-default  btn-sm"
                       th:href="@{/tramite/solicitudconstancia}" >
                        Regresar
                    </a>

                    <h1 >Solicitud de Constancia</h1>

                </header>

                <section class="wrapper-lg ">
                    <section  class="panel">
                        <section class="panel-body">
                            <div slot="body" class="col-md-offset-2">

                                <iframe    id="myframe"  width="1080"  height="500">

                                </iframe>

                            </div>
                        </section>
                        <section class="panel-body text-center v-middle">

                            <!--<button v-on:click="updateContenido" class="btn btn-primary" id="updateContenido">Guardar</button>-->
                            <!--                            <a class="btn btn-primary" v-bind:href="'/tramite/solicitudconstancia/downloadWord/' + id">Generar Word</a>
                                                        <button type="button"  class="btn btn-warning btn-sm ">Finalizar</button>-->

                            <a class="btn btn-success m-r-md"
                               v-if="tramite"
                               v-for="accion in tramite.accionesTramitesDocumentos"
                               v-text="accion.opcion"
                               v-on:click.prevent="procesarTramite(accion)"
                               >
                            </a>
                        </section>
                    </section>
                    <section  class="panel">
                        <section class="panel-body">
                            <div class='form-group row'>
                                <label class="col-sm-12 control-label block">Incrustaciones: </label>
                                <div class="col-sm-6">
                                    <multiselect 
                                        v-model="plantillaBean.plantillaDocumentoAcademico"
                                        v-bind:options="incrustaciones"
                                        label="nombre"
                                        placeholder="Seleccione una incrustación"
                                        v-bind:limit="15"
                                        track-by="id"
                                        v-bind:show-labels="false"
                                        v-bind:internal-search="true">
                                    </multiselect>
                                </div>
                                <button type="button"  class="btn btn-primary btn-sm " v-on:click="addVariable">Agregar</button> 
                            </div>
                            <div class="col-md-4" v-if="tramiteIncrustaciones.length > 0">
                                <table  class="table table-striped table-hover  col-md-offset-1" >
                                    <thead>
                                        <tr>
                                            <th class="col-md-1 text-left">Orden</th>
                                            <th class="col-md-6 text-left">Nombre Incrustación</th>
                                            <th ></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr v-for="(item, idx ) in tramiteIncrustaciones">
                                            <td class="v-middle">
                                                <span v-text="item.orden"></span>
                                            </td>
                                            <td class="v-middle text-left">
                                                <span v-text="item.platillaIncrustacion.nombre"></span>
                                            </td>
                                            <td class="v-middle">
                                                <div class="actions">
                                                    <a class="dropdown-toggle" href="#" data-toggle="dropdown"><i class="glyphicon glyphicon-option-vertical"></i></a>
                                                    <ul class="dropdown-menu pull-right">
                                                        <li><a  v-on:click="borrar(item,idx)">Eliminar</a></li>
                                                    </ul>
                                                </div>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </section>
                    </section>
                </section>

                <!--<div th:substituteby="tramite/tramiteConstancia/ciclosModal"></div>-->
            </div>

        </div>

        <div layout:fragment="js">
            <script th:inline="javascript">
                /*<![CDATA[*/
                var contenidoJson = /*[[${contenido.toString()}]]*/ 'json';
                var incrustacionesJson = /*[[${incrustaciones.toString()}]]*/ 'json';
                var tramiteJson = /*[[${tramite.toString()}]]*/ 'json';
                var id = /*[[${id.toString()}]]*/ 'json';
                /*]]>*/
            </script>
            <!--<div th:substituteby="_layout/includes :: vuejs"/>-->
            <div th:substituteby="_layout/includes :: javascript-upload" th:remove='tag'></div>
            <div th:substituteby="_layout/includes :: javascript-ckeditor" th:remove="tag"></div>
            <div th:substituteby="_layout/includes :: javascript-filedownload"/>
            <div th:substituteby="_modules/vue-modal"/>
            <script th:src="@{/app/tramite/tramiteConstancia/viewContenido.js}" charset="utf-8"></script>
        </div>
    </body>
</html>
