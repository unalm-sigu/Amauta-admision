<template id="dynatableTemplate">
    <transition >
        <div class="panel padder-v col-md-8 col-md-offset-2">
            <table id="dynaTable" class="table table-striped table-hover ">
                <thead> 
                    <tr>
                        <th class="text-center v-middle">Item</th>
                        <th class="text-center">Nombre</th>
                        <th class="text-center">Costo por ciclo</th>
                        <th class="text-center">Tipo</th>
                        <th class="text-center">Editar</th>
                    </tr> 
                </thead>
                <tbody></tbody>
            </table>
        </div>

    </transition>
</template>

<template id="dynatableRowTemplate">

    <tr>
        <td class="v-middle text-center">
            <span class="block">{{:index + 1}}</span> 
        </td>
        <td class="v-middle ">
            <span >{{:nombre}}</span> 
        </td>
        <td>

            <label class="switch">     
                {{if costo}}
                <input type="checkbox" class="checking1" checked="" ></input>    
                {{else}}
                <input type="checkbox" class="checking" ></input>    
                {{/if}}
                <span></span>
            </label>

        </td>
         <td class="v-middle ">
             <span >{{:tipo.value}}</span> 
        </td>
        <td class="v-middle"> 

            <div class="dropdown actions">
                <a class="dropdown-toggle" data-toggle="dropdown">
                    <i class="glyphicon glyphicon-option-vertical"></i>
                </a> 
                <ul class="dropdown-menu pull-right" >                
                    <li><a  rel="{{:id}}" class="modalUpdate">Actualizar</a></li>
                </ul>
            </div>

        </td>
    </tr>
</template>
