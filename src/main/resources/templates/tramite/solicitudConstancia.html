<html layout:decorator="_layout/layout">
    <head>
        <title>Administración de Oficinas</title>
    <div th:substituteby="_layout/includes :: styles-dynatable"></div>
</head>
<body>
    <div layout:fragment="main">
        <div id="colaboradorVue">

            <header class="header b-b padder-lg">

                <div class="btn-group pull-right">
                    <button type="button" class="btn btn-success btn-sm dropdown-toggle" data-toggle="dropdown">
                        <i class="fa fa-file-text-o"/> &nbsp; Acciones &nbsp; <span class="caret"></span>
                    </button>
                    <ul class="dropdown-menu">
                        <li ><a href="#" v-on:click="nuevoColaborador()" >Nuevo Colaborador</a></li>
                        <li><a href="#">Agregar Cargo</a></li>
                        <li class="divider"></li>
                        <li><a href="#">Ver Cargos</a></li>
                        <li><a href="#">Ver Funciones</a></li>
                    </ul>
                </div>

                <h2>Colaboradores</h2>

            </header>
            <section class="wrapper-lg m-b-xs">
                <section class="panel">
                    <section class="panel-body">
                        <div class="row">
                            <div class="col-md-2 text-center" >
                                <a class="verModalidades text-success pointer" value="1" rel="ACT" >
                                    <span class="h1 block bold" th:text="${resumen.activos}"></span>
                                    <small class="block m-b-xs">Activos</small>
                                </a>
                            </div>
                            <div class="col-md-2 text-center">
                                <a class="verModalidades ext-black pointer" value="2" rel="VAC" >
                                    <span class="h1 block bold" th:text="${resumen.vacaciones}"></span>
                                    <small class="block m-b-xs">Vacaciones</small>
                                </a>
                            </div>
                            <div class="col-md-2 text-center">
                                <a class="verModalidades text-black pointer" value="3" rel="RET" >
                                    <span class="h1 block bold" th:text="${resumen.retirado}"></span>
                                    <small class="block m-b-xs">Retirados</small>
                                </a>
                            </div>
                            <div class="col-md-2 text-center">
                                <a class="verModalidades text-warning pointer" value="4" rel="DSC"  >
                                    <span class="h1 block bold" th:text="${resumen.descanso}" ></span>
                                    <small class="block m-b-xs">Descanso</small>
                                </a>
                            </div>
                            <div class="col-md-2 text-center">
                                <a class="verModalidades text-warning pointer" value="5" rel="PER" >
                                    <span class="h1 block bold" th:text="${resumen.permiso}" ></span>
                                    <small class="block m-b-xs">Permiso</small>
                                </a>
                            </div>
                            <div class="col-md-2 text-center">
                                <a class="verModalidades text-danger pointer" value="6" rel="DESP" >
                                    <span class="h1 block bold" th:text="${resumen.despedido}" ></span>
                                    <small class="block m-b-xs">Despedidos</small>
                                </a>
                            </div>
                        </div>
                    </section>
                </section>
                <section class="panel">            

                    <section class="panel-body">
                        <div class="col-sm-6">
                            <div class="form-group">                                
                                <multiselect v-model="oficina" 
                                             v-bind:options='oficinas'
                                             label='nombre'
                                             track-by='id'
                                             placeholder="Seleccione una oficina"
                                             v-on:input="oficinaSeleccionada()">
                                </multiselect>
                            </div>
                        </div>                        
                        <dynatable/>
                    </section>
                </section>
            </section>

        </div>
        <th:block th:replace="general/oficina/colaborador/colaboradorDynatable"/>
    </div>
    <div layout:fragment="js">
        <script th:inline="javascript">
            /*<![CDATA[*/
            var oficinaId = /*[[${oficina}]]*/ 'json';
            var oficinasJson = /*[[${oficinas.toString()}]]*/ 'json';
            /*]]>*/
        </script>
        <div th:substituteby="_layout/includes :: javascript-dynatable"/>
        <script th:src="@{/app/general/oficina/colaborador/colaborador.js}" charset="utf-8"></script>
    </div>

</body>
</html>
