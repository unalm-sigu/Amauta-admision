<modal-vik ref="verTramiteModal"
           v-bind="verTramiteModal"
           v-bind:okaction="saveRespuesta">

    <div slot="body">
        <div class="step1">

            <div class="row ">                 
                <div class="col-md-12" v-if="tramiteSubvencion != null">
                    <div class="form-group row">
                        <div class="col-md-10">
                            <label class="block">Alumno</label>
                            <span class="text-info bold" v-text="persona.nombreCompleto"> </span>
                        </div>
                    </div>
                    <div class="form-group row">
                        <div class="col-md-10" >
                            <label class="block">Horas a laborar {{tramiteSubvencion.horas}}</label>
                            <multiselect v-model="value" 
                                         v-bind:options='horasTrabajo'
                                         label="horas"
                                         track-by='horas'
                                         placeholder="Seleccione una hora"
                                         >
                            </multiselect>
                        </div>
                    </div>
                    <div class="form-group row">
                        <div class="col-md-10 ">
                            <label class="block">Lugar de labores</label>
                            <input  v-model="tramiteSubvencion.lugar" class="form-control" rows="4"></input>
                        </div>    
                    </div>
                    <div class="form-group row">
                        <div class="col-md-10 ">
                            <label class="block">Labor a realizar</label>
                            <textarea  v-model="tramiteSubvencion.laborRealizar" class="form-control" rows="2"></textarea>
                        </div>
                    </div>
                    <div class="form-group row">
                        <div class="col-md-10 ">
                            <label class="block" >Aceptar</label>
                            <label class="switch">
                                <input type="checkbox" v-model="rechazado" />
                                <span></span>
                            </label>
                        </div>
                    </div>
                    <div class="form-group row" v-if="!rechazado">
                        <div class="col-md-10 ">
                            <label class="block">Motivo de rechazo</label>
                            <textarea  v-model="tramiteSubvencion.comentario" class="form-control" rows="2"></textarea>
                        </div>
                    </div>
                </div>
            </div>        

        </div>
    </div>
</modal-vik>
