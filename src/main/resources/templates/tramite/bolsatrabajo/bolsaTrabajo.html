<html layout:decorator="_layout/layout">
    <head>
        <title>Tramite Bolsistas</title>
    <div th:substituteby="_layout/includes :: styles-dynatable"></div>
</head>
<body>
    <section layout:fragment="main">
        <div id="bolsaTrabajoVue">
            <div v-cloak="">
                <header class="header b-b padder-lg">

                    <h2>Trámite Bolsistas {{cicloAcademico.descripcion}}</h2>

                </header>
                <section class="panel">
                    <section class="panel-body">
                        <div class="col-md-12 col-md-offset-0">
                            <raptor-table v-bind:url="tramiteAlumnosURL" ref="load">
                                <template  scope="props" >

                                    <table  class="table table-striped table-hover">
                                        <thead>
                                            <tr>
                                                <th class="col-md-3 text-left" colspan="2">Alumno</th>
                                                <th class="col-md-2 text-center">Tramite</th>
                                                <th class="col-md-2 text-center">Motivo</th>
                                                <th class="col-md-3 text-left">Fecha Registro</th>
                                                <th class="col-md-1 text-center"></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr v-for="item in props.data">
                                                <td class="v-middle">
                                                    <div class="pull-left">
                                                        <div v-if="item.tramite.alumno.persona.tipoFoto=='POSTUL' "
                                                             class="img-responsive img-thumbnail img-circle div-foto-list">
                                                            <img class="img-foto-list" v-bind:src="item.tramite.alumno.persona.rutaFoto" />
                                                        </div>

                                                        <img v-else-if="item.tramite.alumno.persona.tipoFoto=='COMUN' " 
                                                             class="img-responsive img-thumbnail img-circle div-foto-alumno-list" 
                                                             v-bind:src="item.tramite.alumno.persona.rutaFoto" />

                                                        <img v-else="" 
                                                             class="img-foto-tempo img-responsive img-thumbnail img-circle" 
                                                             v-bind:src="item.tramite.alumno.persona.rutaFoto" />
                                                    </div>
                                                </td>
                                                <td class="v-middle text-left">
                                                   
                                                    <span class="block bold "> <a>{{item.tramite.alumno.persona.nombreCompleto}}</a> </span> 
                                                    <span class="block bold " v-if="item.tramite.alumno.carrera.nombre!=item.tramite.alumno.carrera.facultad.nombre"> {{item.tramite.alumno.carrera.nombre}} - {{item.tramite.alumno.carrera.facultad.nombre}} </span> 
                                                    <span class="block bold " v-if="item.tramite.alumno.persona.numeroDocIdentidad!=null"> {{item.tramite.alumno.persona.tipoDocumento.simbolo}} - {{item.tramite.alumno.persona.numeroDocIdentidad}} </span> 
                                                    <span class="block bold " > {{item.tramite.alumno.codigo}}</span> 
                                                </td>
                                                <td class="v-middle text-left">
                                                    <span class="block text-muted">
                                                        <span class="bold "> Tipo Trámite:</span> 
                                                        {{item.tramite.tipoTramite.nombre}}
                                                    </span>
                                                    <span class=" block text-muted">
                                                        <span class="bold "> Tipo {{item.tramite.tipoTramite.nombre}}:</span> 
                                                        {{item.tipoSubvencion.nombre}}</span>
                                                    <span class="text-muted"> <span class=" bold "> Código Trámite:</span> {{item.tramite.serie}}-{{item.tramite.numero}}</span>
                                                </td>
                                                <td class="v-middle">
                                                    <span class="block text-center"> {{item.motivo}}</span>
                                                </td>
                                                <td class="v-middle">
                                                    <span class="block text-muted"> {{item.fechaRegistro}}</span>
                                                </td>
                                                <td class="v-middle">
                                                    <div class="actions">
                                                        <a class="dropdown-toggle" href="#" data-toggle="dropdown"><i class="glyphicon glyphicon-option-vertical"></i></a>
                                                        <ul class="dropdown-menu pull-right" >
                                                            <li><a  href="#" v-on:click="verTramite(item)">Ver Trámite</a></li>
                                                        </ul>
                                                    </div>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </template>
                            </raptor-table>
                        </div>
                    </section>
                </section>
                <th:block  th:replace="tramite/bolsatrabajo/verTramiteModal"/>
            </div>
        </div>
        <div th:substituteby="_modules/vue-modal"/>
    </section>

    <div layout:fragment="js">
        <script th:inline="javascript">
            /*<![CDATA[*/
            var cicloacademicoJson = /*[[${cicloacademico.toString()}]]*/ 'json';
            /*]]>*/
        </script>
        <div th:substituteby="_modules/vue-raptor-table"></div>
        <script type="text/javascript" th:src="@{/phobos/modules/vue-modal.js}"></script>
        <script th:src="@{/app/tramite/bolsatrabajo/bolsaTrabajo.js}" charset="utf-8"></script>
    </div>

</body>
</html>
