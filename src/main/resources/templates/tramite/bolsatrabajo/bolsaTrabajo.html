<html layout:decorator="_layout/layout">
    <head>
        <title>Tramite Bolsistas</title>

    </head>
    <body>
        <section layout:fragment="main">
            <div id="bolsaTrabajoVue">
                <div v-cloak="">
                    <header class="header b-b padder-lg">
                        <h2 class="m-b">Trámite Bolsistas {{ciclo.descripcion}}</h2>
                    </header>

                    <section class="wrapper-lg m-b-xs">
                        <section class="panel  ">           
                            <section class="panel-body ">

                                <raptor-table v-bind:url="tramiteAlumnosURL" ref="load">
                                    <template  scope="props" >

                                        <table  class="table table-striped table-hover">
                                            <thead>
                                                <tr>
                                                    <th class="col-md-3 text-left" colspan="2">Alumno</th>
                                                    <th class="col-md-2 text-center">Trámite</th>
                                                    <th class="col-md-2 text-center">Motivo</th>
                                                    <th class="col-md-3 text-left">Estado</th>
                                                    <th class="col-md-1 text-center"></th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <tr v-for="item in props.data">
                                                    <td class="v-middle">
                                                        <div class="pull-left">
                                                            <div v-if="item.tramite.alumno.persona.tipoFoto=='POSTUL' "
                                                                 class="img-responsive img-thumbnail img-circle div-foto-list">
                                                                <img class="img-foto-list" v-bind:src="item.tramite.alumno.persona.rutaFoto" />
                                                            </div>

                                                            <img v-else-if="item.tramite.alumno.persona.tipoFoto=='COMUN' " 
                                                                 class="img-responsive img-thumbnail img-circle div-foto-alumno-list" 
                                                                 v-bind:src="item.tramite.alumno.persona.rutaFoto" />

                                                            <img v-else="" 
                                                                 class="img-foto-tempo img-responsive img-thumbnail img-circle" 
                                                                 v-bind:src="item.tramite.alumno.persona.rutaFoto" />
                                                        </div>
                                                    </td>
                                                    <td class="v-middle text-left">
                                                        <span class="block bold "> <a>{{item.tramite.alumno.persona.apellidosNombres}}</a> </span> 
                                                        <span class="block bold " v-if="item.tramite.alumno.carrera.nombre == item.tramite.alumno.carrera.facultad.nombre"> {{item.tramite.alumno.carrera.nombre}} </span> 
                                                        <span class="block bold " v-else=""> {{item.tramite.alumno.carrera.nombre}} - {{item.tramite.alumno.carrera.facultad.nombre}} </span> 
                                                        <span class="block " v-if="item.tramite.alumno.persona.numeroDocIdentidad"> {{item.tramite.alumno.persona.tipoDocumento.simbolo}} {{item.tramite.alumno.persona.numeroDocIdentidad}} </span> 
                                                        <span class="block bold " > {{item.tramite.alumno.codigo}}</span> 
                                                    </td>
                                                    <td class="v-middle text-left">
                                                        <span class="block"> 
                                                            <span class=" bold ">Nº Trámite {{item.tramite.serie}}-{{item.tramite.numero}}</span>
                                                        </span>
                                                        <span class="block">
                                                            {{item.tramite.tipoTramite.nombre}}
                                                        </span>
                                                        <span class=" block">
                                                            {{item.tipoSubvencion.nombre}}
                                                        </span>
                                                    </td>
                                                    <td class="v-middle">
                                                        <span class="block text-center"> {{item.motivo}}</span>
                                                    </td>
                                                    <td class="v-middle">
                                                        <span class="block"> {{item.tramite.estadoEnum.value}}</span>
                                                        <span class="block" v-if="item.tramite.accionTramiteBienestar"> 
                                                            <b>¿Qué falta hacer?</b> {{item.tramite.accionTramiteBienestar.queHacer}}
                                                        </span>
                                                    </td>

                                                    <td class="v-middle">
                                                        <div class="actions">
                                                            <a class="dropdown-toggle" href="#" data-toggle="dropdown"><i class="fa fa-cog"></i></a>
                                                            <ul class="dropdown-menu pull-right" >
                                                                <li vqif="item.tramite.estado == 'SOL' "><a class="pointer" v-on:click="verTramite(item)">Ver Trámite</a></li>
                                                            </ul>
                                                        </div>
                                                    </td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </template>
                                </raptor-table>

                            </section>
                        </section>
                    </section>
                    <th:block  th:replace="tramite/bolsatrabajo/verTramiteModal"/>
                </div>
            </div>
        </section>

        <div layout:fragment="js">
            <script th:inline="javascript">
                /*<![CDATA[*/
                var cicloJson = /*[[${ciclo.toString()}]]*/ 'json';
                /*]]>*/
            </script>

            <div th:replace="_modules/vue-raptor-table"></div>
            <script th:src="@{/app/tramite/bolsaTrabajo/bolsaTrabajo.js}" charset="utf-8"></script>
        </div>

    </body>
</html>
