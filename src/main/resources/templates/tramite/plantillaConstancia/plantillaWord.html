<modal-vik ref="modalLoadWord"
           v-bind="modalLoadWord"
           v-bind:okaction="saveLoadWord">

    <div slot="body">
        <div class="step1">

            <div >
                <div  class="form-group row">
                    <div class="col-sm-4 col-md-4 ">
                        <file-upload 
                            v-show="!$refs.upload || !$refs.upload.active"
                            extensions="docx"
                            accept=".docx"
                            input-id="file"
                            name="file"
                            class="col-sm-12 col-md-12 btn btn-success"
                            v-bind:class="btnFileColor"
                            post-action="/tramite/plantillaconstancia/uploadWordFile"
                            v-on:input-file="inputFile"
                            v-on:input-filter="inputFilter"
                            ref="upload">
                            <i class="fa fa-file-word-o "></i> &nbsp;Subir Archivo
                        </file-upload>
                    </div>
                </div>

                <div class="form-group row">
                    <div class="col-sm-12 col-md-12">
                        <p>{{archivo.nombre}}</p>
                    </div>
                </div>
                <div class="form-group row col-md-12">
                    <div class="progress " 
                         style="height: 4px;">
                        <div id="progress-bar" class="progress-bar" 
                             role="progressbar" 
                             style="width: 0%;" 
                             aria-valuenow="0" 
                             aria-valuemin="0" 
                             aria-valuemax="100">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


</modal-vik>
