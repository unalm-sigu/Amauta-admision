<html>
    <head>
        <title th:inline="text"> Curso Dirigido </title>
        <style>
            body{
                font-size: 14px !important;	
            }

            .fecha {
                font-size: 10px;
                font-style: italic;
            }

            .table{
                font-size:8px !important;
                border: solid .25px;
                border-collapse: collapse;
            }
            .tabled{
                font-size:14px !important;
                border-collapse: collapse;
            }

            .text-center {
                text-align: center;
            }

            .text-right{
                text-align: right;
            }

            table td {
                padding: 8px !important;
            }

            .table-plan {
                width: 100%;
            }
            .table-dirigido {
                width: 50%;
            }
            .tableCred {
                width: 80%;
            }
            div {
                padding-top: 15px;
            }
            .table-cretidos > tbody > tr > td, .table-plan > thead > tr > td  {
                border-bottom: solid .25px;
            }
            .table-dirigido > tbody > tr > td, .table-plan > thead > tr > td  {
                border-bottom: solid .25px;
            }
            .table-plan > tbody > tr > td, .table-plan > thead > tr > td  {
                border-top: solid .25px;
                border-bottom: solid .25px;
                border-left:  solid .25px;
                border-right:   solid .25px;
            }
        </style>


    </head>
    <body>

        <div >
            <span class="fecha" th:text="${fecha}">La Molina, miércoles 8 de agosto de 2018</span>
        </div>
        <div style="text-align: right; padding-top: 20px; padding-bottom: 20px;">
            <table  cellspacing="0" cellpadding="0" width="100%">
                <tr>
                    <td width="200" style="text-center">
                        <img height= "80px" src="logo-min.jpg" />
                    </td>
                    <td width="80%" style="text-align: center; padding-bottom: 20px;">
                        <b style="font-size: 16px;"> UNIVERSIDAD NACIONAL AGRARIA LA MOLINA </b>
                        <p style="font-family: serif; font-size: 12px;"> OFICINA DE ESTUDIOS Y REGISTROS ACADÉMICOS </p>
                    </td>


                </tr>
            </table>
        </div>
        <div style="text-align: center; padding-bottom: 30px">
            <h4 style="font-size: 16px;">LISTA DE ALUMNOS QUE SOLICITAN CURSOS DIRIGIDOS</h4>
            <h4 style="font-size: 16px;" th:text="'FACULTAD DE ' + ${facultad}"></h4>
        </div>
        <div >            
            <table class="tabled table-plan" align="center">
                <thead>
                    <tr >
                        <th style="font-size: 14px;">Matricula</th>
                        <th style="font-size: 14px;">Alumno</th>
                        <th style="font-size: 14px;">ESP</th>
                        <th style="font-size: 14px;">Curso</th>
                    </tr>
                </thead>
                <tbody >
                    <tr th:each="curDir : ${cursoDirigido}" >
                        <td width="50">
                            <span style="font-size: 10px;" th:text="${curDir.tramite.alumno.codigo}"></span>
                        </td>
                        <td width="300">
                            <span  style="font-size: 10px;" th:text="${curDir.tramite.alumno.persona.apellidosNombres}"></span>
                        </td>
                        <td width="40">
                            <span style="font-size: 10px;" th:text="${curDir.tramite.alumno.carrera.codigo}"></span>
                        </td>
                        <td width="300">
                            <span style="font-size: 10px;" th:text="${curDir.curso.codigo}"></span> - <span th:text="${curDir.curso.nombre}"></span>
                        </td>
                    </tr>

                </tbody>
            </table>
        </div>
        <br/>
    </body>
</html>
