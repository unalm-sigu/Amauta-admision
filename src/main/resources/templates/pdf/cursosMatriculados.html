<html>
    <head>
        <title th:inline="text"> Cursos matriculados </title>
        <style>
            body{
                font-size: 10px !important;	
            }

            .fecha {
                font-size: 10px;
                font-style: italic;
            }

            .table{
                font-size:10px !important;
                border: solid .25px;
                border-collapse: collapse;
            }

            .text-center {
                text-align: center;
            }

            .text-right{
                text-align: right;
            }

            table td {
                padding: 8px !important;
            }

            .table-plan {
                width: 100%;
            }

            .table-plan > tbody > tr > td, .table-plan > thead > tr > td  {
                border-top: solid .25px;
                border-bottom: solid .25px;
            }

        </style>
    </head>
    <body>
        <div style="text-align: center">
            <b class="block" th:inline="text"> CURSOS MATRICULADOS </b>
        </div>
        <div style="text-align: right; padding-top: 20px;padding-bottom: 20px;">
            <span class="fecha" th:text="${fecha}">La Molina, miércoles 8 de agosto de 2018</span>
        </div>

        <table class="table table-plan">
            <thead>
                <tr>
                    <td style="width: 35%"><b> Curso </b></td>
                    <td style="width: 10%" class="text-center"><b> Créditos </b></td>


                    <td style="width: 10%" class="text-center"><b> Sección </b></td>
                    <td style="width: 10%" class="text-center"><b> Grupo </b></td>
                    <td style="width: 35%"><b> Docente </b></td>
                </tr>
            </thead>
            <tbody style="border: solid 2px !important">
            <th:block th:each="item : ${gpoSecciones}">
                <th:block th:if="${item.value.size() == 2}">
                    <tr>
                        <td rowspan="2">
                            <span th:text="${item.key.curso.nombre}"> nombre </span>
                        </td>
                        <td rowspan="2" class="text-center">
                            <span th:text="${item.key.curso.creditos}"> nombre </span>
                        </td>

                        <td class="text-center" style="border-bottom: none !important;">
                            <span th:text="${item.value.get(0).codigo}"> nombre </span>
                        </td>
                        <td class="text-center">
                            <span th:text="${item.value.get(0).grupoHoras.codigo}"> nombre </span>
                        </td>
                        <td>
                            <div th:each="docenteSeccion : ${item.value.get(0).docenteSeccion}">
                                <p th:text="${docenteSeccion?.docente?.persona?.nombreCompleto}" style="padding-top: 2px; padding-bottom: 2px;"> nombre </p>
                            </div>
                        </td>
                    </tr>

                    <tr>
                        <td class="text-center" style="border-top: none !important">
                            <span th:text="${item.value.get(1).codigo}"> nombre </span>
                        </td>
                        <td class="text-center">
                            <span th:text="${item.value.get(1).grupoHoras.codigo}"> nombre </span>
                        </td>
                        <td>
                            <div th:each="docenteSeccion : ${item.value.get(1).docenteSeccion}">
                                <p th:text="${docenteSeccion?.docente?.persona?.nombreCompleto}" style="padding-top: 2px; padding-bottom: 2px;"> nombre </p>
                            </div>
                        </td>
                    </tr>
                </th:block>
                <th:block th:if="${item.value.size() == 1}">
                    <tr>
                        <td rowspan="2">
                            <span th:text="${item.key.curso.nombre}"> nombre </span>
                        </td>
                        <td rowspan="2" class="text-center">
                            <span th:text="${item.key.curso.creditos}"> nombre </span>
                        </td>


                        <td rowspan="2" class="text-center">
                            <span th:text="${item.value.get(0).codigo}"> nombre </span>
                        </td>
                        <td rowspan="2" class="text-center">
                            <span th:text="${item.value.get(0).grupoHoras.codigo}"> nombre </span>
                        </td>
                        <td rowspan="2">
                            <div th:each="docenteSeccion : ${item.value.get(0).docenteSeccion}">
                                <p th:text="${docenteSeccion?.docente?.persona?.nombreCompleto}"> nombre </p>
                            </div>
                        </td>
                    </tr>
                </th:block>
            </th:block>
        </tbody>
    </table>


</body>
</html>
