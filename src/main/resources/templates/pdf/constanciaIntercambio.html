<html>
<head>
    <title> Constancia Intercambia Alumno  </title>
</head>
<style>
    body{
        font-size: 8px;
    }
    .main-container {
        border: 1px solid black;
    }
    .constancia-num {
        text-align: right;
    }
    .constancia-num h2 {
        margin: 0;
    }
    .table-dirigido {
        width: 100%;
    }
    .tabled {
        width: 100%;
        border-collapse: collapse;
    }

    .tabled th, .tabled td {
        border: 1px solid black;
        padding: 4px;
        font-size: 12px;
    }

    .tabled td:nth-child(2) {
        text-align: left;
    }

    .tabled thead th {
        background-color: #D6D6D6;
        font-weight: bold;
    }
    .tabled.no-center th,
    .tabled.no-center td {
        text-align: left;
    }
    .centered {
        text-align: center;
    }

</style>
<body>
<div style="margin: 0 auto; padding: 0 30px; position: relative;">
<div style="height: 120px;"></div>
<div class="constancia-num">
    <span>627-UR</span>
</div>
<div style="height: 220px;"></div>

<div class="main-container">
    <div>
        <h2 style="font-size: 18px; text-align: center;"> <strong class="" th:text="${alumno.persona.apellidosNombres.toUpperCase()}"></strong> .- </h2>
    </div>
    <div class="tabled table-dirigido no-center">
        <tr>
            <td>
                <span th:text="${alumno.persona.sexo == 'M' ? 'Identificado' : 'Identificada'}"></span> con el código N°
                <strong th:text="${alumno.codigo}"></strong> en el Registro de Matrícula, ha realizado estudios como
                <strong th:text="${alumno.persona.sexo == 'M' ? 'ALUMNO DE INTERCAMBIO ESTUDIANTIL' : 'ALUMNA DE INTERCAMBIO ESTUDIANTIL'}" style="font-size: 15px;"></strong> en esta Universidad,

                <span th:if="${#lists.size(ciclos) > 1}" th:text="'estudió durante los ciclos: '"></span>

                <span th:if="${#lists.size(ciclos) > 1}" th:each="ciclo, iterStat : ${ciclos}">
                    <strong><span th:text="${ciclo}" style="font-size: 15px;"></span></strong>
                    <span th:if="${iterStat.index < #lists.size(ciclos) - 1}">/ </span>
                </span>

                <span th:if="${#lists.size(ciclos) == 1}" th:text="'estudió durante el ciclo: '"></span>
                <strong><span th:if="${#lists.size(ciclos) == 1}" th:text="${ciclos[0]}" style="font-size: 15px;"></span></strong>,

                habiendo aprobado los siguientes cursos:
            </td>



        </tr>
    </div>
    <br/>


    <div th:each="entry : ${cursosPorCiclo}">
        <h3 th:text="'Ciclo ' + ${entry.key}">Ciclo Académico</h3>

        <table class="tabled table-dirigido">
            <thead>
            <tr>
                <th class="centered">CODIGO</th>
                <th style="width: 220px;" class="centered">NOMBRE DEL CURSO</th>
                <th class="centered">NOTA</th>
                <th class="centered">CREDITO</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="cursox : ${entry.value}">
                <td class="centered" th:text="${cursox.getCurso().getCodigo()}"></td>
                <td style="width: 220px;" th:text="${cursox.getCurso().getNombre()}"></td>
                <td class="centered" th:text="${cursox.getNota()}"></td>
                <td class="centered" th:text="${cursox.getCreditos()}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <br/>
    <div style="width: 100%; position: relative; font-family: Arial, sans-serif;">
        <div style="float: left; width: 50%; padding-left: 20px;">

        </div>

        <div style="text-align: center; padding-left: 20px; padding-top: 20px;">
            <br/>
            <span style="font-size: 12px;" th:text="${fecha}"></span>
            <br/><br/><br/><br/><br/><br/><br/>
            <span style="font-size: 12px; display: block; font-weight: bold; padding-top: 40px;">Alipio Ccorimanya Ccasani</span>
        </div>
    </div>

</div>
</div>
</body>
</html>
