<html>
    <head>
        <meta charset="UTF8" />
        <title>Reporte</title>
        <style>
            body{
                font-size:8px !important;	
            }
            table{
                border-collapse: collapse;
                font-size:10px !important;
            }
            table td{
                padding: 3px;
            }
        </style>
    </head>
    <body>

        <div>
            <table width="100%">
                <tr>
                    <td width="70">
                        <img 
                            width="60px" 
                            height= "58px" 
                            src="logo-min.jpg" />
                    </td>
                    <td width="100%">
                        <div  style="text-align: center;font-size: 10px;font-weight: bold;width: 100%;">UNIVERSIDAD NACIONAL AGRARIA LA MOLINA</div>
                        <div style="text-align: center;font-size: 8px;width: 100%;">Oficina  de Estudios y Registros Academicos</div>
                    </td>

                </tr>
            </table>
        </div>

        <p style="text-align: center;"><b><span >Relación de Profesor-Curso con Monto a Pagar</span></b></p>
        <p style="text-align: center;"><b><span th:inline="text" >Matrícula [[${cicloAcademico.descripcion2}]] </span></b></p>

        <p style="text-align: right;font-size: 10px" th:inline="text" >La Molina , [[${fecha}]]</p>

        <table th:each="facu:${falcultades}"  style="margin-top: 25px" width="100%">
            <tr>
                <td with="100%">
                    <p style="font-weight: bold;font-size: 16px;" th:text="${facu.nombre}"></p>
                </td>
            </tr>
            <tr>
                <td width="100%">

                    <table th:each="depa:${facu.departamentoAcademico}"  style="margin-top: 15px" width="100%">

                        <tr>
                            <td colspan="3">
                                <p style="font-weight: bold;font-size: 14px;" th:text="${depa.nombreLargo}"></p>
                            </td>
                        </tr>

                        <tr>
                            <td width="10%">
                            </td>
                            <td width="80%">
                                <p style="font-weight: bold;">Profesor</p>
                            </td>
                            <td width="10%">
                                <p style="font-weight: bold;">Monto</p>
                            </td>
                        </tr>

                        <tr th:each="doc:${depa.docente}">
                            <td width="10%">
                                <p th:text="${doc.codigo}"></p>
                            </td>
                            <td width="80%">
                                <p th:text="${doc.persona.apellidosNombres}"></p>
                            </td>
                            <td width="10%">
                                <p th:text="${'S/.'+doc.montoTotalVeranoFormato}"></p>
                            </td>
                        </tr>

                        <tr>
                            <td width="10%">
                            </td>
                            <td width="80%">
                                <p style="font-weight: bold;">Monto Total por Departamento Acádemico</p>
                            </td>
                            <td width="10%">
                                <p style="font-weight: bold;" th:text="${'S/.'+depa.montoTotalVeranoFormato}"></p>
                            </td>
                        </tr>

                    </table>
                    

                    <table  style="margin-top: 25px" width="100%">
                        <tr>
                            <td width="10%">
                            </td>
                            <td width="80%">
                                <p style="font-weight: bold;">Monto Total por Facultad</p>
                            </td>
                            <td width="10%">
                                <p style="font-weight: bold;" th:text="${'S/.'+facu.montoTotalVeranoFormato}"></p>
                            </td>
                        </tr>
                    </table>


                </td>
            </tr>
        </table>
        

    </body>
</html>
