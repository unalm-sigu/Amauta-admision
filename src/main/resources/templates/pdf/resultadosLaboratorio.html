<!DOCTYPE html>

            }.fecha {
                padding-top: 20px;
                text-align: left;
            }
            .firma{
                padding-top: 20px;
                text-align: right;
            }.footer {
                position: fixed;
                left: 0;
                bottom: 0;
                width: 100%;
            }
            .nombre-familiar{
                text-align:left;
                font-size:13px;
                padding-bottom: 5px;

            .datos_seccion{
