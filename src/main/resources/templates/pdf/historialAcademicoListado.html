<html>
    <head>
        <title th:inline="text"> Plan Curricular </title>
        <style>
            body{
                font-size: 10px !important;	
            }

            .fecha {
                font-size: 10px;
                font-style: italic;
            }

            .table{
                font-size:10px !important;
                border: solid .25px;
                border-collapse: collapse;
            }

            .text-center {
                text-align: center;
            }

            .text-right{
                text-align: right;
            }

            table td {
                padding: 5px !important;
            }

            .info-adicional{
                font-size: 10px;
                font-style: italic;
            }
            .header {
                display: block;
                padding-bottom: 20px;
            }
            .col-sm{
                width: 30px;
            }

            .col-xs {
                width: 20px;
            }

            .col-xxs {
                width: 7px;
            }

            .table-plan {
                width: 100%;
            }

            .table-plan > tbody > tr > td, .table-plan > thead > tr > td  {
                border-top: solid .25px;
                border-bottom: solid .25px;
            }

        </style>
    </head>
    <body>

        <div style="text-align: center">
            <b class="block" th:inline="text"> HISTORIAL ACADÉMICO LISTADO </b>
        </div>
        <div style="text-align: right; padding-top: 20px;padding-bottom: 20px;">
            <span class="fecha" th:text="${fecha}">La Molina, miércoles 8 de agosto de 2018</span>
        </div>

        <table class="table table-plan" style="margin-bottom: 30px">
            <thead>
                
            </thead>
            <tbody>
                <tr th:each="cursado : ${alumnoCicloCurso}">
                    <td>
                        <span th:text="${cursado.curso.codigo}"> codigo </span>
                    </td>
                    <td>
                        <span th:text="${cursado.curso.nombre}"> codigo </span>
                    </td>
                    <td>
                        <span th:text="${cursado.nota}"> nota </span>
                    </td>
                    <td>
                        <span th:text="${cursado.alumnoCiclo.cicloAcademico.descripcion}"> ciclo </span>
                    </td>
                </tr>
            </tbody>
        </table>



</body>
</html>
