<html layout:decorator="_layout/layout">
    <head>
        <title>Menú</title>
    <div th:substituteby="_layout/includes :: styles-dynatable"></div>
    <link rel="stylesheet" type="text/css" th:href="@{/nestable/nestable.css}" />
    <link rel="stylesheet" type="text/css" th:href="@{/iconpicker/css/fontawesome-iconpicker.min.css}" />
    <style>
        .m1 {
            display: flex;
            overflow: hidden;
            height: 100vh;
            margin-top: -100px;
            padding-top: 100px;
            position: relative;
            width: 100%;
            backface-visibility: hidden;
            will-change: overflow;
            border: #000 solid thin;
            
        }
        .m2 {
            overflow: auto;
            height: auto;
            padding: .5rem;
            -webkit-overflow-scrolling: touch;
            -ms-overflow-style: none;
            flex: 1;
        }
    </style>
</head>

<body>
    <div layout:fragment="main">

         <header class="header b-b padder-lg">
            <h2>Menus</h2>
        </header>

        <section class="panel">
            <section class="panel-body">

                <div class="row">
                    <div class="col-sm-6">
                        <div class="m1">
                            <div class="m2">
                                <a class="btn btn-primary" id="nuevoTitulo"  href="#" >Nuevo Título</a>
                                <div id="tree"  class="tree"></div>
                            </div>
                        </div>
                    </div>

                    <div class="col-sm-6" id="formMenu"></div>

                </div>
            </section>
        </section>

        <script id="tituloTemplate" type="text/x-jsrender" class="hide">
            <div th:substituteby="seguridad/menu/tituloTemplate"></div>
        </script>

        <script id="menuListTemplate" type="text/x-jsrender" class="hide">
            <div th:substituteby="seguridad/menu/menuListTemplate"></div>
        </script>

    </div>

    <div layout:fragment="js">
        <script th:src="@{/nestable/nestable.js}" charset="utf-8"></script>
        <script th:src="@{/iconpicker/js/fontawesome-iconpicker.min.js}" charset="utf-8"></script>
        <script th:src="@{/app/seguridad/menu/menuForm.js}" charset="utf-8"></script>
    </div>

</body>
</html>
