<form class="row">

    <div class="col-sm-12">

        <div class="col-sm-12">
            <label class="h5"><b>Recurso :</b> <p class="h3"   th:text="${menu.nombre}"></p>      </label>

        </div>

        <div class="col-sm-5">

            <div class="form-group">
                <label><h5 th:inline="text"><b>Roles Asignados</b></h5></label>
                <select class="form-control input-sm" multiple="true" id="rolAsignados" >
                    <option th:each="rol : ${rolesMenu}" th:value="${rol.id}" th:text="${rol.nombre}">TITULO</option>
                </select>
            </div>

        </div>

        <div class="col-sm-2 v-middle" style="margin-top: 50px;">
            <button type="button" id="btnRolAsignar" class="btn btn-info m-t-sm" style="margin-left: 10px"><i class="fa fa-chevron-left" aria-hidden="true"></i></button>
            <button type="button" id="btnRolDesasignar" class="btn btn-danger m-t-sm" style="margin-left: 10px"><i class="fa fa-chevron-right" aria-hidden="true"></i></button>
        </div>

        <div class="col-sm-5">

            <div class="form-group">
                <label><h5><b>Roles Disponibles</b></h5></label>
                <select class="form-control input-sm" multiple="true" id="rolPorAsignar">
                    <option th:each="rol : ${roles}" th:value="${rol.id}" th:text="${rol.nombre}">TITULO</option>
                </select>
            </div>

        </div>

    </div>
</form>
