<html layout:decorator="zlayout/layout">
    <head>
        <title>Menú</title>
    <div th:substituteby="zlayout/includes :: styles-dynatable"></div>
    <link rel="stylesheet" type="text/css" th:href="@{/nestable/nestable.css}" />
    <link rel="stylesheet" type="text/css" th:href="@{/iconpicker/css/fontawesome-iconpicker.min.css}" />
    <style>
        .m1 {
            display: flex;
            overflow: hidden;
            height: calc(100vh - 150px);
            margin-top: -100px;
            padding-top: 100px;
            padding-bottom: 40px;
            position: relative;
            width: 100%;
            backface-visibility: hidden;
            will-change: overflow;
            border: #fff none thin;

        }
        .m2 {
            overflow: auto;
            height: auto;
            padding: .5rem;
            -webkit-overflow-scrolling: touch;
            -ms-overflow-style: none;
            flex: 1;
        }
    </style>
</head>

<body>
    <div layout:fragment="main">

        <header class="page-header">
            <h2>Menús del sistema</h2>
        </header>

        <section class="panel">
            <section class="panel-body">

                <div class="row">
                    <div class="col-sm-8">
                        <div class="m1">
                            <div class="m2">
                                <a class="btn btn-primary" id="nuevoTitulo"  href="#" >Nuevo Título</a>
                                <div id="tree"  class="tree"></div>
                            </div>
                        </div>
                    </div>

                    <div class="col-sm-4" id="formMenu"></div>

                </div>
            </section>
        </section>

        <script id="titulotemplate" type="text/x-jsrender" class="hide">
            <div th:substituteby="seguridad/menu/tituloTemplate"></div>
        </script>

        <script id="menuSistemaTemplate" type="text/x-jsrender" class="hide">
            <div th:substituteby="seguridad/menu/menuSistemaTemplate"></div>
        </script>

    </div>

    <div layout:fragment="js">
        <script th:src="@{/nestable/nestable.js}" charset="utf-8"></script>
        <script th:src="@{/iconpicker/js/fontawesome-iconpicker.min.js}" charset="utf-8"></script>
        <script th:src="@{/app/seguridad/menu/menuSistema.js}" charset="utf-8"></script>
    </div>

</body>
</html>
