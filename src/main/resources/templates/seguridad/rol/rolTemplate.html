<tr rel="{{:index}}">
    <td class="v-middle">
        <span class="block text-primary bold pointer showInfo" rel="{{:id}}" >{{:nombre}}</span>
    </td>

    <td class="v-middle text-center">
        <span class="block">{{:codigo}}</span>
    </td>

    <td class="v-middle"> 
        <div class="dropdown actions">
            <a class="dropdown-toggle" data-toggle="dropdown">
                <i class="glyphicon glyphicon-cog"></i>
            </a> 
            <ul class="dropdown-menu pull-right">
                <li><a class="btn-link pointer editar-rol" rel="{{:id}}">Editar</a></li>
                <li><a class="btn-link pointer delete-rol" rel="{{:id}}">Eliminar</a></li>
            </ul>
        </div>
    </td>
</tr>
