</th:block>

    <script type="text/javascript" th:src="@{/dynatable/jquery.dynatable.js}" />
    <script type="text/javascript" th:src="@{/dynatable/dynatable.setup.js}" charset="utf-8"/>
</th:block>




<th:block th:fragment="notify">
    <script th:inline="javascript" th:if="${notificaciones}">
        /*<![CDATA[*/
        Messenger.options = {
            extraClasses: 'messenger-fixed messenger-on-bottom messenger-on-right',
            theme: 'flat'
        }
        var msgJson = /*[[${notificaciones.all()}]]*/ mensajes;

        $(function () {
            for (var i = 0; i < msgJson.length; i++) {
                notify(msgJson[i].mensaje, msgJson[i].tipo);
            }
        });

        /*]]>*/
    </script>
</th:block>
