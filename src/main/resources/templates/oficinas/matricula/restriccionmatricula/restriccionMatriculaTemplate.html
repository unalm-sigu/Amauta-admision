<tr rel="{{:index}}">
    <td class="v-middle text-center">
        <img class="img-responsive img-thumbnail img-circle" src="{{:rutaFoto}}"/>
    </td>
    <td class="v-middle">
        <span class="block text-primary bold "> {{:nombre}} </span>
        <span class="block text-muted"> {{:codigo}} </span>
        <small class="block text-muted"> {{:tipoDoc}} {{:numeroDoc}} </small>
        <small class="block text-muted"> {{:carrera}} </small>
        {{if mostrarModalidad }}
        <small class="block text-muted"> {{:modalidadEstudio}} </small>
        {{/if}}
    </td>

    <td class="v-middle">
        <span class="block bold"> {{:tipo}} </span>
        <span class="block">{{:respNombre}} </span>
        <span class="block">{{:respTelefono}} </span>
    </td>

    <td class="v-middle">
        {{:descripcion}}
    </td>
    <td class="v-middle text-center">
        <span class="label label-{{:label}}">{{:estado}} </span>
    </td>

    <td class="v-middle"> 
        {{if editable}}
        <div class="dropdown actions">
            <a class="dropdown-toggle" data-toggle="dropdown">
                <i class="glyphicon glyphicon-option-vertical"></i>
            </a> 
            <ul class="dropdown-menu pull-right pointer">
                <li><a class="editar">Editar</a></li>
                <li><a class="levantar">Levantar</a></li>
                <li><a class="anular">Anular</a></li>
            </ul>
        </div>
        {{/if}}
    </td>
</tr>
