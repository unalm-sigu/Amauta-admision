<html layout:decorator="_layout/layout">
    <head>
        <title> Restricciones de Matrícula </title>
    <div th:substituteby="_layout/includes :: styles-dynatable"></div>
</head>

<body>
    <div layout:fragment="main">

        <header class="header b-b padder-lg">

            <div class="pull-right m-t-md">                 
                <a th:href="@{'/oficinas/matricula/restriccionmatricula/upload'}" class="btn btn-success btn-sm" type="button" id="btnAddPersona">Cargar Datos</a>
            </div>  

            <h2> Restricciones de Matrícula </h2>
        </header>
        <section class="wrapper-lg">
            <section class="panel">
                <section class="panel-body">
                    <table id="dynaTable" class="table table-striped">
                        <thead class="panel panel-heading">
                              <tr>
                                <th class="col-md-1"></th>
                                <th class="col-md-3">Alumno</th>
                                <th class="col-md-3">Tipo</th>
                                <th class="col-md-3">Descripción</th>
                                <th class="col-md-2 text-center">Estado</th>
                                <th></th>
                            </tr> 
                        </thead>
                        <tbody></tbody>
                    </table>
                </section>
            </section>
        </section>

        <form id="formPersonaEdit"  action="" method="POST">
            <input type="hidden" name="origen" value="" id="origenUrl"/>
        </form>

        <div th:substituteby="templates/modal"></div>
        <div th:substituteby="oficinas/matricula/restriccionmatricula/restriccionMatriculaModals"/>
        <script id="templateDeudaAlumno" type="text/x-jsrender" class="hide" ><div th:substituteby="oficinas/matricula/restriccionMatricula/restriccionMatriculaTemplate"/></script>
    </div>

    <div layout:fragment="js">
        <div th:substituteby="_layout/includes :: javascript-dynatable"/>
        <script th:src="@{/app/oficinas/matricula//restriccionmatricula/restriccionMatricula.js}" charset="utf-8"></script>
    </div>

</body>
</html>
