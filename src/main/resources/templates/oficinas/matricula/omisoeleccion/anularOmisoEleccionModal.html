<modal-vik ref="modalAnular"
           v-bind="modalAnular"
           v-bind:okaction="saveAnular">

    <div slot="body">
        <form id="formAnular" data-parsley-validate="true" v-if="omisionAnular.id != null">

            <div class="form-group" >
                <table>
                    <tr >
                        <td class="v-middle col-md-4" >
                            <div v-if="omisionAnular.persona.tipoFoto=='POSTUL' "
                                 class="img-responsive img-thumbnail img-circle div-foto-list">
                                <img class="img-foto-list" v-bind:src="omisionAnular.persona.rutaFoto" />
                            </div>

                            <img v-else-if="omisionAnular.persona.tipoFoto=='COMUN' " 
                                 class="img-responsive img-thumbnail img-circle div-foto-alumno-list" 
                                 v-bind:src="omisionAnular.persona.rutaFoto" />

                            <img v-else="" 
                                 class="img-foto-tempo img-responsive img-thumbnail img-circle" 
                                 v-bind:src="omisionAnular.persona.rutaFoto" />
                        </td>
                        <td  class="v-middle col-md-4" >
                            <a  class="block text-primary bold h5 m-b-xs m-t-xs" >
                                {{omisionAnular.persona.apellidosNombres}}
                            </a>
                            <span class="block">
                                Matrícula: {{omisionAnular.codigo}}
                            </span>
                            <span class="block">
                                Modalidad: {{omisionAnular.modalidadEstudio.nombre}}
                            </span>
                            <small v-if="omisionAnular.persona.numeroDocIdentidad != '' " class="block bold">
                                {{omisionAnular.persona.tipoDocumento.simbolo}} {{omisionAnular.persona.numeroDocIdentidad}}
                            </small>
                        </td>
                    </tr>
                </table>
            </div>
            <div class="form-group">
                <table class="table table-striped table-hover col-md-6">
                    <thead>
                        <tr>
                            <th class="col-md-3 text-center">Estado</th>
                            <th class="col-md-3 text-center v-middle">Motivo</th>
                            <th class="col-md-1 text-center v-middle">Ciclo</th>
                            <th class="col-md-1 text-center v-middle">Monto</th>
                            <th class="col-md-1"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="(deudas,idx) in omisionAnular.alumnoOmisoEleccions" v-if="deudas.estado == 'DEU'">
                            <td class="v-middle text-center" >
                                <span class="label " v-bind:class="getClass(deudas.estadoEnum.name)" v-text="deudas.estadoEnum.value"></span>
                            </td>
                            <td class="v-middle text-center" >
                                <span v-text="deudas.motivoEnum.value"></span>
                            </td>
                            <td class="v-middle" >
                                <span v-text="deudas.cicloAcademico.codigo"></span>
                            </td>
                            <td class="text-center v-middle" >
                                <span v-text="deudas.multa"></span>
                            </td>
                            <td class="v-middle" >
                                <input type="checkbox" v-bind:value='deudas.id' v-model="deudas.seleccionado"/>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="form-group pull-right m-r-md">
                <span>Total: </span> <span v-text="sum"> </span>
            </div>
            <div class="form-group">
                <label>Motivo Anulación</label>
                <textarea v-model="omisionAnular.motivoAnulacion" class="form-control" maxlength="100" required=""></textarea>
            </div>
        </form>
    </div>
</modal-vik>
