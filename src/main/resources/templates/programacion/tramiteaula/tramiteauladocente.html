<html layout:decorator="_layout/layout">
    <head>
        <title>Mis Reservas de Aulas</title>
    </head>

    <body>

        <div layout:fragment="main">
            <div id="mainDocente" v-cloak="">

                <header class="header b-b padder-lg">

                    <div class="pull-right">
                        <a class="btn btn-primary" type="button" th:href="@{/tramite/aula/docente/nuevo}">
                            <i class="fa fa-plus"></i> Nueva Reserva
                        </a>
                    </div>

                    <h2>Mis Reservas de Aulas</h2>
                    <p class="text-muted">Gestiona tus reservas de aulas</p>

                </header>

                <section class="wrapper-lg">

                    <section class="panel panel-info">
                        <div class="panel-heading">
                            <i class="fa fa-info-circle"></i> Información
                        </div>
                        <div class="panel-body">
                            <ul class="m-b-none">
                                <li>Aquí puedes ver todas tus reservas de aulas</li>
                                <li>Las reservas en estado <strong>PENDIENTE</strong> pueden ser editadas</li>
                                <li>Una vez aprobadas, las reservas pasan a estado <strong>ACTIVO o RESERVADO</strong></li>
<!--                                <li>Puedes consultar la <a th:href="@{/general/aula/aulasLibres}" target="_blank">disponibilidad de aulas</a> antes de reservar</li>-->
                            </ul>
                        </div>
                    </section>

                    <section class="panel">
                        <section class="panel-body">

                            <raptor-table
                                v-bind:url="urlfilter"
                                v-bind:paginate="true"
                                v-bind:preload="true"
                                ref="raptor">

                                <template scope="props">
                                    <table class="table table-striped table-hover">
                                        <thead>
                                            <tr>
                                                <th class="col-xs-2">Fecha</th>
                                                <th class="col-xs-3">Motivo</th>
                                                <th class="col-xs-2">Aulas</th>
                                                <th class="col-xs-1 text-center">Estado</th>
                                                <th class="col-xs-1 text-center">Solicitud</th>
                                                <th class="col-xs-1"></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr v-if="!props.data || props.data.length === 0">
                                                <td colspan="7" class="text-center text-muted">
                                                    <p class="m-t-lg m-b-lg">
                                                        <i class="fa fa-inbox fa-3x"></i><br>
                                                        No tienes reservas registradas
                                                    </p>
                                                </td>
                                            </tr>
                                            <tr v-for="item in props.data">

                                                <td class="v-middle">
                                                    <strong>{{item.fechaInicio}}</strong>
                                                    <p class="text-xs" v-if="item.fechaFin">
                                                        al {{item.fechaFin}}
                                                    </p>
                                                </td>

                                                <td class="v-middle">
                                                    <p class="text-xs">{{item.motivo}}</p>
                                                </td>

                                                <td class="v-middle">
                                                    <span v-for="aula in item.reservados" class="text-xs">
                                                        {{aula.nombrePublico}}<span v-if="!$last">, </span>
                                                    </span>
                                                </td>

                                                <td class="v-middle text-center">
                                                    <span class="label label-primary" v-if="item.estado=='ACT'">Activo</span>
                                                    <span class="label label-success" v-if="item.estado=='RES'">Reservado</span>
                                                    <span class="label label-default" v-if="item.estado=='PEND'">Pendiente</span>
                                                    <span class="label label-danger" v-if="item.estado=='ANU'">Anulado</span>
                                                    <span class="label label-warning" v-if="item.estado=='REG'">Regularizado</span>
                                                </td>

                                                <td class="v-middle text-center">
                                                    <small v-if="item.tramite">{{item.tramite.serie}}-{{item.tramite.numero}}</small>
                                                    <small v-else>-</small>
                                                </td>

                                                <td class="v-middle text-center">
                                                    <div class="btn-group">
                                                        <a class="dropdown-toggle" href="#" data-toggle="dropdown">
                                                            <i class="fa fa-cog"></i>
                                                        </a>
                                                        <ul class="dropdown-menu pull-right">
                                                            <li v-if="item.estado == 'PEND'">
                                                                <a v-bind:href="editarReserva(item)">
                                                                    <i class="fa fa-edit text-info"></i> Editar
                                                                </a>
                                                            </li>
                                                            <li>
                                                                <a href="#" v-on:click.prevent="verResumen(item)">
                                                                    <i class="fa fa-eye text-primary"></i> Ver Resumen
                                                                </a>
                                                            </li>
                                                        </ul>
                                                    </div>
                                                </td>

                                            </tr>
                                        </tbody>
                                    </table>
                                </template>

                            </raptor-table>

                        </section>
                    </section>
                </section>

                <div th:replace="programacion/tramiteaula/tramiteaularesumen"></div>

            </div>
        </div>

        <div layout:fragment="js">
            <div th:replace="_modules/vue-modal"></div>
            <div th:replace="_modules/vue-raptor-table"></div>
            <script th:src="@{/app/programacion/tramiteaula/tramiteauladocente.js}" charset="utf-8"></script>
        </div>

    </body>
</html>
