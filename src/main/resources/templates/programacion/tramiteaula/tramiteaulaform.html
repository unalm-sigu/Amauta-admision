<html layout:decorator="_layout/layout">
    <head>
        <title>Trámite Aula</title>
    </head>

    <body>
        <div layout:fragment="main">

            <div id="main" v-cloak="">

                <header class="header b-b padder-lg">

                    <div class="pull-right m-t-md">                 
                        <a class="btn btn-default" type="button" th:href="@{/tramite/aula}"  >Regresar</a>
                    </div>  

                    <h2>Nuevo tramite </h2>

                </header>


                <section class="wrapper-lg">
                    <section class="panel">
                        <section class="panel-body">

                            <form  method="post" ref="formtramite"   data-parsley-validate="true">

                                <div class="col-sm-3">
                                    <label class="col-sm-12 control-label">Solo Una Fecha</label>
                                    <div class="col-sm-12">
                                        <label class="switch">
                                            <input type="checkbox" 
                                                   v-model="solofecha" 
                                                   v-on:change="changeSoloFecha()"/>
                                            <span></span>
                                        </label>
                                    </div>
                                </div>

                                <div class="col-sm-3">
                                    <label class="col-sm-12 control-label">Rango de Fecha</label>
                                    <div class="col-sm-12">
                                        <label class="switch">
                                            <input type="checkbox"
                                                   v-model="rangofecha"
                                                   v-on:change="changeRangoFecha()"/>
                                            <span></span>
                                        </label>
                                    </div>
                                </div>


                                <div class="col-sm-3">
                                    <div class="form-group">
                                        <label v-show="solofecha">Fecha </label>
                                        <label v-show="rangofecha">Fecha Inicio </label>
                                        <div class='input-group'>
                                            <date-picker 
                                                v-bind:config="{format: 'DD/MM/YYYY'}" 
                                                name="fechaInicio"
                                                ref="fechaInicio"
                                                class='form-control' 
                                                data-parsley-errors-container="#errorfechaInicio"
                                                v-on:dp-change="changeFechaInicio()"
                                                required="true"
                                                v-bind:wrap="true" 
                                                v-model="tramite.fechaInicio"></date-picker>
                                            <span class="input-group-addon pointer"><i class="fa fa-calendar"></i></span>
                                        </div>
                                        <span id="errorfechaInicio"></span>
                                    </div>
                                </div>

                                <div v-show="rangofecha" class="col-sm-3">
                                    <div class="form-group">
                                        <label>Fecha Fin </label>
                                        <div class='input-group'>
                                            <date-picker 
                                                v-bind:config="{format: 'DD/MM/YYYY',useCurrent: false}" 
                                                name="fechaFin"
                                                ref="fechaFin"
                                                data-parsley-errors-container="#errorfechafin"
                                                class='form-control' 
                                                required="true"
                                                v-bind:wrap="true" 
                                                v-model="tramite.fechaFin"></date-picker>
                                            <span class="input-group-addon pointer">
                                                <i class="fa fa-calendar"></i>
                                            </span>
                                        </div>
                                        <span id="errorfechafin"></span>
                                    </div>
                                </div>

                                <div class="col-sm-12"></div>

                                <div class="col-sm-3">
                                    <div class="form-group">
                                        <label>Hora Inicio </label>
                                        <div class='input-group'>
                                            <input 
                                                v-bind:config="{format: 'DD/MM/YYYY',useCurrent: false}" 
                                                name="horaInicio"
                                                ref="horaInicio"
                                                class='form-control' 
                                                data-parsley-errors-container="#errorhorainicio"
                                                required="true"
                                                v-bind:wrap="true" 
                                                v-model="tramite.horaInicio"></input>
                                            <span class="input-group-addon pointer">
                                                <i class="fa fa-clock-o" aria-hidden="true"></i>
                                            </span>
                                        </div>
                                        <span id="errorhorainicio"></span>
                                    </div>
                                </div>

                                <div class="col-sm-3">
                                    <div class="form-group">
                                        <label>Hora Fin </label>
                                        <div class='input-group'>
                                            <input 
                                                v-bind:config="{format: 'DD/MM/YYYY'}" 
                                                name="horaFin"
                                                ref="horaFin"
                                                class='form-control' 
                                                data-parsley-errors-container="#errorhorafin"
                                                required="true"
                                                v-bind:wrap="true" 
                                                v-model="tramite.horaFin"></input>
                                            <span class="input-group-addon pointer">
                                                <i class="fa fa-clock-o" aria-hidden="true"></i>
                                            </span>
                                        </div>
                                        <span id="errorhorafin"></span>
                                    </div>
                                </div>


                                <div class="col-sm-12"></div>

                                <div class="col-sm-3">
                                    <div class="form-group">
                                        <label>Capacidad </label>

                                        <input type="text"  v-model="tramite.capacidad" class="form-control" />

                                    </div>
                                </div>

                                <div class="col-sm-3">
                                    <div class="form-group">
                                        <label>Cantidad Ambiente </label>

                                        <input type="text" v-model="tramite.cantidadAmbiente" class="form-control" />

                                    </div>
                                </div>

                                <div class="col-xs-12"></div>


                                <div class="col-sm-3">
                                    <label class="col-sm-12 control-label">Un solo Ambiente</label>
                                    <div class="col-sm-12">
                                        <label class="switch">
                                            <input type="checkbox" 
                                                   v-model="soloambiente" 
                                                   v-on:change="changeSoloAmbiente()"/>
                                            <span></span>
                                        </label>
                                    </div>
                                </div>

                                <div class="col-sm-3">
                                    <label class="col-sm-12 control-label">Varios Ambientes</label>
                                    <div class="col-sm-12">
                                        <label class="switch">
                                            <input type="checkbox"
                                                   v-model="variosambiente"
                                                   v-on:change="changeVariosAmbientes()"/>
                                            <span></span>
                                        </label>
                                    </div>
                                </div>


                                <div v-show="variosambiente" class="col-sm-3">
                                    <div class="form-group">
                                        <label>Capacidad Mínima del Ambiente </label>

                                        <input type="text" v-model="tramite.capacidadMinimaAmbiente" class="form-control" />

                                    </div>
                                </div>

                                <div v-show="variosambiente" class="col-sm-3">
                                    <div class="form-group">
                                        <label>Capacidad Máxima del Ambiente </label>

                                        <input type="text" v-model="tramite.capacidadMaximaAmbiente" class="form-control" />

                                    </div>
                                </div>


                                <div class="col-xs-12"></div>


                                <div class="col-sm-3">
                                    <div class="form-group">
                                        <label>Solicitante </label>

                                        <select class="form-control"  v-model="tramite.tipoSolicitante" >
                                            <option th:each="item:${tiposSolicitante}" th:value="${item.name()}" th:text="${item.value}">Alumno</option>
                                        </select>

                                    </div>
                                </div>



                                <div v-show="tramite.tipoSolicitante=='ALUMNO'" class="col-xs-6">
                                    <div class="form-group">
                                        <label>Alumno </label>

                                        <vuelect 
                                            required="true"
                                            formatselection="persona.nombreCompleto"
                                            idtemplateresult="divBuscarAlumno"
                                            usetemplateresult="true"
                                            v-bind:objetogenerico="tramite.alumno"
                                            nameinput="alumno.id"
                                            remoteurl="tramite/aula/allAlumno"
                                            v-model="tramite.alumno"
                                            ></vuelect>

                                    </div>
                                </div>

                                <div v-show="tramite.tipoSolicitante=='DOCENTE'" class="col-xs-6">
                                    <div class="form-group">
                                        <label>Docente </label>

                                        <vuelect 
                                            required="true"
                                            idtemplateresult="divBuscarDocente"
                                            formatselection="persona.nombreCompleto"
                                            usetemplateresult="true"
                                            v-bind:objetogenerico="tramite.docente"
                                            nameinput="docente.id"
                                            remoteurl="tramite/aula/allDocente"
                                            v-model="tramite.docente"
                                            ></vuelect>

                                    </div>
                                </div>

                                <div v-show="tramite.tipoSolicitante=='INSTITUCION'" class="col-xs-6">
                                    <div class="form-group">
                                        <label>Institución </label>

                                        <div class='input-group'>

                                            <vuelect 
                                                required="true"
                                                formatselection="razonSocial"
                                                formatresult="razonSocial"
                                                v-bind:objetogenerico="tramite.empresa"
                                                nameinput="institucion.id"
                                                remoteurl="comun/buscar/allEmpresa"
                                                v-model="tramite.empresa"
                                                ></vuelect>

                                            <span class="input-group-addon pointer" v-on:click.prevent="addInstitucion()"><i class="fa fa-plus"></i></span>
                                        </div>

                                    </div>
                                </div>

                                <div class="col-xs-12"></div>

                                <div class="col-sm-12">
                                    <div class="form-group">
                                        <label>Motivo </label>

                                        <textarea v-model="tramite.motivo" class="form-control" ></textarea>

                                    </div>
                                </div>



                                <div class="col-xs-12"></div>

                                <div class="col-xs-12">

                                    <raptor-table 
                                        v-bind:url="urlfilter" 
                                        v-bind:paginate="true"
                                        v-bind:preload="true" 
                                        ref="raptor">

                                        <div slot="header">

                                            <div class="col-sm-3">
                                                <label class="col-sm-12 control-label">Todos</label>
                                                <div class="col-sm-12">
                                                    <label class="switch">
                                                        <input type="checkbox" 
                                                               v-model="todos"  
                                                               v-on:change="changeTodos()"/>
                                                        <span></span>
                                                    </label>
                                                </div>
                                            </div>


                                            <div class="col-sm-3">
                                                <label class="col-sm-12 control-label">Solo disponible</label>
                                                <div class="col-sm-12">
                                                    <label class="switch">
                                                        <input type="checkbox"
                                                               v-model="solodisponible" 
                                                               v-on:change="changeSoloDisponible()"/>
                                                        <span></span>
                                                    </label>
                                                </div>
                                            </div>


                                        </div>

                                        <template scope="props" >
                                            <table class="table table-striped table-hover">
                                                <thead> 
                                                    <tr>
                                                        <th class="col-xs-1" ></th>
                                                        <th class="col-xs-8 text-center">Ambiente</th>
                                                        <th class="col-xs-2 text-center v-middle">Situación</th>
                                                        <th class="col-xs-1 text-center v-middle">Aforo</th>
                                                        <th></th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    <tr v-for="item in props.data">

                                                        <td class="v-middle">
                                                            <i class="fa fa-calendar pointer" aria-hidden="true"></i>
                                                        </td>

                                                        <td class="v-middle">
                                                            <strong>{{item.nombre}}</strong>
                                                            <p>{{item.codigo}}</p>
                                                        </td>

                                                        <td class="v-middle text-center">
                                                            situacion
                                                        </td>

                                                        <td class="v-middle text-center">
                                                            <p>{{item.aforo}}</p>
                                                        </td>

                                                        <td class="v-middle">
                                                            <div class="actions">
                                                                <a class="dropdown-toggle" href="#" data-toggle="dropdown"><i class="glyphicon glyphicon-cog"></i></a>
                                                                <ul class="dropdown-menu pull-right">
                                                                    <li><a href="#">Opción</a></li>
                                                                </ul>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </template>
                                    </raptor-table>
                                </div>

                            </form>

                            <div class="line line-dashed b-b b-t-sm line-lg pull-in col-xs-12"></div>

                            <div class="col-xs-12 text-center">

                                <button 
                                    v-bind:disabled="isactiveguardar"
                                    class="btn btn-primary"
                                    v-on:click.prevent="guardarTramite()" >
                                    <i v-if="isactiveguardar" class="fa fa-spinner fa-spin" aria-hidden="true"></i>
                                    Guardar
                                </button>

                            </div>




                        </section>


                    </section>

                </section>


                <modal-vik ref="nuevaInstitucionModal"
                           v-bind="dataInstitucionModal"
                           v-bind:okaction="saveInstitucionModal">
                    <div slot="body">

                        <div class="panel-body">
                            <div class="row">

                                <form ref="formInstitucionModal"  data-parsley-validate="true" >

                                    <div class="form-group">
                                        <label>Pais</label>

                                        <vuelect 
                                            required="true"
                                            v-bind:objetogenerico="institucion.pais"
                                            nameinput="paisUbicacion.id"
                                            remoteurl="comun/buscar/allPaises"
                                            v-model="institucion.pais"
                                            ></vuelect>

                                    </div>

                                    <div class="form-group">
                                        <label>Nombre</label>
                                        <input type="text"
                                               class="form-control"
                                               name="razonSocial"
                                               v-model="institucion.razonSocial"
                                               required="true"/>
                                    </div>

                                </form>


                            </div>
                        </div>

                    </div>
                </modal-vik>

            </div>

            <div th:substituteby="_modules/vue-modal"></div>

            <template  type="text/x-template" id="divBuscarAlumno">
                <div>
                    <p class="block">
                        <span class="bold">{{item.codigo}}</span>
                        {{item.persona.nombreCompleto}}
                    </p>
                </div>
            </template>

            <template  type="text/x-template" id="divBuscarDocente">
                <div>
                    <p class="block">
                        <span class="bold">{{item.codigo}}</span>
                        {{item.persona.nombreCompleto}}
                    </p>
                </div>
            </template>

        </div>

        <div layout:fragment="js">
            <div th:substituteby="_layout/includes :: sweetalert"/>
            <div th:substituteby="_modules/vue-raptor-table"></div>
            <div th:substituteby="_layout/includes :: vue-loader"/>
            <div th:substituteby="_layout/includes :: javascript-bootstrap-datetimepicker"></div>
            <div th:substituteby="_layout/includes :: javacsript-vue-bootstrap-datetimepicker"></div>
            <script type="text/javascript" th:src="@{/phobos/modules/vuelect2.js}"></script>
            <script type="text/javascript" th:src="@{/phobos/modules/vue-modal.js}"></script>
            <script th:src="@{/app/programacion/tramiteaula/tramiteaulaform.js}" charset="utf-8"></script>
        </div>

    </body>
</html>
