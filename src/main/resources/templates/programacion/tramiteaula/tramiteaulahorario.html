<template id="aulaHorarioComp"> 
    <div class="" >
        <table class="table table-bordered" >

            <thead>
                <tr>
                    <th style="width: 12.5%" class="text-center">Hora</th>
                    <th style="width: 12.5%" class="text-center"
                        v-for="dia in dias"
                        v-bind:style="isDiaActivo(dia)
                            ? 'background-color: #2196F3; color: #fff; font-weight: bold;'
                            : 'background-color: #f0f0f0; color: #bbb; opacity: 0.6;'">
                        {{dia.nombre}}
                    </th>
                </tr>
            </thead>

            <tbody>
                <tr v-for="hora in horas">

                    <td class="v-middle">
                        <span class="bold">
                            {{hora.descripcion}}
                        </span>
                    </td>

                    <td v-for="dia in hora.dias" class="text-center"
                        v-on:click="selectHora(dia, hora)"
                        v-bind:class="{
                            'bg-primary': dia.selecionado,
                            'pointer': isDiaActivo(dia)
                        }"
                        v-bind:style="!isDiaActivo(dia) ? 'opacity: 0.3; cursor: not-allowed; background-color: #f5f5f5;' : ''">
                    </td>

                </tr>
            </tbody>
        </table>
    </div>
</template>
