<modal-vik ref="agendaModal"
           v-bind="agendaModal"
           v-bind:okaction="agendaConsejero.id == null ? save : update">
    <div slot="body">

        <form data-parsley-validate="true" id="formSaveOrUpdate">
            <div class="form-group row">
                <div class="col-md-12">
                    <label>Asunto</label>
                    <input class="form-control" v-model="agendaConsejero.asunto" required="true" placeholder="Ingrese un asunto"/>
                </div>
            </div>
            <div class=" form-group row">
                <div class=" col-md-6">  
                    <label>Fecha</label>
                    <div class="input-group">
                        <date-picker v-bind:config="configDate" v-bind:wrap="false" v-model="agendaConsejero.fecha" required="true"></date-picker>
                        <div class="input-group-addon">
                            <span class="fa fa-calendar"></span>
                        </div>
                    </div>
                </div>
                <div class=" col-md-6">                    
                    <label>Hora</label>
                    <multiselect v-model="agendaConsejero.hora" 
                                 v-bind:options='horas'
                                 label="descripcion"
                                 track-by='id'
                                 placeholder="Seleccione una hora"
                                 deselect-label=""
                                 select-label=""
                                 v-bind:allow-empty="false"
                                 v-bind:preselect="false">
                    </multiselect>
                    <input v-model="agendaConsejero.hora" class="hidden" required="true"/>
                </div>
            </div>
            <div class="form-group row">
                <div class="col-md-12">                    
                    <label>Detalle:</label>
                    <textarea class="form-control" v-model="agendaConsejero.cuerpo" required="true" placeholder="Ingrese un cuerpo (Max 400)"/>
                </div>
            </div>
            <section class="panel">
                <div class=" table-responsive">

                    <table class="table table-striped">
                        <thead class="panel panel-heading">
                            <tr>
                                <th colspan="2">Alumno</th>
                                <th><div style="display: flex;"><span>Seleccionar todos </span><input style="margin: 0 10px 0;" type="checkbox" id="selectAll"  v-model="selectAll"/></div></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="alumnoConsejero in alumnosConsejerosTemp">
                                <td class="v-middle" >
                                    <div class="pull-left">
                                        <div v-if="alumnoConsejero.alumno.persona.tipoFoto=='POSTUL' "
                                             class="img-responsive img-thumbnail img-circle div-foto-list">
                                            <img class="img-foto-list" v-bind:src="alumnoConsejero.alumno.persona.rutaFoto" />
                                        </div>
                                        <img v-else-if="alumnoConsejero.alumno.persona.tipoFoto=='COMUN' " 
                                             class="img-responsive img-thumbnail img-circle div-foto-alumno-list" 
                                             v-bind:src="alumnoConsejero.alumno.persona.rutaFoto" />
                                        <img v-else="" 
                                             class="img-foto-tempo img-responsive img-thumbnail img-circle" 
                                             v-bind:src="alumnoConsejero.alumno.persona.rutaFoto" />
                                    </div>                                
                                </td>
                                <td class="v-middle">
                                    <a class="block text-primary bold h5 m-b-xs m-t-xs" >
                                        {{alumnoConsejero.alumno.persona.apellidosNombres}}
                                    </a>
                                    <span class="block">
                                        {{alumnoConsejero.alumno.codigo}}
                                    </span>
                                    <small v-if="alumnoConsejero.alumno.persona.emailCompania != '' " class="block text-primary">
                                        <i class="fa fa-envelope-o"></i> {{alumnoConsejero.alumno.persona.emailCompania}}
                                    </small>
                                    <span class="block">
                                        {{alumnoConsejero.alumno.carrera.nombre}}
                                    </span>
                                    <small class="block" v-if="alumnoConsejero.alumno.carrera.nombre != alumnoConsejero.alumno.carrera.facultad.nombre ">
                                        Facultad de {{alumnoConsejero.alumno.carrera.facultad.nombre}}
                                    </small>
                                    <p class="badge" v-if="alumnoConsejero.alumno.situacionAcademica">
                                        {{alumnoConsejero.alumno.situacionAcademica.nombre}}
                                    </p>
                                </td>
                                <td class="text-center">
                                    <label class="m-t-md checkbox-inline form-control-static">
                                        <input class="form-control" type="checkbox" id="chkbxGenMat"  v-model="alumnoConsejero.seleccionado"/>
                                    </label>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </form>
    </div>
</modal-vik>

<modal-vik ref="asistenciaModal"
           v-bind="asistenciaModal"
           v-bind:okaction="asistio">
    <div slot="body">

        <div data-parsley-validate="true" id="formAsistio">
            <div class="form-group row">
                <div class="col-md-12">                    
                    <label>Comentario</label>
                    <textarea class="form-control" v-model="reunionConsejero.comentario" required="" placeholder="Ingrese un comentario"/>
                </div>
            </div>
            <div class="form-group row">
                <div class="col-md-6">  
                    <div class="col-md">
                        <label>Es Riesgo Academico</label>
                    </div>
                    <label class="switch">
                        <input type="checkbox" v-model="reunionConsejero.esRiesgoAcademico" />
                        <span></span>
                    </label>
                </div>
                <div class="col-md-6">  
                    <div class="col-md">
                        <label>Es Problema Sicólogico</label>
                    </div>
                    <label class="switch">
                        <input type="checkbox" v-model="reunionConsejero.esProblemaSicologico" />
                        <span></span>
                    </label>
                </div>
            </div>
            <div class="form-group row">
                <div class="col-md-6">     
                    <div class="col-md">
                        <label>Es Problema Familiar</label>
                    </div>
                    <label class="switch">
                        <input type="checkbox" v-model="reunionConsejero.esProblemaFamiliar" />
                        <span></span>
                    </label>
                </div>
                <div class="col-md-6"> 
                    <div class="col-md">
                        <label>Es Problema Economico</label>
                    </div>
                    <label class="switch">
                        <input type="checkbox" v-model="reunionConsejero.esProblemaEconomico" />
                        <span></span>
                    </label>
                </div>
            </div>
            <div class="form-group row">
                <div class="col-md-6">
                    <label>Fecha Asistencia</label>
                    <div class="input-group">
                        <date-picker v-bind:config="configDate" v-bind:wrap="false" v-model="reunionConsejero.fechaAsistencia" required="true"></date-picker>
                        <div class="input-group-addon">
                            <span class="fa fa-calendar"></span>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <label>Hora inicio</label>
                    <div class="input-group">
                        <date-picker v-model="reunionConsejero.horaInicio" v-bind:config="{format: 'hh:mm a'}"></date-picker>
                        <div class="input-group-addon">
                            <span class="fa fa-clock-o"></span>
                        </div>
                    </div>
                    <input v-model="reunionConsejero.horaInicio" class="hidden" required="true"/>
                </div>
                <div class="col-md-3">
                    <label>Hora fin</label>
                    <div class="input-group">
                        <date-picker v-model="reunionConsejero.horaFin" v-bind:config="{format: 'hh:mm a'}"></date-picker>
                        <div class="input-group-addon">
                            <span class="fa fa-clock-o"></span>
                        </div>
                    </div>
                    <input v-model="reunionConsejero.horaFin" class="hidden" required="true"/>
                </div>
            </div>
        </div>
    </div>
</modal-vik>

<modal-vik ref="noAsistenciaModal"
           v-bind="noAsistenciaModal"
           v-bind:okaction="noAsistio">
    <div slot="body">

        <div data-parsley-validate="true" id="formNoAsistio">
            <div class="form-group row">
                <div class="col-md-12">                    
                    <label>Comentario</label>
                    <textarea class="form-control" v-model="reunionConsejero.comentario" required="" placeholder="Ingrese un comentario"/>
                </div>
            </div>
        </div>
    </div>
</modal-vik>
