<html layout:decorator="_layout/layout">
    <head>
        <title>Coordinadores de Tutoria</title>
    </head>

    <body>
        <section layout:fragment="main">

            <div id="main" v-cloak="">

                <header class="header b-b padder-lg">

                    <div class="pull-right m-t-md">
                        <a v-bind:href="origen" class="btn btn-default">Regresar</a>
                    </div>

                    <h2> Coordinadores de Tutoria</h2>

                </header>

                <section class="wrapper-lg">

                    <section class="panel">
                        <section class="panel-body">


                            <raptor-table v-bind:url="coordinadoresURL"   ref="raptorCoordinador"   v-bind:preload="true"   >      
                                <div slot="header">
                                </div>
                                <template scope="props" >
                                    <table id="dynaTable" class="table table-striped table-hover">
                                        <thead class="panel panel-heading">
                                            <tr>
                                                <th class="col-xs-3 v-middle text-center"  >Carrera</th>
                                                <th class="col-xs-7 v-middle text-center"  >Nombre</th>
                                                <th class="col-xs-2 v-middle text-center"  >Cargo</th>
                                                <th>Estado</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr v-for="item in props.data">


                                                <td class="v-middle">

                                                    {{item.oficina.nombre}}

                                                </td>

                                                <td class="v-middle" >

                                                    <p class="bold h5 text-primary"> {{item.persona.nombreCompleto}}</p>
                                                    <p class="block">{{item.persona.emailCompania}}</p>

                                                </td>


                                                <td class="v-middle text-center" >

                                                    {{item.cargo.nombre}}

                                                </td>


                                                <td class="v-middle text-center" >
                                                    <span class="block" >                                                            
                                                        <span class="bold" v-bind:class="styleColor(item.estado)" v-text="item.estadoEnum.value">  </span>
                                                    </span>                                                   
                                                </td>

                                            </tr>
                                        </tbody>

                                    </table>         
                                </template>
                            </raptor-table>






                        </section>
                    </section>
                </section>

            </div>

        </section>

        <div layout:fragment="js" th:remove="tag">

            <div th:substituteby="_modules/vue-raptor-table"></div>
            <script th:src="@{/app/consejeria/administracion/coordinadorconsejeria.js}" charset="utf-8"></script>

        </div>

    </body>
</html>
