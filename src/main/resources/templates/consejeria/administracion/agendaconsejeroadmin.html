<html layout:decorator="_layout/layout">
    <head>
        <title>Agenda Consejero</title>
    </head>

    <body>
        <section layout:fragment="main">

            <div id="main" v-cloak="">

                <header class="header b-b padder-lg">

                    <div class="pull-right m-t-md m-l-sm">
                        <a href="#"  v-on:click.prevent="reporte" class="btn btn-primary">Reporte</a>
                    </div>

                    <div class="pull-right m-t-md">
                        <a v-bind:href="origen" class="btn btn-default">Regresar</a>
                    </div>

                    <h2> Agenda Consejero</h2>

                </header>

                <section class="wrapper-lg">

                    <section class="panel">
                        <section class="panel-body">


                            <raptor-table v-bind:url="agendaConsejeroURL"   ref="raptorConsejero"   v-bind:preload="true"   >      
                                <div slot="header">
                                    <div class="col-md-8 preguntas-col">

                                        <div class="col-md-4">

                                            <multiselect
                                                v-model="filtro.carrera"
                                                v-bind:options="carreras"
                                                v-bind:allow-empty="true"
                                                v-on:search-change="searchCarrera"
                                                track-by="id"
                                                placeholder="Carrera"
                                                label='nombre'
                                                v-bind:internal-search="false"
                                                v-bind:hide-selected="false"
                                                v-bind:showNoOptions="true"
                                                v-on:input="changeFilter"
                                                v-bind:show-labels="false">

                                                <template slot="singleLabel" slot-scope="props">
                                                    <span class="option__title">
                                                        <b>{{props.option.codigo}}</b> {{ props.option.nombre }}
                                                    </span>
                                                </template>

                                                <template slot="option" slot-scope="props">
                                                    <span class="option_title">
                                                        <b>{{props.option.codigo}}</b> {{props.option.nombre}}
                                                    </span> 
                                                </template>

                                                <template slot="noOptions">&nbsp;</template>
                                                <template slot="noResult">&nbsp;</template>

                                            </multiselect>

                                        </div>

                                        <div class="col-md-4">


                                            <multiselect
                                                v-model="filtro.consejero"
                                                v-bind:options="consejeros"
                                                v-bind:allow-empty="true"
                                                v-on:search-change="searchConsejero"
                                                track-by="id"
                                                placeholder="Consejero"
                                                label='nombre'
                                                v-bind:internal-search="false"
                                                v-bind:hide-selected="false"
                                                v-bind:showNoOptions="true"
                                                v-on:input="changeFilter"
                                                v-bind:show-labels="false">

                                                <template slot="singleLabel" slot-scope="props">
                                                    <span class="option__title">
                                                        {{ props.option.colaborador.persona.nombreCompleto }}
                                                    </span>
                                                </template>

                                                <template slot="option" slot-scope="props">
                                                    <span class="option_title">
                                                        {{props.option.colaborador.persona.nombreCompleto}}
                                                    </span> 
                                                </template>

                                                <template slot="noOptions">&nbsp;</template>
                                                <template slot="noResult">&nbsp;</template>

                                            </multiselect>

                                        </div>

                                        <div class="col-md-4">


                                            <multiselect
                                                v-model="filtro.alumno"
                                                v-bind:options="alumnos"
                                                v-bind:allow-empty="true"
                                                v-on:search-change="searchAlumno"
                                                track-by="id"
                                                placeholder="Alumno"
                                                label='nombre'
                                                v-bind:internal-search="false"
                                                v-bind:hide-selected="false"
                                                v-bind:showNoOptions="true"
                                                v-on:input="changeFilter"
                                                v-bind:show-labels="false">

                                                <template slot="singleLabel" slot-scope="props">
                                                    <span class="option__title">
                                                        <b>{{ props.option.codigo }}</b> - {{ props.option.persona.apellidosNombres }}
                                                    </span>
                                                </template>

                                                <template slot="option" slot-scope="props">
                                                    <span class="option_title">
                                                        <b>{{ props.option.codigo }}</b> - {{props.option.persona.apellidosNombres}}
                                                    </span> 
                                                </template>

                                                <template slot="noOptions">&nbsp;</template>
                                                <template slot="noResult">&nbsp;</template>

                                            </multiselect>

                                        </div>


                                    </div>

                                </div>
                                <template scope="props" >
                                    <table id="dynaTable" class="table table-striped table-hover">
                                        <thead class="panel panel-heading">
                                            <tr>
                                                <th class="col-xs-5 v-middle text-center"  >Agenda</th>
                                                <th class="col-xs-6 v-middle text-center"  >Estudiante</th>
                                                <th class="col-xs-1">Estado</th>

                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr v-for="item in props.data">

                                                <td class="v-middle" >
                                                    <span class="block" >                                                            
                                                        <span class=" bold"> Titulo: </span>
                                                        {{item.asunto}}
                                                    </span>
                                                    <span class="block">                                                            
                                                        <span class=" bold"> Fecha: </span>
                                                        {{item.fecha}} - {{item.hora.descripcion}}
                                                    </span>
                                                    <span class="block">                                                            
                                                        <span class=" bold"> Consejero: </span>
                                                        {{item.consejero.colaborador.persona.nombreCompleto}}
                                                    </span>
                                                    <span class="block">                                                            
                                                        <span class=" bold"> Carrera: </span>
                                                        {{item.consejero.carrera.nombre}}
                                                    </span>
                                                    <span v-if="item.consejero.carrera.nombre != item.consejero.carrera.facultad.nombre" class="block">                                                            
                                                        <span class=" bold"> Facultad: </span>
                                                        {{item.consejero.carrera.facultad.nombre}}
                                                    </span>
                                                </td>

                                                <td class="v-middle">

                                                    <div v-for="reunion in item.reunionAlumnoConsejeros" class="row">

                                                        <div class="col-xs-12">
                                                            <p class="block bold" >
                                                                <span>{{reunion.alumnoConsejero.alumno.codigo}}</span>   <span class=" text-primary ">{{reunion.alumnoConsejero.alumno.persona.apellidosNombres}} </span>  
                                                            </p>
                                                        </div>

                                                    </div>
                                                </td>

                                                <td class="v-middle text-center" >
                                                    <span class="block" >                                                            
                                                        <span class=" bold " v-bind:class="styleColor(item.estadoEnum)" v-text="item.estadoEnum.value">  </span>
                                                    </span>                                                   
                                                </td>

                                            </tr>
                                        </tbody>

                                    </table>         
                                </template>
                            </raptor-table>

                        </section>
                    </section>
                </section>

            </div>
            <script th:inline="javascript">
                var nombreCarreraSupervisor = /*[[${nombreCarreraSupervisor}]]*/ 'defaultValue';
            </script>
        </section>

        <div layout:fragment="js" th:remove="tag">
            <div th:substituteby="_modules/vue-raptor-table"></div>
            <script th:src="@{/app/consejeria/administracion/agendaconsejeroadmin.js}" charset="utf-8"></script>
        </div>

    </body>
</html>
