<html layout:decorator="_layout/layout">
    <head>
        <title>Listado de Aconsejados</title>
        <style>
            span#departs {
                /* margin-left: 1px;*/
                font-size: x-small;
            }

            .circle-recorrido {
                display: block;
                border-radius: 50%;
                width: 50px;
                height: 50px;
                overflow: hidden;
                margin: 0 auto;
                line-height: 50px;
                /* text-align: center;*/
                font-size: 16px;
                /* margin-left: 49px;*/
                text-indent: 0;
                vertical-align: middle;
                margin-top: 2px;
                margin-bottom: 2px;
            }

            .circle-recorrido.bgr-success {
                background-color: #2ECC71;
                color: #fff;
            }

            .circle-recorrido.bgr-default {
                background-color: #3C4043;
                color: #fff;
            }
        </style>
    </head>
    <body>
        <section layout:fragment="main">
            <div id="firstVue"  v-cloak=""></div>
        </section>

        <div layout:fragment="js" th:remove="tag">
            <script th:inline="javascript">
                /*<![CDATA[*/
                var cicloJson = /*[[${cicloJson.toString()}]]*/ 'json';
                var personaJson = /*[[${personaJson.toString()}]]*/ 'json';
                var consejeroJson = /*[[${consejeroJson.toString()}]]*/ 'json';
                var departamentoJson = /*[[${departamentoJson.toString()}]]*/ 'json';
                var rutaModulo = /*[[${rutaModulo}]]*/ 'json';
                /*]]>*/
            </script>
            <div th:substituteby="_modules/vue-modal"></div>
            <div th:substituteby="_modules/vue-raptor-table"></div>
            <script th:src="@{/app/consejeria/aconsejadostutor/aconsejadosTutor.js}" charset="utf-8"></script>
        </div>
    </body>
</html>
