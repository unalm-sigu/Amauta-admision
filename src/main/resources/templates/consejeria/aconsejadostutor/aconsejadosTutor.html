<html layout:decorator="_layout/layout">
    <head>
        <title>Listado de Aconsejados</title>
        <style>
            span#departs {
                /*                margin-left: 1px;*/
                font-size: x-small;
            }
            .circle-recorrido {
                display: block;
                border-radius: 50%;
                width: 50px;
                height: 50px;
                overflow: hidden;
                margin: 0 auto;
                line-height: 50px;  
                /*                text-align: center;*/
                font-size: 16px;
                /*                margin-left: 49px;*/
                text-indent: 0;
                vertical-align: middle;
                margin-top: 2px;
                margin-bottom: 2px;
            }

            .circle-recorrido.bgr-success {
                background-color: #2ECC71;
                color: #fff;
            }

            .circle-recorrido.bgr-default {
                background-color: #3C4043;
                color: #fff;
            }

        </style>
    </head>

    <body>
        <section layout:fragment="main">

            <div id="consejeriaVUE" v-cloak="">

                <header class="header b-b padder-lg">
                    <h2>Alumnos a cargo de su tutoría <span v-text='ciclo.descripcion'></span></h2>
                </header>

                <section class="wrapper-lg">
                    <section class="panel">
                        <section class="panel-body">
                            <raptor-table v-bind:url="aconsejadosURL" v-bind:preload="true" ref="load">      
                                <div slot="header">
                                    <div class="col-md-8 preguntas-col">
                                        <div >
                                            <div  class="col-md-2 text-center" v-bind:class="bgColorClass['matriculado']">
                                                <a  v-on:click="findAconsejado('matriculado')" class="text-success pointer" >
                                                    <span class="h2 bold" v-text="count.matriculados"></span>
                                                    <small class="block m-b-xs">Matriculados</small>
                                                </a>
                                            </div>
                                            <div  class="col-md-2 text-center" v-bind:class="bgColorClass['noMatriculado']">
                                                <a v-on:click="findAconsejado('noMatriculado')" class="text-black pointer" >
                                                    <span class="h2 bold" v-text="count.noMatriculados"></span>
                                                    <small class="block m-b-xs">No Matriculados</small>
                                                </a>
                                            </div>
                                            <div  class="col-md-2 text-center"  v-bind:class="bgColorClass['retirado']" >
                                                <a  v-on:click="findAconsejado('retirado')" class="text-primary pointer" >
                                                    <span class="h2 bold" v-text="count.retiroCiclo"></span>
                                                    <small class="block m-b-xs">Retirado Ciclo</small>
                                                </a>
                                            </div>
                                        </div> 
                                    </div>
                                </div>
                                <template scope="props" >
                                    <table id="dynaTable" class="table table-striped">
                                        <thead class="panel panel-heading">
                                            <tr>
                                                <th class="col-md-6 v-middle text-center"  colspan="2">Estudiante</th>
                                                <th class="col-md-3 v-middle text-center">Resumen Académico</th>
                                                <th class="col-md-1 v-middle text-center">Autorización Matricula</th>
                                                <th class="col-md-2 v-middle text-center">Estado Matrícula</th>
                                                <th class=""></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr v-for="item in props.data">
                                                <td class="v-middle">
                                                    <div class="pull-left">
                                                        <div v-if="item.alumno.persona.tipoFoto=='POSTUL' "
                                                             class="img-responsive img-thumbnail img-circle div-foto-list">
                                                            <img class="img-foto-list" v-bind:src="item.alumno.persona.rutaFoto" />
                                                        </div>

                                                        <img v-else-if="item.alumno.persona.tipoFoto=='COMUN' " 
                                                             class="img-responsive img-thumbnail img-circle div-foto-alumno-list" 
                                                             v-bind:src="item.alumno.persona.rutaFoto" />

                                                        <img v-else="" 
                                                             class="img-foto-tempo img-responsive img-thumbnail img-circle" 
                                                             v-bind:src="item.alumno.persona.rutaFoto" />
                                                    </div>
                                                </td>

                                                <td class="v-middle">
                                                    <a v-bind:href="urlAcademico(item.alumno)"
                                                       class="block text-primary bold h5 m-b-xs m-t-xs" >
                                                        {{item.alumno.persona.apellidosNombres}}
                                                    </a>
                                                    <span class="block">
                                                        {{item.alumno.codigo}}
                                                    </span>
                                                    <!--small v-if="item.alumno.persona.numeroDocIdentidad != '' " class="block bold">
                                                        {{item.alumno.persona.tipoDocumento.simbolo}}: {{item.alumno.persona.numeroDocIdentidad}}
                                                    </small-->
                                                    <span class="block">
                                                        {{item.alumno.carrera.nombre}}
                                                    </span>
                                                    <small class="block" v-if="item.alumno.carrera.nombre != item.alumno.carrera.facultad.nombre ">
                                                        Facultad de {{item.alumno.carrera.facultad.nombre}}
                                                    </small>
                                                </td>

                                                <td class="v-middle">
                                                    <span class="block" v-if="item.alumno.cicloIngreso != null">                                                            
                                                        <span class=" bold"> Ciclo Ingreso: </span>
                                                        {{item.alumno.cicloIngreso.descripcion}}
                                                    </span>
                                                    <span class="block">                                                            
                                                        <span class=" bold"> Situación Academica: </span>
                                                        {{item.alumno.situacionAcademica.nombre}}
                                                    </span>
                                                    <span class="block">                                                            
                                                        <span class=" bold"> CCA: </span>
                                                        {{item.alumno.creditosCursados}}
                                                    </span>
                                                    <span class="block">                                                            
                                                        <span class=" bold"> CAPA: </span>
                                                        {{item.alumno.creditosAprobados}}
                                                    </span>
                                                    <span class="block">                                                            
                                                        <span class=" bold"> PPA: </span>
                                                        {{item.alumno.promedioAcumulado}}
                                                    </span>
                                                </td>

                                                <td class="v-middle text-center">
                                                    <input type="checkbox" id="chkbox" v-model="item.estadoMatriculaAutorizacion" onclick="return false;" v-on:click="matriculatAutoriazacion(item)"/>
                                                </td>
                                                <td class="v-middle text-center">
                                                    <span v-if="item.estadoMatriculableEnum.name == 'MAT'">
                                                        <small class="block">Créditos: {{item.creditosMatriculados}}</small>
                                                        <small class="block">Cursos: {{item.cursosMatriculados}}</small>
                                                        <span v-text="item.estadoMatriculableEnum.value" class="label label-primary"></span>
                                                    </span>
                                                    <span v-else="" v-text="item.estadoMatriculableEnum.value" class="label label-danger"></span>
                                                </td>
                                                <td class="v-middle">
                                                    <div class="dropdown actions">
                                                        <a class="dropdown-toggle" data-toggle="dropdown">
                                                            <i class="glyphicon glyphicon-cog"></i>
                                                        </a>
                                                        <ul class="dropdown-menu pull-right">
                                                            <li><a v-bind:href="urlAcademico(item.alumno)">Información académica</a></li>
                                                        </ul>
                                                    </div>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>         
                                </template>
                            </raptor-table>

                        </section>
                    </section>
                </section>
            </div>

            <div th:substituteby="_modules/vue-modal"/>
        </section>

        <div layout:fragment="js" th:remove="tag">
            <div th:substituteby="_modules/vue-raptor-table"></div>
            <script th:inline="javascript">
                /*<![CDATA[*/
                var cicloJson = /*[[${ciclo.toString()}]]*/ 'json';
                var rutaModulo = 'consejeria/aconsejadostutor';
                /*]]>*/
            </script>
            <script type="text/javascript" th:src="@{/phobos/modules/vue-modal.js}"></script>
            <script th:src="@{/app/consejeria/aconsejadostutor/aconsejadosTutor.js}" charset="utf-8"></script>
        </div>

    </body>
</html>
