<html layout:decorator="_layout/layout">
    <head>
        <title>Listado de Consejeros</title>
        <style>
            span#departs {
                /*                margin-left: 1px;*/
                font-size: x-small;
            }
            .circle-recorrido {
                display: block;
                border-radius: 50%;
                width: 50px;
                height: 50px;
                overflow: hidden;
                margin: 0 auto;
                line-height: 50px;  
                /*                text-align: center;*/
                font-size: 16px;
                /*                margin-left: 49px;*/
                text-indent: 0;
                vertical-align: middle;
                margin-top: 2px;
                margin-bottom: 2px;
            }

            .circle-recorrido.bgr-success {
                background-color: #2ECC71;
                color: #fff;
            }

            .circle-recorrido.bgr-default {
                background-color: #3C4043;
                color: #fff;
            }

        </style>
    </head>

    <body>
        <section layout:fragment="main">

            <div id="consejeriaVUE">
                <div v-cloak="">

                    <header class="header b-b padder-lg">
                        <div class="btn-group pull-right">
                            <button type="button" class="btn btn-primary dropdown-toggle pull-right" data-toggle="dropdown">
                                Acciones &nbsp; <span class="caret"></span>
                            </button>
                            <ul class="dropdown-menu">
                                <li><a type="button" v-bind:disabled="btnAñadir" title="Primero seleccione una carrera" v-on:click.prevent="nuevoConsejero">Añadir Consejero</a></li>
                                <li><a type="button" v-bind:disabled="btnAñadir" v-on:click.prevent="asignarAlummnos" >Asignar Alumnos aleatoriamente</a></li>
                                <li><a type="button" v-on:click.prevent="desasignarAlummnos" >Desasignar Alumnos</a></li>
                            </ul>
                        </div>
                        <h2>Listado de Consejeros <span v-text='ciclo.descripcion'></span></h2>
                    </header>
                    <section class="wrapper-lg">
                        <section class="panel">
                            <section class="panel-body">
                                <raptor-table v-bind:url="consjerosURL" v-bind:preload="false" ref="raptorConsejero">      
                                    <div slot="header">
                                        <div class="col-md-10 preguntas-col">
                                            <div class="row">
                                                <div class="col-md-5" >
                                                    <multiselect v-model="carreraSelect" 
                                                                 v-bind:options='carreras'
                                                                 label='nombre'
                                                                 track-by='id'
                                                                 placeholder="Seleccione una carrera"
                                                                 deselect-label=""
                                                                 select-label=""
                                                                 v-bind:allow-empty="false"
                                                                 v-bind:preselect="false"
                                                                 v-on:input="cargaConsejeros">
                                                    </multiselect>
                                                </div>
                                                <div class="col-md-2 text-center" v-bind:class="bgColorClass['activos']">
                                                    <a v-on:click="filtroConsejeros('Habilitado')" class="text-success pointer" >
                                                        <span class="h2 bold" v-text="cantidadActivo"></span>
                                                        <small class="block m-b-xs">Activos</small>
                                                    </a>
                                                </div>
                                                <div class="col-md-1 text-center" v-bind:class="bgColorClass['inactivos']">
                                                    <a v-on:click="filtroConsejeros('Inhabilitado')" class="text-black pointer" >
                                                        <span class="h2 bold" v-text="cantidadInactivo"></span>
                                                        <small class="block m-b-xs">Inactivos</small>
                                                    </a>
                                                </div>
                                                <div class="col-md-2 text-center">
                                                    <div class="text-info" >
                                                        <span class="h2 bold" v-text="cantidadAconsejados"></span>
                                                        <small class="block m-b-xs">Aconsejados</small>
                                                    </div>
                                                </div>
                                                <div class="col-md-2 text-center">
                                                    <div  class="text-danger" >
                                                        <span class="h2 bold" v-text="cantidadSinAconsejados"></span>
                                                        <small class="block m-b-xs">Sin consejero</small>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <template scope="props" >
                                        <table id="dynaTable" class="table table-striped">
                                            <thead class="panel panel-heading">
                                                <tr>
                                                    <th class="col-md-2 v-middle"><span>Consejeros</span></th>
                                                    <th class="col-md-2 text-center v-middle" colspan="2">Estudiantes</th>
                                                    <th class="col-md-2 v-middle text-center">Estado</th>
                                                    <th class="col-md-1 v-middle"></th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <tr v-for="item in props.data">
                                                    <td class="v-middle">

                                                        <a class="block text-primary bold ">{{item.colaborador.persona.nombreCompleto}}</a> 
                                                        <small class="block bold">DNI: {{item.colaborador.persona.numeroDocIdentidad}}</small>
                                                        <small class="block bold">Codigo: 
                                                            <small class="bold" v-for="docente in item.colaborador.persona.docente"> {{docente.codigo}}</small>
                                                        </small> 
                                                        <small class="block bold">Departamento: 
                                                            <small v-for="docente in item.colaborador.persona.docente">
                                                                <span v-for="departamento in docente">
                                                                    <span v-if="departamento.nombre == null" ></span>
                                                                    <span v-else="" class="bold label label-default" id="departs" >{{ departamento.nombre }} </span>
                                                                </span>
                                                            </small>
                                                        </small> 
                                                    </td>
                                                    <td class="v-middle text-center b-r">
                                                        <label>Activos</label>
                                                        <div class="v-middle text-center">
                                                            <div class=" circle-recorrido bgr-success text-center" v-text="item.alumnosActivos"></div>
                                                        </div>
                                                    </td>
                                                    <td class="v-middle text-center">
                                                        <label>Inactivos</label>
                                                        <div class="circle-recorrido bgr-default text-center" v-text="item.alumnosInactivos"></div>
                                                    </td>
                                                    <td class="v-middle text-center">
                                                        <small v-if="item.estado == 'ACT' " class="label label-success">Activo</small>
                                                        <span v-else="" class="label label-default">Inactivo</span>
                                                    </td>
                                                    <td class="v-middle">
                                                        <div class="dropdown actions">
                                                            <a class="dropdown-toggle" data-toggle="dropdown">
                                                                <i class="glyphicon glyphicon-cog"></i>
                                                            </a>
                                                            <ul class="dropdown-menu pull-right">
                                                                <li v-if="item.estado == 'ACT'" ><a v-on:click="cambiarEstado(item, 'INA')">Inhabilitar</a></li>
                                                                <li v-else=""><a v-on:click="cambiarEstado(item, 'ACT')">Habilitar</a></li>
                                                            </ul>
                                                        </div>
                                                    </td>
                                                </tr>
                                            </tbody>
                                        </table>         
                                    </template>
                                </raptor-table>

                            </section>
                        </section>
                    </section>
                    <div th:substituteby="consejeria/consejeroDocentesModal"></div>
                </div>
            </div>
            <div th:substituteby="_modules/vue-modal"/>
        </section>

        <div layout:fragment="js" th:remove="tag">
            <div th:substituteby="_modules/vue-raptor-table"></div>
            <script th:inline="javascript">
                /*<![CDATA[*/
                var cicloJson = /*[[${ciclo}]]*/ 'json';
                var carrerasJson = /*[[${carreras}]]*/ 'json';
                /*]]>*/
            </script>
            <script type="text/javascript" th:src="@{/phobos/modules/vue-modal.js}"></script>
            <script th:src="@{/app/consejeria/consejeria.js}" charset="utf-8"></script>
        </div>

    </body>
</html>
