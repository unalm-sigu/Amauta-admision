<modal-vik ref="nuevoConsejeroModal"
           v-bind="configNuevoConsejero"
           v-bind:okaction="saveConsejero">
    <div slot="body">

        <div class="row" data-parsley-validate="true" id="form">
            <div class="col-md-8 preguntas-col">
                <div class="form-group">
                    <label>Especialidad: <span v-text="carreraSelect.nombre"></span></label>
                </div>
            </div>
            <div class="col-md-12 preguntas-col">
                <label>Seleccione un docente</label>
                <div class="form-group">
                    <multiselect v-model="docenteSelect" 
                                 v-bind:options='docentes'
                                 label='nombres'
                                 v-bind:custom-label="nombreDocente"
                                 track-by='id'
                                 placeholder="Ingrese y seleccione el nombre de un docente"
                                 deselect-label=""
                                 select-label=""
                                 v-bind:allow-empty="false"
                                 v-bind:internal-search="false"
                                 v-on:search-change="getDocentes"
                                 v-on:input="cargaDepartamento">

                        <template slot="option" slot-scope="props">
                            <span class="option__title">{{ props.option.persona.nombreCompleto }}</span>
                            <div class="option__desc">
                                <span class="option__small text-primary">{{ props.option.departamentoAcademico.nombre }}</span>
                            </div>
                        </template>
                    </multiselect>
                </div>
            </div>
            <div v-if="departamentoDocente.id != undefined "
                 class="col-md-12 preguntas-col">
                <div class="form-group">
                    <label>Departamento académico del docente</label>
                    <span class="form-control text-primary" v-text="departamentoDocente.nombre" />
                </div>
            </div>
        </div>
    </div>
</modal-vik>
