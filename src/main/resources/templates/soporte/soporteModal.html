<modal-vik ref="modalSoporte"
           v-bind="modalSoporte"
           v-bind:okaction="responder">
    <div slot="body">
        <div class="modal-body">
            <form id="frmSoporteModal" data-parsley-validate="">
                <div class="row">
                    <div class="form-group m-b">
                        <div class="form-group row" >
                            <label   class="col-sm-3 control-label">Alumno</label>
                            <div class="col-sm-9" v-if="soporteForm.alumno != null">
                                <input class="form-control" v-model="soporteForm.alumno.persona.apellidosNombres" disabled=""></input>
                            </div>
                        </div>
                        <div class="form-group row" >
                            <label   class="col-sm-3 control-label">Observación</label>
                            <div class="col-sm-9">
                                <textarea class="form-control" v-model="soporteForm.comentario"  disabled=""></textarea>
                            </div>
                        </div>

                        <div class="form-group row">

                            <label class="col-sm-3 control-label">Respuesta</label>
                            <div class="col-sm-9">
                                <textarea class="form-control" v-model="soporteForm.respuesta"
                                          maxlength="200" required="true" ></textarea>
                            </div>

                        </div>

                    </div>
                </div>
            </form>
        </div>
    </div>
</modal-vik>
