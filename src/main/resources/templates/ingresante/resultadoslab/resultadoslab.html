<html layout:decorator="_layout/layout">
    <head>
        <title>Resultados de Laboratorio</title>
    </head>

    <body>         

        <div layout:fragment="main">
            <div id="resultadosVUE" v-cloak="">

                <header class="header b-b padder-lg">
                    <!--<a type="button" class="btn btn-success pull-right" href="/ingresante/resultadoslab/reporte">Reporte</a>-->    
                    <div class="btn-group pull-right">
                        <button type="button" class="btn btn-primary dropdown-toggle pull-right" data-toggle="dropdown">
                            <i class="fa fa-random fa-lg"/> &nbsp; Reportes &nbsp; <span class="caret"></span>
                        </button>
                        <ul class="dropdown-menu">
                            <li><a th:href="@{'/ingresante/resultadoslab/reporte'}"> <i class="fa fa-cloud-upload"/>&nbsp;Reporte General</a></li>
                            <li><a v-on:click="verReporteTurno"> <i class="fa fa-cloud-upload"/>&nbsp; Reporte Excel</a></li>
                        </ul>
                    </div>

                    <h2> Resultados de Laboratorio {{ciclo.descripcion}}</h2>   
                </header>

                <section class="wrapper-lg">
                    <section class="panel">
                        <section class="panel-body">
                            <raptor-table v-bind:url="ingresantesURL" ref="raptorRL">  

                                <div slot="header">
                                    <div class="col-md-6">
                                        <div class="input-group">
                                            <span class="input-group-addon">Fecha muestra</span>
                                            <multiselect 
                                                v-model='turnoSelected'
                                                v-bind:internal-search='false'
                                                v-bind:limit='15'
                                                v-bind:options='turnos'
                                                placeholder=""
                                                label='fecha'
                                                v-on:input="cambiarTurno">
                                                <template slot="clear" slot-scope="props">
                                                    <div class="multiselect__clear" v-if="existeTurnoSelect()"
                                                         v-on:mousedown.prevent.stop="clearAll(props.search)"></div>
                                                </template>
                                            </multiselect>
                                        </div>
                                    </div>
                                </div>

                                <template scope="props" >
                                    <div class="table-responsive">
                                        <table id="dynaTable" class="table table-striped table-hover">

                                            <thead>

                                                <tr>
                                                    <th class="col-xs-1 v-middle"></th>
                                                    <th class="col-xs-5 v-middle">Alumno</th>
                                                    <th class="col-xs-1 v-middle text-center">Muestra Abs</th>
                                                    <th class="col-xs-1 v-middle text-center">Estándar Abs</th>
                                                    <th class="col-xs-1 v-middle text-center">Hemoglobina g/dL</th>
                                                    <th class="col-xs-3 v-middle text-center">Sangre</th>
                                                    <th class=""></th>
                                                    <th></th>
                                                </tr> 

                                            </thead>
                                            <tbody>
                                                <tr v-for="item in props.data">

                                                    <td class="v-middle">
                                                        <div class="pull-left">
                                                            <div v-if="item.alumno.persona.tipoFoto=='POSTUL' "
                                                                 class="img-responsive img-thumbnail img-circle div-foto-list">
                                                                <img class="img-foto-list" v-bind:src="item.alumno.persona.rutaFoto" />
                                                            </div>

                                                            <img v-else-if="item.alumno.persona.tipoFoto=='COMUN' " 
                                                                 class="img-responsive img-thumbnail img-circle div-foto-alumno-list" 
                                                                 v-bind:src="item.alumno.persona.rutaFoto" />

                                                            <img v-else="" 
                                                                 class="img-foto-tempo img-responsive img-thumbnail img-circle" 
                                                                 v-bind:src="item.alumno.persona.rutaFoto" />
                                                        </div>
                                                    </td>

                                                    <td class="v-middle">
                                                        <a class="block text-primary bold h5 m-b-xs m-t-xs" >
                                                            {{item.alumno.persona.apellidosNombres}}
                                                        </a>
                                                        <span class="block">
                                                            <strong>Matrícula:</strong> {{item.alumno.codigo}} &nbsp;|&nbsp;
                                                            <strong>{{item.alumno.persona.tipoDocumento.simbolo}}:</strong> {{item.alumno.persona.numeroDocIdentidad}}
                                                        </span>
                                                        <small class="block bold">
                                                            Especialidad: {{item.alumno.carrera.nombre}}
                                                        </small>
                                                        <br/>
                                                        <span class="block bold text-danger">
                                                            Número muestra: {{item.numeroMuestraSangre}}
                                                        </span>

                                                    </td>

                                                    <td  class="v-middle" >       
                                                        <div v-if="item.laboratorio.id != ''">
                                                            <input v-model="item.laboratorio.valorMuestra" type="text" class="form-control decimal" />        
                                                        </div>
                                                    </td>

                                                    <td  class="v-middle" >       
                                                        <div  v-if="item.laboratorio.id != ''">
                                                            <input v-model="item.laboratorio.estandar" type="text" class="form-control decimal" />        
                                                        </div>
                                                    </td>

                                                    <td  class="v-middle" >       
                                                        <div  v-if="item.laboratorio.id != ''">
                                                            <input v-model="item.laboratorio.hemoglobina" type="text" class="form-control decimal" disabled="" />        
                                                        </div>
                                                    </td>

                                                    <td  class="v-middle" >       
                                                        <div class="input-group m-b-md" v-if="item.laboratorio.id != ''">
                                                            <span class="input-group-addon">Tipo</span>
                                                            <multiselect 
                                                                v-model="item.laboratorio.tipoSangreEnum"
                                                                v-bind:internal-search='false'
                                                                v-bind:limit='15'
                                                                v-bind:options='tipoSangreList'
                                                                placeholder=""
                                                                label='value'
                                                                v-bind:show-labels="false"
                                                                v-bind:allow-empty="false">
                                                            </multiselect>
                                                        </div>

                                                        <div class="input-group" v-if="item.laboratorio.id != ''">
                                                            <span class="input-group-addon">&nbsp;RH&nbsp;</span>
                                                            <multiselect 
                                                                v-model="item.laboratorio.factorRHEnum"
                                                                v-bind:internal-search='false'
                                                                v-bind:limit='15'
                                                                v-bind:options='rhList'
                                                                placeholder=""
                                                                label='value'
                                                                v-bind:show-labels="false"                                                         
                                                                v-bind:allow-empty="false">
                                                            </multiselect>
                                                        </div>
                                                    </td>

                                                    <td  class="v-middle text-center" >                                                                 
                                                        <div v-if="item.laboratorio.id != ''">
                                                            <a class="btn btn-success btn-sm"
                                                               v-on:click="guardarNumeroMuestra(item)">Guardar</a>
                                                            <div class="m-t-md" v-if="item.laboratorio.observaciones != '' ">
                                                                <i class="fa fa-info-circle fa-lg text-primary"
                                                                   data-toggle="tooltip"
                                                                   v-bind:title="item.laboratorio.observaciones"></i>
                                                            </div>
                                                        </div>
                                                    </td>

                                                    <td class="v-middle"> 
                                                        <div class="dropdown actions">
                                                            <a class="dropdown-toggle" data-toggle="dropdown">
                                                                <i class="glyphicon glyphicon-option-vertical"></i>
                                                            </a> 
                                                            <ul class="dropdown-menu pull-right">
                                                                <li><a class="pointer" v-on:click="abrirObservaciones(item)">Observaciones</a></li>
                                                            </ul>
                                                        </div>
                                                    </td> 


                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </template>
                            </raptor-table>
                        </section>
                    </section>
                </section>

                <th:block th:replace="ingresante/resultadoslab/modal/observacionModal"/>
                <!--<div th:substituteby="ingresante/resultadoslab/modal/observacionModal"></div>-->
            </div>

            <div th:substituteby="_modules/vue-modal"/>
        </div>


        <div layout:fragment="js" th:remove="tag">
            <script th:inline="javascript">
                var cicloJson = /*[[${cicloJson}]]*/ {};
                var turnosJson = /*[[${turnosJson}]]*/ {};
            </script>

            <div th:substituteby="_modules/vue-raptor-table"></div>
            <div th:substituteby="_layout/includes :: vuemodal"/>
            <script th:src="@{/app/ingresante/resultadoslab/resultadoslab.js}" charset="utf-8"></script>
        </div>

    </body>
</html>
