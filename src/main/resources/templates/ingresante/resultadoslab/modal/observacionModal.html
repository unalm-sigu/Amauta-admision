<modal-vik ref="modalObservacion"
           v-bind="newObservacionModal"
           v-bind:okaction="cerrarObservacion">

    <div slot="body">      

        <div class="row m-t-md">             
            <div class="col-md-12">
                <textarea v-model="itemSelected.laboratorio.observaciones" class="form-control col-md-10" rows="5"></textarea>
            </div>
        </div>
    </div>

</modal-vik>

<modal-vik ref="modalVerObservacion"
           v-bind="modalVerObservacion">

    <div slot="body">      

        <div class="row m-t-md"
             v-if="itemSelected.laboratorio">
            <div class="col-md-12">
                <div class="alert alert-info">
                    <h4 class="m-t-xs m-b-md">Observaciones</h4>
                    <p>{{itemSelected.laboratorio.observaciones}}</p>
                </div>
            </div>
        </div>
    </div>

</modal-vik>
