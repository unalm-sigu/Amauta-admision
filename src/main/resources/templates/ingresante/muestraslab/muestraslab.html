<html layout:decorator="_layout/layout">
    <head>
        <title>Muestras de Laboratorio</title>
        <style>
            .circle-recorrido {
                display: block;
                position: relative;
                float: left;
                border-radius: 50%;
                width: 68px;
                height: 68px;
                overflow: hidden;
                line-height: 55px;
                text-align: center;
                font-size: 16px;
                margin-right: 12px;
                text-indent: 0;
                vertical-align: middle;
                margin-top: 2px;
                margin-bottom: 2px;
            }
            .circle-recorrido.bgr-warning {
                background-color: #f0ad4e;
                color: #737373;
            }
            .circle-recorrido.bgr-success {
                background-color: #2ECC71;
                color: #fff;
            }
            .circle-recorrido.bgr-default {
                background-color: #3C4043;
                color: #fff;
            }
            .circle-recorrido.bgr-danger {
                background-color: #d9534f;
                color: #fff;
            }
            .nombre-actividad {
                background-color: #F2B097;
                color: #F11414;
                padding: 3px;
                padding-right: 10px;
                padding-left: 10px;
                border-radius: 3px;
                border-color: #F11414;
                border-style: solid;
                border-width: 1px;
            }
            /* Enter and leave animations can use different */
            /* durations and timing functions.              */
            .slide-fade-enter-active {
                transition: all .8s ease;
            }
            .slide-fade-leave-active {
                transition: all .8s cubic-bezier(1.0, 0.5, 0.8, 1.0);
            }
            .slide-fade-enter, .slide-fade-leave-to
            /* .slide-fade-leave-active below version 2.1.8 */ {
                transform: translateX(10px);
                opacity: 0;
            }

            .circle-recorrido.CAP{
                border:8px solid #AED6F1;
                /*border:3px solid #000080;*/
            }
            .circle-recorrido.OBU{
                border:8px solid #95A5A6;
                /*border:3px solid #ffd110;*/
            }
            .circle-recorrido.ALUMNO{
                border:8px solid #F9E79F;
                /*border:3px solid #ffd110;*/
            }
            .circle-recorrido.OERA{
                border:8px solid #D7BDE2;
                /*border:3px solid #00aaff;*/
            }
        </style>
    </head>

    <body>
        <section layout:fragment="main">            

            <div id="ingresantesVUE">
                <div v-cloak="">

                    <header class="header b-b padder-lg">
                        <h2 th:inline="text"> Muestras de Laboratorio</h2>    
                        <h4 style="text-align: right">Laboratorio Siguiente: {{laboratorioActual.numero}}</h4>
                    </header>

                    <section class="wrapper-lg">
                        <section class="panel">
                            <section class="panel-body">

                                <raptor-table v-bind:url="ingresantesURL" ref="raptorML">                            

                                    <div slot="header">
                                        <div class="col-md-5" >
                                            <div class="col-md-3">
                                                <br v-if="verTurno"/>
                                                <label v-if="!verTurno">&nbsp;&nbsp;&nbsp;&nbsp;Turno:</label>
                                                <div class="col-sm-6">
                                                    <label class="switch">
                                                        <input type="checkbox" v-model="verTurno" v-on:change="selectTurno"/>
                                                        <span></span>
                                                    </label>
                                                </div>
                                            </div>
                                            <div class="col-md-9">
                                                <label v-if="verTurno">Turno:</label>
                                                <multiselect 
                                                    v-if="verTurno"
                                                    v-model='turnoSelected'
                                                    v-bind:internal-search='false'
                                                    v-bind:limit='15'
                                                    v-bind:options='turnos'
                                                    placeholder="Seleccione un turno"
                                                    label='fecha'
                                                    v-bind:allow-empty="false"
                                                    v-on:input="cambiarTurno">
                                                </multiselect>
                                            </div>
                                        </div>

                                        <div class="col-md-5">
                                            <div class="col-md-3">
                                                <br v-if="verAtendidos"/>
                                                <label v-if="!verAtendidos">&nbsp;&nbsp;&nbsp;&nbsp;Atendidos:</label>
                                                <div class="col-sm-6">
                                                    <label class="switch">
                                                        <input type="checkbox" v-model="verAtendidos" v-on:change="selectAtendido"/>
                                                        <span></span>
                                                    </label>
                                                </div>
                                            </div>
                                            <div class="col-md-9">
                                                <label v-if="verAtendidos">Atendidos:</label>
                                                <multiselect 
                                                    v-if="verAtendidos"
                                                    v-model='atendidoSelected'
                                                    v-bind:internal-search='false'
                                                    v-bind:limit='15'
                                                    v-bind:options='turnos'
                                                    placeholder="Seleccione un turno"
                                                    label='fecha'
                                                    v-bind:allow-empty="false"
                                                    v-on:input="cambiarTurno">
                                                </multiselect>
                                            </div>
                                        </div>
                                    </div>

                                    <template scope="props" >
                                        <div class="table-responsive">
                                            <table id="dynaTable" class="table table-striped table-hover">

                                                <thead>

                                                    <tr>
                                                        <th class="col-xs-2">Alumno</th>
                                                        <th class="col-xs-3"></th>
                                                        <th class="col-xs-2">Fecha Atención</th>
                                                        <th class="col-xs-3">Número de Laboratorio</th>
                                                    </tr> 

                                                </thead>
                                                <tbody>
                                                    <tr v-for="item in props.data">

                                                        <td class="v-middle">
                                                            <div class="pull-left">
                                                                <div v-if="item.alumno.persona.tipoFoto=='POSTUL' "
                                                                     class="img-responsive img-thumbnail img-circle div-foto-list">
                                                                    <img class="img-foto-list" v-bind:src="item.alumno.persona.rutaFoto" />
                                                                </div>

                                                                <img v-else-if="item.alumno.persona.tipoFoto=='COMUN' " 
                                                                     class="img-responsive img-thumbnail img-circle div-foto-alumno-list" 
                                                                     v-bind:src="item.alumno.persona.rutaFoto" />

                                                                <img v-else="" 
                                                                     class="img-foto-tempo img-responsive img-thumbnail img-circle" 
                                                                     v-bind:src="item.alumno.persona.rutaFoto" />
                                                            </div>
                                                        </td>

                                                        <td class="v-middle">
                                                            <a class="block text-primary bold h5 m-b-xs m-t-xs" >
                                                                {{item.alumno.persona.apellidosNombres}}
                                                            </a>
                                                            <span class="block">
                                                                <strong>Matrícula:</strong> {{item.alumno.codigo}} &nbsp;|&nbsp;
                                                                <strong>{{item.alumno.persona.tipoDocumento.simbolo}}:</strong> {{item.alumno.persona.numeroDocIdentidad}}
                                                            </span>
                                                            <small class="block bold">
                                                                Especialidad: {{item.alumno.carrera.nombre}}
                                                            </small>
                                                            <br/>
                                                            <span class="block bold">
                                                                Número de Atención: {{item.numeroAtencion}}
                                                            </span>

                                                        </td>

                                                        <td class="v-middle">
                                                            <span class="block">
                                                                {{item.laboratorio.fechaRegistro}}
                                                            </span>

                                                        </td>

                                                        <td  class="v-middle"> 
                                                            <div class="form-group col-md-6">
                                                                <input v-model="item.laboratorio.numeroMuestra" type="text" class="form-control" disabled=""/>        
                                                            </div>

                                                            <div v-if="verTurno">
                                                                <div v-if="item.laboratorio.numeroMuestra==''" class="form-group col-md-6">
                                                                    <a type="button" class="btn btn-success" v-on:click="asignarNumLab(item)">Asignar</a>
                                                                </div>
                                                                <div v-if="item.laboratorio.numeroMuestra!=''" class="form-group col-md-6">
                                                                    <a type="button" class="btn btn-danger" v-on:click="borrarNumlab(item)">Borrar</a>
                                                                </div>
                                                            </div>
                                                        </td>

                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>
                                    </template>
                                </raptor-table>
                            </section>
                        </section>
                    </section>

                </div>
            </div>

        </section>

        <div layout:fragment="js" th:remove="tag">
            <script th:inline="javascript">
                /*<![CDATA[*/
                var laboratorioActual = /*[[${laboratorioActual.toString()}]]*/ 'json';
                /*]]>*/
            </script>
            <div th:substituteby="_modules/vue-raptor-table"></div>
            <div th:substituteby="_layout/includes :: sweetalert"/>
            <script th:src="@{/app/ingresante/muestraslab/muestraslab.js}" charset="utf-8"></script>
        </div>

    </body>
</html>
