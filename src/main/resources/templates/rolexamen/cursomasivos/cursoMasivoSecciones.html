<html layout:decorator="_layout/layout"> 
    <head>
        <title> Cursos Masivos </title> 

    </head>
    <body>
        <section layout:fragment="main">
            <div id="main" v-cloak="">

                <header class="header b-b padder-lg">
                    <h2>Secciones Curso Masivo <span th:text="${cicloAcademico.descripcion}">2018-II</span></h2>
                    <div class="pull-right m-t-md">
                        <a class="btn btn-default"   th:href="@{/rolexamen/cursomasivos}"  >Regresar</a>
                    </div>
                </header>

                <section class="wrapper-lg">
                    <section class="panel m-b">
                        <section class="panel-body">

                            <table>
                                <tbody>
                                    <tr class="m-b">
                                        <td class="col-md-2 bold">Rol Examen</td>
                                        <td class="col-md-4" v-text="cursoMasivoExamen.rolExamenes.nombre"></td>
                                        <td class="col-md-6"></td>
                                    </tr>
                                    <tr class="">
                                        <td class="col-md-2 bold">Curso</td>
                                        <td class="col-md-4">
                                            <div class="block text-primary bold m-t"
                                                 v-text="cursoMasivoExamen.curso.nombre"></div>
                                            <div class="block m-b">
                                                {{cursoMasivoExamen.curso.codigo}}&nbsp;
                                                <i class="fa fa-bookmark text-primary"></i>
                                                {{cursoMasivoExamen.curso.tpc}}</div>
                                        </td>
                                        <td class="col-md-6"></td>
                                    </tr>
                                    <tr class="m-b">
                                        <td class="col-md-2 bold">Fecha Examen</td>
                                        <td class="col-md-4" >
                                            <template v-if="cursoMasivoExamen.grupoHorasExamen.fecha">
                                                {{cursoMasivoExamen.grupoHorasExamen.fecha }}
                                                (Grupo {{cursoMasivoExamen.grupoHorasExamen.grupoHoras.codigo}})
                                                <label >Hora Inicio: {{cursoMasivoExamen.grupoHorasExamen.horaInicio.descripcion}}</label>
                                                <label >Hora Fin: {{cursoMasivoExamen.grupoHorasExamen.horaFin.descripcion}}</label>
                                            </template>
                                            <template v-else="">
                                                Sin Asignar Horario
                                            </template>
                                        </td>
                                        <td class="col-md-6"></td>
                                    </tr>
                                </tbody>
                            </table>

                            <!--div class="row">
                                <div class="form-group">
                                    <label class="m col-md-2 bold">Rol Examen</label>  
                                    <div class="m-t-md col-md-4" v-text="cursoMasivoExamen.rolExamenes.nombre"></div>
                                </div>
                            </div>                                   

                            <div class="row">
                                <div class="form-group">
                                    <label class="m col-md-2 bold">Curso</label>
                                    <div class="m-t-md col-md-4" v-text="cursoMasivoExamen.curso.nombre"></div>
                                </div>
                            </div>

                            <div class="row"  v-if="cursoMasivoExamen.grupoHorasExamen">
                                <div class="form-group">
                                    <label class="m col-md-2 bold">Fecha Examen</label>
                                    <div class="m-t-md col-md-4">
                                        <template v-if="cursoMasivoExamen.grupoHorasExamen.fecha">
                                            {{cursoMasivoExamen.grupoHorasExamen.fecha }}
                                            (Grupo {{cursoMasivoExamen.grupoHorasExamen.grupoHoras.codigo}})
                                            <label >Hora Inicio: {{cursoMasivoExamen.grupoHorasExamen.horaInicio.descripcion}}</label>
                                            <label >Hora Fin: {{cursoMasivoExamen.grupoHorasExamen.horaFin.descripcion}}</label>
                                        </template>
                                        <template v-else="">
                                            Sin Asignar Horario
                                        </template>
                                    </div>

                                </div>
                            </div-->

                        </section>
                    </section>

                    <section class="panel m-t">
                        <section class="panel-body">

                            <raptor-table v-bind:url="`${URL}/listSeccionesCursosMasivos`" v-bind:preload="false" ref="tblSeccionesCursosMasivos">
                                <template scope="props">

                                    <table class="table table-striped">
                                        <thead>
                                            <tr>
                                                <th class="col-md-3 text-center">Sección</th>
                                                <th class="col-md-2 text-center">Horario Sección</th>
                                                <th class="col-md-2 text-center">Aula Sección</th>
                                                <th class="col-md-3 text-center">Alumnos</th>
                                                <th class="col-md-2 text-center">Estado</th>
                                                <th v-if="accionesDisponibles" class="text-center"></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr v-for="sec in props.data">
                                                <td class="text-center">
                                                    <span class="text-md bold text-primary">  {{sec.seccion.codigo2}}  </span>
                                                </td>
                                                <td>
                                                    <span v-text="sec.seccion.grupoHoras.codigo"></span>
                                                </td>
                                                <td>
                                                    <span v-text="sec.seccion.aula.codigo"></span>
                                                </td>
                                                <td class="text-center">
                                                    <span class="badge pointer">{{ sec.alumnosCount }}</span>
                                                </td>
                                                <td class="text-center">
                                        <v-estado v-bind:codigo="sec.estado" v-bind:valor="sec.estadoEnum.value"/> 
                                        </td>
                                        <td v-if="accionesDisponibles">
                                            <div class="dropdown actions pointer">
                                                <a class="dropdown-toggle" data-toggle="dropdown">
                                                    <i class="glyphicon glyphicon-option-vertical"></i>
                                                </a> 
                                                <ul class="dropdown-menu pull-right">
                                                    <li><a v-if="sec.isEstadoActivo"  v-on:click.prevent="excluir(sec,'SECCION')">Excluir</a></li>
                                                    <li><a v-if="sec.isEstadoExcluido"  v-on:click.prevent="incluir(sec,'SECCION')">Incluir</a></li>
                                                    <li class="divider"></li> 
                                                    <li><a v-if="sec.isEstadoActivo"  
                                                           v-on:click.prevent="trasladar(sec)">Mover</a></li>
                                                </ul>
                                            </div>
                                        </td>
                                        </tr>
                                        </tbody>
                                    </table>   

                                </template>
                            </raptor-table>


                        </section>
                    </section>
                </section>


                <modal-vik ref="moverSeccionModal"
                           id="modalMoverSeccion"
                           header="true"
                           modalsize="modal-lg"
                           title="Mover Seccion"
                           v-bind:showaccept="false">
                    <div slot="body">

                        <mover-seccion-examen ref="moverSeccionComp"
                                              > 
                        </mover-seccion-examen> 

                    </div>
                </modal-vik>

            </div>
            <div th:substituteby="_modules/vue-modal"/>
        </section>

        <div layout:fragment="js">
            <script  th:inline="javascript" >
                /*<![CDATA[*/
                var jCursoMasivoExamen = /*[[${jCursoMasivoExamen}]]*/ '';
                /*]]>*/
            </script>

            <div th:substituteby="_modules/vue-raptor-table"></div>
            <script th:src="@{/phobos/modules/vue-generalComponents.js}" charset="utf-8"></script>
            <script th:src="@{/phobos/modules/vue-modal.js}" charset="utf-8"></script>
            <div th:substituteby="rolexamen/components/mover-seccion-examen"/>
            <script th:src="@{/app/rolexamen/cursomasivos/cursoMasivoSecciones.js}" charset="utf-8"></script>
        </div>

    </body>
</html>
