<html layout:decorator="_layout/layout"> 
    <head>
        <title> Secciones Grupos Regulares - Rol Exámenes </title> 
    </head>
    <body>
        <section layout:fragment="main">
            <div id="main" v-cloak="">

                <header class="header b-b padder-lg">
                    <h2>Secciones Grupo Regular <span th:text="${cicloAcademico.descripcion}">2018-II</span></h2>
                    <div class="pull-right m-t-md">
                        <a class="btn btn-default"   th:href="@{/rolexamen/gruporegular}"  >Regresar</a>
                    </div>
                </header>

                <section class="wrapper-lg">
                    <section class="panel">
                        <section class="panel-body">

                            <div class="row">

                                <div class="row">
                                    <div class="form-group">
                                        <label class="m col-md-2 bold">Rol Examen</label>  
                                        <div class="m-t-md col-md-4" v-text="rolExamenex.nombre"></div>
                                    </div>
                                </div>                                   

                                <div class="row" v-if="letraGrupoRegular.id">
                                    <div class="form-group">
                                        <label class="m col-md-2 bold">Letra Grupo Regular</label>
                                        <div class="m-t-md col-md-4" v-text="letraGrupoRegular.letra"></div>
                                    </div>
                                </div>

                            </div>

                        </section>
                    </section>

                    <section class="panel">
                        <section class="panel-body">

                            <raptor-table v-bind:url="`${URL}`" v-bind:preload="false" ref="tblSeccionesGrupoRegular">
                                <template scope="props">

                                    <table class="table table-striped">
                                        <thead>
                                            <tr>
                                                <th class="col-md-1 text-center">Letra</th>
                                                <th class="col-md-4">Curso</th>
                                                <th class="col-md-1 text-center">Alumnos</th>
                                                <th class="col-md-2">Docente</th>
                                                <th class="col-md-3 text-center">Examen</th>
                                                <th class="col-md-1 text-center">Estado</th>
                                                <th class="text-center"></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr v-for="sec in props.data">
                                                <td class="text-center v-middle">
                                                    <div class="h3 text-primary" v-text="sec.letraGrupoRegular.letra"></div>
                                                </td>
                                                <td>
                                                    <input type="hidden" v-bind:value="sec.seccion.id"/>
                                                    <span class="block" >
                                                        <span v-text="sec.seccion.codigo2" class="bold text-info text-md"></span>
                                                        <span v-if="sec.seccion.grupoHoras" class="">({{sec.seccion.grupoHoras.codigo}})</span>
                                                    </span>
                                                    <span class="block text-muted">{{ sec.seccion.grupoSeccion.curso.nombre }}</span>
                                                    <span class="block text-muted"><b>{{ sec.seccion.grupoSeccion.curso.codigo  }}</b> &nbsp; <i class="fa fa-bookmark-o"></i> {{ sec.seccion.grupoSeccion.curso.tpc }}</span>
                                                </td>
                                                <td class="text-center v-middle">
                                                    <span class="badge pointer"
                                                          >{{ sec.alumnosCount }}</span>
                                                </td>
                                                <td class="v-middle">
                                                    <span v-text="sec.docente.persona.apellidosNombres"></span>
                                                </td>
                                                <td class="text-center v-middle">
                                                    <span class="block text-primary bold">Aula {{sec.aula.codigo}}</span>
                                                    <span class="block">Fecha {{sec.letraGrupoRegular.grupoHorasExamen.fecha}}</span>
                                                    <span class="block">
                                                        De {{sec.letraGrupoRegular.grupoHorasExamen.horaInicio.descripcion}}
                                                        a {{sec.letraGrupoRegular.grupoHorasExamen.horaFin.descripcionFin}}
                                                    </span>
                                                </td>

                                                <td class="text-center v-middle">
                                                    <div>
                                                        <v-estado v-bind:codigo="sec.estado" v-bind:valor="sec.estadoEnum.value"/> 
                                                    </div>
                                                </td>
                                                <td class="v-middle">
                                                    <div class="dropdown actions pointer">
                                                        <a class="dropdown-toggle" data-toggle="dropdown">
                                                            <i class="glyphicon glyphicon-option-vertical"></i>
                                                        </a> 
                                                        <ul class="dropdown-menu pull-right">
                                                            <li v-if="sec.isEstadoActivo"><a v-on:click.prevent="excluir(sec,tipoAccion.SECCION)">Excluir</a></li>
                                                            <li v-if="sec.isEstadoExcluido"><a v-on:click.prevent="incluir(sec,tipoAccion.SECCION)">Incluir</a></li>
                                                            <li><a  v-on:click.prevent="cambiarAula(sec)">Cambiar Aula</a></li>
                                                            <li><a  v-on:click.prevent="trasladar(sec)">Mover</a></li>
                                                        </ul>
                                                    </div>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>

                                </template>
                            </raptor-table>

                        </section>
                    </section>
                </section>

                <div th:substituteby="rolexamen/gruporegular/grupoRegularSeccionesModals"/>

            </div>
        </section>

        <div layout:fragment="js">
            <script  th:inline="javascript" >
                /*<![CDATA[*/
                var jLetraGrupoRegular = /*[[${jLetraGrupoRegular}]]*/ '';
                var jRolExamenes = /*[[${jRolExamenes}]]*/ '';
                var urlSeccion = /*[[${urlSeccion}]]*/ '';
                var rutaModulo = "rolexamen/gruporegular";
                /*]]>*/
            </script>
            <div th:substituteby="_modules/vue-modal"/>
            <div th:substituteby="_modules/vue-raptor-table"></div>
            <script th:src="@{/phobos/modules/vue-generalComponents.js}" charset="utf-8"></script>
            <div th:substituteby="rolexamen/components/mover-seccion-examen"/>
            <div th:substituteby="rolexamen/components/cambio-aula"/>
            <script th:src="@{/app/rolexamen/gruporegular/grupoRegularSecciones.js}" charset="utf-8"></script>
        </div>

    </body>
</html>
