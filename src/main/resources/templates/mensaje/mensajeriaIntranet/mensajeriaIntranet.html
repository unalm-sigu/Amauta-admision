<html layout:decorator="_layout/layout">
    <head>
        <title>Mensajeria </title>
        <style  type="text/css">
            .multiselect--active {
                z-index: 1000;
            }
        </style>    
    </head>

    <body>
        <div layout:fragment="main">

            <div id="mensajeriaVUE">
                <header class="header b-b padder-lg">

                    <div class="pull-right m-t-md">                 
                        <div class="btn-group">
                            <a type="button" class="btn btn-success" v-on:click="nuevo">Nuevo</a>
                        </div>
                    </div> 
                    <h2 v-text="'Lista de Mensajes Intranet ' + cicloAcademico.descripcion">Lista de Mensajeria Intranet</h2>
                </header>

                <section class="wrapper-lg">
                    <section class="panel">
                        <section class="panel-body">
                            <div class="col-md-12">
                                <raptor-table v-bind:url="mensajeriaURL" ref="load">
                                    <template  scope="props" >
                                        <table class="table table-striped table-hover">
                                            <thead> 
                                                <tr class=""> 
                                                    <th class="col-md-2">Grupo Alumno </th>
                                                    <th class="col-md-2">Tipo Mensaje</th>
                                                    <th class="col-md-4">Contenido</th>
                                                    <th class="col-md-1">Inicio</th>
                                                    <th class="col-md-1">Fin</th>
                                                    <th class="col-md-1">P / V / O / C</th>
                                                    <th class="col-md-1"></th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <tr v-for="(item, index) in props.data">
                                                    <td class="v-middle" v-text="item.grupoAlumno.nombre"></td>
                                                    <td class="v-middle" v-text="item.tipoMensajeIntranet.nombre"></td>
                                                    <td class="v-middle" v-text="item.contenido"></td>
                                                    <td class="v-middle" v-text="item.fechaInicio"></td>
                                                    <td class="v-middle" v-text="item.fechaFin"></td>
                                                    <td class="v-middle">
                                                        {{item.prioridad}} / {{item.vecesVisible}} / 
                                                        {{item.esObligatorio == 1 ? 'Si': 'No'}} / {{item.conCronograma == 1 ? 'Si' : 'No'}}
                                                    </td>
                                                    <td class="v-middle"> 
                                                        <div class="dropdown actions">
                                                            <a class="dropdown-toggle" data-toggle="dropdown">
                                                                <i class="glyphicon glyphicon-cog"></i>
                                                            </a> 
                                                            <ul class="dropdown-menu pull-right">
                                                                <li><a class="" v-on:click="editar(item)" >Editar</a></li>
                                                                <li><a class="" v-on:click="eliminar(item)" >Eliminar</a></li>
                                                            </ul>
                                                        </div>
                                                    </td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </template>
                                </raptor-table>
                            </div>
                        </section>
                    </section>
                </section>    

                <div th:substituteby="mensaje/mensajeriaIntranet/modalMensajeria"></div>
            </div>
            <div th:substituteby="_modules/vue-modal"></div>
        </div>

        <div layout:fragment="js">
            <div th:substituteby="_modules/vue-raptor-table"></div>  
            <script th:inline="javascript">
                /*<![CDATA[*/
                var gruposAlumnoJson = /*[[${gruposAlumno.toString()}]]*/ 'json';
                var tiposMensajeJson = /*[[${tiposMensaje.toString()}]]*/ 'json';
                var cicloJson = /*[[${ciclo.toString()}]]*/ 'json';
                /*]]>*/
            </script>
            <script th:src="@{/vendor/sweetalert/dist/sweetalert.min.js}" charset="utf-8"></script>
            <div th:substituteby="_layout/includes :: javascript-bootstrap-datetimepicker"></div>
            <div th:substituteby="_layout/includes :: javacsript-vue-bootstrap-datetimepicker"></div>
            <script type="text/javascript" th:src="@{/phobos/modules/vue-modal.js}"></script>
            <script th:src="@{/app/mensaje/mensajeIntranet/mensajeIntranet.js}" charset="utf-8"></script>
        </div>

    </body>
</html>
