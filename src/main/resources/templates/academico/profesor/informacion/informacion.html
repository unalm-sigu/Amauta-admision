<html layout:decorator="_layout/layout">
    <head>
        <title> Docente </title>
    </head>
    <body>
        <section layout:fragment="main">

            <div id="main">

                <header class="header b-b padder-lg">

                    <a th:href="@{/academico/profesor}" class="btn btn-default btn-sm pull-right">Regresar</a>

                    <h2  v-text="docente.persona.id!=null ? docente.persona.nombreCompleto : 'Nuevo Docente' " >Nuevo Docente</h2>

                    <div class="tabbable-line">
                        <ul class="nav nav-tabs" >


                            <!--tab 1-->
                            <li  v-bind:class="{ 'active': stepactivo==1 }">
                                <a href="#" data-toggle="tab" v-on:click.prevent="stepactivo=1" >Datos Personales</a>
                            </li>

                            <!--tab 2-->
                            <li  v-bind:class="{ 'active': stepactivo==2 }">
                                <a href="#" data-toggle="tab" v-on:click.prevent="stepactivo=2" >Datos Académicos</a>
                            </li>

                            <!--tab 3-->
                            <li  v-bind:class="{ 'active': stepactivo==3 }">
                                <a href="#" data-toggle="tab" v-on:click.prevent="stepactivo=3" >Datos Laborales</a>
                            </li>
                        </ul>
                    </div>


                </header>



                <section class="wrapper-lg">
                    <section class="panel">
                        <section class="panel-body">



                            <form data-parsley-validate="true" method="POST" id="formDocente" >


                                <input type="hidden"  name="id" v-bind:value="docente.id"/>
                                <input type="hidden"  name="persona.id" v-bind:value="docente.persona.id"/>


                                <div v-show="stepactivo==1"  >

                                    <th:block th:replace="academico/profesor/informacion/informacionpersonal"/>

                                </div>

                                <div v-show="stepactivo==2"  >

                                    <th:block th:replace="academico/profesor/informacion/informacionacademica"/>

                                </div>

                                <div v-show="stepactivo==3"  >

                                    <th:block th:replace="academico/profesor/informacion/informacionlaboral"/>

                                </div>


                            </form>



                        </section>
                    </section>
                </section>

            </div>

            <th:block th:replace="academico/profesor/informacion/informacionacademicatemp"/>

            <div th:substituteby="_modules/vue-modal"/>

            <script  th:inline="javascript" >
                /*<![CDATA[*/
                var iddocente = /*[[${docente.id}]]*/'';
                /*]]>*/
            </script>


        </section>

        <div layout:fragment="js">
            <script charset="utf-8">
                var datepicker = $.fn.datepicker.noConflict();
                $.fn.datepickerBoot = datepicker;
            </script>
            <div th:substituteby="_layout/includes :: javascript-upload"> </div>
            <div th:substituteby="_layout/includes :: vuemodal"/>
            <script th:src="@{/app/academico/profesor/informacion/informacionacademicapais.js}" charset="utf-8"></script>
            <script th:src="@{/app/academico/profesor/informacion/informacionacademicaubicacion.js}" charset="utf-8"></script>
            <script th:src="@{/app/academico/profesor/informacion/informacionacademicadepartamento.js}" charset="utf-8"></script>
            <script th:src="@{/app/academico/profesor/informacion/informacionfileupload.js}" charset="utf-8"></script>
            <script th:src="@{/app/academico/profesor/informacion/informacionacademica.js}" charset="utf-8"></script>
        </div>

    </body>
</html>
