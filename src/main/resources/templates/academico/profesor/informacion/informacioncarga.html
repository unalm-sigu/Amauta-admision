<raptor-table v-bind:url="`/academico/profesor/${docente.id}/listCargaAcademicaDocente`" v-bind:searcher="false" v-bind:paginate="false">
    <template scope="props">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th class="col-md-5">Curso</th>
                    <th class="col-md-1 text-center">Tipo</th>
                    <th class="col-md-1 text-center">Sección</th>
                    <th class="col-md-1 text-center">Aula</th>
                    <th class="col-md-1 text-center">Grupo</th>
                    <th class="col-md-1 text-center">Alumnos</th>
                    <th class="col-md-1 text-center">% Carga</th>
                    <th class="col-md-2 text-center">Periodo</th>
                    <th class=""></th>
                </tr>
            </thead>
            <tbody v-for="item in props.data">
                <tr> 
                    <td class="v-middle padder-v" v-bind:style="item.styleHijo"
                        v-bind:rowspan="item.secciones.length">
                        <div class="h4 text-primary m-t-xs m-b-xs">{{item.curso.nombre}}</div>
                        <span class="block m-b-xs">
                            {{item.curso.codigo}} &nbsp;&nbsp; <i class="fa fa-bookmark-o"></i> {{item.curso.tpc}}
                        </span>
                    </td>

            <template v-for="(seccion,idx) in item.secciones"
                      v-if="idx==0">
                <td class="v-middle text-center">
                    <span v-if="seccion.tipoSeccionEnum.name==='PCUR'" class="fa fa-flask fa-lg"/>
                    <span v-else-if="seccion.tipoSeccionEnum.name==='PRA'" class="fa fa-flask  fa-lg"/>
                    <span v-else="" class="fa fa-book"/>
                    <small class="block text-muted" v-text="tipoSeccion(seccion)"></small>
                </td>
                <td class="v-middle text-center">
                    {{seccion.codigo2}}
                </td>
                <td class="v-middle text-center">
                    {{seccion.aula.codigo}}
                </td>
                <td class="v-middle text-center">
                    {{seccion.grupoHoras.codigo}}
                </td>
                <td class="v-middle text-center">
                    {{seccion.matriculados}}
                </td>
                <template v-for="profeSecc in seccion.docenteSeccion">
                    <td class="v-middle text-center">
                        <span v-if="profeSecc.porcentajeCarga != '' ">{{profeSecc.porcentajeCarga.toFixed(2)}} </span>
                    </td>
                    <td class="v-middle text-center">
                        {{profeSecc.fechaInicio}}
                        {{profeSecc.fechaFin}}
                    </td>
                </template>
            </template>
            </tr>

            <tr v-for="(seccion,idx) in item.secciones"
                v-if="idx>0"> 
                <td class="v-middle text-center">
                    <span v-if="seccion.tipoSeccionEnum.name==='PCUR'" class="fa fa-flask  fa-lg"/>
                    <span v-else-if="seccion.tipoSeccionEnum.name==='PRA'" class="fa fa-flask  fa-lg"/>
                    <span v-else="" class="fa fa-book"/>
                    <small class="block text-muted" v-text="tipoSeccion(seccion)"></small>
                </td>
                <td class="v-middle text-center">
                    {{seccion.codigo2}}
                </td>
                <td class="v-middle text-center">
                    {{seccion.aula.codigo}}
                </td>
                <td class="v-middle text-center">
                    {{seccion.grupoHoras.codigo}}
                </td>
                <td class="v-middle text-center">
                    {{seccion.matriculados}}
                </td>
            <template v-for="profeSecc in seccion.docenteSeccion">
                <td class="v-middle text-center">
                    <span v-if="profeSecc.porcentajeCarga != '' ">{{profeSecc.porcentajeCarga.toFixed(2)}} </span>
                </td>
                <td class="v-middle text-center">
                    {{profeSecc.fechaInicio}}
                    {{profeSecc.fechaFin}}
                </td>
            </template>
            </tr>

            </tbody>
        </table>
    </template>
</raptor-table>
