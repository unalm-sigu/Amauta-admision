<div class="col-xs-12">
    <h4 class="m-b-md m-t-md">Datos Generales</h4>
</div>


<div class="col-sm-6">
    <div class="form-group">

        <label>Tipo de documento de identidad</label>

        <select name="persona.tipoDocumento.id"
                v-model="docente.persona.tipoDocumento.id"
                class="form-control" required="true">
            <option></option>
            <option th:each="tipo : ${tiposDocIdentidad}"
                    th:value="${tipo.id}"
                    th:text="${tipo.nombre}"></option>
        </select>

    </div>
</div>

<div class="col-sm-6">
    <div class="form-group">

        <label>Número de documento de identidad</label>

        <input type="text"
               v-model="docente.persona.numeroDocIdentidad"
               v-bind:value="docente.persona.numeroDocIdentidad"
               name="persona.numeroDocIdentidad"
               class="form-control" required="true"/>

    </div>
</div>

<div class="col-sm-6">
    <div class="form-group">

        <label>Apellido Paterno</label>

        <input type="text"
               name="persona.paterno"
               v-bind:value="docente.persona.paterno"
               v-model="docente.persona.paterno"
               v-on:change="nombrePersona"
               class="form-control"/>

    </div>
</div>

<div class="col-sm-6">
    <div class="form-group">

        <label>Apellido Materno</label>

        <input type="text"
               name="persona.materno"
               v-bind:value="docente.persona.materno"
               v-model="docente.persona.materno"
               v-on:change="nombrePersona"
               class="form-control"/>

    </div>
</div>

<div class="col-sm-6">
    <div class="form-group">
        <label>Nombres</label>

        <input type="text"
               name="persona.nombres"
               required="true"
               v-model="docente.persona.nombres"
               v-bind:value="docente.persona.nombres"
               v-on:change="nombrePersona"
               class="form-control"/>

    </div>
</div>

<div class="col-sm-6">
    <div class="form-group">
        <label >Correo  Institucional</label>

        <input  class="inline form-control"
                data-trigger="change" required="true" type="email"
                data-trim-value="true"
                v-model="docente.persona.emailCompania"
                name="persona.emailCompania" id="emailCompania"
                v-bind:value="docente.persona.emailCompania"
                />
    </div>
</div>

<div class="col-sm-6">
    <div class="form-group">
        <label>Sexo</label>

        <div class="form-group">
            <div class="col-sm-10">
                <div class="col-sm-5">

                    <label class="radio inline">

                        <input  type="radio"
                                required="true"
                                name="persona.sexo"
                                id="inlineCheckbox1"
                                value="M"
                                v-model="docente.persona.sexo"
                                /> Masculino
                    </label>

                </div>
                <div class="col-sm-5">

                    <label class="radio inline">
                        <input  type="radio"
                                required="true"
                                name="persona.sexo"
                                id="inlineCheckbox2"
                                value="F"
                                v-model="docente.persona.sexo"
                                /> Femenino
                    </label>

                </div>
            </div>
        </div>

    </div>
</div>

<div class="col-xs-12 col-sm-12">
    <div class="form-group">
        <label>Fotografía</label>
        <vueupload
            v-bind:persona="docente.persona"
            ></vueupload>
    </div>
</div>

<div class="col-xs-12">
    <h4  class="m-b-md m-t-md"> Lugar y fecha de nacimiento </h4>
</div>

<div class="col-sm-6">
    <div class="form-group">
        <label>País</label>

        <paissearh 
            v-bind:pais="docente.persona.paisNacer"
            v-bind:nombre="'persona.paisNacer.id'"/>

    </div>
</div>

<div class="col-sm-6">


    <div v-if="docente.persona.paisNacer.codigo=='PE'"  class="form-group" >
        <label>Distrito de nacimiento (en Perú)</label>

        <ubicacionsearch 
            v-bind:ubicacion="docente.persona.ubicacionNacer"
            v-bind:nombre="'persona.ubicacionNacer.id'"/>

    </div>


</div>

<div class="col-sm-6">
    <div class="form-group">

        <label>Fecha ( día / mes / año )</label>
        <div class="input-group date">

            <input type="text"
                   data-parsley-errors-container="#errorfechaNacer"
                   class="form-control"
                   v-model="docente.persona.fechaNacer"
                   name="persona.fechaNacer" required="true" />

            <span class="input-group-addon">
                <i class="fa fa-calendar" aria-hidden="true"></i>
            </span>

        </div>
        <span id="errorfechaNacer"></span>
    </div>
</div>

<div class="col-sm-6">
    <div class="form-group">

        <label>Nacionalidad (Ingresa el país de tu nacionalidad)</label>

        <paissearh 
            v-bind:pais="docente.persona.nacionalidad"
            v-bind:nombre="'persona.nacionalidad.id'"/>

    </div>
</div>

<div class="col-sm-6">
    <div class="form-group">

        <label>Con Discapacidad</label>

        <div>
            <label class="switch"> 
                <input type="checkbox"
                       name="encuestaTeoriaPractica"

                       value="true"/>
                <span></span>
            </label>
        </div>
        

    </div>
</div>

<div class="col-xs-12">
    <h4  class="m-b-md m-t-md">Contacto</h4>
</div>

<div class="col-sm-4">
    <div class="form-group">

        <label>Teléfono</label>

        <input type="text"
               name="persona.telefono"
               v-model="docente.persona.telefono"
               class="form-control sin-espacios numerico"/>

    </div>
</div>

<div class="col-sm-4">
    <div class="form-group">

        <label>Celular</label>

        <input type="text"
               name="persona.celular"
               v-model="docente.persona.celular"
               class="form-control sin-espacios numerico"/>

    </div>
</div>

<div class="col-sm-4">
    <div class="form-group">

        <label>Correo Electrónico</label>

        <input type="text"
               name="persona.email"
               v-model="docente.persona.email"
               class="form-control verificar-email"/>

    </div>
</div>
<div class="col-xs-12">
    <h4  class="m-b-md m-t-md">Domicilio</h4>
</div>

<div class="col-sm-6">
    <div class="form-group">

        <label>País Domicilio</label>

        <paissearh 
            v-bind:pais="docente.persona.paisDomicilio"
            v-bind:nombre="'persona.paisDomicilio.id'"/>


    </div>
</div>

<div v-if="docente.persona.paisDomicilio.codigo=='PE'"    class="col-sm-6">
    <div class="form-group">

        <label>Ubicación Domicilio</label>

        <ubicacionsearch 
            v-bind:ubicacion="docente.persona.ubicacionDomicilio"
            v-bind:nombre="'persona.ubicacionDomicilio.id'"/>

    </div>
</div>

<div class="col-sm-6">
    <div class="form-group">

        <label>Dirección</label>

        <input type="text"
               class="form-control"
               name="persona.direccion"
               v-model="docente.persona.direccion"
               data-trigger="change" required="true" />

    </div>
</div>

<div class="panel-footer col-md-12 text-center">
    <button type="button" class="btn btn-success"  v-on:click.prevent="submitForm">Guardar</button>
</div>
