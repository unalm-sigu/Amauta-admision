<html layout:decorator="_layout/layout">
    <head>
        <title>Configurar Cuotas por Anexo</title>
        <style>
            .circle-recorrido {
                display: block;
                border-radius: 50%;
                width: 50px;
                height: 50px;
                overflow: hidden;
                margin: 0 auto;
                line-height: 50px;  
                /*                text-align: center;*/
                font-size: 16px;
                /*                margin-left: 49px;*/
                text-indent: 0;
                vertical-align: middle;
                margin-top: 2px;
                margin-bottom: 2px;
            }

            .circle-recorrido.bgr-success {
                background-color: #2ECC71;
                color: #fff;
            }

            .circle-recorrido.bgr-danger {
                background-color: #E74C3C;
                color: #fff;
            }

            .circle-recorrido.bgr-warning {
                background-color: #F1B41E;
                color: #fff;
            }

            .circle-recorrido.bgr-black {
                background-color: #3C4043;
                color: #fff;
            }

            .circle-recorrido.bgr-default {
                background-color: #979595;
                color: #fff;
            }
        </style>
    </head>

    <body>
        <div layout:fragment="main">
            <div id="cuotagpohorasVUE">
                <header class="header b-b padder-lg">

                    <div class="pull-right m-t-md">                 
                        <div class="btn-group">
                            <a type="button" class="btn btn-success" v-on:click="verNuevoAnexo()">Configurar Cuotas</a>
                        </div>
                    </div> 
                    <h2 th:text="|Configurar Cuotas por Anexo ${ciclo.descripcion}|">Configurar Cuotas por Anexo</h2>
                </header>

                <section class="wrapper-lg">
                    <section class="panel">
                        <section class="panel-body">

                            <div slot="header">

                                <div class="col-md-6">
                                    <multiselect v-model='anexoGrid'                                             
                                                 label="nombre"
                                                 placeholder="Seleccione un Anexo"
                                                 track-by="id"
                                                 v-bind:allow-empty="false"
                                                 v-bind:options="anexos"
                                                 deselect-label=""
                                                 select-label="Seleccione este anexo"
                                                 v-on:input="changeAnexoMain">
                                    </multiselect>
                                </div>

                            </div>


                            <raptor-table v-bind:url="cuotagpohorasURL" v-bind:pagination="pagination" v-bind:searcher="false" v-bind:paginate="false"  v-bind:preload="false" ref="raptorCuotaGpoHoras" >

                                <template  scope="props" >
                                    <table class="table table-striped">
                                        <thead> 
                                            <tr> 
                                                <th class="col-md-4 v-middle">Anexo</th>
                                                <th class="col-md-1 text-center v-middle">Letra</th>
                                                <th class="col-md-1 text-center v-middle">Cuota</th>
                                                <th class="col-md-1 text-center v-middle">Utilizados</th>
                                                <th class="col-md-1 text-center v-middle">Horas Utilizadas</th>
                                                <th class="col-md-4 v-middle">Cantidad Grupos</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr v-for="item in props.data">
                                                <td class="v-middle text-primary h5">
                                                    {{item.anexoBoletin.nombre}}
                                                </td>
                                                <td class="v-middle text-center h3"> 
                                                    <div class="circle-recorrido bgr-black">{{item.grupoHoras.codigo}}</div>
                                                </td>
                                                <td class="v-middle text-center"> 
                                                    <div class="circle-recorrido bgr-default">{{item.cuotas}}</div>
                                                </td>
                                                <td class="v-middle text-center pointer"> 
                                                    <div v-if="item.horasUtilizadas > item.cuotas"
                                                         class="circle-recorrido bgr-danger">{{item.horasUtilizadas}}</div>
                                                    <div v-else-if="item.horasUtilizadas == item.cuotas"
                                                         class="circle-recorrido bgr-success">{{item.horasUtilizadas}}</div>
                                                    <div v-else="" class="circle-recorrido bgr-warning">{{item.horasUtilizadas}}</div>
                                                </td>
                                                <td class="v-middle text-center"> 
                                                    <div class="circle-recorrido bgr-default">{{item.gruposUtilizados}}</div>
                                                </td>   
                                                <td class="v-middle"> 
                                                    {{item.detalleGrupos}}
                                                </td>   
                                            </tr>
                                        </tbody>
                                    </table>
                                </template>
                            </raptor-table>

                        </section>
                    </section>
                </section>
                <modal-vik ref="modalConfirmar"
                           v-bind="confirmarModal"
                           v-bind:okaction="verGuardar"
                           showaccept="true">
                    <div slot="body">                                                
                        <div class="form-group">
                            <label>Anexos</label>                            
                            <multiselect v-model='anexoTempo'                                             
                                         label="nombre"
                                         placeholder="Seleccione un Anexo"
                                         track-by="id"
                                         v-bind:allow-empty="false"
                                         v-bind:options="anexos"
                                         deselect-label=""
                                         select-label="Seleccione este anexo"
                                         v-on:input="verCuotasByAnexo">
                            </multiselect>
                        </div>


                        <form method="post" id="formGruposCuotas"   data-parsley-validate="true">
                            <h5>Grupos y Cuotas</h5>
                            <table class="table table-striped">
                                <thead> 
                                    <tr> 
                                        <th class="col-md-6 v-middle">Grupo</th>                                                                                                
                                        <th class="col-md-6 v-middle">Cuota</th>

                                    </tr>
                                </thead>
                                <tbody>
                                    <tr v-for="cuo in cuotas">                                           
                                        <td class="v-middle">
                                            {{cuo.grupoHoras.codigo}}
                                        </td>
                                        <td class="v-middle">
                                            <input required="" class="form-control" v-model="cuo.cuotas"/>
                                        </td>

                                    </tr>
                                </tbody>
                            </table>
                        </form>

                    </div>
                </modal-vik>

            </div>

        </div>

        <div layout:fragment="js">
            <div th:substituteby="_modules/vue-modal"/>
            <div th:substituteby="_modules/vue-raptor-table"></div>
            <script th:src="@{/app/academico/cuotagpohoras/cuotagpohoras.js}" charset="utf-8"></script>
        </div>

    </body>
</html>
