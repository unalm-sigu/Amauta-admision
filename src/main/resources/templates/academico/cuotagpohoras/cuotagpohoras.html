<html layout:decorator="_layout/layout">
    <head>
        <title>Cuotas Grupos</title>
        <style>
            .td-vacio {
                padding-right: 4px !important;
                padding-left: 4px !important;
            }
            .bg-row {
                background-color: #f9fafc;
            }
            .row{
                margin-bottom: 15px;
            }

        </style>
    </head>

    <body>
        <div layout:fragment="main">
            <div id="" >

                <header class="header b-b padder-lg">

                    <div class="pull-right m-t-md">                 
                        <div class="btn-group">
                            <a type="button" class="btn btn-success nuevo-grupo-sec" 
                               th:href="@{/academico/cuotagpohoras}">
                                Agregar Cuota
                            </a>
                        </div>
                    </div> 
                    <h2 th:text="|Cuotas Grupos ${ciclo.descripcion}|">Cuotas Grupos</h2>
                </header>
                <section class="wrapper-lg">
                    <section class="panel">
                        <section class="panel-body">


                            <raptor-table v-bind:url="cuotagpohorasURL" ref="raptorCuotaGpoHoras">

                                <template  scope="props" >
                                    <table class="table table-striped">
                                        <thead> 
                                            <tr> 
                                                <th class="col-md-4">Anexo</th>
                                                <th class="col-md-2">Grupo</th>
                                                <th class="col-md-2">Cuota</th>
                                                <th class="col-md-2">Asig Auto</th>
                                                <th class="col-md-2">Total</th>
                                                <th></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr v-for="item in props.data">
                                                <td>
                                                </td>
                                                <td>
                                                </td>
                                                <td>
                                                </td>
                                                <td>
                                                </td>
                                                
                                                <td class="v-middle">
                                                    <div class="actions">
                                                        <a class="dropdown-toggle pointer" href="#" data-toggle="dropdown"> <i class="fa fa-ellipsis-v fa-lg"> </i></a>

                                                        <ul class="dropdown-menu pull-right" >
                                                            <li role="presentation"><a class="btn-link" v-on:click="editar(item)">Editar</a></li>
                                                            <li role="presentation">
                                                                <a class="btn-link estado" href="#">Desactivar</a>
                                                            </li>
                                                            <li role="presentation" class="divider"></li>
                                                            <li role="presentation"><a class="btn-link" >Editar</a></li>

                                                        </ul>

                                                    </div>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </template>
                            </raptor-table>

                        </section>
                    </section>
                </section>
                
            </div>
            <div th:substituteby="_modules/vue-modal"/>
        </div>

        <div layout:fragment="js">
            <div th:substituteby="_modules/vue-raptor-table"></div>
            <script th:src="@{/phobos/modules/vue-modal.js}" charset="utf-8"></script>
            <script th:src="@{/app/academico/cuotagpohoras/cuotagpohoras.js}" charset="utf-8"></script>
        </div>
    </body>
</html>
