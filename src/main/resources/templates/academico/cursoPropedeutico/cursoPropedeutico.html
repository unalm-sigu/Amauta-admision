<html layout:decorator="_layout/layout">
    <head>
        <title>Cursos Propedeútico</title>
    </head>

    <body>
        <section layout:fragment="main">

            <div id="main" v-cloak="">

                <header class="header b-b padder-lg">

                    <div class="pull-right m-t-md">                 
                        <div class="btn-group">
                            <a type="button" class="btn btn-success" v-on:click="openModal()" >Nuevo</a>
                        </div>
                    </div> 
                    <h2>Cursos Propedeútico</h2>
                </header>

                <section class="wrapper-lg">
                    <section class="panel">
                        <section class="panel-body">
              
                                <raptor-table v-bind:url="alumnoCurosURL"  ref="load">
                                    <template scope="props" >
                                        <table class="table table-striped table-hover">
                                            <thead> 
                                                <tr>
                                                    <th class="col-lg-4">Curso</th>
                                                    <th class="col-lg-3 text-center">Alumno</th>
                                                    <th class="col-lg-3 text-center">Estado</th>
                                                    <th></th>
                                                </tr> 
                                            </thead>
                                            <tbody>
                                                <tr v-for="item in  props.data">
                                                    <td  class="col-lg-4">
                                                        <div class="pull-left">
                                                            <div >
                                                                {{item.seccion.grupoSeccion.curso.nombre}}
                                                            </div>
                                                            <span  class="block text-primary bold h5 m-b-xs m-t-xs" >
                                                                {{item.seccion.codigo2}}
                                                            </span>
                                                        </div>
                                                    </td>
                                                    <td class="col-lg-3 text-center">

                                                        <span  class="block text-primary bold h5 m-b-xs m-t-xs" >
                                                            {{item.matriculaResumen.alumno.persona.nombreCompleto}}
                                                        </span>
                                                        <span>  {{item.matriculaResumen.alumno.codigo}}</span>
                                                        <span>  {{item.matriculaResumen.alumno.persona.tipoDocumento.simbolo}} -  {{item.matriculaResumen.alumno.persona.numeroDocIdentidad}}</span>

                                                    </td>
                                                    <td class="col-lg-3 text-center">
                                                        <span v-if="item.estado=='ACT'" class="bold label label-primary">
                                                            Activo
                                                        </span>
                                                        <span v-if="item.estado=='INA'" class="bold label label-danger">
                                                            Inactivo
                                                        </span>
                                                    </td>
                                                    <td class="v-middle"> 
                                                        <div class="dropdown actions">
                                                            <a class="dropdown-toggle" data-toggle="dropdown">
                                                                <i class="fa fa-cog"></i>
                                                            </a> 
                                                            <ul class="dropdown-menu pull-right pointer">
                                                                <li><a v-on:click="removerDeuda(item)">Remover Deuda</a></li>
                                                            </ul>
                                                        </div>
                                                    </td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </template>
                                </raptor-table>
               
                        </section>
                    </section>
                </section>

                <div th:substituteby="academico/cursoPropedeutico/cursoPropedeuticoModal"/>

            </div>
        </section>

        <div layout:fragment="js" th:remove="tag">
            <div th:substituteby="_modules/vue-raptor-table"></div>
            <script th:src="@{/app/academico/cursoPropedeutico/cursoPropedeutico.js}" charset="utf-8"></script>
        </div>

    </body>
</html>
