<html layout:decorator="_layout/layout">
    <head>
        <title>Cursos Propedeútico</title>
    </head>

    <body>
        <section layout:fragment="main">

            <div id="propedeuticoVUE" v-cloak="">
                <header class="header b-b padder-lg">

                    <div class="pull-right m-t-md">                 
                        <div class="btn-group">
                            <a type="button" class="btn btn-success" v-on:click="openModal()" >Nuevo</a>
                        </div>
                    </div> 
                    <h2>Cursos Propedeútico</h2>
                </header>
                <section class="panel">
                    <!--                    <div class="form-group col-md-6">
                                            <label>Curso Electivo</label>
                                            <multiselect v-model='cursocurricula'
                                                         v-bind:options='cursoscurriculas'
                                                         v-bind:allow-empty="false"
                                                         placeholder="Ingresa un caracter como mínimo"
                                                         deselect-label=""
                                                         :custom-label="customlabel"
                                                         track-by="id"
                                                         :internal-search="true"
                                                         select-label="Seleccione un curso">
                                                <template slot="option" slot-scope="props">
                                                    <span class="block bold" v-text="props.option.curso.nombre"></span>
                                                    <small class="block" v-text=" props.option.curso.codigo"></small>
                                                </template>
                                            </multiselect>
                                            <input type="text" required="" class="hide" v-model="cursocurricula.id" data-trigger="change"/>
                                        </div>-->
                    <section class="panel-body">
                        <div class="col-md-12">
                            <raptor-table v-bind:url="alumnoCurosURL"  ref="load">

                                <template scope="props" >

                                    <table class="table table-striped table-hover">
                                        <thead> 
                                            <tr>
                                                <th class="col-lg-4">Curso</th>
                                                <th class="col-lg-3 text-center">Alumno</th>
                                                <th class="col-lg-3 text-center">Estado</th>
                                                <th class="col-lg-3 text-center">Boletas</th>
                                                <th></th>
                                            </tr> 
                                        </thead>
                                        <tbody>
                                            <tr v-for="item in  props.data">
                                                <td  class="col-lg-4">
                                                    <div class="pull-left">
                                                        <div >
                                                            {{item.seccion.grupoSeccion.curso.nombre}}
                                                        </div>
                                                    </div>
                                                </td>
                                                <td class="col-lg-3 text-center">
                                                    <span  class="block text-primary bold h5 m-b-xs m-t-xs" >
                                                        {{item.matriculaResumen.alumno.persona.nombreCompleto}}
                                                    </span>
                                                    <span>  {{item.matriculaResumen.alumno.codigo}}</span>
                                                    <span>  {{item.matriculaResumen.alumno.persona.tipoDocumento.simbolo}} -  {{item.matriculaResumen.alumno.persona.numeroDocIdentidad}}</span>

                                                </td>
                                                <td class="col-lg-3 text-center">
                                                    <span class="block text-info bold">{{item.estado}} </span>

                                                </td>
                                                <td class="v-middle"> 
                                                    <div class="dropdown actions">
                                                        <a class="dropdown-toggle" data-toggle="dropdown">
                                                            <i class="fa fa-cog"></i>
                                                        </a> 
                                                        <ul class="dropdown-menu pull-right pointer">
                                                            <li><a v-on:click="habilitar(item)">Habilitar</a></li>
                                                            <!--<li><a v-on:click="noCumpleRequisitos(item)">No cumple requsito</a></li>-->
                                                        </ul>
                                                    </div>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </template>
                            </raptor-table >

                        </div>
                    </section>
                </section>
                <div th:substituteby="academico/cursoPropedeutico/cursoPropedeuticoModal"/>
            </div>
        </section>

        <div layout:fragment="js" th:remove="tag">

            <div th:substituteby="_modules/vue-raptor-table"></div>
            <script th:src="@{/app/academico/cursoPropedeutico/cursoPropedeutico.js}" charset="utf-8"></script>
        </div>

    </body>
</html>
