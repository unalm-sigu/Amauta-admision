<html layout:decorator="_layout/layout">
    <head>
        <title>Tipo Grupos</title>
        <!--<div th:substituteby="_layout/includes :: styles-dynatable"></div>-->
    </head>

    <body>
        <div layout:fragment="main">
            <div id="tipoGrupoVUE" v-cloak="">

                <header class="header b-b padder-lg">

                    <div class="pull-right m-t-md">                 
                        <a class="btn btn-success" type="button" v-on:click="verNuevo">Nuevo</a>
                    </div>  

                    <h2>Tipo de Grupos Horarios</h2>

                </header>

                <section class="wrapper-lg">
                    <section class="panel">
                        <section class="panel-body">

                            <raptor-table v-bind:url="tipoGrupoURL" ref="raptorTipoGpos">
                                <template scope="props" >

                                    <div class="col-lg-3 col-md-4 col-sm-6 col-xs-12" style="height: 160px;"
                                         v-for="item in props.data">
                                        <div class="list-group">

                                            <div href="#" class="list-group-item item " style="min-height: 140px;border-color: #2c3e50;"
                                                 >

                                                <div class="dropdown actions pull-right">

                                                    <a class="dropdown-toggle text-muted" href="#" data-toggle="dropdown">
                                                        <i class="fa fa-cog" aria-hidden="true"></i>
                                                    </a>

                                                    <ul class="dropdown-menu pull-right" aria-labelledby="dropdownMenu1" role="menu">
                                                        <li role="presentation"
                                                            v-if="item.estado != 'INA' ">
                                                            <a class="btn-link editar" v-on:click="verEditar(item)" >Editar</a>
                                                        </li>

                                                        <li role="presentation"
                                                            v-if="item.estado == 'CRE' ">
                                                            <a class="btn-link estado" v-on:click="changeEstado(item)" >Activar</a>
                                                        </li>

                                                        <li role="presentation"
                                                            v-if="item.estado == 'INA' ">
                                                            <a class="btn-link estado" v-on:click="changeEstado(item)" >Activar</a>
                                                        </li>

                                                        <li role="presentation"
                                                            v-if="item.estado == 'ACT' ">
                                                            <a class="btn-link estado" v-on:click="changeEstado(item)" >Desactivar</a>
                                                        </li>

                                                        <li role="presentation" class="divider"></li>
                                                        <li role="presentation">
                                                            <a class="btn-link eliminar" v-on:click="eliminar(item)">Eliminar</a>
                                                        </li>
                                                    </ul>

                                                </div>

                                                <div class="m-t-sm  pointer opengroup" 
                                                     v-on:click="goGrupos(item)">

                                                    <h4 class="list-group-item-heading" > GRUPO {{item.tipo}}  {{item.codigo}}  </h4>
                                                    <h6 class="list-group-item-heading" ><b>Descripción:</b> {{item.descripcion}}</h6>
                                                    <h6 class="list-group-item-heading" ><b>Grupo:</b> {{item.estadoGruposEnum.value}}</h6>
                                                    <!--<h6 class="list-group-item-heading" ><b>Tipo Ciclo:</b> {{item.tipoCicloEnum.value}}</h6>-->

                                                    <label class="label" v-bind:class="getLabelEstado(item)">{{item.estadoEnum.value}}</label>

                                                </div>

                                            </div>
                                        </div>
                                    </div>

                                </template>
                            </raptor-table>
                        </section>
                    </section>
                </section>

                <!--            <script id="tipoGrupoTemplate" type="text/x-jsrender" class="hide">
                                <div th:substituteby="academico/horario/tipo/tipoGrupoTemplate"></div>
                            </script>-->

                <modal-vik ref="refTipoGrupo"
                           v-bind="tipoGrupoModal" 
                           v-bind:okaction="saveTipoGrupo">
                    <div slot="body">


                        <form method="post" id="formTipoGrupo" class="form-horizontal" data-parsley-validate="true">

                            <div class="form-group">

                                <label class="col-sm-3 control-label" >Descripción</label>
                                <div class="col-sm-8">
                                    <input  type="text" 
                                            name="codigo" 
                                            v-model="tipoGrupoHoras.descripcion"
                                            required='true'
                                            maxlength="100"
                                            data-trigger="change"
                                            class="form-control"/>
                                </div>
                            </div>

<!--                            <div class="form-group">

                                <label class="col-sm-3 control-label">Tipo Ciclo</label>
                                <div class="col-sm-8">
                                    <multiselect v-model='tipoGrupoHoras.tipoCicloEnum'
                                                 v-bind:options='tiposCiclo'
                                                 v-bind:allow-empty="false"
                                                 label='value'
                                                 placeholder=""
                                                 deselect-label=""
                                                 select-label=""
                                                 track-by='name'>
                                    </multiselect>
                                    <input type="text" class="hide" v-model="tipoGrupoHoras.tipoCicloEnum" required=""/>
                                </div>

                            </div>-->

                            <div class="form-group">

                                <label class="col-sm-3 control-label">Con horarios</label>
                                <div class="col-sm-8">
                                    <label class="switch">
                                        <input type="checkbox" v-model="tipoGrupoHoras.tieneHoras" value="true"/> 
                                        <span></span> 
                                        <i></i>
                                    </label>
                                </div>

                            </div>
                        </form>

                    </div>
                </modal-vik>

            </div>
            <div th:substituteby="_modules/vue-modal"/>

        </div>


        <div layout:fragment="js">
            <script  th:inline="javascript" >
                /*<![CDATA[*/
                var tiposCicloJson = /*[[${tiposCicloJson}]]*/  '';
                /*]]>*/
            </script>
            <!--<div th:substituteby="_layout/includes :: javascript-dynatable"/>-->
            <div th:substituteby="_modules/vue-raptor-table"></div>
            <script type="text/javascript" th:src="@{/phobos/modules/vue-modal.js}"></script>
            <script th:src="@{/app/academico/horario/tipogrupo/tipogrupo.js}" charset="utf-8"></script>
        </div>

    </body>
</html>
