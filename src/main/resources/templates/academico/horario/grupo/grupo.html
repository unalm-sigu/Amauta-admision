<html layout:decorator="zlayout/layout">
    <head>
        <title>Lista de estudiantes</title>
    <div th:substituteby="zlayout/includes :: styles-dynatable"></div>
</head>

<body>
    <div layout:fragment="main">
        <header class="page-header">

            <h2><span th:text='|${curso.nombre} ${session["SESSION_USUARIO"].cicloAcademico.descripcion} - Lista de estudiantes |'>2016-II</span></h2>

        </header>

        <section class="panel">
            <section class="panel-body">
                <table class="table table-striped" id="dynaTable">
                    <thead> 
                        <tr>
                            <th class="text-center v-middle"></th>
                            <th class="text-center v-middle col-md-1"></th>
                            <th class="text-center v-middle col-md-7">Estudiante</th>
                            <th class="text-center v-middle col-md-4">Facultad<br/>Especialidad</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </section>

        </section>

        <div th:substituteby="templates/modal"/>
        <script id="templateAlumnosDocente" type="text/x-jsrender" class="hide"><div th:substituteby="academico/docente/alumnos/templateAlumnosDocente"/></script>
    </div>
        
    <div layout:fragment="js">
        <div th:substituteby="zlayout/includes :: javascript-dynatable"/>
        <script th:src="@{/app/academico/docente/alumnos/alumnosDocente.js}" charset="utf-8"></script>
    </div>

</body>
</html>
