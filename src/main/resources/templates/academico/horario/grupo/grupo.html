<html layout:decorator="_layout/layout">
    <head>
        <title>Grupos</title>
    <div th:substituteby="_layout/includes :: styles-bootstrap-colorpicker"></div>
</head>

<body>
    <div layout:fragment="main">

        <header class="header b-b padder-lg">

            <div class="pull-right m-t-md">                 
                <a class="btn btn-link" th:href="@{/academico/horario}" >Regresar</a>
                <a class="btn btn-primary" id="nuevo" href="#" >Nuevo</a>
            </div> 

            <h2 class="block" th:text="${'Horarios de grupo '+ ciclo}" >Grupos</h2> 
            <small th:text="${tipoGrupoHoras.codigo + ' GRUPO ' + tipoGrupoHoras.tipo}"></small>

        </header>

        <section class="panel">
            <section class="panel-body">

                <input type="hidden" name="idTipoGrupo" th:value="${tipoGrupoHoras.id}" />

                <div id="dynaTable"></div>

            </section>
            <section class="panel-body">

                <div id="tablaHorario"></div>

            </section>
        </section>

        <script id="grupoTemplate" type="text/x-jsrender" class="hide">
            <div th:substituteby="academico/horario/grupo/grupoTemplate"></div>
        </script>

        <script id="horarioTemplate" type="text/x-jsrender" class="hide">
            <div th:substituteby="academico/horario/grupo/horarioTemplate"></div>
        </script>

    </div>

    <div layout:fragment="js">
        <div th:substituteby="_layout/includes :: javascript-dynatable"/>
        <div th:substituteby="_layout/includes :: bootstrap-colorpicker"/>
        <script th:src="@{/app/academico/horario/grupo/grupo.js}" charset="utf-8"></script>
    </div>

</body>
</html>
