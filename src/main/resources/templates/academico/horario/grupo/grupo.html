<html layout:decorator="_layout/layout">
    <head>
        <title>Grupos</title>
        <style>
            table.table-letra {
                border-collapse:separate;
                border:solid #95a5a6 1px;
                border-radius:4px;
                -moz-border-radius:4px;
            }

            td.table-letra, th.table-letra {
                border-left:solid #95a5a6 1px;
                border-top:solid #95a5a6 1px;
            }

            th.table-letra {
                background-color: #95a5a6;
                border-top: none;
            }

            td.table-letra:first-child, th.table-letra:first-child {
                border-left: none;
            }
            .col-gpo-hide {
                width: 12.5% !important;
            }
            .gpo-regular-ok {
                border-color: #DFE7EE; 
                background-color: #FFFFFF;
                color: #3C7DE7 ;
            }
            .gpo-regular-cruce {
                border-color: #DFE7EE; 
                background-color: #FFFFFF;
                color: #E74C3C;
                font-weight: bold;
            }
            .dia-hora-busy {
                border-color: #600D63;
                background-color: #F5DE86;
                color: #000000;
                font-weight: bold;
            }
        </style>
        <!--<div th:substituteby="_layout/includes :: styles-bootstrap-colorpicker"></div>-->
    </head>

    <body>
        <div layout:fragment="main">
            <div id="grupoVUE">

                <header class="header b-b padder-lg">

                    <div class="btn-group pull-right">
                        <button type="button" class="btn btn-success btn-sm dropdown-toggle" data-toggle="dropdown">
                            <i class="fa fa-file-text-o"/> &nbsp; Acciones &nbsp; <span class="caret"></span>
                        </button>
                        <ul class="dropdown-menu">
                            <li><a v-on:click="clonarCiclo" class="pointer">Clonar</a></li>
                            <li><a v-on:click="nuevo" class="pointer">Nuevo</a></li>
                            <li><a v-on:click="verActivarGpos" class="pointer">Activar ocultos</a></li>
                        </ul>
                    </div>

                    <div class="pull-right m-t-sm m-r">
                        <a class="btn btn-default btn-sm" th:href="@{/academico/horario}" >Regresar</a>
                        <!--<a class="btn btn-primary" id="nuevo" href="#" >Nuevo</a>-->
                    </div> 

                    <h2 class="block" th:text="${'Horarios de grupo '+ ciclo}" >Grupos</h2> 
                    <small th:text="${tipoGrupoHoras.codigo + ' GRUPO ' + tipoGrupoHoras.tipo}"></small>

                </header>

                <section class="panel">
                    <section class="panel-body">

                        <input type="hidden" name="idTipoGrupo" th:value="${tipoGrupoHoras.id}" />

                        <raptor-table v-bind:url="grupoURL" v-bind:preload="false" v-bind:pagination="paginationGpo" ref="raptorGrupo">
                            <div slot="header">
                                <div class="col-md-1">

                                    <div class="form-group" title="Ordenar alfabéticamente" data-toggle="tooltip" data-placement="top">
                                        <label class="switch">
                                            <input type="checkbox" v-model="orderByLetra" value="1" autocomplete="off" /> 
                                            <span></span> 
                                            <i></i>
                                        </label>
                                    </div>

                                </div>
                                <div class="col-md-2">
                                    <div class="text-primary h4 m-t-xxs m-b-xxs">Ordenar por letra</div>
                                </div>
                            </div>
                            <template scope="props" >
                                <div class="col-sm-1 col-xs-1" 
                                     v-for="item in props.data">
                                    <div class="list-group">

                                        <div class="list-group-item item pointer" 
                                             style="min-height: 100px;border-width: 1px;"
                                             v-bind:style="styleBorder(item)">

                                            <div class="dropdown actions pull-right">

                                                <a class="dropdown-toggle text-muted pointer" data-toggle="dropdown">
                                                    <i class="fa fa-cog"></i>
                                                </a>

                                                <ul class="dropdown-menu pull-right" aria-labelledby="dropdownMenu" role="menu">
                                                    <li role="presentation">
                                                        <a class="pointer" v-on:click="verEditarGrupo(item)" >Editar</a>
                                                    </li>
                                                    <li role="presentation">
                                                        <a class="pointer" v-on:click="ocultar(item)" >Ocultar</a>
                                                    </li>
                                                    <li role="presentation">
                                                        <a class="pointer" v-on:click="eliminar(item)" >Eliminar</a>
                                                    </li>
                                                </ul>

                                            </div>

                                            <div class="m-t-sm pointer" v-on:click="verHorario(item)">
                                                <h4 class="list-group-item-heading" >{{item.codigo}}</h4>
                                                <h5 class="list-group-item-heading" >{{item.tipoSeccion}}/{{item.letra}}</h5>

                                                <h5 class="list-group-item-heading text-center m-t-md" >
                                                    <span class="label" v-bind:class="classHoras(item)"> {{item.horas}} horas </span>
                                                </h5>
                                            </div>

                                        </div>
                                    </div>
                                </div>
                            </template>
                        </raptor-table>

                    </section>

                    <section class="panel" v-if="grupoActivo.id != undefined ">
                        <section class="panel-body">


                            <div class="table-responsive">

                                <table class="table table-fixed">

                                    <thead>
                                        <tr>
                                            <th style="width: 12.5%" class="text-center">Hora</th>
                                            <th style="width: 12.5%" class="text-center" 
                                                v-for="dia in dias" v-text="dia.nombre" >
                                            </th>
                                        </tr>
                                    </thead>

                                    <tbody >
                                        <tr v-for="hora in horas">
                                            <td style="width: 12.5%" class="v-middle">
                                                <span 
                                                    class="form-control"
                                                    th:style="'border-color:#fff;'">
                                                    {{hora.descripcion}}
                                                </span>

                                            </td>
                                            <td v-for="dia in dias" style="width: 12.5%" 
                                                v-on:click="conterObjHdia(dia,hora) == null ? asignarHora(dia,hora) : desasignarHora(dia,hora)">
                                                <span v-bind:value="hora.id + '-' + dia.id" class="form-control pointer text-center"
                                                      v-bind:class="styleHdia(dia,hora)"
                                                      v-text="conteHdia(dia,hora)">
                                                    <!--span class="text-item-horario"
                                                       v-bind:style="styleConteHdia(dia,hora)"
                                                       v-text="conteHdia(dia,hora)">77</span-->
                                                </span>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>

                            </div>
                        </section>
                    </section>
                </section>

                <div th:substituteby="academico/horario/grupo/grupoModal"></div>
                <div th:substituteby="_modules/vue-modal-confirm"></div>

                <!--            <modal-vik ref="modalCloneCiclo"
                                       v-bind="dataCloneCiclo" 
                                       v-bind:okaction="saveCloneCiclo" > 
                                <div slot="body">
                
                                    <form data-parsley-validate="true" class="panel-body">
                
                                        <div class="col-xs-12">
                                            <div class="form-group">
                                                <label>Seleccione el ciclo académico de origen</label>
                                                <vuelect 
                                                    required="true"
                                                    v-bind:objetogenerico="ciclo"
                                                    v-bind:initobject="ciclo"
                                                    formatselection="descripcion2"
                                                    formatresult="descripcion2"
                                                    nameinput="ciclo.id"
                                                    remoteurl="comun/buscar/allCicloDescendent"
                                                    v-model="ciclo"/>
                                            </div>
                                        </div>
                                    </form>
                                </div>
                            </modal-vik>-->

            </div>
        </div>

        <div layout:fragment="js">
            <script  th:inline="javascript" >
                /*<![CDATA[*/
                var tipoGpoJson = /*[[${tipoGpoJson}]]*/  '';
                var diasJson = /*[[${diasJson}]]*/  '';
                var horasJson = /*[[${horasJson}]]*/  '';
                var horarioRegularJson = /*[[${horarioRegularJson}]]*/  '';
                var tipoHorariosJson = /*[[${tipoHorariosJson}]]*/  '';
                var rutaModulo = 'academico/horario/grupo';
                /*]]>*/
            </script>
            <div th:substituteby="_modules/vue-modal"/>
            <div th:substituteby="_modules/vue-raptor-table"></div>
            <script type="text/javascript" th:src="@{/phobos/modules/vuelect2.js}"></script>
            <div th:substituteby="_layout/includes :: bootstrap-colorpicker"/>
            <script th:src="@{/app/academico/horario/grupo/grupo.js}" charset="utf-8"></script>
        </div>

    </body>
</html>
