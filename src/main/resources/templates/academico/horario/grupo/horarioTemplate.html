<section class="panel">
    <section class="panel-body"  >
        <table class="table table-horario" >
            <thead>
                <tr>
                    <th style="width: 12.5%"></th>
                    <th style="width: 12.5%" th:each="dia : ${dias}" th:text="${dia.nombre}"> </th>
                </tr>
            </thead>
            <tbody class="table-horario-body">
                <tr th:each="hora : ${horas}"  th:inline="text">
                    <td> [[${hora.descripcion}]]</td>
                    <td th:each="dia : ${dias}">
                        <span class="asignar-hora pointer" th:rel="${hora.id}" th:rev="${dia.id}">
                            <h5 th:each="item:${diaHoraGrupos}" 
                                th:text="${item.grupoHorario.codigo}"
                                th:if="${hora.id==item.hora.id AND dia.id==item.dia.id }"></h5>
                        </span>
                    </td>
                </tr>
            </tbody>
        </table>
    </section>
</section>
