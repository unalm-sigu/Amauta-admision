 
<tr th:each="matSeccion : ${matriculasSeccion}" style="height: 50px;">

    <td class="text-center v-middle" th:each="evaluacion : ${evaluacionesByTipoSeccion}" th:style="${sistemaNotas.letras} ? 'width:50%' : ''">
        <span class="block form-inline">
            <span th:class="${evaluacion.tipoEvaluacion.codigo}+${evaluacion.numero}" >
                <span style="display: ''" 
                      th:name="${evaluacion.id}" 
                      th:class="${matSeccion.matriculaResumen.alumno.id}">
                    <span  th:if="${notas[matSeccion.matriculaResumen.alumno.id+'-'+evaluacion.id]}">
                        <span class="nota-academica" 
                              th:if="${notas[matSeccion.matriculaResumen.alumno.id+'-'+evaluacion.id].valorLetra}"
                              th:text="|(${notas[matSeccion.matriculaResumen.alumno.id+'-'+evaluacion.id].valorLetra})|"> 04.18 </span>

                        <span class="nota-academica" th:text="${notas[matSeccion.matriculaResumen.alumno.id+'-'+evaluacion.id].nota}"
                              th:unless="${curso.creditosZero}"
                              >
                            04.18 
                        </span>

                    </span>
                </span>
            </span>

            <span  th:class="${sistemaNotas.letras} ? 'form-inline col-md-12' : ''" th:title="${evaluacion.id}"> 
                <div th:class="${sistemaNotas.letras} ? 'form-group col-md-6' : ''">
                    <select class="clsCboLetraNota"  
                            th:title="${evaluacion.id}" 
                            th:name="${evaluacion.tipoEvaluacion.codigo}+${evaluacion.numero}" 
                            style="display: none; width:25x; padding: 3px !important;">
                        <option></option>
                        <option th:each="notaLet : ${sistemaNotas.notaLetra}" 
                                th:text="|${notaLet.letra} - ${notaLet.descripcion} |"
                                th:value="${notaLet.letra}"></option>
                    </select>
                </div>

                <div th:class="${sistemaNotas.letras} ? 'form-group col-md-6' : ''">
                    <input th:name="${evaluacion.tipoEvaluacion.codigo}+${evaluacion.numero}" 
                           th:unless="${notas[matSeccion.matriculaResumen.alumno.id+'-'+evaluacion.id]}"
                           th:rel="${matSeccion.matriculaResumen.alumno.id}"
                           th:title="${evaluacion.id}" 
                           type="text" 
                           class="form-control"
                           style="display: none; width:50px; padding: 3px !important;"
                           size="3"/>
                </div>
            </span>





        </span>
    </td>

    <td th:if="${sistemaNotas.letras}">
        <span th:text="${matriculaCursoMap[matSeccion.matriculaResumen.alumno.id].creditos}"
              > 
            04.18 
        </span>
    </td>

    <td class="text-center v-middle" th:if="${sistemaNotas.numerico}">

        <span  th:if="${matriculaCursoMap[matSeccion.matriculaResumen.alumno.id]}" >
            <span class="nota-academica" th:text="${matriculaCursoMap[matSeccion.matriculaResumen.alumno.id].notaAvance}" 
                  data-toggle="tooltip" 
                  th:title="${matriculaCursoMap[matSeccion.matriculaResumen.alumno.id].notaAvanceFull}"
                  > 
                04.18 
            </span>
        </span>

    </td>
    <td class="text-center v-middle" th:if="${sistemaNotas.numerico}">

        <span  th:if="${matriculaCursoMap[matSeccion.matriculaResumen.alumno.id]}" >
            <span class="nota-academica" 
                  th:text="${matriculaCursoMap[matSeccion.matriculaResumen.alumno.id].notaAcumulada}"
                  data-toggle="tooltip" 
                  th:title="${matriculaCursoMap[matSeccion.matriculaResumen.alumno.id].notaAcumuladaFull}"
                  > 
                04.18 
            </span>
        </span>

    </td>
    <td class="text-center v-middle">

        <span   th:if="${sistemaNotas.numerico}" >
            <span class="nota-academica" th:text="${matriculaCursoMap[matSeccion.matriculaResumen.alumno.id].notaFinal}" 
                  th:if="${matriculaCursoMap[matSeccion.matriculaResumen.alumno.id]}"
                  > 
                04.18 
            </span>
        </span>

    </td>
    <td class="text-center v-middle" th:unless="${grupoSeccion.estadoGrupoCerrado}">
        <div class="dropdown actions">
            <a class="dropdown-toggle" href="#" data-toggle="dropdown"><i class="glyphicon glyphicon-cog"></i></a>
            <ul class="dropdown-menu pull-right" >

                <li role="presentation">
                    <a class="solicitar-cambio-nota" 
                       title="false"
                       href="#"
                       th:rel="${matSeccion.id}">Cambio nota</a>
                </li>
                <li role="presentation">
                    <a class="solicitar-cambio-nota" 
                       title="true"
                       href="#"
                       th:rel="${matSeccion.id}">Cambio nota NSP</a>
                </li>

            </ul>
        </div>
    </td>
    <td class="v-middle headcolNumber">
        <!--<span class="block text-primary" th:text="${(itrStat.index+1) + ')'}"></span>-->
    </td>
    <td class="v-middle headcol">
        <span class="block text-primary" th:text="${matSeccion.matriculaResumen.alumno.persona.apellidosNombres}">Alvarez Perez Juan</span>
        <span class="block" th:text="${matSeccion.matriculaResumen.alumno.codigo}">Alvarez Perez Juan</span>
    </td>

</tr>
