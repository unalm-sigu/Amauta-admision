<html layout:decorator="zlayout/layout">
    <head>
        <title> Usuario </title>
    </head>
    <body>
        <section layout:fragment="main">

            <header class="page-header">                
                <a th:href="@{/academico/docente}" class="btn btn-default btn-sm pull-right">Regresar</a>

                <h2  id="nombreDocente" th:text="${ docente.persona.id!=null ? docente.persona.apellidosNombres : 'Nuevo Docente' }" >Nuevo Docente</h2> 

            </header>

            <section class="panel">

                <section class="panel-body bg-white b">


                    <form th:action="@{/academico/docente/save}" method="post"  class="form-horizontal m-t-lg" data-parsley-validate="true">

                        <input type="hidden" name="persona.id" id="personaId"  th:value="${docente.persona}? ${docente.persona.id}"/>
                        <input type="hidden" name="id" id="personaId" th:value="${docente.id}"/>

                        <div class="form-group">

                            <label for="docIdentidad" class="col-sm-2 control-label">N° documento</label>

                            <div class="col-sm-4">
                                <select name="persona.tipoDocumento.id" 
                                        required="true" 
                                        class="form-control select2single buscar-persona" >
                                    <option></option>
                                    <option th:each="item : ${documentos}"  
                                            th:text="${item.nombre}"
                                            th:selected="${docente.persona.tipoDocumento!=null} ? ${docente.persona.tipoDocumento.id==item.id}"
                                            th:value="${item.id}" ></option>
                                </select>
                            </div>

                            <div class="col-sm-3">

                                <input  type="text" 
                                        class="inline numeric form-control sin-espacios" 
                                        required="true" 
                                        name="persona.numeroDocIdentidad" 
                                        th:value="${docente.persona!=null} ? ${docente.persona.numeroDocIdentidad}"/>

                            </div>

                        </div>

                        <div id='formPersona'>

                        </div> 


                        <div class="form-group">

                            <label class="col-sm-2 control-label" >Departamento Académico</label>
                            <div class="col-sm-4">
                                <input  type="text" 
                                        name="departamentoAcademico.id" 
                                        th:value="${docente.departamentoAcademico!=null?docente.departamentoAcademico.id:''}"
                                        th:rel="${docente.departamentoAcademico!=null?docente.departamentoAcademico.nombre:''}"
                                        th:rev="${docente.departamentoAcademico!=null?docente.departamentoAcademico.codigo:''}"
                                        required='true'
                                        data-trigger="change"
                                        class="form-control"/>
                            </div>
                        </div>


                        <div class="form-group">

                            <label for="" class="col-sm-2 control-label">Modalidad de Estudio</label>

                            <div class="col-sm-4">
                                <select name="modalidadEstudio.id" 
                                        required="true" 
                                        class="form-control select2single buscar-persona" >
                                    <option></option>
                                    <option th:each="item : ${modalidades}"  
                                            th:text="${item.nombre}"
                                            th:selected="${docente.modalidadEstudio!=null} ? ${docente.modalidadEstudio.id==item.id}"
                                            th:value="${item.id}" ></option>
                                </select>
                            </div>

                        </div>

                        <div class="form-group m-t-xxlg">
                            <label class="col-sm-2 control-label"></label>
                            <div id="footerUsuario" class="col-sm-10">
                                <a class="btn btn-primary" th:text="${docente.id!=null?'Actualizar':'Guardar'}" id="btnSavePersona">Guardar</a>                                        
                                <a th:href="@{/academico/docente}" class="btn btn-link" >Cancelar</a>
                            </div>
                        </div>

                    </form>

                    <script id="docentePersonaTemplate" type="text/x-jsrender" class="hide" >
                        <div th:substituteby="academico/docente/docente/docentePersonaTemplate"/>
                    </script>


                </section>

            </section>

        </section>

        <div layout:fragment="js">
            <script type="text/javascript" th:src="@{/phobos/js/wizard/jquery.bootstrap.wizard.js}"/>  
            <script th:src="@{/app/academico/docente/docente/docenteForm.js}" charset="utf-8"></script>
        </div>

    </body>
</html>
