<html layout:decorator="_layout/layout">
    <head>
        <title>Graduados y Titulados</title>
    </head>
    <body>
        <div layout:fragment="main">
            <div id="graduadosVUE" v-cloak="">
                <header class="header b-b padder-lg">
                    <h2>Graduados y Titulados</h2>
                </header>
                <section class="wrapper-lg">
                    <section class="panel m-b-md">
                        <section class="panel-body">

                            <div class="row">
                                <div class="col-md-12">

                                    <div v-for="index in [...Array(4).keys()]" 
                                         class="col-md-3 text-center" 
                                         v-bind:class="{'bg-light':index==seleccionado}">
                                        <a v-on:click="verTipoGrado(index,resumen[index][0])" 
                                           class="pointer" 
                                           v-bind:class="bgColorClass[index]" >
                                            <span class="h1 block bold" v-text="resumen[index][1]">23</span>
                                            <small class="block m-b-xs" 
                                                   v-text="textoResumen[resumen[index][0]]">Pregrado
                                            </small>
                                        </a>
                                    </div>

                                </div>
                            </div>
                        </section>
                    </section>

                    <section class="panel">
                        <section class="panel-body">
                            <raptor-table v-bind:url="rutaGraduados" ref="raptorGraduados">
                                <div slot="header"></div>

                                <template scope="props" >
                                    <table class="table table-striped table-hover">
                                        <thead> 
                                            <tr>
                                                <th class="col-md-4" colspan="2"></th>
                                                <th class="col-md-3 v-middle">Grado / Título</th>
                                                <th class="col-md-3 v-middle">Resolución</th>
                                                <th class="col-md-1 text-center v-middle">Ciclo</th>
                                                <th class="col-md-1 text-center v-middle">Estado</th>
                                                <th></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr v-for="item in props.data">

                                                <td class="v-middle">
                                                    <div class="pull-left">
                                                        <div v-if="item.alumno.persona.tipoFoto=='POSTUL' "
                                                             class="img-responsive img-thumbnail img-circle div-foto-list">
                                                            <img class="img-foto-list" v-bind:src="item.alumno.persona.rutaFoto" />
                                                        </div>
                                                        <img v-else-if="item.alumno.persona.tipoFoto=='COMUN' " 
                                                             class="img-responsive img-thumbnail img-circle div-foto-alumno-list" 
                                                             v-bind:src="item.alumno.persona.rutaFoto" />
                                                        <img v-else="" 
                                                             class="img-foto-tempo img-responsive img-thumbnail img-circle" 
                                                             v-bind:src="item.alumno.persona.rutaFoto" />
                                                    </div>
                                                </td>

                                                <td class="v-middle">
                                                    <a href="#" class="block text-primary bold h5 m-b-xs m-t-xs" >
                                                        {{item.alumno.persona.apellidosNombres}}
                                                    </a>
                                                    <span class="block">
                                                        Matrícula: {{item.alumno.codigo}}
                                                    </span>
                                                    <small v-if="item.alumno.persona.numeroDocIdentidad != '' " class="block bold">
                                                        {{item.alumno.persona.tipoDocumento.simbolo}} {{item.alumno.persona.numeroDocIdentidad}}
                                                    </small>
                                                </td>

                                                <td class="v-middle">
                                                    <span class="block text-dark h4 m-t-xxs m-b-xxs">{{item.gradoAcademico.nombre}}</span>
                                                </td>

                                                <td class="v-middle">
                                                    <div v-if="item.resolucion">
                                                        <span class="block">
                                                            {{item.resolucion.descripcion}}
                                                        </span>
                                                        <div v-if="item.resolucion.rutaUrl" class="block">
                                                            <a v-bind:href="item.resolucion.rutaUrl" target="_blank" >
                                                                <i class="fa fa-file-pdf-o text-danger"></i>
                                                                Ver documento
                                                            </a>
                                                        </div>
                                                    </div>
                                                </td>

                                                <td class="v-middle text-center">
                                                    <span class="block">{{item.cicloAcademico.descripcion}}</span>
                                                </td>

                                                <td class="v-middle text-center">
                                                    <span v-bind:class="classEstado(item.estadoTramite)" class="block bold">
                                                        {{item.estadoTramite.nombre}}
                                                    </span>
                                                </td>

                                                <td class="v-middle">
                                                    <div class="actions" v-if="item.estadoTramite.codigo === 'ACEP' || item.estadoTramite.codigo === 'PEND'">

                                                        <a class="dropdown-toggle" href="#" data-toggle="dropdown"><i class="fa fa-cog"></i></a>

                                                        <ul class="dropdown-menu pull-right">

                                                            <li  th:if="${isDeveloper}"><a  v-on:click.prevent="forzarSituacionEgresado(item)" href="#">Forzar Situación Egresado</a></li>

                                                            <li role="presentation" class="divider"></li>

                                                            <li ><a href="#"  v-on:click.prevent="anularTramite(item)">Anular grado</a></li>

                                                        </ul>

                                                    </div>
                                                </td>

                                            </tr>
                                        </tbody>
                                    </table>
                                </template>
                            </raptor-table>
                        </section>
                    </section>
                </section>
            </div>
        </div>
        <div layout:fragment="js">
            <script  th:inline="javascript" >
                /*<![CDATA[*/
                var rutaModulo = /*[[${rutaModulo}]]*/ '';
                /*]]>*/
            </script>

            <div th:replace="_modules/vue-modal"></div>
            <div th:substituteby="_modules/vue-raptor-table"></div>
            <script th:src="@{/app/academico/graduado/graduado.js}" charset="utf-8"></script>
        </div>
    </body>

</html>
