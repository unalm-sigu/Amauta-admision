<html layout:decorator="_layout/layout">
<head>
    <title>Detalle Programacion</title>
    <div th:replace="_layout/includes :: styles-dynatable"></div>
</head>

<body>
<div layout:fragment="main">
    <header class="page-header">
        <h2 class="page-title"><span th:text="${departamentoAcademico.nombre}">Matematicas</span>: <span class="ciclo-badge" th:text="${cicloAcademico.descripcion}">2016-II</span></h2>
        <input id="txtDepartamentoAcademico" type="hidden" th:value="${departamentoAcademico.id}"/>
    </header>
    <section class="wrapper-lg">
        <section class="panel m-b-md">
            <section class="panel-body">
                <div class="col-md-12" >
                    <div class="row">
                        <div class="col-md-2 text-center">
                            <a class="ver-modalidades text-danger pointer" value="1" rel="ABI" >
                                <span class="h1 block bold" >14</span>
                                <small class="block m-b-xs">Activos</small>
                            </a>
                        </div>
                        <div class="col-md-2 text-center">
                            <a class="ver-modalidades text-black pointer" value="2" rel="CER" >
<!--                                <span class="h1 block bold" th:text="${resumen.cerrado}"></span>-->
                                <small class="block m-b-xs">Bloqueados</small>
                            </a>
                        </div>
                        <div class="col-md-2 text-center">
                            <a class="ver-modalidades text-success pointer" value="3" rel="pregrado" >
<!--                                <span class="h1 block bold" th:text="${resumen.pregrado}"></span>-->
                                <small class="block m-b-xs">Cancelados</small>
                            </a>
                        </div>
                        <div class="col-md-2 text-center">
                            <a class="ver-modalidades text-warning pointer" value="4" rel="posgrado">
<!--                                <span class="h1 block bold" th:text="${resumen.posgrado}" ></span>-->
                                <small class="block m-b-xs">Anulados</small>
                            </a>
                        </div>
                        <div class="col-md-2 text-center">
                            <a class="ver-modalidades text-warning pointer" value="4" rel="posgrado">
                                <!--                                <span class="h1 block bold" th:text="${resumen.posgrado}" ></span>-->
                                <small class="block m-b-xs">Fusionados</small>
                            </a>
                        </div>
                    </div>
                </div>
            </section>
        </section>
    </section>

    <section class="panel">
        <section class="panel-body">
            <table class="table table-striped" id="dynaTable">
                <thead>
                <tr class="">
                    <th class="col-md-4 text-center v-middle">Curso</th>
                    <th class="col-md-2 text-center v-middle">Seeccion</th>
                    <th class="col-md-2 text-center v-middle">Docente Principal</th>
                    <th class="col-md-1 text-center v-middle">Versión Acta</th>
                    <th class="col-md-1 text-center v-middle">Estado Sistema Calificación</th>
                    <th class="col-md-1 text-center v-middle">Estado Acta</th>
                    <th class="col-md-1 text-center v-middle">Estado</th>
                    <th class=""></th>
                </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </section>
    </section>
    <script id="templateGrupos" type="text/x-template">
        <tr rel="{{:index}}">
            <td class="text-left v-middle">
                <a href="/academico/gposeccion/{{:idGrupo}}/editar" class="block text-primary h4 m-t-xxs">
                    {{:nombreCurso}}
                </a>
                <span class="block"><b>{{:codigo}}</b> &nbsp; <i class="fa fa-bookmark-o"></i> {{:estructura}}</span>
                <input type="hidden" value="{{:idGrupo}}"/>
            </td>

            <td class="text-center v-middle">
                {{:secciones}}
            </td>

            <td class="v-middle">
                <span class="block bold">{{:docenteNombre}}</span>
                <small class="block text-primary">{{:emailDocente}}</small>
            </td>
            <td class="text-center v-middle">
                <span class="block h3 text-success">{{:version}}</span>
            </td>

            <td class="text-center v-middle">
                <span class=" label label-{{:colorEstadoPlan}}">{{:estadoPlanValue}}</span>
            </td>
            <td class="text-center v-middle">
                <span class=" label label-{{:colorEstadoGrupo}}">{{:estadoGrupoValue}}</span>
                {{if fechaCierreActa}}
                <span>{{:fechaCierreActa}}</span>
                {{/if}}
            </td>
            <td class="text-center v-middle">
                <span class=" label label-{{:colorEstado}}">{{:estadoValue}}</span>
            </td>
            <td class="v-middle">
                <div th:if="${esOperadorEditor}">


                    <div class="dropdown actions">
                        <a class="dropdown-toggle" href="#" data-toggle="dropdown"><i class="fa fa-cog"></i></a>

                        <ul class="dropdown-menu pull-right" >

                            <li role="presentation">
                                <a class="reenviarActa" rel="{{:idGrupo}}" href="#">Reenviar Acta</a>
                            </li>

                            {{if secciones!=""}}
                            <li role="presentation">
                                <a class="reporteActa" rel="{{:seccion}}" href="#">Reporte de Actas</a>
                            </li>
                            {{/if}}
                            {{if estadoGrupoCerrado==true}}
                            {{if estadoPlanAceptado==true}}
                            <li role="presentation">
                                <a class="reabrir" rel="{{:idGrupo}}" href="#">Reabrir</a>
                            </li>
                            {{/if}}
                            {{/if}}
                        </ul>
                    </div>

                </div>

                <!--<div th:if="${isRevisorActaNotas}">-->
                <div class="dropdown actions">
                    <a class="dropdown-toggle" href="#" data-toggle="dropdown"><i class="fa fa-cog"></i></a>

                    <ul class="dropdown-menu pull-right" >
                        {{if secciones!=""}}
                        <li role="presentation">
                            <a class="reporteActa" rel="{{:seccion}}" href="#">Reporte de Actas</a>
                        </li>
                        {{/if}}
                    </ul>
                </div>

                <!--</div>-->
            </td>

        </tr>
    </script>

</div>

<div class="footer"></div>

<div layout:fragment="js">
    <div th:replace="_layout/includes :: javascript-dynatable"></div>
    <script th:src="@{/app/academico/programacion/detalleProgramacion.js}" charset="utf-8"></script>
</div>
</body>

</html>
