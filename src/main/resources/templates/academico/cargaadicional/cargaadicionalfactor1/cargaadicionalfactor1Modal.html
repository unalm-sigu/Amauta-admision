<modal-vik ref="modal"
           v-bind="modal"
           v-bind:okaction="save">
    <div slot="body">
        <div class="form-group">
            <label> Situación </label>
            <multiselect 
                label="nombre"
                placeholder=""
                v-model="factor.situacionDocente"
                v-bind:options="situaciones"
                v-bind:show-labels="false"
                v-bind:limit="15">
            </multiselect>
        </div>
        <div class="form-group">
            <label> Categoría </label>
            <multiselect
                label="nombre"
                placeholder=""
                v-model="factor.categoriaDocente"
                v-bind:options="categorias"
                v-bind:show-labels="false"
                v-bind:limit="15">
            </multiselect>
        </div>
        <div class="row">
            <div class="col-md-4 form-group">
                <label> Créditos mayores a </label>
                <input class="form-control" v-model="factor.creditosMinimo"/> 
            </div>
            <div class="col-md-4 form-group">
                <label> Valor del factor </label>
                <input class="form-control" v-model="factor.factor"/> 
            </div>
        </div>
    </div>
</modal-vik>
