<modal-vik ref="modal"
           v-bind="modal"
           v-bind:okaction="save">
    <div slot="body">
        <form id="form">
            <div class="row">
                <div class="col-md-4 form-group">
                    <label> Límite inferior </label>
                    <input class="form-control numerico" v-model="factor.cantidadInicio" required=""/> 
                </div>
                <div class="col-md-4 form-group">
                    <label> Límite superior </label>
                    <input class="form-control numerico" v-model="factor.cantidadFin" v-bind:disabled="sinLimiteSuperior"/> 
                </div>
                <div class="col-md-4">
                    <label>Sin límite superior</label>
                    <div class="form-group">
                        <label class="switch">
                            <input type="checkbox" v-model="sinLimiteSuperior"/>
                            <span></span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-4 form-group">
                    <label> Valor </label>
                    <input class="form-control floatingpoint" v-model="factor.factor" required=""/> 
                </div>
            </div>
        </form>
    </div>
</modal-vik>
