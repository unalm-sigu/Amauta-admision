<modal-vik ref="modal"
           v-bind="modal"
           v-bind:okaction="save">
    <div slot="body">
        <div class="row">
            <div class="col-md-4 form-group">
                <label> Límite inferior </label>
                <input class="form-control" v-model="factor.cantidadInicio"/> 
            </div>
            <div class="col-md-4 form-group">
                <label> Límite superior </label>
                <input class="form-control" v-model="factor.cantidadFin"/> 
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-4 form-group">
                <label> Valor </label>
                <input class="form-control" v-model="factor.factor"/> 
            </div>
        </div>
        
    </div>
</modal-vik>
