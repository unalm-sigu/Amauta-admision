<template id="dynatableTemplate">
    <transition name="fade">

        <div class="panel padder-v">
            <table id="dynaTable" class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th class="col-xs-3"></th>
                        <th class="col-xs-2 text-center v-middle">Carrera</th>
                        <th class="col-xs-1 text-center v-middle">Monto</th>
                        <th class="col-xs-4 text-center v-middle">Facultad Destino</th>
                        <th class="col-xs-1 text-center v-middle">Ciclo</th>
                        <th class="col-xs-1 text-center v-middle">Estado</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="dynaTbody">
                    <tr></tr>
                </tbody>
            </table>
        </div>

    </transition>
</template>

<template  type="text/x-template" id="dynatableRowTemplate">
    <tr>

        <td class="v-middle">
            <p class="h5 bold text-primary">
                {{ becado.nombre}}
            </p>
            <span>{{becado.codigo}}</span>
            <small class="block bold">
                {{becado.tipoDoc}} {{becado.nroDocumento}}
            </small>
        </td>

        <td class="v-middle text-center">
            <p class="">{{becado.carrera}}</p>
            <span v-if="becado.verFacultad" class="text-muted">Facultad de {{becado.facultad}}</span>
        </td>

        <td class="v-middle text-right">
            <span class="">{{becado.monto}}</span>
        </td>

        <td class="v-middle">
            <span class="block">Facultad: {{becado.facultadDestino}}</span>
            <span class="bold block">{{becado.universidadDestino}}</span>
        </td>

        <td class="v-middle  text-center">
            <span class="">{{becado.ciclo}}</span>
        </td>

        <td class="v-middle  text-center">
            <span v-if="becado.estado=='INA'" class="label label-default" >Inactivo</span>
            <span v-if="becado.estado=='ACT'" class="label label-primary" >Activo</span>
        </td>

        <td class="v-middle">
            <div class="dropdown actions">
                <a class="dropdown-toggle" data-toggle="dropdown">
                    <i class="glyphicon glyphicon-option-vertical"></i>
                </a>
                <ul class="dropdown-menu pull-right">
                    <li><a class=""   v-on:click.prevent="editar(becado.id)"  href="#">Editar Becado</a></li>
                    <li role="presentation" class="divider"></li>
                    <li><a class=""   v-on:click.prevent="eliminar(becado.id)"  href="#">Eliminar Becado</a></li>
                </ul>
            </div>
        </td>

    </tr>
</template>

<div id="divBuscarAlumno" type="text/x-jsrender" class="hide" >
    <span class="block bold">{{:nombre}}</span>
    <span class="block">{{:carrera}}
        {{if codigoCarrera != codigoFacultad}}
        <span>Facultad de {{:facultad}}</span> 
        {{/if}}
    </span>
    <small class="block">{{:codigo}} </small>
    {{if nroDocumento != undefined}}
        <small class="block">{{:tipoDoc}} {{:nroDocumento}} </small>
    {{/if}}
</div>
