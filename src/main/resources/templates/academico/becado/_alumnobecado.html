<modal-vik ref="modalAddAlumnoBecado"
           v-bind="addAlumnoBecadoModal"
           v-bind:okaction="createAlumnoBecado">

    <div slot="body">

        <form id="formAlumnoBecado"  data-parsley-validate="true">

            <input type="hidden" name="id" value="becado.id" v-model="becado.id" />

            <div class="form-group">
                <label>Alumno</label>
                <input type="text"
                       class="form-control"
                       name="alumno.id"
                       value="becado.alumno.id"
                       v-model="becado.alumno.id"
                       required="true"/>
            </div>

            <div class="form-group">
                <label>Ciclo Beca</label>
                <select name="cicloBeca.id"
                        class="form-control"
                        required="true">
                    <option></option>
                    <option th:each="ciclo : ${ciclos}"
                            th:value="${ciclo.id}"
                            th:text="${ciclo.descripcion}"></option>
                </select>
            </div>

            <div class="form-group">
                <label>Pais Destino</label>
                <input type="text"
                       class="form-control"
                       name="paisDestino.id"
                       value="becado.paisDestino.id"
                       v-model="becado.paisDestino.id"
                       required="true"/>
            </div>

            <div class="form-group">
                <label>Universidad</label>
                <input type="text"
                       class="form-control"
                       name="universidadDestino.id"
                       value="becado.universidad.id"
                       v-model="becado.universidad.id"
                       required="true"/>
            </div>

            <div class="form-group">
                <label>Universidad Destino</label>
                <input type="text"
                       class="form-control"
                       name="nombreUniversidadDestino"
                       maxlength="200"
                       v-model="becado.universidadDestino"
                       required="true"/>
            </div>

            <div class="form-group">
                <label>Facultad Destino</label>
                <input type="text"
                       class="form-control"
                       maxlength="200"
                       name="facultadDestino"
                       v-model="becado.facultadDestino"
                       required="true"/>
            </div>

            <div class="form-group">
                <label>Monto Beca</label>
                <input type="text"
                       class="form-control"
                       name="monto"
                       maxlength="10"
                       step="0.01"
                       v-model="becado.monto"
                       required="true"/>
            </div>

        </form>
    </div>
</modal-vik>
