<modal-vik ref="modalAddCicloAcademico"
           v-bind="addCicloAcademicoaModal"
           v-bind:okaction="saveCicloAcademico">

    <div slot="body">


        <form id="formCicloAcademico" class="form-horizontal"  data-parsley-validate="true">

            <input type="hidden"  name="id" v-bind:value="cicloAcademico.id"/>

            <div class="form-group">
                <label class="control-label col-sm-3">Modalidad</label>
                <div class="col-sm-9">


                    <select class="form-control"    required="true"  name="modalidadEstudio.id" >
                        <option></option>
                        <option
                            th:each="modalidad:${modalidades}"
                            th:value="${modalidad.id}"
                            th:text="${modalidad.nombre}">
                        </option>
                    </select>


                </div>
            </div>



            <div class="form-group">
                <label class="control-label col-sm-3">Año</label>
                <div class="col-sm-9">
                    <input type="text"
                           class="form-control numerico"
                           name="year"
                           minlength="4"
                           v-bind:value="cicloAcademico.year"
                           required="true"/>
                </div>
            </div>

            <div class="form-group">
                <label for="fechaNacimiento" class="col-sm-3 control-label">Fecha de entrega Actas</label>
                <div class="col-sm-9">
                    <div class="input-group date" >
                        <input  type="text" class="form-control" data-parsley-errors-container="#errorfechaEntregaActas" 
                                name="fechaEntregaActas" id="fechaEntregaActas" 
                                th:value="${cicloAcademico!=null} ? ${cicloAcademico.fechaEntregaActas!=null ? #dates.format(cicloAcademico.fechaEntregaActas,'dd/MM/yyyy'):''}"/>
                        <span class="input-group-addon pointer"><i class="fa fa-calendar" aria-hidden="true"></i></span>
                    </div>
                    <span id="errorfechaEntregaActas"></span>
                </div>
            </div>

        </form>

    </div>
</modal-vik>

<modal-vik ref="modalAddAnularCiclo"
           v-bind="addAnularCicloModal"
           v-bind:okaction="saveAnularCiclo">

    <div slot="body">

        <form id="formAnularCiclo" class="form-horizontal"  data-parsley-validate="true">

            <input type="hidden"  name="id"  v-bind:value="cicloAcademico.id"/>

            <div class="form-group">
                <label class="control-label col-sm-3">Motivo de anulación</label>
                <div class="col-sm-9">
                    <textarea
                        class="form-control"
                        required="true"
                        maxlength="200"
                        name="motivo"
                        v-model="motivoAnular"
                        v-bind:text="motivoAnular"
                        ></textarea>
                </div>
            </div>


        </form>

    </div>
</modal-vik>
