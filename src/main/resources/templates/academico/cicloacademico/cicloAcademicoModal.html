<modal-vik ref="modalAddCicloAcademico"
           v-bind="addCicloAcademicoaModal"
           v-bind:okaction="saveCicloAcademico">

    <div slot="body">


        <form id="formCicloAcademico" class="form-horizontal"  data-parsley-validate="true">

            <input type="hidden"  name="id" value=""/>

            <div class="form-group">
                <label class="control-label col-sm-3">Modalidad</label>
                <div class="col-sm-9">
                    <select name="modalidadEstudio.id" >
                        <option
                            th:each="modalidad:${modalidades}"
                            th:value="${modalidad.id}"
                            required="true"
                            th:text="${modalidad.nombre}">
                        </option>
                    </select>
                </div>
            </div>



            <div class="form-group">
                <label class="control-label col-sm-3">Año</label>
                <div class="col-sm-9">
                    <input type="text"
                           class="form-control numerico"
                           name="year"
                           v-bind:value="cicloAcademico.year"
                           required="true"/>
                </div>
            </div>



            <div class="form-group">
                <label class="control-label col-sm-3">Número ciclo</label>

                <div class="col-sm-9">

                    <select   required="true"  class="form-control" name="numeroCiclo" >
                        <option
                            th:each="item : ${numeros}"
                            th:value="${item.value}"
                            required="true"
                            th:text="${item.value}">
                        </option>
                    </select>

                </div>

            </div>


        </form>

    </div>
</modal-vik>
