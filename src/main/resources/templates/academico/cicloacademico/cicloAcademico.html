<html layout:decorator="_layout/layout">
    <head>
        <title>Tipo Grupos</title>
    <div th:replace="_layout/includes :: styles-dynatable"></div>
</head>

<body>
    <div layout:fragment="main">

        <div  id="main">

            <header class="header b-b padder-lg">
                <div class="pull-right m-t-md">
                    <a class="btn btn-info" type="button"    v-on:click.prevent="nuevo"          href="#" >Agregar Ciclo Académico</a>
                </div>
                <h2 th:inline="text">Ciclo Académico </h2>
            </header>

            <section class="wrapper-lg">
                <section class="panel">
                    <section class="panel-body">

                        <div class="col-sm-3">
                            <label>Modalidad</label>
                            <select class="form-control input-sm"  id="modalidad">
                                <option
                                    th:each="modalidad:${modalidades}"
                                    th:value="${modalidad.id}"
                                    required="true"
                                    th:text="${modalidad.nombre}"></option>
                            </select>
                        </div>

                        <div class="btn-group m-t-md">
                            <a class="btn" href="#"
                               v-for="item in margenes"
                               v-on:click="cambiarPeriodo(item.year)"
                               v-bind:class="classCiclo(item)"
                               v-text="item.year"></a>
                        </div>

                        <dynatable />

                    </section>
                </section>
            </section>

            <div th:replace="academico/cicloacademico/cicloAcademicoModal"></div>

        </div>


        <th:block th:replace="academico/cicloacademico/cicloAcademicoDynatable"/>

        <script  th:inline="javascript" >
            /*<![CDATA[*/
            var margenesJson = /*[[${margenes.toString()}]]*/'';
            var rutaModulo = /*[[${rutaModulo}]]*/'';
            /*]]>*/
        </script>

    </div>

    <div layout:fragment="js">
        <div th:replace="_layout/includes :: javascript-dynatable"></div>


        <script th:src="@{/app/academico/cicloacademico/cicloAcademicoDynatable.js}" charset="utf-8"></script>
        <script th:src="@{/app/academico/cicloacademico/cicloAcademico.js}" charset="utf-8"></script>
    </div>

</body>
</html>
