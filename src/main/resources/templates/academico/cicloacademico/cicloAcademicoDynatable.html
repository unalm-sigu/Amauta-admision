<template id="dynatableTemplate">
    <transition name="fade">

        <div class="panel padder-v">

            <table id="dynaTable" class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th class="col-xs-1 v-middle">Año</th>
                        <th class="col-xs-1 v-middle">Número ciclo</th>
                        <th class="col-xs-2 v-middle">Código</th>
                        <th class="col-xs-2 v-middle">Descripción</th>
                        <th class="col-xs-2 v-middle">Descripción 2</th>
                        <th class="col-xs-2 v-middle">Descripción 3</th>
                        <th class="col-xs-2 v-middle">Visible</th>
                        <th class="col-xs-1 v-middle">Estado</th>
                        <th class="v-middle"></th>
                    </tr>
                </thead>
                <tbody id="dynaTbody"><tr></tr></tbody>
            </table>

        </div>

    </transition>
</template>

<template  type="text/x-template" id="dynatableRowTemplate">
    <tr>

        <td class="v-middle">
            <p class="text-primary"> {{ cicloAcademico.year}} </p>
        </td>

        <td class="v-middle">
            <p class=""> {{ cicloAcademico.numeroCiclo}} </p>
        </td>

        <td class="v-middle">
            <p class=""> {{ cicloAcademico.codigo}} </p>
        </td>

        <td class="v-middle">
            <p class="text-sm"> {{ cicloAcademico.descripcion}} </p>
        </td>

        <td class="v-middle">
            <p class="text-sm"> {{ cicloAcademico.descripcion2}} </p>
        </td>

        <td class="v-middle">
            <p class="text-sm"> {{ cicloAcademico.descripcion3}} </p>
        </td>
        <td class="v-middle">
            <input type="checkbox" v-model="cicloAcademico.visibleLogin" v-on:click="visible(cicloAcademico)"/>
        </td>

        <td class="v-middle  text-center">
            <span v-if="cicloAcademico.estado=='ACT'" class="label label-success" >Activo</span>
            <span v-if="cicloAcademico.estado=='CER'" class="label label-warning" >Cerrado</span>
            <span v-if="cicloAcademico.estado=='CRE'" class="label label-default" >Creado</span>
            <span v-if="cicloAcademico.estado=='ANU'" class="label label-danger" >Anulado</span>
            <span v-if="cicloAcademico.estado=='PEND'" class="label label-info" >Pendiente</span>
            <span v-if="cicloAcademico.estado=='DES'" class="label label-default" >Desactivado</span>
            <span v-if="cicloAcademico.estado=='CFG'" class="label label-default" >Configurando</span>
        </td>

        <td class="v-middle">
            <div class="dropdown actions">
                <a class="dropdown-toggle" data-toggle="dropdown">
                    <i class="glyphicon glyphicon-option-vertical"></i>
                </a>
                <ul class="dropdown-menu pull-right">

                    <li  v-if="cicloAcademico.estado=='ACT'  || cicloAcademico.estado=='CFG' ">
                        <a v-on:click.prevent="anularCiclo(cicloAcademico.id)"  href="#">Anular ciclo</a>
                    </li>

                    <li  v-if="cicloAcademico.estado=='CRE'">
                        <a v-on:click.prevent="desactivarCiclo(cicloAcademico.id)"  href="#">Desactivar ciclo</a>
                    </li>

                    <li  v-if="cicloAcademico.estado=='CRE'">
                        <a v-on:click.prevent="configurarCiclo(cicloAcademico.id)"  href="#">Configurar ciclo</a>
                    </li>

                    <li  v-if="cicloAcademico.estado=='CFG' "  >
                        <a v-on:click.prevent="activarCiclo(cicloAcademico.id)"  href="#">Activar ciclo</a>
                    </li>

                    <li v-if="cicloAcademico.estado=='ACT'  || cicloAcademico.estado=='PEND'">
                        <a v-on:click.prevent="cerrarCiclo(cicloAcademico.id)"  href="#">Cerrar ciclo</a>
                    </li>

                    <li v-if="cicloAcademico.estado=='ACT'">
                        <a v-on:click.prevent="pendienteCiclo(cicloAcademico.id)"  href="#">Ciclo pendiente</a>
                    </li>


                    <li class="divider"></li>
                    <li>
                        <a v-on:click.prevent="editar(cicloAcademico.id)"  href="#">Editar ciclo</a>
                    </li>
                    <li class="divider"></li>
                    <li v-if="cicloAcademico.estado=='CRE' || cicloAcademico.estado=='DES' " >
                        <a v-on:click.prevent="eliminar(cicloAcademico.id)"  href="#">Eliminar ciclo</a>
                    </li>

                </ul>
            </div>
        </td>

    </tr>
</template>
