<html layout:decorator="zlayout/layout">
    <head>
        <title>Calificacion de Postulantes</title>
    <div th:substituteby="zlayout/includes :: styles-dynatable"></div>
</head>

<body>
    <div layout:fragment="main">
        <header class="page-header">
            <h2>Nuevo Plan de Estudios</h2>
        </header>

        <form id="frmPlanCurricular">
            <input name="id"
                   id="txtPlanCurricular"
                   type="hidden" 
                   th:value="${planCurricular.id}"/>
            <div id="exTab2" class="tabbable-line m-b-sm">	
                <ul class="nav nav-tabs">
                    <li class="active">
                        <a  href="#1" data-toggle="tab">Inicio</a>
                    </li>
                    <li th:if="${planCurricular.id}">
                        <a href="#2" data-toggle="tab">Cursos</a>
                    </li>
                    <li th:if="${planCurricular.id}">
                        <a href="#3" data-toggle="tab">Electivos</a>
                    </li>
                    <li th:if="${planCurricular.id}">
                        <a href="#4" data-toggle="tab">Adicionales</a>
                    </li>
                    <li th:if="${planCurricular.id}" >
                        <a href="#5" data-toggle="tab" >Resumen</a>
                    </li>
                </ul>
                <section class="panel">
                    <div class="tab-content">
                        <div class="tab-pane active" id="1">
                            <div th:substituteby="academico/plancurricular/plan/includes/inicio"/>
                        </div>
                        <div class="tab-pane" id="2" th:if="${planCurricular.id}">
                            <div th:substituteby="academico/plancurricular/plan/includes/cursos"/>
                        </div>
                        <div class="tab-pane" id="3" th:if="${planCurricular.id}">
                            <div th:substituteby="academico/plancurricular/plan/includes/electivos"/>
                        </div>
                        <div class="tab-pane" id="4" th:if="${planCurricular.id}">
                            <div th:substituteby="academico/plancurricular/plan/includes/adicionales"/>
                        </div>
                        <div class="tab-pane" id="5" th:if="${planCurricular.id}">
                            <div th:substituteby="academico/plancurricular/plan/includes/resumen"/>
                        </div>
                    </div>
                </section>
            </div>

            <section class="panel-footer pull-right">
                <a  href="#" class="btn btn-link cancelar">Cancelar</a>
                <a th:unless="${planCurricular.id}" href="#" id="cmbSavePlanCurricular" class="btn btn-success">Crear PlanCurricular</a>
            </section>

        </form>

        <div th:substituteby="templates/modal"/>
        <div id="divBuscarCurso" type="text/x-jsrender" class="hide" >
            <span class="block bold h5 text-success">{{:cursoNombre}}</span>
            <span class="block"><strong>Código:</strong> {{:cursoCodigo}} - <strong>TPC:</strong> {{:cursoTpc}}</span>
            <small class="block"><strong>Dpto. Académico:</strong> {{:departamentoAcademico}}</small>
            <small class="block"><strong>Facultad:</strong> {{:facultadNombre}}</small>
        </div>
    </div>

    <div layout:fragment="js">
        <div th:substituteby="zlayout/includes :: javascript-dynatable"/>
        <script th:src="@{/app/academico/plancurricular/plan/nuevoPlanCurricular.js}" charset="utf-8"></script>
    </div>
</body>
</html>
