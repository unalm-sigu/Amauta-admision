<html layout:decorator="zlayout/layout">
    <head>
        <title>Lista de Ciclos</title>
    <div th:substituteby="zlayout/includes :: styles-dynatable"></div>
</head>

<body>
    <div layout:fragment="main">
         <header class="header b-b padder-lg">
            <div class="pull-right" >
                <a class="btn btn-success nuevo-plan-curricular" href="#" >Nuevo Plan de Estudios</a>
            </div>
            <h2>Plan de Estudios</h2>
            <!--
            <span>Departamento Académico:<span th:text="${dptoAcad.nombre}">dfdf</span></span>  -->
        </header>

        <section class="panel">
            <section class="panel-body">
                <table class="table table-striped" id="dynaTable">
                    <thead> 
                        <tr class=""> 
                            <th class="col-md-3">Carrera </th>
                            <th class="col-md-2">Fecha Aprobación</th>
                            <th class="col-md-2 text-center">Ciclo Inicio Vigencia</th>
                            <th class="col-md-3">Resumen</th>
                            <th class="col-md-1 text-center">Estado</th>
                            <th class="1"></th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </section>
        </section>

        <script id="templatePlanCurricular" type="text/x-jsrender" class="hide"><div th:substituteby="academico/plancurricular/plan/templatePlanCurricular"/></script>
    </div>

    <div layout:fragment="js">
        <div th:substituteby="zlayout/includes :: javascript-dynatable"/>
        <script th:src="@{/app/academico/plancurricular/plan/planCurricular.js}" charset="utf-8"></script>
    </div>
</body>
</html>
