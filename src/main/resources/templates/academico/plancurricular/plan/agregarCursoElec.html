<form id="frmAgregarCursoElec" >

    <input  id="txtPlanCurricularEle" 
            name="planCurricular.id" 
            type="hidden" 
            th:value="${planCurricular.id}"/>


    <div class="form-group">
        <label for="txtTipo">Tipo</label>

        <select id="cboTipoCursoCurriculaElec" 
                class="select2single form-control select2" 
                name="tipoCursoCurricula.id"
                required="">
            <option value="">Seleccione</option> 
            <option  th:each="item : ${tiposCursoCurriculas}" 
                     th:value="${item.id}" th:text="${item.codigo +' - '+ item.nombre}"></option>
        </select>
    </div>

    <div class="form-group">
        <label for="txtCursoElec">Curso</label>

        <input id="cboCursoElec" class="form-control" 
               name="curso.id"
               type="text" 
               required="yes"/>
    </div>

    <div class="form-group">
        <label for="txtCreditos">Creditos</label>
        <input id="txtCreditosElec" class="form-control" 
               name="creditos" 
               type="text" readonly="true"
               required="yes"
               data-parsley-type="digits"/>


    </div>



</form>
