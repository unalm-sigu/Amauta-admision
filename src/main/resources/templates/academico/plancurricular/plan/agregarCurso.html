<div class="wrapper scrollable">
    <form id="frmAgregarCurso" >

        <input  id="txtPlanCurricular" name="planCurricular.id" type="hidden" th:value="${cursoCurricula.planCurricular.id}"/>
        <input  id="txtCursoCurricula" name="id" type="hidden" 
                th:value="${cursoCurricula.id}"
                th:if="${cursoCurricula.id}"/>

        <input  id="txtNumeroCiclo" type="hidden" name="numeroCiclo" />
        <input  id="txtTipoCurCur"
                type="hidden" 
                th:value="${cursoCurricula.tipoCursoCurricula.id}" 
                th:if="${cursoCurricula.id}"/>

        <div class="form-group">
            <label for="cboTipoCursoCurricula">Tipo</label>

            <select id="cboTipoCursoCurricula" 
                    class="select2single form-control select2" 
                    name="tipoCursoCurricula.id"
                    th:disabled="${cursoCurricula.id!=null}"
                    required="">
                <option value="">Seleccione</option> 
                <option  th:each="item : ${tiposCursoCurriculas}" 
                         th:selected="${cursoCurricula.tipoCursoCurricula.id==item.id}"
                         th:value="${item.id}" th:text="${item.codigo +' - '+ item.nombre}"></option>
            </select>
        </div>

        <div class="form-group">
            <label for="cboCurso">Curso</label>
            <input id="cboCurso" class="form-control" 
                   type="text" 
                   th:unless="${cursoCurricula.id}"
                   required="yes"/>
            <input id="txtCurso" type="hidden" 
                   name="curso.id"
                   th:unless="${cursoCurricula.id}"/>

            <span class="form-control"
                  th:if="${cursoCurricula.id}"
                  th:text="|${cursoCurricula.curso.codigo} ${cursoCurricula.curso.nombre}|"></span>

        </div>

        <div class="form-group">
            <label for="txtCreditos">Creditos</label>
            <input id="txtCreditos" class="form-control" 
                   name="creditos" 
                   th:value="${cursoCurricula.creditos}"
                   type="text" 
                   required="yes"
                   th:disabled="${cursoCurricula.id!=null}"
                   data-parsley-type="digits"/>


        </div>

        <fieldset>
            <legend>Requisitos</legend>


            <div class="form-group">
                <label for="txtCreditoReq">Creditos Requeridos</label>
                <input id="txtCreditoReq" 
                       name="creditosRequisito" 
                       th:value="${cursoCurricula.creditosRequisito}"
                       type="text" 
                       class="form-control"
                       required="true" 
                       data-parsley-type="digits"/>
            </div>

            <div class="form-group">
                <label for="cboCursosReq">Cursos</label>

                <input id="cboCursosReq" 
                       class="form-control" 
                       type="text" />

                <input id="txtCursoReq" 
                       type="hidden"/>

                <a class="btn btn-primary pull-right" id="cmbAddCurReq">Agregar</a>
            </div>

            <div class="form-group">

                <table id="tblCursosReq" class="table table-striped" >
                    <thead> 
                        <tr class=""> 
                            <th class="col-md-5">Código </th>
                            <th class="col-md-5">Nombre</th>
                            <th class="col-md-2"></th>
                        </tr>
                    </thead>
                    <tbody id="tblCursosReqBody">
                        <tr  th:if="${cursoCurricula.id}" th:each="item, iter  : ${cursoCurricula.requisitosCurricula}">
                            <td >
                                <input th:name="|requisitosCurricula[${iter.index}].id|" th:value="${item.id}" type="hidden"/>
                                <span th:name="|codigoCurCur${iter.index}|" th:text="${item.cursoRequisito.curso.codigo}"></span>
                            </td>
                            <td th:text="${item.cursoRequisito.curso.nombre}">

                            </td>
                            <td class="v-middle text-center">
                                <a  rel="{{:index}}" class="btn btn-default cbo-celete-cur-cur"><i class="fa fa-times text-danger"></i></a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>


        </fieldset>

    </form>
</div>



<script id="templateCursosReqBody" type="text/x-jsrender" class="hide"><tr>
    <td class="v-middle text-left col-md-5">
    <span name="codigoCurCur{{:index}}">{{:cursoCodigo}}</span>
    </td>
    <td class="v-middle text-left col-md-5">
    <span>{{:cursoNombre}}</span>
    </td>
    <td class="col-md-2">
    <a  rel="{{:index}}" class="btn btn-default cbo-celete-cur-cur"><i class="fa fa-times text-danger"></i></a>
    </td>
    </tr></script>
