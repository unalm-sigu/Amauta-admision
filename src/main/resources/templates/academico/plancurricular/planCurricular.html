<html layout:decorator="_layout/layout">
    <head>
        <title>Lista de planes curriculares</title>
    </head>

    <body>
        <div layout:fragment="main">
            <div id="main" v-cloak="">

                <header class="header b-b padder-lg">

                    <div class="btn-group pull-right"
                         >
                        <button type="button" class="btn btn-primary dropdown-toggle pull-right" data-toggle="dropdown">
                            <i class="fa fa-random fa-lg"/> &nbsp; Acciones &nbsp; <span class="caret"></span>
                        </button>
                        <ul class="dropdown-menu">
                            <li>
                                <a class="btn-sm nuevo-plan-curricular" 
                                   v-on:click="nuevoPlan()">Nuevo Plan de Estudios</a>
                            </li>
                            <li th:if="${ambiente} != 'prod'">
                                <a class="btn-sm" href="#" v-on:click.prevent="asignacionMasiva()" >Asignación Masiva X Carrera</a>
                            </li>
                        </ul>
                    </div>


                    <h2>Planes de Estudios</h2>
                </header>

                <section class="wrapper-lg">
                    <section class="panel">
                        <section class="panel-body">
                            <raptor-table v-bind:url="curriculasURL" ref="raptorCurriculas">
                                <div slot="header"></div>

                                <template scope="props" >
                                    <table class="table table-striped" id="dynaTable">
                                        <thead> 
                                            <tr class=""> 
                                                <th class="col-md-5 v-middle">Especialidad </th>
                                                <th class="col-md-1 v-middle text-center">Fecha aprobación</th>
                                                <th class="col-md-1 v-middle text-center">Ciclos</th>
                                                <th class="col-md-1 v-middle text-center">Ciclo inicio vigencia</th>
                                                <th class="col-md-3 v-middle text-center">Resumen</th>
                                                <th class="col-md-1 v-middle text-center">Estado</th>
                                                <th class=""></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr v-for="item in props.data">
                                                <td  class="v-middle"> 
                                                    <h4 class="m-b-xs m-t-xs pointer"
                                                        v-on:click="verPlan(item)"><span class="block text-primary bold">{{item.carrera}}</span></h4>
                                                    <h5 v-if="item.orientacion" 
                                                        v-on:click="verPlan(item)" class="m-b-xs m-t-xs pointer"><span class="block text-primary">Orientación {{item.orientacion}}</span></h5>

                                                    <span v-if="item.codigoModalidad == 'EPG' " class="block"><b>Tipo</b> {{item.tipoCarrera}}</span>
                                                    <span v-else="" class="block"><b>Facultad</b> {{item.facultad}}</span>

                                                    <span class="block">{{item.modalidad}}</span>
                                                </td>
                                                <td  class="v-middle text-center"> 
                                                    <span class="block">{{item.fechaAprobacion}}</span>
                                                </td>
                                                <td  class="v-middle text-center"> 
                                                    <span class="badge">{{item.ciclos}}</span>
                                                </td>
                                                <td  class="v-middle text-center"> 
                                                    <span class="block">{{item.cicloInicioVigencia}}</span>
                                                </td>
                                                <td  class="v-middle"> 
                                                    <span class="block m-b-sm">
                                                        <span v-if="item.cantObl>0" class="estado-green">{{item.cantObl}}</span> 
                                                        <span v-else="" class="estado-red">{{item.cantObl}}</span> 
                                                        Cursos definidos
                                                    </span>
                                                    <span class="block m-b-sm">
                                                        <span v-if="item.cantOpc>0" class="estado-green">{{item.cantOpc}}</span> 
                                                        <span v-else="" class="estado-gray">{{item.cantOpc}}</span> 
                                                        Cursos opcionales 
                                                    </span>
                                                    <span class="block">
                                                        <span v-if="item.cantAdc>0" class="estado-green">{{item.cantAdc}}</span> 
                                                        <span v-else="" class="estado-gray">{{item.cantAdc}}</span> 
                                                        Cursos adicionales 
                                                    </span>
                                                </td>
                                                <td  class="v-middle text-center"> 
                                                    <span class="label " v-bind:class="labelEstado(item)">{{item.estadoEnum}}</span>
                                                </td>
                                                <td  class="v-middle"> 
                                                    <div class="dropdown actions" th:if="${editor}">
                                                        <a class="dropdown-toggle" href="#" data-toggle="dropdown"><i class="glyphicon glyphicon-cog"></i></a>
                                                        <ul class="dropdown-menu pull-right" >
                                                            <li v-if="item.estado == 'ACT' || item.estado == 'CRE' " role="presentation">
                                                                <a class="pointer" v-bind:href="urlEditarPlan(item)">Editar</a>
                                                            </li>
                                                            <li v-if="item.estado !== 'ACT' " role="presentation">
                                                                <a class="pointer" v-on:click="activarPlan(item)">Activar</a>
                                                            </li>
                                                            <li v-if="item.estado == 'ACT' " role="presentation">
                                                                <a class="pointer" v-on:click="desactivarPlan(item)">Desactivar</a>
                                                            </li>
                                                            <li v-if="item.estado == 'ACT' " role="presentation">
                                                                <a class="pointer" v-on:click="clonarPlan(item)">Clonar</a>
                                                            </li>
                                                            <li v-if="item.estado == 'CRE' " role="presentation">
                                                                <a class="pointer" v-on:click="eliminarPlan(item)">Eliminar</a>
                                                            </li>
                                                        </ul>
                                                    </div>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </template>
                            </raptor-table>
                        </section>
                    </section>
                </section>

                <div th:replace="academico/plancurricular/planCurricularModals"></div>
                <div th:substituteby="_modules/vue-modal-confirm"></div>

            </div>

        </div>

        <div layout:fragment="js">
            <script th:inline="javascript">
                var carrerasJson = /*[[${carrerasJson}]]*/ '';
                var rutaModulo = 'academico/planCurricular';
            </script>
            <div th:substituteby="_modules/vue-modal"/>
            <div th:substituteby="_layout/includes :: sweetalert"/>
            <div th:substituteby="_modules/vue-raptor-table"></div>
            <script th:src="@{/app/academico/plancurricular/planCurricularVue.js}" charset="utf-8"></script>
        </div>
    </body>
</html>
