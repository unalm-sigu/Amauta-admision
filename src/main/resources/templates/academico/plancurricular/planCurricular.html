<html layout:decorator="_layout/layout">
    <head>
        <title>Lista de planes curriculares</title>
    <div th:substituteby="_layout/includes :: styles-dynatable"></div>
</head>

<body>
    <div layout:fragment="main">


        <div id="main">

            <header class="header b-b padder-lg">

                <div class="btn-group pull-right">
                    <button type="button" class="btn btn-primary dropdown-toggle pull-right" data-toggle="dropdown">
                        <i class="fa fa-random fa-lg"/> &nbsp; Acciones &nbsp; <span class="caret"></span>
                    </button>
                    <ul class="dropdown-menu">
                        <li>
                            <a class="btn-sm nuevo-plan-curricular" href="#" >Nuevo Plan de Estudios</a>
                        </li>
                        <li>
                            <a class="btn-sm" href="#" v-on:click.prevent="asignacionMasiva()" >Asignación Masiva</a>
                        </li>
                    </ul>
                </div>


                <h2>Planes de Estudios</h2>
            </header>

            <section class="wrapper-lg">
                <section class="panel">
                    <section class="panel-body">
                        <table class="table table-striped" id="dynaTable">
                            <thead> 
                                <tr class=""> 
                                    <th class="col-md-5 v-middle">Especialidad </th>
                                    <th class="col-md-1 v-middle text-center">Fecha aprobación</th>
                                    <th class="col-md-1 v-middle text-center">Ciclos</th>
                                    <th class="col-md-1 v-middle text-center">Ciclo inicio vigencia</th>
                                    <th class="col-md-3 v-middle text-center">Resumen</th>
                                    <th class="col-md-1 v-middle text-center">Estado</th>
                                    <th class="1"></th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </section>
                </section>
            </section>


            <modal-vik ref="modalAsignacionMasiva"
                       v-bind="modalAsignacionMasiva"
                       v-bind:okaction="saveAsignacionMasiva">

                <div slot="body">
                    <section class="panel-body">
                        <h4 class="m-t-n">Asignación masiva de planes curricuales a estudiantes</h4>
                        <form id="formAsignacionMasiva">

                            <div class="form-group">

                                <label> Indique la Especialidad </label>
                                <multiselect v-model="carrera" 
                                             v-bind:options='carreras'
                                             label='nombre'
                                             track-by='id'
                                             placeholder=" ">
                                    <template slot="option" slot-scope="props">
                                        <span class="block bold" v-text="props.option.nombre"></span>
                                        <small v-if="props.option.modalidadEstudio.codigo=='EPG' " class="block" v-text="props.option.tipoEnum.value"></small>
                                        <small v-else="" class="block" >Facultad de {{props.option.facultad.nombre}}</small>
                                    </template>
                                </multiselect>

                            </div>


                        </form>
                    </section>

                </div>

            </modal-vik>
        </div>

        <div th:substituteby="_modules/vue-modal"/>

        <script id="templatePlanCurricular" type="text/x-jsrender" class="hide"><div th:substituteby="academico/plancurricular/planCurricularTemplate"/></script>

    </div>

    <div layout:fragment="js">
        <script th:inline="javascript">
            var carrerasJson = /*[[${carrerasJson}]]*/ '';
        </script>
        <div th:substituteby="_layout/includes :: sweetalert"/>
        <div th:substituteby="_layout/includes :: javascript-dynatable"/>
        <script type="text/javascript" th:src="@{/phobos/modules/vue-modal.js}"></script>
        <script th:src="@{/app/academico/plancurricular/planCurricular.js}" charset="utf-8"></script>
        <script th:src="@{/app/academico/plancurricular/planCurricularVue.js}" charset="utf-8"></script>
    </div>
</body>
</html>
