<tr rel="{{:index}}">
    <td class="v-middle text-center" rel="{{:index}}">
        <span name="codigoCurCur{{:index}}">{{:codigo}}</span>
        {{if codigo2}}
        <small class="block bold text-primary">{{:codigo2}}</small>
        {{/if}}
    </td>

    <td class="v-middle">
        <span>{{:curso}}</span>
    </td>

    <td class="v-middle text-center">
        <span>{{:creditos}}</span>
    </td>

    <td class="col-md-1 v-middle text-center">
        <span>{{:cicloInicio}}</span>

    </td>

    <td class="col-md-1 v-middle text-center">
        <span>{{:cicloFin}}</span>
    </td>

    <td class="v-middle text-center">
        <div class="dropdown actions" th:if="${editor}">
            <a class="dropdown-toggle" href="#" data-toggle="dropdown"><i class="glyphicon glyphicon-cog"></i></a>
            <ul class="dropdown-menu pull-right" >
                <li role="presentation">
                    <a class="editar-cur-adc" href="#">Editar</a>
                </li>
                <li role="presentation">
                    <a  rel="{{:index}}" class="delete-cur-adc pointer"> Eliminar </a>
                </li>
            </ul>
        </div>
    </td>
</tr>
