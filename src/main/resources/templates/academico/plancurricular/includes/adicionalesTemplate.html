<tr rel="{{:index}}">
    <td class="v-middle text-center" rel="{{:index}}">
        <span name="codigoCurCur{{:index}}">{{:codigo}}</span>
        {{if codigo2}}
            <small class="block bold text-primary">{{:codigo2}}</small>
        {{/if}}
    </td>

    <td class="v-middle">
        <span>{{:curso}}</span>
    </td>

    <td class="v-middle text-center">
        <span>{{:creditos}}</span>
    </td>

    <td class="col-md-1 v-middle">
        <a  rel="{{:index}}" class="delete-cur-adc pointer"><i class="fa fa-times-circle fa-lg text-danger"></i></a>
    </td>
</tr>
