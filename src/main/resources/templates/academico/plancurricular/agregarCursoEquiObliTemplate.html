<tr>
    <td class="v-middle text-center">
        <input name="cursoEquivalente[{{:index}}].cursoEquivalente.id" value="{{:id}}" type="hidden"/>
        <span> {{:codigo}} </span>
        {{if codigo2}}
            <small class="block bold text-primary">{{:codigo2}}</small>
        {{/if}}
    </td>
    <td class="v-middle">
        <span>{{:curso}}</span>
    </td>
    <td class="v-middle text-center">
        <a rel="{{:index}}" class="btn-delete-curso-equivalente pointer"><i class="fa fa-times-circle fa-lg text-danger"></i></a>
    </td>
</tr>
