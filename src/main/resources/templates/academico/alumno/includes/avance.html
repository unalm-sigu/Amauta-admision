
<h3 class="v-middle text-left">Avance curricular</h3>

<div class="tabbable-line">
    <div class="tabbable-line" id="subBar">
        <ul class="nav nav-tabs">

            <li class="ver-tab-ciclo-cur-obl" v-for="(ciclocurricula,index) in ciclosCurricula" v-bind:class="active(index)">
                <a href="#" style="text-transform: none;"
                   v-text="ciclocurricula.numeroRoman"  v-on:click="cicloSelecc(ciclocurricula.numero)" >
                    <small v-text="ciclocurricula.cantidad" class="text-primary"></small>
                </a>  

            </li>
        </ul>
    </div>
</div>
<hr/>
<table class="table table-striped "  >
    <thead class="panel panel-heading">
        <tr>
            <th class="col-md-1 v-middle text-center">Tipo</th>
            <th class="col-md-1 v-middle"></th>
            <th class="col-md-2 v-middle">Curso</th>
            <th class="col-md-1 v-middle">Veces Cursado</th>
            <th class="col-md-1 v-middle text-center">Créditos</th>
            <th class="col-md-1 v-middle text-center">Nota</th>
            <th class="col-md-1 v-middle text-center">Ciclo de aprobación</th>            
            <th class="col-md-1 v-middle text-center">Estado</th>
        </tr>
    </thead>
    <tbody >           
        <tr v-for="curso in  cursosCurricula">
            <td  class="v-middle text-center"> 
                <span class="block" v-text="curso.tipoCurso"></span>
            </td>
            <td  class="v-middle text-center"> 
                <span class="block" v-text="curso.codigo"></span>

                <small class="block bold text-primary" v-text="curso.codigoAnterior"> </small>

            </td>
            <td  class="v-middle text-left" > 
                <b v-text="curso.nombre"></b>
            </td>
            <td  class="v-middle text-center" > 
                <b v-text="curso.vecesCursado"></b>
            </td>
            <td  class="v-middle text-center"> 

                <span class="estado-gray" v-text="curso.creditos"></span>

            </td>

            <td class="v-middle text-center">

                <span v-bind:class="styleNotaCurri(curso.nota)" v-text="curso.nota"></span>


            </td>
            <td class="v-middle text-center">
                <span v-text="curso.descripcion"></span>

            </td>
            <td class="v-middle text-center">

                <span v-bind:class="styleEstadoCurr(curso.estado.nombre)" v-text="curso.estado.valor"></span>

            </td>

        </tr>
    </tbody>
</table>
