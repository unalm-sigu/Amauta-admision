<template id="historialComponent">
    <section class="panel-body m-t-md">

        <div class="m-b-sm">
            <h3 class="m-t-n" style="display: inline-block" v-if="showTitle">Historial Académico</h3>
            <div class="pull-right m-t-n"  v-if="showactions" style="margin-bottom: 15px;">

                <div class="dropdown" th:if="${puedeCalcular}" >
                    <button class="btn btn-primary dropdown-toggle" type="button" data-toggle="dropdown">
                        Acciones <span class="caret"></span>
                    </button>

                    <ul class="dropdown-menu dropdown-menu-right">
                        <li><a class="dropdown-item" href="#" v-on:click.prevent="calcularPromedio">Calcular Promedios</a></li>
                        <!--<li><a class="dropdown-item" v-bind:href="'/academico/matriculable/'+alumno.id+'/histrialPdf'" >Descargar PDF</a></li>-->
                        <li><a  v-on:click.prevent="generarReporteHistorial" href="#"  class="dropdown-item">
                                Generar Reporte
                            </a>
                        </li>
                    </ul>
                </div>
                <div th:unless="${puedeCalcular}"><button class="btn btn-primary hide" type="button">&nbsp;&nbsp;&nbsp;</button></div>
            </div>
        </div>

        <div class="row m-t-md m-b-sm">
            <div class="col-sm-2">
                <label class="col-sm-6 control-label">Sólo promedios</label>
                <div class="col-sm-6">
                    <label class="switch">
                        <input type="checkbox" v-model="typeSearch4" v-on:change="changeSearch4()"/>
                        <span></span>
                    </label>
                </div>
            </div>

            <div class="col-sm-2" v-if="verInfo != 4">
                <label class="col-sm-6 control-label">Sólo aprobados</label>
                <div class="col-sm-6">
                    <label class="switch">
                        <input type="checkbox" v-model="typeSearch" v-on:change="changeSearch()"/>
                        <span></span>
                    </label>
                </div>
            </div>

            <div class="col-sm-2" v-if="verInfo != 4">
                <label class="col-sm-6 control-label">Listado general</label>
                <div class="col-sm-6">
                    <label class="switch">
                        <input type="checkbox" v-model="typeSearch2" v-on:change="changeSearch2()"/>
                        <span></span>
                    </label>
                </div>
            </div>

            <div class="col-sm-2" v-show="general" v-if="verInfo != 4">
                <label class="col-sm-6 control-label">Solo un ciclo</label>
                <div class="col-sm-6">
                    <label class="switch">
                        <input type="checkbox" v-model="typeSearch3" v-on:change="changeSearch3()"/>
                        <span></span>
                    </label>
                </div>
            </div>

            <div class="col-sm-4" v-show="general" v-if="verInfo != 4">
                <label class="col-sm-3 control-label">Ciclos</label>
                <div class="col-sm-9">
                    <multiselect 
                        v-model="cicloSelect" 
                        v-bind:options='promedios'
                        label='nombre'
                        track-by='id'
                        deselect-label=""
                        select-label=""
                        v-bind:allow-empty="false"
                        v-bind:hide-selected="true"
                        v-on:input="changeCiclo"
                        v-bind:custom-label='labelCiclo'>
                    </multiselect>

                </div>
            </div>
        </div>

        <div v-bind:class="classScrollable()" v-show="verInfo==1">
            <table class="table table-striped col-md-12 m-b-lg" 
                   v-for="tab in promedios"
                   v-bind:id="tab.id"
                   v-if="verificarCiclo(tab)">
                <thead>
                    <tr>
                        <td colspan="7" class="td-pad text-center">
                            <div class="header-ciclo block h5 bold bg-primary text-white" v-text="tab.cicloAcademico.descripcion2" />
                        </td>

                    </tr>

                </thead>
                <tbody>
                    <tr class="bold h5">
                        <td scope="col" class="col-md-1 text-center">
                            Código
                        </td>
                        <td scope="col" class="col-md-7">
                            Nombre del curso
                        </td>
                        <td scope="col" class="col-md-1 text-center">
                            Créditos
                        </td>
                        <td scope="col" class="col-md-1 text-center">
                            Nota
                        </td>
                        <td scope="col" class="col-md-1 text-center">
                            Estado
                        </td>
                        <td scope="col" class="col-md-1 text-center">
                            Aprobado
                        </td>
                        <td scope="col" class="col-md-1 text-center">
                            Veces
                        </td>
                    </tr>

                    <tr v-for="cur in tab.alumnoCicloCurso"
                        v-if="validarNota(cur,typeSearch)"
                        v-bind:class="styleNota(cur)">

                        <td class="text-center" v-text="cur.curso.codigo" />

                        <td class="" v-text="cur.curso.nombre"/>

                        <td class="text-center" v-text="cur.creditos"/>

                        <td class="text-center" v-text="cur.nota"/>

                        <td class="text-center" v-text="cur.estadoEnum.value"/>

                        <td class="text-center">
                            <i class="fa fa-check-circle text-success fa-lg" v-if="cur.estaAprobado==1"></i>
                            <i class="fa fa-times-circle text-danger fa-lg" v-if="cur.estaAprobado==0"></i>
                        </td>

                        <td class="text-center" >
                            <span v-text="cur.vecesCursado"></span> - <span v-text="cur.vecesCursadoRegular"></span>
                        </td>

                    </tr>
                    <tr v-if="verCiclo(tab)">
                        <td colspan="7" style="background-color: #ffffff !important">
                            <div class="col-md-10 col-md-offset-1">

                                <table class="table table-striped">
                                    <thead>
                                        <tr>
                                            <td scope="col" class="text-center td-pad" 
                                                v-bind:colspan="colspanResumen(tab)+4" >
                                                <div class="header-ciclo block h5 bold bg-light">
                                                    Resumen Académico  {{tab.cicloAcademico.descripcion}} &nbsp;-&nbsp;
                                                    {{tab.carrera.nombre}}
                                                </div>
                                            </td>
                                        </tr>

                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td v-bind:colspan="colspanResumen(tab)+4" class="text-center">
                                                Situación Académica: <span class="estado-red">{{tab.situacionFinal.nombre}}</span>
                                            </td>
                                        </tr>

                                        <tr class="">
                                            <td colspan="2" class="text-center h5 bold">Semestral</td>
                                            <td colspan="2" class="text-center h5 bold">Acumulado</td>
                                            <td v-bind:colspan="colspanResumen(tab)" class="text-center h5 bold">Mérito Alcanzado</td>
                                        </tr>

                                        <tr>
                                            <td class="col-md-2 v-middle">Créditos cursados</td>
                                            <td class="col-md-1 v-middle" v-text="tab.creditosCursadosCiclo"></td>
                                            <td class="col-md-2 v-middle b-l">Créditos cursados</td>
                                            <td class="col-md-1 v-middle" v-text="tab.creditosAcumulados"></td>
                                            <td class="bold text-center v-middle b-l" v-bind:class="classResumen(tab)">Ciclo</td>
                                            <td class="bold text-center v-middle" v-bind:class="classResumen(tab)">Facultad</td>
                                            <td class="bold text-center v-middle" v-bind:class="classResumen(tab)" v-if="verCarrera(tab)">Especialidad</td>
                                        </tr>

                                        <tr>
                                            <td class="v-middle">Créditos aprobados</td>
                                            <td class="v-middle" v-text="tab.creditosAprobadosCiclo"></td>
                                            <td class="v-middle b-l">Créditos aprobados</td>
                                            <td class="v-middle" v-text="tab.creditosAprobadosAcumulados"></td>
                                            <td class="text-center v-middle b-l">
                                                <span v-if="tab.ordenMeritoCiclo != '' ">
                                                    {{tab.ordenMeritoCiclo}} de {{tab.controlMeritoCiclo.alumnosComputados}}
                                                </span>
                                            </td>
                                            <td class="text-center v-middle b-l">
                                                <span v-if="tab.ordenMeritoFacultad != '' ">
                                                    {{tab.ordenMeritoFacultad}} de {{tab.controlMeritoFacultad.alumnosComputados}}
                                                </span>
                                            </td>
                                            <td class="text-center v-middle b-l" v-if="verCarrera(tab)">
                                                <span v-if="tab.ordenMeritoCarrera != '' ">
                                                    {{tab.ordenMeritoCarrera}} de {{tab.controlMeritoCarrera.alumnosComputados}}
                                                </span>
                                            </td>
                                        </tr>

                                        <tr>
                                            <td class="v-middle">Promedio ponderado</td>
                                            <td class="v-middle" v-text="verNota(tab.promedioCiclo)"></td>
                                            <td class="v-middle b-l">Promedio ponderado</td>
                                            <td class="v-middle" v-text="verNota(tab.promedioAcumulado)"></td>
                                            <td class="text-center v-middle b-l">
                                                <span v-if="tieneMerito('CICLO',tab)" v-text="getMerito('CICLO',tab)"></span>
                                            </td>
                                            <td class="text-center v-middle b-l">
                                                <span v-if="tieneMerito('FAC',tab)" v-text="getMerito('FAC',tab)"></span>
                                            </td>
                                            <td class="text-center v-middle b-l" v-if="verCarrera(tab)">
                                                <span v-if="tieneMerito('CARR',tab)" v-text="getMerito('CARR',tab)"></span>
                                            </td>
                                        </tr>

                                        <tr>
                                            <td class="v-middle">Puntaje</td>
                                            <td class="v-middle" v-text="tab.puntajeCiclo"></td>
                                            <td class="v-middle b-l">Puntaje</td>
                                            <td class="v-middle" v-text="tab.puntajeAcumulado"></td>
                                            <td class="b-l"></td>
                                            <td class="b-l"></td>
                                            <td class="b-l" v-if="verCarrera(tab)"></td>
                                        </tr>

                                        <tr>
                                            <td v-bind:colspan="colspanResumen(tab)+4" class="td-pad col-md-12">
                                                <div class="footer-ciclo block bg-light"></div>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>

                            </div>
                        </td>
                    </tr>


                </tbody>
            </table>
        </div>

        <div v-show="verInfo==3">
            <table v-if="!general" class="table table-striped col-md-12 ">
                <thead>
                    <tr class="bold h5">
                        <td scope="col" class="col-md-1 text-center">
                            Código
                        </td>
                        <td scope="col" class="col-md-5">
                            Nombre del curso
                        </td>
                        <td scope="col" class="col-md-1 text-center">
                            Créditos
                        </td>
                        <td scope="col" class="col-md-1 text-center">
                            Nota
                        </td>
                        <td scope="col" class="col-md-1 text-center">
                            Estado
                        </td>
                        <td scope="col" class="col-md-1 text-center">
                            Aprobado
                        </td>
                        <td scope="col" class="col-md-1 text-center">
                            Veces
                        </td>
                        <td scope="col" class="col-md-1 text-center">
                            Ciclo
                        </td>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="cur in cursos" 
                        v-if="validarNota(cur,typeSearch)"
                        v-bind:class="styleNota(cur)">


                        <td class="text-center" v-text="cur.curso.codigo" />

                        <td class="" v-text="cur.curso.nombre"/>

                        <td class="text-center" v-text="cur.creditos"/>

                        <td class="text-center" v-text="cur.nota"/>

                        <td class="text-center" v-text="cur.estadoEnum.value"/>

                        <td class="text-center">
                            <i class="fa fa-check-circle text-success fa-lg" v-if="cur.estaAprobado==1"></i>
                            <i class="fa fa-times-circle text-danger fa-lg" v-if="cur.estaAprobado==0"></i>
                        </td>

                        <td class="text-center" v-text="cur.vecesCursado"/>
                        <td class="text-center" v-text="cur.alumnoCiclo.cicloAcademico.descripcion"/>
                    </tr>
                </tbody>
            </table>
        </div>

        <div v-show="verInfo==4">
            <table class="table table-striped col-md-12 m-b-lg" >
                <thead>
                    <tr>
                        <th rowspan="2" class="v-middle text-center">Ciclo</th>
                        <th rowspan="2" class="v-middle text-center">
                            Situación Académica <br/> Nivel
                        </th>
                        <th colspan="3" class="v-middle text-center">Mérito Alcanzado - Nivel</th>
                        <th colspan="3" class="v-middle text-center">Mérito Alcanzado - General</th>
                        <th colspan="5" class="v-middle text-center">Semestral</th>
                        <th colspan="4" class="v-middle text-center">Acumulado</th>

                    </tr>
                    <tr>
                        <th class="v-middle text-center col-md-1">Ciclo</th>
                        <th class="v-middle text-center col-md-1">Facultad</th>
                        <th class="v-middle text-center col-md-1">Especial.</th>
                        <th class="v-middle text-center col-md-1">Ciclo</th>
                        <th class="v-middle text-center col-md-1">Facultad</th>
                        <th class="v-middle text-center col-md-1">Especial.</th>
                        <th class="v-middle text-center">Créd Cur</th>
                        <th class="v-middle text-center">Créd Apr</th>
                        <th class="v-middle text-center">Créd Conv</th>
                        <th class="v-middle text-center">Pje</th>
                        <th class="v-middle text-center">Prom</th>
                        <th class="v-middle text-center">Créd Cur</th>
                        <th class="v-middle text-center">Créd Apr</th>
                        <th class="v-middle text-center">Pje</th>
                        <th class="v-middle text-center">Prom</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="tab in promedios"
                        v-bind:class="classCiclo(tab)">
                        <td class="v-middle">
                            <span class="block">{{tab.cicloAcademico.descripcion}} {{tab.cicloAcademico.tipoEnum.value}}</span>
                            <small class="block">{{tab.estadoEnum.value}}</small>
                            <!--<small class="block text-primary">{{tab.carrera.nombre}}</small>-->
                        </td>

                        <td class="v-middle" colspan="12"
                            v-if="!verCiclo(tab)"></td>

                        <td class="v-middle" v-if="verCiclo(tab)">
                            <span v-text="tab.situacionFinal.nombre" class="block"></span>
                            <span v-text="'Nivel ' + tab.nivel" class="block"></span>
                        </td>

                        <td class="v-middle text-center b-l" v-if="verCiclo(tab)">
                            <span v-if="tab.ordenMeritoCicloNivel != '' " class="block">{{tab.ordenMeritoCicloNivel}} de {{getComputados("CICLO", tab)}}</span>
                            <small v-if="tieneMeritoNivel('CICLO',tab)" class="block" v-text="getMeritoNivel('CICLO',tab)"></small>
                        </td>

                        <td class="v-middle text-center" v-if="verCiclo(tab)">
                            <span v-if="tab.ordenMeritoFacultad != '' " class="block" v-text="getOrdenMeritoNivel('FAC',tab)"></span>
                            <small v-if="tieneMeritoNivel('FAC',tab)" class="block" v-text="getMeritoNivel('FAC',tab)"></small>
                        </td>

                        <td class="v-middle text-center" v-if="verCiclo(tab)">
                            <span v-if="verCarrera(tab)">
                                <span v-if="tab.ordenMeritoCarrera != '' " class="block" v-text="getOrdenMeritoNivel('CARR',tab)"></span>
                                <small v-if="tieneMeritoNivel('CARR',tab)" class="block" v-text="getMeritoNivel('CARR',tab)"></small>
                            </span>
                        </td>

                        <td class="v-middle text-center b-l" v-if="verCiclo(tab)">
                            <span v-if="tab.ordenMeritoCiclo != '' " class="block" v-text="getOrdenMerito('CICLO',tab)"></span>
                            <small v-if="tieneMerito('CICLO',tab)" class="block" v-text="getMerito('CICLO',tab)"></small>
                        </td>

                        <td class="v-middle text-center" v-if="verCiclo(tab)">
                            <span v-if="tab.ordenMeritoFacultad != '' " class="block" v-text="getOrdenMerito('FAC',tab)"></span>
                            <small v-if="tieneMerito('FAC',tab)" class="block" v-text="getMerito('FAC',tab)"></small>
                        </td>

                        <td class="v-middle text-center" v-if="verCiclo(tab)">
                            <span v-if="verCarrera(tab)">
                                <span v-if="tab.ordenMeritoCarrera != '' " class="block" v-text="getOrdenMerito('CARR',tab)"></span>
                                <small v-if="tieneMerito('CARR',tab)" class="block" v-text="getMerito('CARR',tab)"></small>
                            </span>
                        </td>

                        <td class="v-middle text-center b-l" 
                            v-if="verCiclo(tab)"
                            v-text="tab.creditosCursadosCiclo"></td>

                        <td class="v-middle text-center" 
                            v-if="verCiclo(tab)"
                            v-text="tab.creditosAprobadosCiclo"></td>

                        <td class="v-middle text-center" 
                            v-if="verCiclo(tab)"
                            v-text="tab.creditosConvalidados"></td>

                        <td class="v-middle text-center"
                            v-if="verCiclo(tab)"
                            v-text="tab.puntajeCiclo"></td>

                        <td class="v-middle text-center"
                            v-if="verCiclo(tab)"
                            v-bind:class="styleNota(tab)"
                            v-text="verNota(tab.promedioCiclo)"></td>

                        <td class="v-middle text-center b-l" 
                            v-if="verCiclo(tab)"
                            v-text="tab.creditosAcumulados"></td>

                        <td class="v-middle text-center" 
                            v-if="verCiclo(tab)"
                            v-text="tab.creditosAprobadosAcumulados"></td>

                        <td class="v-middle text-center" 
                            v-if="verCiclo(tab)"
                            v-text="tab.puntajeAcumulado"></td>

                        <td class="v-middle text-center" 
                            v-if="verCiclo(tab)"
                            v-text="verNota(tab.promedioAcumulado)"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
</template>
