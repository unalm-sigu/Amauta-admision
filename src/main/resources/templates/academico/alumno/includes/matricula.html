<div>
    <h3 class="v-middle text-left">Matrícula </h3>
    <div class="row">
        <div class="col-md-2 col-md-offset-2">
        <p><strong >Créditos Matriculados: </strong>  <span v-text="creditosMatriculado"></span></p>
        </div>
        <div class="col-md-2 col-md-offset-2">
        <p><strong >Cursos Matriculados: </strong> <span  v-text="cursosMatriculado"></span> </p>
        </div>
    </div>
    <table class="table table-hover table-body-hover">
        <thead>
            <tr>
                <th class="col-md-4 text-left">Curso</th>
                <th></th>
                <th class="col-md-1 text-center">Clave</th>
                <th class="col-md-1 text-center">Grupo</th>
                <th class="col-md-1 text-center">Aula</th>
                <th class="col-md-3 text-left">Docente</th>
                <th class="col-md-1 text-center">Nota Final</th>
                <th class="col-md-1 text-center">Estado</th>
            </tr>
        </thead>
        <tbody  v-for="item in cursos" v-bind:key="item.id">
            <tr>
                <td v-bind:rowspan="item.curso.tipoCurso === 'TEOPRA' ? 2 : 1">
                    <span class="block m-t-sm">
                        <a href="#" v-on:click="verDetalleCurso(item.id)" class="text-left h4 text-info curso-info" v-text="item.curso.nombre"/>
                        <span class="block text-muted p-no-margin" v-text="item.curso.codigo + ' ' + displayCreditos(item)"/>
                        <span class="block m-b-sm" v-text="item.curso.departamentoAcademico.nombre"/>
                    </span>
                </td>
                <td class="text-center v-middle">
                    <span v-if="item.detalle[0].tipo==='PCUR'" class="fa fa-flask"/>
                    <span v-else="" class="fa fa-book"/>
                </td>
                <td class="text-center v-middle">
                    <span v-text="item.detalle[0].codigo"/>
                </td>
                <td class="text-center v-middle">
                    <span v-text="item.detalle[0].grupo"/>
                </td>
                <td class="text-center v-middle">
                    <span v-text="item.detalle[0].aula"/>
                </td>
                <td class="v-middle">
                    <span v-if="item.detalle[0].docenteCodigo !== 'N.N.'" v-text="item.detalle[0].docenteCodigo + ' - '+ item.detalle[0].docente"/>
                    <span v-else="" v-text="item.detalle[0].docenteCodigo + ' - Desconocido'"/>
                </td>
                <td v-bind:rowspan="item.curso.tipoCurso === 'TEOPRA' ? 2 : 1" class="v-middle text-center">
                    <span v-bind:class="colornota(item.notaFinal)" v-text="item.notaFinal"/>
                </td>
                <td v-bind:rowspan="item.curso.tipoCurso === 'TEOPRA' ? 2 : 1" class="v-middle text-center">
                    <span class="label" v-bind:class="labelclass(item)" v-text="labeltext(item)"></span>
                </td>
            </tr>
            <tr v-if="item.curso.tipoCurso === 'TEOPRA'">
                <td class="text-center v-middle">
                    <span v-if="item.detalle[1].tipo==='PCUR'" class="fa fa-flask"/>
                    <span v-else="" class="fa fa-book"/>
                </td>
                <td class="text-center v-middle">
                    <span v-text="item.detalle[1].codigo"/>
                </td>
                <td class="text-center v-middle">
                    <span v-text="item.detalle[1].grupo"/>
                </td>
                <td class="text-center v-middle">
                    <span v-text="item.detalle[1].aula"/>
                </td>
                <td class="v-middle">
                    <span v-if="item.detalle[1].docenteCodigo !== 'N.N.'" v-text="item.detalle[1].docenteCodigo + ' - '+ item.detalle[1].docente"/>
                    <span v-else="" v-text="item.detalle[1].docenteCodigo + ' - Desconocido'"/>
                </td>

            </tr>
        </tbody>
    </table>
</div>
