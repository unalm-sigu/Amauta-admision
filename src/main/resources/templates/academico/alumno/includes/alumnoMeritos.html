<template id="alumnoMeritoComponent">
    <section class="panel-body">

        <form  method="post" id="form"   data-parsley-validate="true">

            <table class="table table-striped table-hover" v-for="(value,key) in ordenesMerdito" >
                <thead>
                    <tr>
                        <td class="text-center bold" colspan="4" ><h4 v-text="titleTable(key)" class="text-primary"></h4></td>
                    </tr>
                    <tr>
                        <th> Ciclo</th>
                        <th >Orden de Merito Total</th>
                        <th >Orden de Merito x Nivel</th>
                        <th >Excelencia Académica</th>
                    </tr>
                </thead>
                <tbody>
                <template v-if='value.length > 0'>

                    <tr  v-for="item in value">
                        <td v-text="item.ciclo"></td>
                        <td v-text="item.ordenMeritoTotal  + ' de '+ item.cantidadTotalMerito"></td>
                        <td v-text="item.ordenMeritoNivel  + ' de '+ item.cantidadMeritoNivel"></td>
                        <td v-text="item.cuadroHonor"></td>
                    </tr>
                </template>
                <template v-else=''>
                    <tr >
                        <td colspan="4"> 
                            <div class="alert alert-danger text-center" role="alert">
                                No existe información
                            </div>                           
                        </td>
                    </tr>
                </template>
                </tbody>
            </table>
        </form>

    </section>
</template>
