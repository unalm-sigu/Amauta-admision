<raptor-table v-bind:url="urlCursos" ref="cursosload">
    <div slot="header"></div>
    <template scope="props" >
        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th class="col-md-8">Curso</th>
                    <th class="col-md-2 text-center">Créditos</th>
                    <th class="col-md-2 text-center">Estado</th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="item in props.data">
                    <th class="v-middle">
                        <span class="block m-t-sm">
                            <span class="text-left h4 text-primary bold" v-text="item.curso.nombre"/>
                            <span class="block text-muted p-no-margin">
                                {{item.curso.codigo}} &nbsp;
                                <i class="fa fa-bookmark text-primary"></i> {{item.curso.tpc}}
                            </span>
                            <small class="block text-muted m-b-sm">
                                Dpto: {{item.curso.departamentoAcademico.nombre}}
                            </small>
                        </span>
                    </th>
                    <th class="v-middle text-center">
                        <span class="estado-blue">{{item.creditos}}</span>
                    </th>
                    <th class="v-middle text-center">
                        <span v-if='item.estadoEnum' v-text='item.estadoEnum.value'></span>
                    </th>
                </tr>
            </tbody>
        </table>
    </template>
</raptor-table>
