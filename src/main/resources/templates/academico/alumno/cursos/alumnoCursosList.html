<raptor-table v-bind:url="urlCursos" ref="cursosload">
    <div slot="header"></div>
    <template scope="props" >
        <table class="table table-striped table-hover">
            <thead> 
                <tr>
                    <th class="col-md-6">Curso</th>
                    <th class="col-md-6">Estado</th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="item in props.data">
                    <th class="col-md-6">
                        <div>
                            <span class="text-primary" v-text='item.curso.nombre'></span><br/>
                            <small v-if='item.curso.tipoCursoEnum != null' class="" v-text='item.curso.tipoCursoEnum.value'></small>
                        </div>
                    </th>
                    <th class="col-md-6">
                        <span v-if='item.estadoEnum' class="badge" v-text='item.estadoEnum.value'></span>
                    </th>
                </tr>
            </tbody>
        </table>
    </template>
</raptor-table>
