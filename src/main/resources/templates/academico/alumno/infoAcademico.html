<html layout:decorator="_layout/layout">
    <head>
        <title>Alumnos</title>
        <style>
            .header-ciclo {
                padding-top: 9px;
                padding-bottom: 9px;
                border-top-left-radius: 8px;
                border-top-right-radius: 8px;
            }
            .footer-ciclo {
                padding-top: 9px;
                padding-bottom: 9px;
                border-bottom-left-radius: 11px;
                border-bottom-right-radius: 11px;
            }
            .td-pad {
                padding: 0 !important;
            }
        </style>
    </head>

    <body>
        <section  layout:fragment="main">
            <div id="infoAcademico" v-cloak="">
                <header class="header b-b padder-lg">
                    <h2>Información Académica</h2>
                    <div class="pull-right m-t-md">
                        <a th:href="${origen}" class="btn btn-default">Regresar</a>
                    </div>
                    <header-info-component v-bind:alumno="alumno"></header-info-component>
                    <div class="tabbable-line">
                        <ul class="nav nav-tabs" >
                            <li v-for="tab in tabs" v-bind:class="styleMenu(tab.id)">
                                <a href="#" data-toggle="tab" v-on:click="updateTabs(tab)" v-text="tab.name"></a>
                            </li>
                        </ul>
                    </div>
                </header>
                <div class="wrapper-md">
                    <section class="panel">
                        <section class="panel-body">
                            <div v-show="1 == tabId"  >
                                <inicio-component v-bind:alumno="alumno" v-on:reiniciar-planes-main="reiniciarPlanes()"></inicio-component>
                            </div>
                            <div v-show="2 == tabId" >
                                <historial-component v-bind:alumno="alumno" ref="loadHistorial" v-bind:showactions="true"></historial-component>
                            </div>
                            <div v-show="3 == tabId" >
                                <avance-component v-bind:alumno.sync="alumno" v-on:reload-plan-alumno="reloadPlanAlumno()" ref="loadAvance"></avance-component>
                            </div>
                            <div v-show="4 == tabId" >
                                <matricula-component v-bind:alumno="alumno" ref="loadMatricula"></matricula-component>
                            </div>
                            <div v-show="5 == tabId"  >
                                <horario-component v-bind:alumno="alumno" v-bind:ciclo="ciclo" ref="loadHorario"></horario-component>
                            </div>
                            <div v-show="6 == tabId">
                                <malla-component v-bind:alumno="alumno" ref="loadMalla"></malla-component>
                            </div>
                            <div v-show="8 == tabId">
                                <retiro-ciclo-component v-bind:alumno="alumno" ref="compRetiroCiclo"></retiro-ciclo-component>
                            </div>
                        </section>
                    </section> 

                </div>
                <div th:substituteby="academico/alumno/otros/preRequisitoModal"/>
            </div>
            <div th:substituteby="academico/alumno/includes/headerInfo"/>
            <div th:substituteby="academico/alumno/includes/inicio"/>
            <div th:substituteby="academico/alumno/includes/historial"/>
            <div th:substituteby="academico/alumno/includes/avance"/>
            <div th:substituteby="academico/alumno/includes/horario"/>
            <div th:substituteby="academico/alumno/includes/matricula"/>
            <div th:substituteby="academico/alumno/includes/malla"/>
            <div th:substituteby="academico/alumno/includes/retiroCiclo"/>


        </section>
        <div layout:fragment="js">
            <script th:inline="javascript">
                /*<![CDATA[*/
                var alumnoJson = /*[[${alumno.toString()}]]*/ 'json';
                var horasJson = /*[[${horasBD.toString()}]]*/ 'json';
                var cicloJson = /*[[${ciclo.toString()}]]*/ 'json';
                var planesJson = /*[[${planes.toString()}]]*/ 'json';
                /*]]>*/
            </script>
            <div th:substituteby="_layout/includes :: svgjs"/>
            <div th:substituteby="_modules/vue-modal"/>
            <script th:src="@{/app/academico/alumno/headerInfoComponent.js}" charset="utf-8"></script>
            <script th:src="@{/app/academico/alumno/inicioComponent.js}" charset="utf-8"></script>
            <script th:src="@{/app/academico/alumno/historialComponent.js}" charset="utf-8"></script>
            <script th:src="@{/app/academico/alumno/avanceComponent.js}" charset="utf-8"></script>
            <script th:src="@{/app/academico/alumno/horarioComponent.js}" charset="utf-8"></script>
            <script th:src="@{/app/academico/alumno/matriculaComponent.js}" charset="utf-8"></script>
            <script th:src="@{/app/academico/alumno/mallaComponent.js}" charset="utf-8"></script>
            <script th:src="@{/app/academico/alumno/retiroCicloComponent.js}" charset="utf-8"></script>
            <script th:src="@{/app/academico/alumno/infoAcademico.js}" charset="utf-8"></script>
        </div>
    </body>
</html>
