<html layout:decorator="_layout/layout">
    <head>
        <title>Alumnos</title>
        <link th:substituteby="_layout/includes :: styles-dynatable"/>
    </head>

    <body>
        <section  layout:fragment="main">

            <div id="main" >

                <header class="header b-b padder-lg">
                    <h2>Información Académica</h2>
                    <div class="pull-right m-t-md">
                        <a th:href="@{/academico/alumno}" class="btn btn-default">Regresar</a>
                    </div>
                    <header-info-component v-bind:alumno="alumno"></header-info-component>
                </header>

                <section class="wrapper-lg">
                    <section class="panel">
                        <section class="panel-body">

                            <ciclo-component
                                v-for="tab in ciclos"
                                v-bind:validarNota="validarNota"
                                v-bind:styleNota="styleNota"
                                v-bind:tab="tab" ></ciclo-component>

                            <div class="text-center">
                                <button class="btn btn-link" type="button" v-on:click.prevent="agregarCiclo" >Agregar Ciclo</button>
                            </div>

                        </section>
                    </section>
                </section>


            </div>

            <div th:substituteby="academico/alumno/includes/headerInfo"/>
            <div th:substituteby="academico/alumno/cicloTemplate"/>

        </section>
        <div layout:fragment="js">

            <script th:inline="javascript">
                /*<![CDATA[*/
                var alumnoJson = /*[[${datoAlumno.toString()}]]*/ '';
                /*]]>*/
            </script>

            <script th:src="@{/app/academico/alumno/headerInfoComponent.js}" charset="utf-8"></script>
            <script th:src="@{/app/academico/alumno/cicloAcademicoComponet.js}" charset="utf-8"></script>
            <script th:src="@{/app/academico/alumno/datoAcademico.js}" charset="utf-8"></script>

        </div>
    </body>
</html>
