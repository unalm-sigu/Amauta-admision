<html layout:decorator="_layout/layout">
    <head>
        <title>Aulas</title>
        <link th:substituteby="_layout/includes :: styles-dynatable" />
    </head>

    <body>
        <div layout:fragment="main">

            <div  id="main" v-cloak="">

                <header class="header b-b padder-lg">
                    <h2>Distancia Pabellón </h2>
                </header>

                <section class="wrapper-lg">
                    <section class="panel">
                        <section class="panel-body">

                            <raptor-table v-bind:url="urlpabellon" ref="raptor">

                                <div slot="header">

                                </div>

                                <template scope="props" >

                                    <table class="table table-striped table-hover">
                                        <thead>
                                            <tr>
                                                <th class="v-middle col-sm-1">
                                                    Código
                                                </th>
                                                <th class="v-middle col-sm-6">
                                                    Nombre
                                                </th>
                                                <th class="v-middle col-sm-5">
                                                    Nombre Largo
                                                </th>
                                                <th></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr v-for="item in props.data">

                                                <td class="v-middle col-sm-1">
                                                    {{item.codigo}}
                                                </td>

                                                <td class="v-middle col-sm-6">
                                                    <span class="block bold text-primary h5 m-t-xs m-b-xs">{{item.nombre}}</span>
                                                    <span class="block">{{item.facultad.nombre}}</span>
                                                </td>
                                                <td class="v-middle col-sm-5">
                                                    {{item.nombreLargo}}
                                                </td>
                                                <td class="v-middle">

                                                    <div class="dropdown actions">

                                                        <a class="dropdown-toggle" href="#" data-toggle="dropdown">
                                                            <i class="fa fa-cog" aria-hidden="true"></i>
                                                        </a>

                                                        <ul class="dropdown-menu pull-right" aria-labelledby="dropdownMenu1" role="menu">

                                                            <li role="presentation">
                                                                <a class="btn-link delete" v-on:click.prevent="configurarDistancia(item)" href="#">Configurar Distancia</a>
                                                            </li>

                                                        </ul>

                                                    </div>
                                                </td>

                                            </tr>
                                        </tbody>
                                    </table>


                                </template>
                            </raptor-table>


                        </section>
                    </section>
                </section>


                <modal-vik ref="modalNuevaDistanciaPabellon"
                           v-bind="modalNuevaDistanciaPabellon"
                           v-bind:okaction="saveDistanciaPabellon"
                           showaccept="true">

                    <div slot="body" vclass="panel">

                        <h5 class="text-primary m-b-md m-t-sm">
                            Distancia {{departamentoSelecto.nombre}} Aulas.
                        </h5>

                        <form id='formNuevaDistanciaPabellon' class="form-horizontal" data-parsley-validate="true">


                            <table class="table table-striped table-hover">
                                <thead>
                                    <tr>
                                        <th class="v-middle col-sm-2">
                                            Código
                                        </th>
                                        <th class="v-middle col-sm-7">
                                            Módulo
                                        </th>
                                        <th class="v-middle col-sm-3">
                                            Distancia
                                        </th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr v-for="distancia in distancias">

                                        <td class="v-middle col-sm-2">
                                            {{distancia.pabellon.codigo}}
                                        </td>

                                        <td class="v-middle col-sm-7">
                                            {{distancia.pabellon.nombre}}
                                        </td>

                                        <td class="v-middle col-sm-3">
                                            <input class="form-control numerico" type="text" v-model="distancia.distancia" />
                                        </td>

                                    </tr>
                                </tbody>
                            </table>

                        </form>

                    </div>
                </modal-vik>

            </div>


        </div>

        <div layout:fragment="js">
            <div th:substituteby="_modules/vue-modal"/>
            <div th:substituteby="_layout/includes :: vue-loader"/>
            <div th:substituteby="_modules/vue-raptor-table"></div>
            <script th:src="@{/app/academico/distanciapabellon/distanciapabellon.js}" charset="utf-8"></script>
        </div>

    </body>
</html>
