<div id="divEstadoCarrera" type="text/x-jsrender" class="hide" >

    <form id="{{:form}}" method="POST">
        <input type="hidden" name="id" value="{{:id}}"/>
        <div class="row m-b-md">
            <input class='hide' name="id"/>
            <input class='hide' name="estado" value="{{:estado}}"/>
            <div class="form-group">
                <div class="col-md-12">
                    {{if creado }}
                    Se ingresa resolución
                    {{/if}}

                    {{if activo }}
                    <div class="form-group">
                        <label class="bold">Indique el motivo por el cual esta desactivando la carrera</label>
                        <textarea class='form-control' name='motivoAnulacion' required='true'></textarea>
                    </div>
                    {{/if}}
                    
                    {{if inactivo }}
                    ¿Desea realmente activar la carrera?
                    {{/if}}
                </div>
            </div>
        </div>
    </form>
</div>

<div id="divEstadoOrientacion" type="text/x-jsrender" class="hide" >
    <form id="{{:form}}" method="POST">

        <div class="row m-b-md">
            <input type="hidden" name="id" value="{{:id}}"/>
            <div class="col-md-12">
                {{if activo}}
                <div class="form-group">
                    <label class="bold">Indique el motivo por el cual esta desactivando la carrera</label>
                    <textarea class='form-control' name='motivoAnulacion' required='true'></textarea>
                </div>
                {{else}}
                ¿Desea realmente activar la orientación?
                {{/if}}
            </div>
        </div>
    </form>
</div>

<div id="divFormOrientacion" type="text/x-jsrender" class="hide" >
    <form id="{{:form}}" method="POST">

        <div class="row m-b-md">
            <input type="hidden" name="idCarrera" value="{{:idCarrera}}"/>
            <input type="hidden" name="idOrientacion" value="{{:idOrientacion}}"/>

            <div class="form-group col-lg-11">
                <label>Nombre</label>
                <input name="nombreOrientacion" class="form-control" required="true" value="{{:nombreOrientacion}}"/>
            </div>
        </div>
    </form>

</div>

<modal-vik ref="modalAsignarPostulante"
           v-bind="modalAsignarPostulante"
           v-bind:okaction="removerOrientacion">
    <div slot="body">
    </div>
</modal-vik>
