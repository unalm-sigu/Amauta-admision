<tr rel="{{:index}}">

    <td class="v-middle text-left">
        {{:codigo}}
    </td>
    <td class="v-middle text-left">
        <span class="block">{{:carrera}}</span>
    </td>
    <td class="v-middle text-left">
        {{:nombre}}
    </td>
    <td class="text-center v-middle">
        <span class="clear">
            {{if esActivo}}
            <span class="label label-{{:colorEstado}}">{{:estadoName}} </span>
            {{/if}}
            {{if esInactivo}}
            <label class="label label-{{:colorEstado}}"  data-toggle="tooltip" title="{{:motivo}}">Desactivado</label>
            {{/if}}
        </span>
    </td> 
    <td class="v-middle"> 
        <div class="dropdown actions">
            <a class="dropdown-toggle" data-toggle="dropdown">
                <i class="glyphicon glyphicon-cog"></i>
            </a> 

            <ul class="dropdown-menu pull-right">
                <li><a class="btn-link pointer delete-orientacion" rel="{{:id}}" rev="{{:idCarrera}}">Eliminar</a></li>
                {{if !esActivo}}
                <li><a class="btn-link pointer view-cambio-estado" rel="{{:id}}" rev="{{:estado}}">Activar</a></li>
                {{/if}}
                {{if esActivo}}
                <li><a class="btn-link pointer view-cambio-estado" rel="{{:id}}" rev="{{:estado}}">Desactivar</a></li>
                <li><a class="btn-link pointer editar-orientacion" rel="{{:id}}">Editar</a></li>
                {{/if}}
            </ul>
        </div>
    </td>
</tr>
