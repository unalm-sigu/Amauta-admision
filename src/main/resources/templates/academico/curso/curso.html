<html layout:decorator="_layout/layout">
    <head>
        <title>Cursos</title>
        <!--<div th:substituteby="_layout/includes :: styles-dynatable"></div>-->
    </head>

    <body>
        <div layout:fragment="main">
            <div id="cursosVUE" v-cloak="">

                <header class="header b-b padder-lg">

                    <div class="pull-right m-t-md">                 
                        <div class="btn-group">
                            <a type="button" class="btn btn-success" v-on:click="urlNuevoCurso()" >Nuevo</a>
                        </div>
                    </div> 
                    <h2>Cursos</h2>
                </header>

                <section class="wrapper-lg">
                    <section class="panel">
                        <section class="panel-body">

                            <raptor-table v-bind:url="cursoURL" ref="raptorCursos">
                                <div slot="header"></div>

                                <template scope="props" >

                                    <table class="table table-striped">
                                        <thead> 
                                            <tr> 
                                                <th class="col-md-5 v-middle">Curso</th>
                                                <th class="col-md-3 v-middle"> Dependencia </th>
                                                <th class="col-md-2 v-middle text-left">Coordinador</th>
                                                <th class="col-md-1 v-middle text-center">Planes de Calificación</th>
                                                <th class="col-md-1 v-middle text-center">Estado</th>
                                                <th></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr v-for="item in props.data">

                                                <td class="v-middle">
                                                    <span class="block text-primary h4 m-t-xs m-b-xs">{{item.nombre}}</span>
                                                    <span class="block"><b>{{item.codigo}}</b> &nbsp;&nbsp; <i class="fa fa-bookmark-o"></i> {{item.tpc}}</span>
                                                    <span class="block">{{item.tipoCursoEnum.value}}</span>
                                                    <small v-if="item.codigoAnterior1 != '' " class="block bold">{{item.codigoAnterior1}}</small>
                                                </td>
                                                <td class="v-middle">
                                                    <span class="block text-info bold">Facultad {{item.departamentoAcademico.facultad.nombre}}</span>
                                                    <span class="block"><b>Dpto. Acad.</b> {{item.departamentoAcademico.nombre}}</span>
                                                    <span v-if="item.carrera.id != '' " class="block bold">{{item.carrera.tipoEnum.value}} {{item.carrera.nombre}}</span>
                                                </td>
                                                <td class="v-middle">
                                                    <span class="block">{{item.coordinador.persona.apellidosNombres}}</span>
                                                </td>
                                                <td class="v-middle">
                                                    <span class="block"></span>
                                                </td>
                                                <td class="text-center v-middle">
                                                    <span class="clear">
                                                        <label v-if="item.estado == 'INA' " class="label" v-bind:class="estadoClass[item.estado]"  data-toggle="tooltip" 
                                                               v-bind:title="item.motivoAnulacion" v-text="item.estadoEnum.value">Desactivado</label>
                                                        <span v-else="" class="label" v-bind:class="estadoClass[item.estado]" v-text="item.estadoEnum.value">Activo</span>
                                                    </span>
                                                </td> 
                                                <td class="v-middle"> 
                                                    <div class="dropdown actions">
                                                        <a class="dropdown-toggle" data-toggle="dropdown">
                                                            <i class="glyphicon glyphicon-cog"></i>
                                                        </a> 

                                                        <ul class="dropdown-menu pull-right">
                                                            <li><a class="btn-link pointer" v-bind:href="urlEditar(item)">Editar</a></li>
                                                            <li v-if="item.estado != 'ACT' "><a class="btn-link pointer change-estado" v-on:click="activar(item,'activar')">Activar</a></li>
                                                            <li v-if="item.estado == 'ACT' "><a class="btn-link pointer change-estado" v-on:click="activar(item,'desactivar')">Desactivar</a></li>
                                                        </ul>
                                                    </div>
                                                </td>
                                            </tr>

                                        </tbody>
                                    </table>

                                </template>
                            </raptor-table>

                        </section>
                    </section>
                </section>



                <modal-vik ref="modalEstado"
                           v-bind="configEstado"
                           v-bind:okaction="saveEstado">
                    <div slot="body">
                        <p class="h5 m-t-xs" v-html="configEstado.message">MSG</p>
                        <div v-if="configEstado.accion == 'desactivar' ">
                            <label>Ingrese el motivo de la anulación</label>
                            <textarea rows="3" class="form-control" v-model="configEstado.motivo"></textarea>
                        </div>
                    </div>
                </modal-vik>

            </div>

        </div>

        <div layout:fragment="js">
            <div th:substituteby="_modules/vue-modal"/>
            <div th:substituteby="_modules/vue-raptor-table"></div>
            <script th:src="@{/app/academico/curso/curso.js}" charset="utf-8"></script>
        </div>

    </body>
</html>
