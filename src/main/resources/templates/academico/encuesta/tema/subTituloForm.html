<div class="row">

    <h3>Nuevo Subtitulo</h3>

    <div class="col-sm-12 m-t-lg">

        <form  data-parsley-validate="true">

            <input  type="hidden" name="id" />
            <input  type="hidden" name="temaExamen.id" />

            <div class="form-group  col-sm-12">
                <label>Nombre</label>
                <input  type="text" class="form-control input-sm"
                        required="true"
                        data-trigger="change"
                        maxlength="100"
                        name="nombre" />
            </div>

            <div class="form-group  col-sm-6">
                <label>Bloques</label>
                <input  type="number" class="form-control input-sm"
                        required="true"
                        data-trigger="change"
                        min="0"
                        name="bloquesVisibles" />
            </div>

            <div class="form-group  col-sm-6">
                <label>Preguntas</label>
                <input  type="number" class="form-control input-sm"
                        required="true"
                        min="0"
                        data-trigger="change"
                        name="preguntasVisibles" />
            </div>

        </form>


        <div class="col-sm-12 text-center m-t-lg">
            <button class="btn btn-link cancelar">Cancelar</button>
            <button class="btn btn-primary guardar">Guardar</button>
        </div>

    </div>
</div>
