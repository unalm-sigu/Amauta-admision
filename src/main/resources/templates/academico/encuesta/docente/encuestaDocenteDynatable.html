<template id="dynatableTemplate">
    <transition name="fade">


        <table  id="dynaTable" class="table table-striped">
            <thead class="panel panel-heading">
                <tr>
                    <th class="col-md-3 text-center v-middle">Docente</th>
                    <th class="col-md-3 text-center v-middle">Departamento Académico</th>
                    <th class="col-md-2 text-center v-middle">Fecha</th>
                    <th class="col-md-2 text-center v-middle">Alumnos</th>
                    <th class="col-md-1 text-center v-middle">Encuesta</th>
                    <th class="col-md-1 text-center v-middle">Estado</th>
                </tr>
            </thead>
            <tbody id="dynaTbody"></tbody>
        </table>


    </transition>
</template>

<template  type="text/x-template" id="dynatableRowTemplate">
    <tr>

        <td class="v-middle">
            <div class="v-middle">
                <a href="#"><span class="block text-primary bold detallePostulante" >{{encuestaDocente.nombre}}</span></a>
                <span class="block">
                    Código: {{encuestaDocente.codigo}}
                </span>
                <small v-if="nroDocumento" class="block bold">{{encuestaDocente.tipoDoc}} {{encuestaDocente.nroDocumento}}</small>
            </div>
        </td>

        <td class="v-middle  text-center">
            <span class="block text-primary">{{encuestaDocente.departamentoAcademico}}</span>
            <small class="block">Facultad de {{encuestaDocente.facultad}}</small>
        </td>

        <td class="v-middle">
            <small class="block text-muted">Encuesta: {{encuestaDocente.fechaEncuesta}}</small>
            <small class="block text-muted">Inicio: {{encuestaDocente.fechaInicio}}</small>
            <small class="block text-muted">Fin: {{encuestaDocente.fechaFin}}</small>
        </td>

        <td class="v-middle">
            <small class="block text-muted">Encuestados: {{encuestaDocente.alumnosEncuestados}}</small>
            <small class="block text-muted">Inicio: {{encuestaDocente.alumnosInicio}}</small>
            <small class="block text-muted">Fin: {{encuestaDocente.alumnoFin}}</small>
        </td>

        <td class="v-middle">
            <small class="block">{{encuestaDocente.examen}}</small>
        </td>

        <td class="v-middle text-center">
            <span  v-if="encuestaDocente.estado=='ACT' " class="label label-success">{{encuestaDocente.estadoEnum}}</span>
            <span  v-if="encuestaDocente.estado=='INA' " class="label label-default">{{encuestaDocente.estadoEnum}}</span>
            <span  v-if="encuestaDocente.estado=='CRE' " class="label label-default">{{encuestaDocente.estadoEnum}}</span>
        </td>

    </tr>
</template>
