<html layout:decorator="_layout/layout">
    <head>
        <title>Encuesta Docente</title>
    </head>
    <body>

        <div layout:fragment="main">

            <div  id="main">

                <header class="header b-b padder-lg">
                    <h2>Lista de docentes a encuestar</h2>
                    <h4 class="block"><strong>Ciclo Académico </strong> <span th:text='${ciclo.descripcion}'/></h4>
                </header>

                <section class="wrapper-lg">
                    <section class="panel">
                        <section class="panel-body">

                            <dynatable />

                        </section>
                    </section>
                </section>

            </div>

            <th:block th:replace="academico/encuesta/docente/encuestaDocenteDynatable"/>

        </div>

        <div layout:fragment="js">
            <div th:substituteby="_layout/includes :: javascript-dynatable"/>
            <script th:src="@{/vendor/sweetalert/dist/sweetalert.min.js}" charset="utf-8"></script>
            <script th:src="@{/vendor/vuejs/vue.js}" charset="utf-8"></script>
            <script type="text/javascript" th:src="@{/app/academico/encuesta/docente/encuestaDocenteDynatable.js}"></script>
            <script th:src="@{/app/academico/encuesta/docente/encuestaDocente.js}" charset="utf-8"></script>
        </div>

    </body>
</html>
