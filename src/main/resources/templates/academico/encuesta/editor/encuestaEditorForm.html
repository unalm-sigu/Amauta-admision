<html layout:decorator="_layout/layout">
    <head>
        <title>Encuesta</title>
    </head>
    <body>

        <div layout:fragment="main">

            <div  id="main">

                <header class="header b-b padder-lg">
                    <h2 th:if="${encuesta.id}" th:text="|${encuesta.codigo} -  ${encuesta.nombre}|"> Encuesta Libre </h2>
                    <h2 th:unless="${encuesta.id}"> Encuesta Nueva </h2>
                </header>

                <section class="wrapper-lg">
                    <section class="panel">
                        <section class="panel-body">



                            <form  data-parsley-validate="true"
                                   th:action="@{/academico/encuesta/editor/save}"
                                   method="POST"
                                   class="form-horizontal">

                                <input  type="hidden" name="id" th:value="${encuesta.id}" />

                                <div class="form-group">
                                    <label class="col-sm-2 control-label">Nombre</label>
                                    <div class="col-sm-4">
                                        <input type="text" class="form-control" required="true" name="nombre" th:value="${encuesta.nombre}" />
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label class="col-sm-2 control-label">Tipo</label>
                                    <div class="col-sm-4">

                                        <select class="form-control select2single"
                                                name="tipoExamen.id"
                                                data-trigger="change">
                                            <option></option>
                                            <option th:each="item : ${tipos}"
                                                    th:value="${item.id}"
                                                    th:text="${item.nombre}"
                                                    th:selected="${encuesta.tipoExamen!=null ? item.id == encuesta.tipoExamen.id : ''}"/>
                                        </select>

                                    </div>
                                </div>

                                <div class="text-center m-t-lg">
                                    <a type="button" class="btn btn-link" th:href="@{/academico/encuesta/editor}" >Cancelar</a>
                                    <button type="submit" class="btn btn-primary" >Guardar</button>
                                </div>

                            </form>

                        </section>
                    </section>
                </section>

            </div>

        </div>

    </body>
</html>
