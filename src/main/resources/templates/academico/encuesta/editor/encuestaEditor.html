<html layout:decorator="_layout/layout">
    <head>
        <title>Encuesta Editar</title>
    </head>
    <body>

        <div layout:fragment="main">

            <div  id="main">

                <header class="header b-b padder-lg">

                    <h2>Lista de Encuestas de Docentes</h2>

                    <a class="btn btn-primary nuevo-agrupador pull-right"
                       th:href="@{/academico/encuesta/editor/nuevo}" >Nueva Encuesta</a>

                    <h4 class="block"><strong>Ciclo Académico </strong> <span th:text='${ciclo.descripcion}'/></h4>

                </header>

                <section class="wrapper-lg">
                    <section class="panel">
                        <section class="panel-body">

                            <dynatable />

                        </section>
                    </section>
                </section>

                <th:block th:replace="academico/encuesta/editor/encuestaEditorModal"/>
                <th:block th:replace="academico/encuesta/editor/encuestaEditorConfigModal"/>

            </div>

            <div th:substituteby="_modules/vue-modal"/>
            <th:block th:replace="academico/encuesta/editor/encuestaEditorDynatable"/>

        </div>

        <div layout:fragment="js">
            <div th:substituteby="_layout/includes :: javascript-dynatable"/>
            <script th:src="@{/vendor/sweetalert/dist/sweetalert.min.js}" charset="utf-8"></script>
            <script th:src="@{/vendor/vuejs/vue.js}" charset="utf-8"></script>
            <script type="text/javascript" th:src="@{/phobos/modules/vue-modal.js}"></script>
            <script type="text/javascript" th:src="@{/app/academico/encuesta/editor/encuestaEditorDynatable.js}"></script>
            <script type="text/javascript" th:src="@{/app/academico/encuesta/editor/buscarCurso.js}"></script>
            <script th:src="@{/app/academico/encuesta/editor/encuestaEditor.js}" charset="utf-8"></script>
        </div>

    </body>
</html>
