<modal-vik ref="modalReporte" v-bind="modalReporteBec"
           v-bind:okaction="reporteFiltro">

    <div slot="body">
        <form id="formReporte" data-parsley-validate="true" class="form-horizontal">
            <div class="form-group">
                <label class="control-label col-md-4">Tipo de beca</label>
                <div class="col-md-8">
                    <multiselect v-model="filtroExcel.tipo_beca"
                                 v-bind:options='tipoBeca'
                                 v-bind:internal-search="true"
                                 label='nombre'
                                 track-by='id'
                                 placeholder="Seleccione un ciclo">
                    </multiselect>
                    <input type="hidden" v-model="filtroExcel.tipo_beca" required=""/>
                </div>
            </div>

            <div class="form-group">
                <label class="control-label col-md-4"> Ciclo Academico</label>
                <div class="col-md-8">
                    <multiselect v-model="filtroExcel.ciclo_academico"
                                 v-bind:options='ciclos'
                                 v-bind:internal-search="true"
                                 label='descripcion'
                                 track-by='codigo'
                                 placeholder="Seleccione un ciclo">
                    </multiselect>
                    <input type="hidden" v-model="filtroExcel.ciclo_academico" required=""/>
                </div>

            </div>

            <div class="form-group">
                <label class="control-label col-md-4">Cursos matriculados por 3ra vez(Reinscripciones en cursos/Cursos repetidos)</label>
                <div class="col-md-8">
                    <div class="radio">
                        <label>
                            <input type="radio" name="cursando" value="0" v-model="filtroExcel.veces_desaprobado" />
                            Sí
                        </label>
                    </div>
                    <div class="radio">
                        <label>
                            <input type="radio" name="cursando" value="1" v-model="filtroExcel.veces_desaprobado" />
                            No
                        </label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="control-label col-md-4">Tiene retiro de ciclo</label>
                <div class="col-md-8">
                    <div class="radio">
                        <label>
                            <input type="radio" name="retiro" value="si" v-model="filtroExcel.retiroCiclo" />
                            Sí
                        </label>
                    </div>
                    <div class="radio">
                        <label>
                            <input type="radio" name="retiro" value="no" v-model="filtroExcel.retiroCiclo" />
                            No
                        </label>
                    </div>
                </div>
            </div>

            <div class="form-group" style="background-color: #f9f9f9; padding: 15px; border-radius: 5px; margin-top: 20px;">
                <label class="control-label col-md-4">Parametros adicionales al reporte</label>
                <div class="col-md-8">
                    <div class="checkbox">
                        <label>
                            <input type="checkbox" name="cursosMatriculados" v-model="filtroExcel.cursosMatriculados" />
                            Cursos matriculados
                        </label>
                    </div>
                    <div class="checkbox">
                        <label>
                            <input type="checkbox" name="notaMinima" v-model="filtroExcel.nota" />
                            Nota mínima
                        </label>
                    </div>
                    <div class="checkbox">
                        <label>
                            <input type="checkbox" name="cambioCarrera" v-model="filtroExcel.cambioCarrera" />
                            Cambio de carrera
                        </label>
                    </div>
                </div>
            </div>
        </form>

    </div>
</modal-vik>
