<modal-vik ref="modalReporte" v-bind="modalReporteBec"
           v-bind:okaction="reporteFiltro" v-bind:cancelaction="clearFields">

    <div slot="body">
        <form id="formReporte" data-parsley-validate="true" class="form-horizontal">

            <!-- Pregunta si es en el ciclo actual -->
            <div class="form-group">
                <label class="control-label col-md-4">¿Sacar reporte del ciclo actual?</label>
                <div class="col-md-8">
                    <div class="radio">
                        <label>
                            <input type="radio" name="cicloActual" value="si" v-model="filtroExcel.cicloActual" required="" /> Sí
                        </label>
                    </div>
                    <div class="radio">
                        <label>
                            <input type="radio" name="cicloActual" value="no" v-model="filtroExcel.cicloActual" required="" /> No
                        </label>
                    </div>
                </div>
            </div>

            <div class="form-group" v-if="filtroExcel.cicloActual === 'no'" style="background-color: #f9f9f9; padding: 15px; border-radius: 5px; margin-top: 20px;">
                <label class="control-label col-md-4"> Ciclo Académico</label>
                <div class="col-md-8">
                    <multiselect v-model="filtroExcel.ciclo_academico"
                                 v-bind:options='ciclos'
                                 v-bind:internal-search="true"
                                 label='descripcion'
                                 track-by='codigo'
                                 placeholder="Seleccione un ciclo"
                                 :disabled="filtroExcel.cicloActual === 'si'">
                    </multiselect>
                    <input type="hidden" v-model="filtroExcel.ciclo_academico" required=""/>
                    <span class="help-block">Por favor, seleccione un ciclo académico.</span>
                </div>
            </div>

            <div class="form-group">
                <label class="control-label col-md-4">Tipo de Reporte</label>
                <div class="col-md-8">
                    <div class="radio">
                        <label>
                            <input type="radio" name="tipoReporte" value="general" v-model="filtroExcel.tipoReporte" required="" /> General
                        </label>
                    </div>
                    <div class="radio" >
                        <label>
                            <input type="radio" name="tipoReporte" value="filtros" v-model="filtroExcel.tipoReporte" required="" /> Con Filtros
                        </label>
                    </div>
                </div>
            </div>

            <div v-if="filtroExcel.tipoReporte === 'filtros'">

                <div class="form-group" style="background-color: #f9f9f9; padding: 15px; border-radius: 5px; margin-top: 20px;">
                    <label class="control-label col-md-4">Tipo de beca</label>
                    <div class="col-md-8">
                        <multiselect v-model="filtroExcel.tipo_beca"
                                     v-bind:options='tipoBeca'
                                     v-bind:internal-search="true"
                                     label='nombre'
                                     track-by='id'
                                     placeholder="Seleccione un tipo de beca">
                        </multiselect>
                        <input type="hidden" v-model="filtroExcel.tipo_beca" required=""/>
                    </div>
                </div>

                <div class="form-group" v-if="filtroExcel.cicloActual === 'si'">
                    <label class="control-label col-md-4">Matriculado</label>
                    <div class="col-md-8">
                        <div class="radio">
                            <label>
                                <input type="radio" name="seMatriculo" value="si" v-model="filtroExcel.se_matriculo" required="" /> Sí
                            </label>
                        </div>
                        <div class="radio">
                            <label>
                                <input type="radio" name="seMatriculo" value="no" v-model="filtroExcel.se_matriculo" required="" /> Todos
                            </label>
                        </div>
                    </div>
                </div>


                <div class="form-group" v-if="filtroExcel.cicloActual === 'no'" style="background-color: #f9f9f9; padding: 15px; border-radius: 5px; margin-top: 20px;">
                    <label class="control-label col-md-4">Parametros adicionales al reporte</label>
                    <div class="col-md-8">
                        <div class="checkbox" v-if="filtroExcel.cicloActual === 'no'" >
                            <label>
                                <input type="checkbox" name="cursosMatriculados" v-model="filtroExcel.electivo_matriculado" />
                                Nro Cursos Electivos matriculados
                            </label>
                        </div>
                        <div class="checkbox" v-if="filtroExcel.cicloActual === 'porahorano'" >
                            <label>
                                <input type="checkbox" name="notaMinima" v-model="filtroExcel.nota" />
                                Nota
                            </label>
                        </div>
                        <div class="checkbox" v-if="filtroExcel.cicloActual === 'porahorano'" >
                            <label>
                                <input type="checkbox" name="cambioCarrera" v-model="filtroExcel.cambioCarrera" />
                                Cambio de carrera
                            </label>
                        </div>
                        <div class="checkbox" v-if="filtroExcel.cicloActual === 'no'" >
                            <label>
                                <input type="checkbox" name="tercera_vez" v-model="filtroExcel.tercera_vez" />
                                Reinscripciones en cursos (3ra)
                            </label>
                        </div>
                        <div class="checkbox" v-if="filtroExcel.cicloActual === 'porahorano'" >
                            <label>
                                <input type="checkbox" name="retiro_ciclo" v-model="filtroExcel.retiro_ciclo" />
                                Tiene retiro de ciclo
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </form>


    </div>
</modal-vik>
