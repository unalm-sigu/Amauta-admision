<tr v-for="(tramiteTraslado , index) in resolucion.tramiteTraslado" v-if="isTraslado || isTrasladoInt"> 
    <td class="v-middle text-center">
        <div class="form-group">
            <div class="col-md-12">
                <multiselect v-model="tramiteTraslado.alumno" 
                             v-bind:options='alumnos'
                             v-on:search-change="loadAlumno"
                             v-bind:custom-label='customLabel'
                             track-by='id'
                             v-bind:show-labels="false"
                             v-bind:allow-empty="false"
                             deselect-label="No se puede eliminar este valor"
                             v-bind:internal-search='false'
                             placeholder=" " 
                             v-bind:disabled="isEdicion &amp;&amp; tramiteTraslado.id != null">
                    <template slot="option" slot-scope="props">
                        <div class="option__desc">
                            <span class="option__title block bold">{{ props.option.codigo }} - {{ props.option.persona.nombreCompleto }} </span>
                            <span class="option__small">{{ props.option.persona.tipoDocumento.simbolo }} - {{ props.option.persona.numeroDocIdentidad }}</span>
                            <span class="option__small block bold text-success">{{ props.option.carrera.nombre }} </span>
                        </div>
                    </template>
                </multiselect>
                <input v-model="tramiteTraslado.alumno" required="true" type="text" class="hide"/>
            </div>
        </div>
    </td>
    <td class="v-middle text-center">
        <span v-if="resolucion.tipoResolucion != null" class="block text-muted" v-text="resolucion.tipoResolucion.nombre"></span>
    </td> 
    <td class="v-middle text-left" v-if="!isTrasladoInt">
        <div class="form-group">
            <multiselect 
                v-model="tramiteTraslado.cicloAcademico" 
                v-bind:options="ciclos"
                placeholder=" "
                label="descripcion"
                track-by="id" 
                required="true"
                v-bind:allow-empty="true"
                >
            </multiselect>
            <input v-model="tramiteTraslado.cicloAcademico" required="true" type="text" class="hide"/>
        </div>
    </td>
    <!--    <td class="v-middle text-left" v-if="isTrasladoInt">
            <div class="form-group">
                <multiselect 
                    v-model="tramiteTraslado.carrera" 
                    v-bind:options="carreras"
                    placeholder="Seleccione una carrera"
                    label="nombre"
                    track-by="id" 
                    required="true"
                    v-bind:allow-empty="true"
                    deselect-label="No se puede eliminar este valor" 
                    v-bind:disabled="isEdicion &amp;&amp; tramiteTraslado.id != null"
                    >
                </multiselect>
                <input v-model="tramiteTraslado.carrera" required="true" type="text" class="hide"/>
            </div>
        </td>-->
    <td>
        <label class="switch">
            <input type="checkbox" 
                   v-model="tramiteTraslado.seleccionado"
                   id="tramiteTraslado"
                   checked="1" />
            <span class="slider round"></span>
        </label>
    </td>
    <td class="v-middle text-center">
        <button v-on:click="deleteItem(index)" class="btn btn-danger" v-bind:disabled="isEdicion &amp;&amp; tramiteTraslado.id != null">
            <i class="fa fa-trash-o " aria-hidden="true"></i>
        </button>
    </td>
</tr>
