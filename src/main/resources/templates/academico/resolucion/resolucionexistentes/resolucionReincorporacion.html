<tr v-for="(reincorporacion , index) in resolucion.reincorporaciones" v-if="isReincorporacion"> 
    <td class="v-middle text-center">
        <div class="form-group">
            <div class="col-md-12">
                <multiselect v-model="reincorporacion.alumno" 
                             v-bind:options='alumnos'
                             v-on:search-change="loadAlumno"
                             v-bind:custom-label='customLabel'
                             track-by='id'
                             v-bind:show-labels="false"
                             v-bind:allow-empty="false"
                             deselect-label="No se puede eliminar este valor"
                             v-bind:internal-search='false'
                             placeholder="Ingresa un caracter como mínimo" 
                             v-bind:disabled="isEdicion &amp;&amp; reincorporacion.id != null">
                    <template slot="option" slot-scope="props">
                        <div class="option__desc">
                            <span class="option__title block bold">{{ props.option.persona.nombreCompleto }} </span>
                            <span class="option__small">{{ props.option.persona.tipoDocumento.simbolo }} - {{ props.option.persona.numeroDocIdentidad }}</span>
                        </div>
                    </template>
                </multiselect>
                <input v-model="reincorporacion.alumno" required="true" type="text" class="hide"/>
            </div>
        </div>
    </td>
    <td class="v-middle text-left">
        <div class="form-group">
            <span v-if="resolucion.tipoResolucion != null" class="block text-muted" v-text="resolucion.tipoResolucion.nombre"></span>
        </div>
    </td>
    <td class="v-middle text-center">
        <div class="form-group">
            <input class="form-control" v-model="reincorporacion.motivoDesercion" required="true" type="text" v-bind:disabled="isEdicion &amp;&amp; reincorporacion.id != null"/>
        </div>
    </td>
    <!--                                            <td class="v-middle text-left">
                                                    <div class="form-group">
                                                        <multiselect 
                                                            v-model="reincorporacion.cicloReincorporacion" 
                                                            v-bind:options="ciclos"
                                                            placeholder="Seleccione un ciclo"
                                                            label="descripcion"
                                                            track-by="id" 
                                                            required="true"
                                                            v-bind:allow-empty="true"
                                                            deselect-label="No se puede eliminar este valor" 
                                                            >
                                                        </multiselect>
                                                        <input v-model="reincorporacion.cicloReincorporacion" required="true" type="text" class="hide"/>
                                                    </div>
                                                </td>-->
    <td>
        <button v-on:click="deleteItem(index)" class="btn btn-danger" v-bind:disabled="isEdicion  &amp;&amp; reincorporacion.id != null">
            <i class="fa fa-trash-o " aria-hidden="true"></i>
        </button>
    </td>
</tr>
