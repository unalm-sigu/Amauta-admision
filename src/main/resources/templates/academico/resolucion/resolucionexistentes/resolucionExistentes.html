<html layout:decorator="_layout/layout">
    <head>
        <title>Calificacion de Postulantes</title>
    <div th:substituteby="_layout/includes :: styles-dynatable"></div>
    <style type="text/css">
        .buscarDocClass {
            min-width: 300px;
        }
        /* Enter and leave animations can use different */
        /* durations and timing functions.              */
        .slide-fade-enter-active {
            transition: all 1s ease;
        }
        .slide-fade-leave-active {
            transition: all 1.5s cubic-bezier(1.0, 0.5, 0.8, 1.0);
        }
        .slide-fade-enter, .slide-fade-leave-to
        /* .slide-fade-leave-active below version 2.1.8 */ {
            transform: translateX(10px);
            opacity: 0;
        }
    </style>
</head>

<body>
    <section  layout:fragment="main">
        <header class="header b-b padder-lg">

            <h2 > Resolución Existente <span th:text="${ciclo.descripcion}"></span></h2>
            <div class="pull-right m-t-md">
                <a class="btn btn-default"   th:href="@{/academico/resolucion}"  >Regresar</a>
            </div>
        </header>
        <div id="resolucionReinForm" v-cloak="">
            <div >

                <section class="wrapper-lg">
                    <form id="form" data-parsley-validate="true" >
                        <section class="panel m-b-xs">
                            <section class="panel-body">
                                <div class="row">
                                    <div class="col-lg-6">
                                        <label>Facultad</label>
                                        <div class="form-group">
                                            <multiselect 
                                                v-model="resolucion.oficina" 
                                                v-bind:options="oficinas"
                                                placeholder="Seleccione una oficina"
                                                label="nombre"
                                                v-bind:allow-empty="false"
                                                deselect-label="No se puede eliminar este valor"
                                                track-by="id" 
                                                required="true"
                                                v-on:select="oficinaSelect"
                                                >
                                            </multiselect>
                                            <input v-model="resolucion.oficina" required="true" type="text" class="hide"/>
                                        </div>
                                    </div> 
                                    <div class="col-lg-6">
                                        <div class="form-group">
                                            <label>Fecha Resolución</label>
                                            <div class="input-group date">
                                                <date-picker v-model="resolucion.fecha" required="true" v-bind:config="configDate" data-parsley-id="2" v-bind:wrap="true" ></date-picker>  
                                                <div class="input-group-addon">
                                                    <span class="fa fa-calendar"></span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-lg-6">
                                        <label>Serie</label>
                                        <div class="form-group">
                                            <input type="text"
                                                   v-model="resolucion.serie"
                                                   class="form-control numerico" 
                                                   required="true"></input>
                                        </div>
                                    </div>
                                    <div class="col-lg-6">
                                        <label>Número</label>
                                        <div class="form-group">
                                            <input type="text"
                                                   v-model="resolucion.numero"
                                                   class="form-control numerico" 
                                                   required="true"> </input>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-lg-6">
                                        <label>Tipo Resolución</label>
                                        <div class="form-group">
                                            <multiselect 
                                                v-model="resolucion.tipoResolucion" 
                                                v-bind:options="tiposResolucion"
                                                placeholder="Seleccione un tipo de resolucion"
                                                label="nombre"
                                                v-bind:allow-empty="false"
                                                deselect-label="No se puede eliminar este valor"
                                                track-by="id" 
                                                required="true"
                                                v-on:select="tipoResolucionSelect"
                                                >
                                            </multiselect>
                                            <input v-model="resolucion.tipoResolucion" required="true" type="text" class="hide"/>
                                        </div>
                                    </div> 
                                </div>
                            </section>
                        </section>

                        <section class="panel m-b-xs">
                            <section class="panel-body">
                                <table class="table table-striped">
                                    <thead>
                                        <tr>
                                            <th class="col-md-3 text-center">Persona</th>
                                            <th class="col-md-3 text-center" v-if="!isCambioNota">Tipo Tramite</th>
                                            <th class="col-md-2 text-center" v-if="isCambioNota">Tipo Tramite</th>
                                            <th class="col-md-3 text-center" v-if="!isCambioNota &amp;&amp; !isTraslado">Motivo</th>
                                            <th class="col-md-2 text-center" v-if="isCambioNota">Motivo</th>
                                            <th class="col-md-3 text-center" v-if="!isCambioNota &amp;&amp; !isCursoDirigido">Ciclo
                                                <span v-if='isRetiroCiclo'> a retirar</span>
                                                <span v-if='isReincorporacion'> a reincorporar</span>
                                            </th>
                                            <th class="col-md-2 text-center" v-if="isCambioNota">Ciclo                                               
                                            </th>
                                            <th class="col-md-2 text-center" v-if="isCambioNota">Curso</th>
                                            <th class="col-md-1 text-center" v-if="isCambioNota">Nota</th>
                                            <th class="col-md-3 text-center" v-if="isCursoDirigido">Docente</th>
                                            <th v-if="isCursoDirigido ">Aprobado</th>
                                            <th  v-if="!isCursoDirigido "></th>
                                            <th ></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr v-for="(reincorporacion , index) in resolucion.reincorporaciones" v-if="isReincorporacion"> 
                                            <td class="v-middle text-center">
                                                <div class="form-group">
                                                    <div class="col-md-12">
                                                        <multiselect v-model="reincorporacion.alumno" 
                                                                     v-bind:options='alumnos'
                                                                     v-on:search-change="loadAlumno"
                                                                     v-bind:custom-label='customLabel'
                                                                     track-by='id'
                                                                     v-bind:show-labels="false"
                                                                     v-bind:allow-empty="false"
                                                                     deselect-label="No se puede eliminar este valor"
                                                                     v-bind:internal-search='false'
                                                                     placeholder="Ingresa un caracter como mínimo" >
                                                            <template slot="option" slot-scope="props">
                                                                <div class="option__desc">
                                                                    <span class="option__title block bold">{{ props.option.persona.nombreCompleto }} </span>
                                                                    <span class="option__small">{{ props.option.persona.tipoDocumento.simbolo }} - {{ props.option.persona.numeroDocIdentidad }}</span>
                                                                </div>
                                                            </template>
                                                        </multiselect>
                                                        <input v-model="reincorporacion.alumno" required="true" type="text" class="hide"/>
                                                    </div>
                                                </div>
                                            </td>
                                            <td class="v-middle text-left">
                                                <div class="form-group">
                                                    <span v-if="resolucion.tipoResolucion != null" class="block text-muted" v-text="resolucion.tipoResolucion.nombre"></span>
                                                </div>
                                            </td>
                                            <td class="v-middle text-center">
                                                <div class="form-group">
                                                    <input class="form-control" v-model="reincorporacion.motivoDesercion" required="true" type="text"/>
                                                </div>
                                            </td>
                                            <td class="v-middle text-left">
                                                <div class="form-group">
                                                    <multiselect 
                                                        v-model="reincorporacion.cicloReincorporacion" 
                                                        v-bind:options="ciclos"
                                                        placeholder="Seleccione un ciclo"
                                                        label="descripcion"
                                                        track-by="id" 
                                                        required="true"
                                                        v-bind:allow-empty="true"
                                                        deselect-label="No se puede eliminar este valor" 
                                                        >
                                                    </multiselect>
                                                    <input v-model="reincorporacion.cicloReincorporacion" required="true" type="text" class="hide"/>
                                                </div>
                                            </td>
                                            <td>
                                                <a v-on:click="deleteItem(index)" class="btn btn-danger">
                                                    <i class="fa fa-trash-o " aria-hidden="true"></i>
                                                </a>
                                            </td>
                                        </tr>
                                        <tr v-for="(retiroCiclo , index) in resolucion.retiroCiclo" v-if="isRetiroCiclo"> 
                                            <td class="v-middle text-center">
                                                <div class="form-group">
                                                    <div class="col-md-12">
                                                        <multiselect v-model="retiroCiclo.alumno" 
                                                                     v-bind:options='alumnos'
                                                                     v-on:search-change="loadAlumno"
                                                                     v-bind:custom-label='customLabel'
                                                                     track-by='id'
                                                                     v-bind:show-labels="false"
                                                                     v-bind:allow-empty="false"
                                                                     deselect-label="No se puede eliminar este valor"
                                                                     v-bind:internal-search='false'
                                                                     placeholder="Ingresa un caracter como mínimo" >
                                                            <template slot="option" slot-scope="props">
                                                                <div class="option__desc">
                                                                    <span class="option__title block bold">{{ props.option.persona.nombreCompleto }} </span>
                                                                    <span class="option__small">{{ props.option.persona.tipoDocumento.simbolo }} - {{ props.option.persona.numeroDocIdentidad }}</span>
                                                                </div>
                                                            </template>
                                                        </multiselect>
                                                        <input v-model="retiroCiclo.alumno" required="true" type="text" class="hide"/>
                                                    </div>
                                                </div>
                                            </td>
                                            <td class="v-middle text-center">
                                                <span v-if="resolucion.tipoResolucion != null" class="block text-muted" v-text="resolucion.tipoResolucion.nombre"></span>
                                            </td>
                                            <td class="v-middle text-left">
                                                <input class="form-control" v-model="retiroCiclo.motivo" required="true" type="text"/>
                                            </td>
                                            <td class="v-middle text-left">
                                                <div class="form-group">
                                                    <multiselect 
                                                        v-model="retiroCiclo.cicloAcademico" 
                                                        v-bind:options="ciclos"
                                                        placeholder="Seleccione un ciclo"
                                                        label="descripcion"
                                                        track-by="id" 
                                                        required="true"
                                                        v-bind:allow-empty="true"
                                                        deselect-label="No se puede eliminar este valor" 
                                                        >
                                                    </multiselect>
                                                    <input v-model="retiroCiclo.cicloAcademico" required="true" type="text" class="hide"/>
                                                </div>
                                            </td>
                                            <td>
                                                <a v-on:click="deleteItem(index)" class="btn btn-danger">
                                                    <i class="fa fa-trash-o " aria-hidden="true"></i>
                                                </a>
                                            </td>
                                        </tr>
                                        <tr v-for="(cambioNota , index) in resolucion.cambioNota" v-if="isCambioNota"> 
                                            <td class="v-middle text-center">
                                                <div class="form-group">
                                                    <div class="col-md-12">
                                                        <multiselect v-model="cambioNota.alumno" 
                                                                     v-bind:options='alumnos'
                                                                     v-on:search-change="loadAlumno"
                                                                     v-bind:custom-label='customLabel'
                                                                     track-by='id'
                                                                     v-bind:show-labels="false"
                                                                     v-bind:allow-empty="false"
                                                                     deselect-label="No se puede eliminar este valor"
                                                                     v-bind:internal-search='false'
                                                                     placeholder="Ingresa un caracter como mínimo" >
                                                            <template slot="option" slot-scope="props">
                                                                <div class="option__desc">
                                                                    <span class="option__title block bold">{{ props.option.persona.nombreCompleto }} </span>
                                                                    <span class="option__small">{{ props.option.persona.tipoDocumento.simbolo }} - {{ props.option.persona.numeroDocIdentidad }}</span>
                                                                </div>
                                                            </template>
                                                        </multiselect>
                                                        <input v-model="cambioNota.alumno" required="true" type="text" class="hide"/>
                                                    </div>
                                                </div>
                                            </td>
                                            <td class="v-middle text-center">
                                                <span v-if="resolucion.tipoResolucion != null" class="block text-muted" v-text="resolucion.tipoResolucion.nombre"></span>
                                            </td>
                                            <td class="v-middle text-left">
                                                <input class="form-control" v-model="cambioNota.motivo" required="true" type="text"/>
                                            </td>
                                            <td class="v-middle text-left">
                                                <div class="col-md-12">
                                                    <div class="form-group">
                                                        <multiselect 
                                                            v-model="cambioNota.cicloAcademico" 
                                                            v-bind:options="ciclos"
                                                            placeholder="Seleccione"
                                                            label="descripcion"
                                                            track-by="id" 
                                                            required="true"
                                                            v-bind:allow-empty="true"
                                                            :show-labels="false"
                                                            v-on:select="cicloCambioNota($event,cambioNota)"
                                                            deselect-label="No se puede eliminar este valor" 
                                                            >
                                                        </multiselect>
                                                        <input v-model="cambioNota.cicloAcademico" required="true" type="text" class="hide"/>
                                                    </div>
                                                </div>
                                            </td>
                                            <td  class="v-middle text-left">
                                                <div class="col-md-12">
                                                    <div class="form-group">
                                                        <multiselect v-model="cambioNota.curso" 
                                                                     v-bind:options='cursos'
                                                                     label='nombre'
                                                                     track-by='id'
                                                                     v-bind:show-labels="false"
                                                                     v-bind:allow-empty="false"
                                                                     v-bind:internal-search='true'
                                                                     placeholder="Ingresa un caracter"                                         
                                                                     required="true"  >
                                                        </multiselect>
                                                    </div>
                                                </div>
                                                <input v-model="cambioNota.curso" required="true" type="text" class="hide"/>
                                            </td>
                                            <td  class="v-middle text-left">                                                
                                                <div class="col-md-12">
                                                    <input class="form-control numerico" v-model="cambioNota.nota" required=""></input>
                                                </div>
                                            </td>
                                            <td>
                                                <a v-on:click="deleteItem(index)" class="btn btn-danger">
                                                    <i class="fa fa-trash-o " aria-hidden="true"></i>
                                                </a>
                                            </td>
                                        </tr>
                                        <tr v-for="(cursoDirigido , index) in resolucion.cursoDirigido" v-if="isCursoDirigido"> 
                                            <td class="v-middle text-center">
                                                <div class="form-group">
                                                    <div class="col-md-12">
                                                        <multiselect v-model="cursoDirigido.alumno" 
                                                                     v-bind:options='alumnos'
                                                                     v-on:search-change="loadAlumno"
                                                                     v-bind:custom-label='customLabel'
                                                                     track-by='id'
                                                                     v-bind:show-labels="false"
                                                                     v-bind:allow-empty="false"
                                                                     deselect-label="No se puede eliminar este valor"
                                                                     v-bind:internal-search='false'
                                                                     placeholder="Ingresa un caracter como mínimo" >
                                                            <template slot="option" slot-scope="props">
                                                                <div class="option__desc">
                                                                    <span class="option__title block bold">{{ props.option.persona.nombreCompleto }} </span>
                                                                    <span class="option__small">{{ props.option.persona.tipoDocumento.simbolo }} - {{ props.option.persona.numeroDocIdentidad }}</span>
                                                                </div>
                                                            </template>
                                                        </multiselect>
                                                        <input v-model="cursoDirigido.alumno" required="true" type="text" class="hide"/>
                                                    </div>
                                                </div>
                                            </td>
                                            <td class="v-middle text-center">
                                                <span v-if="resolucion.tipoResolucion != null" class="block text-muted" v-text="resolucion.tipoResolucion.nombre"></span>
                                            </td>
                                            <td class="v-middle text-left">
                                                <input class="form-control" v-if="!cursoDirigido.seleccionado" v-model="cursoDirigido.motivoRechazo" required="true" type="text"/>
                                            </td>
                                            <td class="v-middle text-left">
                                                <div class="col-md-12" v-if="cursoDirigido.seleccionado">
                                                    <div class="form-group">
                                                        <multiselect 
                                                            v-model="cursoDirigido.docenteAsignado" 
                                                            v-bind:options="docentes"
                                                            v-on:search-change="findDocente"
                                                            placeholder="Seleccione un docente"
                                                            label="nombre"
                                                            v-bind:show-labels="false"
                                                            v-bind:custom-label='customLabelDocente'
                                                            v-bind:allow-empty="false"
                                                            deselect-label="No se puede eliminar este valor"
                                                            track-by="id" 
                                                            required="true"
                                                            >
                                                        </multiselect>
                                                        <input v-model="cursoDirigido.docenteAsignado" required="true" type="text" class="hide"/>
                                                    </div>
                                                </div>
                                            </td>
                                            <td>
                                                <label class="switch">
                                                    <input type="checkbox" 
                                                           v-bind:value="cursoDirigido.seleccionado" 
                                                           v-model="cursoDirigido.seleccionado"
                                                           checked="1"/>
                                                    <span class="slider round"></span>
                                                </label>
                                            </td>
                                            <td>
                                                <a v-on:click="deleteItem(index)" class="btn btn-danger">
                                                    <i class="fa fa-trash-o " aria-hidden="true"></i>
                                                </a>
                                            </td>
                                        </tr>
                                        <tr v-for="(tramiteTraslado , index) in resolucion.tramiteTraslado" v-if="isTraslado"> 
                                            <td class="v-middle text-center">
                                                <div class="form-group">
                                                    <div class="col-md-12">
                                                        <multiselect v-model="tramiteTraslado.alumno" 
                                                                     v-bind:options='alumnos'
                                                                     v-on:search-change="loadAlumno"
                                                                     v-bind:custom-label='customLabel'
                                                                     track-by='id'
                                                                     v-bind:show-labels="false"
                                                                     v-bind:allow-empty="false"
                                                                     deselect-label="No se puede eliminar este valor"
                                                                     v-bind:internal-search='false'
                                                                     placeholder="Ingresa un caracter como mínimo" >
                                                            <template slot="option" slot-scope="props">
                                                                <div class="option__desc">
                                                                    <span class="option__title block bold">{{ props.option.persona.nombreCompleto }} </span>
                                                                    <span class="option__small">{{ props.option.persona.tipoDocumento.simbolo }} - {{ props.option.persona.numeroDocIdentidad }}</span>
                                                                </div>
                                                            </template>
                                                        </multiselect>
                                                        <input v-model="tramiteTraslado.alumno" required="true" type="text" class="hide"/>
                                                    </div>
                                                </div>
                                            </td>
                                            <td class="v-middle text-center">
                                                <span v-if="resolucion.tipoResolucion != null" class="block text-muted" v-text="resolucion.tipoResolucion.nombre"></span>
                                            </td> 
                                            <td class="v-middle text-left">
                                                <div class="form-group">
                                                    <multiselect 
                                                        v-model="tramiteTraslado.cicloAcademico" 
                                                        v-bind:options="ciclos"
                                                        placeholder="Seleccione un ciclo"
                                                        label="descripcion"
                                                        track-by="id" 
                                                        required="true"
                                                        v-bind:allow-empty="true"
                                                        deselect-label="No se puede eliminar este valor" 
                                                        >
                                                    </multiselect>
                                                    <input v-model="tramiteTraslado.cicloAcademico" required="true" type="text" class="hide"/>
                                                </div>
                                            </td>
                                            <td class="v-middle text-center">
                                            </td> 
                                            <td class="v-middle text-center">
                                                <a v-on:click="deleteItem(index)" class="btn btn-danger">
                                                    <i class="fa fa-trash-o " aria-hidden="true"></i>
                                                </a>
                                            </td>
                                        </tr>

                                    </tbody>
                                </table>

                                <button type="button" v-on:click="addResolucion" class="btn btn-primary pull-right m-t-md">Agregar Alumno</button>
                                <button type="button" v-on:click="save" class="btn btn-primary pull-left m-t-md">Guardar</button>
                                <!--                                <button type="button" v-on:click="saveResolucion($event)" 
                                                                        th:unless="${resolucion.isEstadoDocConf}"
                                                                        class="btn btn-success pull-right m-t-xs">Guardar</button>
                                
                                                                <button type="button" v-on:click="saveConfirmarResVB($event)" 
                                                                        th:if="${resolucion.isEstadoDocConf}"
                                                                        class="btn btn-success pull-right m-t-xs">Confirmar</button>-->
                            </section>
                        </section>
                    </form>
                </section>
            </div>
            <div th:substituteby="academico/resolucion/resolucionexistentes/resolucionError">
            </div>
        </div>
    </section>

    <div layout:fragment="js">
        <script th:inline="javascript">
            var oficinasJson = /*[[${oficinas.toString()}]]*/ 'json';
            var ciclosJson = /*[[${ciclos.toString()}]]*/ 'json';
            var tiposResolucionJson = /*[[${tiposResolucion.toString()}]]*/ 'json';
        </script>
        <div th:substituteby="_layout/includes :: javascript-vue-upload"></div>
        <div th:substituteby="_modules/vue-modal"/>

        <div th:substituteby="_modules/vue-raptor-table"/>

        <div th:substituteby="_layout/includes :: javascript-bootstrap-datetimepicker"></div>
        <div th:substituteby="_layout/includes :: javacsript-vue-bootstrap-datetimepicker"></div>
        <script th:src="@{/app/academico/resolucion/resolucionexistente/resolucionexistente.js}" charset="utf-8"></script> 
    </div>
</body>
</html>
