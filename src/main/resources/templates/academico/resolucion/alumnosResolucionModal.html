<modal-vik ref="modalAlumnos"
           v-bind="modalAlumnos">
    <div slot="body">
        <div id="divDynatable">
            <table class="table table-condensed">
                <thead>
                    <tr>
                        <th>Alumno</th>
                        <th>Ciclo</th>
                        <th v-if="tipo=='CAM_NOTA'">Curso</th>
                        <th v-if="tipo=='CAM_NOTA'">Nota</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="item in alumnosReincorporacion" v-if="tipo == 'REIC'"
                        >
                        <td>
                            <a class="block" v-text="item.alumno.persona.nombreCompleto"></a>
                            <span class="block" v-text="item.alumno.codigo"></span>
                            <span > {{item.alumno.persona.tipoDocumento.simbolo}} - {{item.alumno.persona.numeroDocIdentidad}}</span>
                        </td>
                        <td>
                            <span v-text="item.cicloReincorporacion.descripcion"></span>
                        </td>

                    </tr>
                    <tr v-for="item in alumnosRetiroCiclo" v-if="tipo == 'RCI'"
                        >
                        <td>
                            <a class="block" v-text="item.alumno.persona.nombreCompleto"></a>
                            <span class="block" v-text="item.alumno.codigo"></span>
                            <span > {{item.alumno.persona.tipoDocumento.simbolo}} - {{item.alumno.persona.numeroDocIdentidad}}</span>
                        </td>
                        <td>
                            <span v-text="item.cicloAcademico.descripcion"></span>
                        </td>

                    </tr>
                    <tr v-for="item in alumnosCambioNota" v-if="tipo == 'CAM_NOTA'"
                        >
                        <td>
                            <a class="block" v-text="item.alumno.persona.nombreCompleto"></a>
                            <span class="block" v-text="item.alumno.codigo"></span>
                            <span > {{item.alumno.persona.tipoDocumento.simbolo}} - {{item.alumno.persona.numeroDocIdentidad}}</span>
                        </td>
                        <td>
                            <span v-text="item.cicloAcademico.descripcion"></span>
                        </td>
                        <td>
                            <span v-text="item.curso.nombre"></span>
                        </td>
                        <td>
                            <span v-text="item.nota"></span>
                        </td>

                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</modal-vik>
