<html layout:decorator="_layout/layout">
    <head>
        <title>Pregunta</title>
    </head>

    <body>

        <div layout:fragment="main">

            <div  id="main">

                <header class="header b-b padder-lg">

                    <h2 th:inline="text"> [[${pregunta.id!=null?'Pregunta '+pregunta.numero:'Nueva Pregunta'}]] </h2>
                    <h2 th:inline="text"> [[${pregunta.examenVirtual.nombre}]]   <b>[[${pregunta.examenVirtual.codigo}]]</b>   [[${cicloAcademico.descripcion}]] </h2>

                </header>

                <section class="wrapper-lg">
                    <section class="panel">
                        <section class="panel-body">


                            <form  data-parsley-validate="true"
                                   th:action="@{/academico/encuestaestudiantil/editor/pregunta/save}"
                                   method="POST"
                                   class="form-horizontal">

                                <input  type="hidden" name="id" th:value="${pregunta.id}"/>
                                <input  type="hidden" name="examenVirtual.id" th:value="${pregunta.examenVirtual.id}"/>

                                <div class="form-group">
                                    <label class="col-sm-2 control-label">Habilitado por</label>
                                    <div class="col-sm-4">
                                        <input type="text"
                                               id="opcionReferencia"
                                               th:value="${pregunta.opcionReferencia!=null?pregunta.opcionReferencia.id:''}"
                                               th:rev="${pregunta.opcionReferencia!=null?pregunta.opcionReferencia.letra:''}"
                                               th:rel="${pregunta.opcionReferencia!=null?pregunta.opcionReferencia.contenido:''}"
                                               th:attr="data-pre=${pregunta.opcionReferencia!=null?pregunta.opcionReferencia.pregunta.numero:''}"
                                               name="opcionReferencia.id"
                                               class="form-control"/>
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label class="col-sm-2 control-label">Categoría</label>
                                    <div class="col-sm-4">

                                        <select name="tema.id"
                                                class="form-control select2singleclear" >
                                            <option></option>
                                            <option th:each="item : ${categorias}"
                                                    th:value="${item.id}"
                                                    th:selected="${pregunta.tema!=null?pregunta.tema.id==item.id:0}"
                                                    th:text="${item.nombre}"></option>
                                        </select>

                                    </div>
                                </div>

                                <div class="form-group">
                                    <label class="col-sm-2 control-label">Tipo</label>
                                    <div class="col-sm-4">
                                        <select class="form-control"
                                                id="tipo"
                                                required="true"
                                                name="tipo">
                                            <option text=""></option>
                                            <option th:each="item : ${tipos}"
                                                    th:selected="${pregunta.tipo==item.name()}"
                                                    th:text="${item.value}" th:value="${item.name()}"></option>
                                        </select>
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label class="col-sm-2 control-label">Contenido</label>
                                    <div class="col-sm-10">
                                        <textarea class="col-sm-4 form-control"
                                                  required="true"
                                                  th:text="${pregunta.texto}"
                                                  name="texto"></textarea>
                                    </div>
                                </div>

                                <div id="placePregunta">
                                    <div th:substituteby="academico/encuestaestudiantil/pregunta/plantillaPreguntaEditar"></div>
                                </div>

                                <div class="text-center m-t-lg">
                                    <a type="button" class="btn btn-link" th:href="@{'/academico/encuestaestudiantil/editor/pregunta/'+${pregunta.examenVirtual.id}}" >Cancelar</a>
                                    <button type="button" class="btn btn-default" id='preview' >Vista previa</button>
                                    <button type="submit" class="btn btn-primary" >Guardar</button>
                                </div>

                            </form>


                        </section>
                    </section>
                </section>



            </div>


            <div id="previewPregunta" type="text/x-jsrender" class="hide">
                <div th:substituteby="academico/encuestaestudiantil/pregunta/preview"></div>
            </div>

            <div id="plantillaPreguntaSimple" type="text/x-jsrender" class="hide">
                <div th:substituteby="academico/encuestaestudiantil/pregunta/plantillaPregunta::simple"></div>
            </div>

            <div id="plantillaRespuestaMultiple" type="text/x-jsrender" class="hide">
                <div th:substituteby="academico/encuestaestudiantil/pregunta/plantillaPregunta::rpta_multiple"></div>
            </div>

            <div id="plantillaPreguntaMultiple" type="text/x-jsrender" class="hide">
                <div th:substituteby="academico/encuestaestudiantil/pregunta/plantillaPregunta::multiple"></div>
            </div>

            <div id="plantillaPreguntaSiNo" type="text/x-jsrender" class="hide">
                <div th:substituteby="academico/encuestaestudiantil/pregunta/plantillaPregunta::sino"></div>
            </div>

            <div id="plantillaPreguntaVeFa" type="text/x-jsrender" class="hide">
                <div th:substituteby="academico/encuestaestudiantil/pregunta/plantillaPregunta::vefa"></div>
            </div>

            <div id="plantillaPreguntaLikert" type="text/x-jsrender" class="hide">
                <div th:substituteby="academico/encuestaestudiantil/pregunta/plantillaPregunta::likert"></div>
            </div>

            <div id="plantillaPreguntaAbierta" type="text/x-jsrender" class="hide">
                <div th:substituteby="academico/encuestaestudiantil/pregunta/plantillaPregunta::abierta"></div>
            </div>

            <script id="plantillaAddOpcion" type="text/x-jsrender" class="hide">
                <div th:substituteby="academico/encuestaestudiantil/pregunta/plantillaPregunta::opcion"></div>
            </script>

            <script id="plantillaAddOpcionMultiple" type="text/x-jsrender" class="hide">
                <div th:substituteby="academico/encuestaestudiantil/pregunta/plantillaPregunta::opcionMultiple"></div>
            </script>

            <script id="templateAddRef" type="text/x-jsrender" class="hide">
                <div th:substituteby="academico/encuestaestudiantil/pregunta/plantillaPregunta::templateAddRef"></div>
            </script>

            <script id="templateRemoveRef" type="text/x-jsrender" class="hide">
                <div th:substituteby="academico/encuestaestudiantil/pregunta/plantillaPregunta::templateRemoveRef"></div>
            </script>

            <script id="templatePreview" type="text/x-jsrender" class="hide">
                <div th:substituteby="academico/encuestaestudiantil/pregunta/preview"></div>
            </script>


        </div>

        <div layout:fragment="js">

            <script  th:inline="javascript" >
                /*<![CDATA[*/
                var tipoLikert = /*[[${pregunta.tipoLikert!=null?pregunta.tipoLikert.id:0}]]*/ '';
                var preguntaid = /*[[${pregunta.id}]]*/ '';
                /*]]>*/
            </script>
            <script th:src="@{/app/academico/encuestaestudiantil/pregunta/preguntaForm.js}" charset="utf-8"></script>
        </div>

    </body>
</html>
