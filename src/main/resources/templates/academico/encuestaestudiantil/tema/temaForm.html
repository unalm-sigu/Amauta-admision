<div class="row">

    <h3>Nuevo Tema</h3>

    <div class="col-sm-12 m-t-lg">

        <form class=""  data-parsley-validate="true">

            <input  type="hidden" name="id" value=""/>
            <input  type="hidden" name="examenVirtual.id" th:value="${encuesta.id}"/>

            <div class="form-group col-sm-12">
                <label>Nombre</label>
                <input  type="text" class="form-control input-sm"
                        required="true"
                        data-trigger="change"
                        maxlength="200"
                        name="nombre" />
            </div>

            <div class="form-group col-sm-12">
                <label>Código</label>
                <input  type="text" class="form-control input-sm"
                        required="true"
                        maxlength="10"
                        data-trigger="change"
                        name="codigo" />
            </div>

            <div class="form-group col-sm-6">
                <label>Sub Títulos</label>
                <input  type="number" class="form-control input-sm"
                        required="true"
                        data-trigger="change"
                        min="0"
                        name="subtitulosVisibles" />
            </div>

            <div class="form-group  col-sm-6">
                <label>Preguntas</label>
                <input  type="number" class="form-control input-sm"
                        required="true"
                        min="0"
                        data-trigger="change"
                        name="preguntasVisibles" />
            </div>

        </form>

        <div class="col-sm-12 text-center m-t-lg">
            <button class="btn btn-link cancelar">Cancelar</button>
            <button class="btn btn-primary guardar">Guardar</button>
        </div>

    </div>
</div>
