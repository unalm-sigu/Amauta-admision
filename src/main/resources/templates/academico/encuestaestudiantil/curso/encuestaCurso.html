<html layout:decorator="_layout/layout">
    <head>
        <title>Encuesta Curso</title>
    </head>
    <body>

        <div layout:fragment="main">

            <div id="main" v-cloak="">

                <header class="header b-b padder-lg">

                    <button
                        v-bind:disabled="generando"
                        class="btn btn-primary pull-right"
                        v-on:click="generarEncuesta"   >
                        <i class="fa fa-spinner fa-spin" v-if="generando" aria-hidden="true"></i>
                        Generar Encuesta
                    </button>

                    <h2 th:inline="text">Encuesta de Cursos  [[${cicloAcademico.descripcion}]] </h2>

                </header>

                <section class="wrapper-lg">
                    <section class="panel">
                        <section class="panel-body">

                            <raptor-table v-bind:url="encuestaURL" ref="load">

                                <template scope="props">
                                    <table class="table table-striped table-hover">
                                        <thead>
                                            <tr>
                                                <th class="col-md-5 v-middle">Curso</th>
                                                <th class="v-middle">Docentes</th>
                                                <th class="col-md-2 text-center v-middle">Periodo Programado</th>
                                                <th class="col-md-1 text-center v-middle">Actividad</th>
                                                <th class="col-md-2 text-center v-middle">Alumnos</th>
                                                <th class="col-md-1 text-center v-middle">Resultados</th>
                                                <th class="col-md-1 text-center v-middle">Estado</th>
                                                <th></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr v-for="item in props.data">
                                                <td class="v-middle">
                                                    <span class="block text-primary h4 bold m-t-xs m-b-xs">
                                                        {{item.grupoSeccion.curso.nombre}}
                                                        <span class="text-muted" style="font-size: 6px;">{{item.id}}</span>
                                                    </span>
                                                    <small class="block text-muted">
                                                        Departamento Académico: 
                                                        {{item.grupoSeccion.curso.departamentoAcademico.nombre}}
                                                    </small>
                                                    <small class="block text-muted">
                                                        Facultad: 
                                                        {{item.grupoSeccion.curso.departamentoAcademico.facultad.nombre}}
                                                    </small>
                                                    <span class="block text-dark">
                                                        {{item.grupoSeccion.curso.codigo}} &nbsp; 
                                                        <i class="fa fa-bookmark-o"></i> {{item.grupoSeccion.curso.tpc}} 
                                                    </span>

                                                    <span v-for="seccion in item.grupoSeccion.secciones"
                                                          class="text-dark h5 block m-t-xs">
                                                        <i class="fa fa-users"></i>
                                                        Sección: {{seccion.codigo2}} &nbsp;|&nbsp; 
                                                        Grupo: {{seccion.grupoHoras.codigo}}
                                                    </span>
                                                </td>

                                                <td class="v-middle text-center">
                                                    <span v-for="seccion in item.grupoSeccion.secciones"
                                                          v-on:click="verDocentes(seccion)"
                                                          class="badge pointer">
                                                        {{seccion.docenteSeccion.length}}
                                                    </span>
                                                </td>

                                                <td class="v-middle text-center">
                                                    <span v-if="item.estado=='ACT'">
                                                        <span class="block m-b-xs"><strong>Desde:</strong> {{item.fechaEncuestaInicio}}</span>
                                                        <span class="block"><strong>Hasta:</strong> {{item.fechaEncuestaFin}}</span>
                                                    </span>
                                                </td>

                                                <td class="v-middle text-center">
                                                    <span v-if="item.estado=='ACT'">
                                                        <div v-if="item.fechaInicio!='' " class="text-primary">
                                                            <span class="block"><strong>Primera:</strong> {{getDia(item.fechaInicio)}}</span>
                                                            <span class="block m-b-xs">{{getHora(item.fechaInicio)}}</span>
                                                            <span class="block"><strong>Última:</strong> {{getDia(item.fechaFin)}}</span>
                                                            <span class="block">{{getHora(item.fechaFin)}}</span>
                                                        </div>
                                                        <div v-else="" class="text-muted">Ninguna</div>
                                                    </span>
                                                </td>

                                                <td class="v-middle text-center">
                                                    <span class="block text-success bold" v-if="item.alumnosEncuestados>0">
                                                        <strong>Encuestados:</strong> {{item.alumnosEncuestados}}
                                                    </span>
                                                    <span class="block"><strong>Iniciales:</strong> {{item.alumnosInicio}}</span>
                                                    <span class="block"><strong>Actuales:</strong> {{item.alumnosFin}}</span>
                                                </td>

                                                <td class="v-middle text-center">
                                                    <span v-if="item.estado=='ACT'">
                                                        <span class="pointer m-r-xs text-primary"><i class="fa fa-list-ul"></i></span>
                                                        <span class="pointer m-r-xs text-success"><i class="fa fa-comments"></i></span>
                                                        <span class="pointer text-warning"><i class="fa fa-bar-chart"></i></span>
                                                    </span>
                                                </td>

                                                <td class="v-middle text-center">

                                                    <span v-if="item.estado=='ACT'" class="label pointer label-success" v-bind:title="item.descripcion">{{item.estadoEnum.value}}</span>
                                                    <span v-if="item.estado=='INA'" class="label pointer label-danger" v-bind:title="item.descripcion">{{item.estadoEnum.value}}</span>
                                                    <span v-if="item.estado=='TEO'" class="label pointer label-warning" v-bind:title="item.descripcion">{{item.estadoEnum.value}}</span>
                                                    <span v-if="item.estado=='ANU'" class="label pointer label-default" v-bind:title="item.descripcion">{{item.estadoEnum.value}}</span>
                                                    <span v-if="item.estado=='CER'" class="label pointer label-primary" v-bind:title="item.descripcion">{{item.estadoEnum.value}}</span>

                                                </td>




                                                <td class="v-middle">
                                                    <div class="actions">
                                                        <a class="dropdown-toggle" href="#" data-toggle="dropdown"><i class="fa fa-cog" aria-hidden="true"></i></a>
                                                        <ul class="dropdown-menu pull-right">

                                                            <li v-if="item.estado=='ACT' "><a  v-on:click.prevent="estado(item)" href="#">Desactivar</a></li>
                                                            <li v-if="item.estado=='INA' "><a  v-on:click.prevent="estado(item)" href="#">Activar</a></li>
                                                            <li v-if="item.estado=='TEO' "><a  v-on:click.prevent="estado(item)" href="#">Activar</a></li>

                                                        </ul>
                                                    </div>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </template>

                            </raptor-table>

                        </section>

                        <modal-vik
                            ref="modalVerDocentes"
                            v-bind="cfgVerDocentes">

                            <div slot="body">
                                <h4 class="m-b">Docentes relacionados a este grupo</h4>
                                <table class="table table-striped">
                                    <thead>
                                        <tr>
                                            <th>Sección</th>
                                            <th>Principal</th>
                                            <th>Docente</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr v-for="docSecc in docentesSecciones">
                                            <td>{{docSecc.seccion.codigo2}}</td>
                                            <td v-if="docSecc.seccion.tipoSeccion != 'PCUR' ">
                                                <i class="fa fa-check" v-if="docSecc.principal==1"></i>
                                            </td>
                                            <td v-else=""></td>
                                            <td>{{docSecc.docente.persona.apellidosNombres}}</td>
                                        </tr>
                                    </tbody>
                                </table>

                            </div>
                        </modal-vik>

                    </section>
                </section>

            </div>

            <div th:substituteby="_modules/vue-modal"></div>

        </div>

        <div layout:fragment="js">
            <div th:substituteby="_modules/vue-raptor-table"></div>
            <script th:src="@{/vendor/sweetalert/dist/sweetalert.min.js}" charset="utf-8"></script>
            <script type="text/javascript" th:src="@{/phobos/modules/vue-modal.js}"></script>
            <script th:src="@{/app/academico/encuestaestudiantil/curso/encuestaCurso.js}" charset="utf-8"></script>
        </div>

    </body>
</html>
