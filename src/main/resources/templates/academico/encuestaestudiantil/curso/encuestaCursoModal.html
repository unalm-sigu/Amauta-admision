<modal-vik ref="modalVerProgreso"
           v-bind="cfgVerProgreso">

    <div slot="body">
        <h4 class="m-b text-center">Generación de encuesta de cursos</h4>

        <div class="alert alert-success text-center" id="divAlert">
            <i class="fa fa-spinner fa-spin fa-lg"></i> {{mensajeProgreso}}
        </div>
        <div class="progress " id="progress">
            <div class="progress-bar progress-bar-success progress-bar-striped active" 
                 v-bind:style="{width:porcentajeProgreso+'%'}">{{porcentajeProgreso}}% de avance</div>
        </div>

    </div>
</modal-vik>

<modal-vik ref="modalEncuestaConfig"
           v-bind="cfgEncuestaConfig"
           v-bind:okaction="saveConfiguracion"
           v-bind:cancelaction="cancelConfiguracion">

    <div slot="body" vclass="panel">

        <div class="text-center">
            <h4>Configuración de la encuesta</h4>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="panel-body">

                    <form id='formConfiguraEncuesta' class="form-horizontal" data-parsley-validate="true">
                        <div class="form-group">
                            <label>Cantidad mínima de alumnos por sección</label>
                            <input type="text"
                                   class="form-control input-sm"
                                   name="cantidadMinimaAlumnos"
                                   v-model="configuraEncuesta.cantidadMinimaAlumnos"
                                   v-bind:value="configuraEncuesta.cantidadMinimaAlumnos"
                                   required="true"/>
                        </div>
                    </form>
                </div>
            </div>

            <div class="col-md-6">
                <div class="panel-body">
                    Fechas en que se efectuarán las encuestas para secciones con un solo curso
                    <table class="table table-condensed m-t">
                        <thead>
                            <tr>
                                <th class="col-md-6 text-center">Fecha inicio</th>
                                <th class="col-md-6 text-center">Fecha fin</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="(periodo,idx) in periodosEncuesta">
                                <td>
                                    <div class="input-group">
                                        <date-picker v-bind:config="configDate" v-bind:wrap="false" v-model="periodo.fechaInicio"></date-picker>
                                        <div class="input-group-addon">
                                            <span class="fa fa-calendar"></span>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <div class="input-group">
                                        <date-picker v-bind:config="configDate" v-bind:wrap="false" v-model="periodo.fechaFin"></date-picker>
                                        <div class="input-group-addon">
                                            <span class="fa fa-calendar"></span>
                                        </div>
                                    </div>
                                </td>
                                <td class="pointer" v-on:click="removePeriodo(idx)">
                                    <i class="fa fa-times text-danger"></i>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <div class="block text-center">
                        <a class="btn btn-sm btn-primary pointer" v-on:click="addPeriodoEncuesta">Agregar periodo</a>
                    </div>
                </div>
            </div>
        </div>

    </div>
</modal-vik>
