<modal-vik
    ref="modalEncuestaConfig"
    v-bind="encuestaConfigModal"
    v-bind:okaction="saveConfiguracion">

    <div slot="body">

        <form id='formConfiguraEncuesta' class="form-horizontal" data-parsley-validate="true">

            <input type="hidden"
                   name="id"
                   v-model="configuraEncuesta.id"
                   required="true"/>

            <input type="hidden"
                   name="encuestaEstudiantil.encuesta.id"
                   v-model="encuestaSelected.id"
                   required="true"/>



            <div class="form-group">
                <label  class="col-sm-5 control-label">Cantidad mínima de alumnos</label>
                <div class="col-sm-5">
                    <input type="text"
                           class="form-control input-sm"
                           name="cantidadMinimaAlumnos"
                           v-model="configuraEncuesta.cantidadMinimaAlumnos"
                           required="true"/>
                </div>
            </div>

            <div class="form-group">
                <label  class="col-sm-5 control-label">Cantidad máxima de docentes</label>
                <div class="col-sm-5">
                    <input type="text"
                           class="form-control input-sm"
                           name="cantidadMaximaDocentes"
                           v-model="configuraEncuesta.cantidadMaximaDocentes"
                           required="true"/>
                </div>
            </div>

            <div class="form-group">
                <div class="col-sm-offset-5 col-sm-10">
                    <div class="checkbox">
                        <label>
                            <input type="checkbox"
                                   name="encuestaTeoriaPractica"
                                   v-model="configuraEncuesta.encuestaTeoriaPractica"
                                   /> Curso teórico practico.
                        </label>
                    </div>
                </div>
            </div>

        </form>

    </div>
</modal-vik>
