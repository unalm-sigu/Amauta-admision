<html layout:decorator="_layout/layout">
    <head>
        <title>Cuotas por Letra</title>
        <style>
            .circle-recorrido {
                display: block;
                border-radius: 50%;
                width: 50px;
                height: 50px;
                overflow: hidden;
                margin: 0 auto;
                line-height: 50px;  
                /*                text-align: center;*/
                font-size: 16px;
                /*                margin-left: 49px;*/
                text-indent: 0;
                vertical-align: middle;
                margin-top: 2px;
                margin-bottom: 2px;
            }

            .circle-recorrido.bgr-success {
                background-color: #2ECC71;
                color: #fff;
            }

            .circle-recorrido.bgr-danger {
                background-color: #E74C3C;
                color: #fff;
            }

            .circle-recorrido.bgr-warning {
                background-color: #F1B41E;
                color: #fff;
            }

            .circle-recorrido.bgr-black {
                background-color: #3C4043;
                color: #fff;
            }

            .circle-recorrido.bgr-default {
                background-color: #979595;
                color: #fff;
            }
        </style>
    </head>

    <body>
        <div layout:fragment="main">
            <div id="cuotadptoVUE">
                <header class="header b-b padder-lg">
                    <h2 th:text="|Cuotas por Letra ${ciclo.descripcion}|">Cuotas por Departamento Académico</h2>
                </header>

                <section class="wrapper-lg">
                    <section class="panel">
                        <section class="panel-body">

                            <div slot="header">
                                <div class="col-md-1 text-right h4 m-t-xs">
                                    Letra
                                </div>
                                <div class="col-md-2">
                                    <multiselect v-model='grupoHoras'                                             
                                                 label="letra"
                                                 placeholder="Seleccione una letra"
                                                 track-by="id"
                                                 v-bind:allow-empty="false"
                                                 v-bind:options="grupos"
                                                 deselect-label=""
                                                 select-label="Seleccione un grupo"
                                                 v-on:input="changeAnexoMain">
                                    </multiselect>
                                </div>
                            </div>


                            <raptor-table v-bind:url="cuotadptoURL" 
                                          v-bind:pagination="pagination" 
                                          v-bind:searcher="false" 
                                          v-bind:paginate="false"  
                                          v-bind:preload="false" ref="raptorCuotaGpoHoras" >

                                <template  scope="props" >
                                    <table class="table table-striped">
                                        <thead> 
                                            <tr> 
                                                <th class="col-md-4">Anexo del boletín</th>
                                                <th class="col-md-2 text-center">Cuotas</th>
                                                <th class="col-md-2 text-center">Utilizadas</th>
                                                <th class="col-md-4">Cantidad Grupos</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr v-for="item in props.data">
                                                <td class="v-middle h5 text-primary">
                                                    {{item.anexoBoletin.nombre}}
                                                </td>
                                                <td class="v-middle text-center"> 
                                                    <div class="circle-recorrido bgr-default text-center">{{item.cuotas}}</div>
                                                </td>
                                                <td class="v-middle text-center">
                                                    <div v-if="item.horasUtilizadas > item.cuotas" 
                                                         class="circle-recorrido bgr-danger text-center" v-text="item.horasUtilizadas"></div>
                                                    <div v-else-if="item.horasUtilizadas == item.cuotas" 
                                                         class="circle-recorrido bgr-success text-center" v-text="item.horasUtilizadas"></div>
                                                    <div v-else="" class="circle-recorrido bgr-warning text-center" v-text="item.horasUtilizadas"></div>
                                                </td>
                                                <td class="v-middle">
                                                    {{item.detalleGrupos}}
                                                </td>   
                                            </tr>
                                        </tbody>
                                    </table>
                                </template>
                            </raptor-table>

                        </section>
                    </section>
                </section>
            </div>

        </div>

        <div layout:fragment="js">
            <script  th:inline="javascript" >
                /*<![CDATA[*/
                var rutaModulo = 'academico/cuotadpto';
                /*]]>*/
            </script>
            <div th:substituteby="_modules/vue-raptor-table"></div>
            <script th:src="@{/app/academico/cuotadpto/cuotaDepartamento.js}" charset="utf-8"></script>
        </div>
    </body>
</html>
