<html layout:decorator="_layout/layout">
    <head>
        <title>Acta de Notas</title>
    <div th:substituteby="_layout/includes :: styles-dynatable"></div>
</head>
<body>
    <div layout:fragment="main">
        <header class="header b-b padder-lg">        
            <h2>Acta de Notas - <span th:text="${cicloAcademico.descripcion}">2016-II</span></h2>

            <span class="block"><strong >Departamento Académico:</strong> <span th:text="${departamentoAcademico.nombre}">Matematicas</span></span>
            <input id="txtDepartamentoAcademico" type="hidden" th:value="${departamentoAcademico.id}"/>
        </header>
        <section class="wrapper-lg">
            <section class="panel m-b-md">
                <section class="panel-body">
                    <div class="col-md-12" >
                        <div class="row">
                            <div class="col-md-3 text-center">
                                <a class="ver-modalidades text-danger pointer" value="1" rel="ABI" >
                                    <span class="h1 block bold" th:text="${resumen.abierto}"></span>
                                    <small class="block m-b-xs">Abiertos</small>
                                </a>
                            </div>
                            <div class="col-md-3 text-center">
                                <a class="ver-modalidades text-black pointer" value="2" rel="CER" >
                                    <span class="h1 block bold" th:text="${resumen.cerrado}"></span>
                                    <small class="block m-b-xs">Cerrados</small>
                                </a>
                            </div>
                            <div class="col-md-3 text-center">
                                <a class="ver-modalidades text-success pointer" value="3" rel="pregrado" >
                                    <span class="h1 block bold" th:text="${resumen.pregrado}"></span>
                                    <small class="block m-b-xs">Pregrado</small>
                                </a>
                            </div>
                            <div class="col-md-3 text-center">
                                <a class="ver-modalidades text-warning pointer" value="4" rel="posgrado">
                                    <span class="h1 block bold" th:text="${resumen.posgrado}" ></span>
                                    <small class="block m-b-xs">Posgrado</small>
                                </a>
                            </div>
                        </div>
                    </div>
                </section>
            </section>
        </section>
        <section class="panel">
            <section class="panel-body">
                <table class="table table-striped" id="dynaTable">
                    <thead> 
                        <tr class=""> 
                            <th class="col-md-4 text-center v-middle">Curso</th>
                            <th class="col-md-2 text-center v-middle">Grupo</th>
                            <th class="col-md-2 text-center v-middle">Docente Principal</th>
                            <th class="col-md-1 text-center v-middle">Versión Acta</th>
                            <th class="col-md-1 text-center v-middle">Estado Sistema Calificación</th>
                            <th class="col-md-1 text-center v-middle">Estado Acta</th>
                            <th class="col-md-1 text-center v-middle">Estado</th>
                            <th class=""></th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </section>
        </section>

        <div th:substituteby="templates/modal"/> 
        <div th:substituteby="academico/systemcalifica/sistema/modalSistema"/>
        <script id="templateGrupos" type="text/x-jsrender" class="hide"><div th:substituteby="academico/acta/templateActasDepartamento"/></script>
    </div>


    <div layout:fragment="js">
        <div th:substituteby="_layout/includes :: javascript-dynatable"/>
        <script th:src="@{/app/academico/acta/actaDepartamento.js}" charset="utf-8"></script>
    </div>

</body>
</html>
