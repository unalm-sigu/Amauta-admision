<html layout:decorator="_layout/layout">
    <head>
        <title>Acta de Notas</title>
    <div th:replace="_layout/includes :: styles-dynatable"></div>
</head>

<body>
    <div layout:fragment="main">

         <header class="header b-b padder-lg">        
            <h2>Acta de Notas - <span th:text="${cicloAcademico.descripcion}">2016-II</span></h2>
            <!-- 
            <span class="block"><strong >Departamento Académico:</strong> <span th:text="${dptoAcad.nombre}">Matematicas</span></span>
            -->
        </header>

        <!--<div th:if="${esOperadorEditor}">-->
            <div class="col-md-3">
                <div class="btn-group">
                    <button type="button" class="btn btn-primary btn-sm dropdown-toggle" data-toggle="dropdown">
                        <i class="fa fa-file-text-o"></i> &nbsp; Reportes &nbsp; <span class="caret"></span>
                    </button>
                    <ul class="dropdown-menu">
                        <li><a th:href="@{'/academico/acta/exportExcel/recordActas'}">Record Actas Pre Grado</a></li>
                        <li th:if="${esOperadorEditor}"><a th:href="@{'/academico/acta/exportExcel/raPostGrado'}">Record Actas Post Grado</a></li>
                    </ul>
                </div>
            </div>
        <!--</div>-->
        <div  id="dynaTable" class="row"></div>

        <script id="templateActas" type="text/x-template" class="hide" >
            <div class="col-xs-12 col-sm-4 col-md-4 col-lg-3" >

                <div class="col-sm-10 col-sm-offset-1 panel qard qard-info depart-academico" rel="{{:idDep}}">
                    <h4>
                        {{:nombreDep}}
                    </h4>

                    <div>
                        <div class="m-b clear">
                            <span class="block clearfix"> 
                                <span class="text-muted">{{:cantidadTotal}} Actas</span>
                            </span>
                            <span class="block clearfix" >
                                <div class="col-sm-12">
                                    <div class="b-r col-md-6">
                                        <span class="clear">
                                            <small class="block text-danger">{{:cantidadAbiertos}}</small>
                                            <small class="block text-danger">Actas Abiertas</small>
                                        </span>
                                    </div>
                                    <div class="col-md-6">
                                        <span class="clear">
                                            <small class="block text-success">{{:cantidadCerrados}}</small>
                                            <small class="block text-success">Actas Cerradas</small>
                                        </span>
                                    </div>
                                </div>
                            </span>
                        </div>
                    </div>

                </div>
            </div>
        </script>

    </div>
    <div layout:fragment="js">
        <div th:replace="_layout/includes :: javascript-dynatable"></div>
        <script th:src="@{/app/academico/acta/acta.js}" charset="utf-8"></script>
    </div>
</body>

</html>
