<html layout:decorator="_layout/layout">
    <head>
        <title>Alumnos visitantes </title>
    <div th:substituteby="_layout/includes :: styles-dynatable"></div>
</head>

<body>
    <div layout:fragment="main">

        <div  id="main">
            <header class="header b-b padder-lg">

                <div class="pull-right m-t-md">
                    <a class="btn btn-info" type="button"   th:href="@{/academico/visitante/alumno/nuevo}"  >Agregar Alumno</a>
                </div>

                <h2 th:inline="text">Alumnos visitantes </h2>

            </header>

            <section class="wrapper-lg">
                <section class="panel">
                    <section class="panel-body">

                        <dynatable />

                    </section>
                </section>
            </section>

        </div>

        <th:block th:replace="academico/visitante/_dynatablealumnovisitante"/>

    </div>

    <div layout:fragment="js">
        <div th:substituteby="_layout/includes :: javascript-dynatable"/>
        <script th:src="@{/vendor/vuejs/vue.js}" charset="utf-8"></script>
        <script type="text/javascript" th:src="@{/phobos/modules/vue-modal.js}"></script>
        <script th:src="@{/app/academico/visitante/alumnoVisitante.js}" charset="utf-8"></script>
    </div>

</body>
</html>
