<html layout:decorator="_layout/layout">
    <head>
        <title>Registro de alumno visitante</title>
    </head>

    <body>

        <div layout:fragment="main">

            <div  id="main">

                <header class="header b-b padder-lg">

                    <div class="pull-right m-t-md">
                        <a class="btn btn-default" type="button"   th:href="@{/academico/visitante/alumno}"  >Regresar</a>
                    </div>

                    <h2 th:inline="text">Registro de Alumno Visitante</h2>
                </header>

                <section class="wrapper-lg">
                    <section class="panel">
                        <section class="panel-body">

                            <p>{{persona.ubicacionNacer}}</p>
                            <p>{{persona.paisNacer}}</p>
                            <p>{{persona.nacionalidad}}</p>
                            <p>{{persona.paisDomicilio}}</p>

                            <form data-parsley-validate="true" method="POST" id="formAlumnoVisitante" >

                                <input type="hidden"  name="id" th:value="${alumnoVisitante.id}"/>
                                <input type="hidden"  name="persona.id" th:value="${alumnoVisitante.persona.id}"/>

                                <div class="panel-body">
                                    <div class="col-xs-12">
                                        <h4 class="m-b-md m-t-md">Datos Generales</h4>
                                    </div>


                                    <div class="col-sm-6">
                                        <div class="form-group">

                                            <label>Tipo de documento de identidad</label>

                                            <select name="persona.tipoDocumento.id"
                                                    v-model="persona.tipoDocumento.id"
                                                    class="form-control" required="true">
                                                <option></option>
                                                <option th:each="tipo : ${tiposDocIdentidad}"
                                                        th:value="${tipo.id}"
                                                        th:selected="${alumnoVisitante.persona.tipoDocumento!=null?alumnoVisitante.persona.tipoDocumento.id==tipo.id:0}"
                                                        th:text="${tipo.nombre}"></option>
                                            </select>

                                        </div>
                                    </div>

                                    <div class="col-sm-6">
                                        <div class="form-group">

                                            <label>Número de documento de identidad</label>

                                            <input type="text"
                                                   v-on:blur="cambiarNumDoc"
                                                   v-model="persona.numeroDocIdentidad"
                                                   v-bind:value="persona.numeroDocIdentidad"
                                                   name="persona.numeroDocIdentidad"
                                                   th:value="${alumnoVisitante.persona.numeroDocIdentidad}"
                                                   class="form-control" required="true"/>

                                        </div>
                                    </div>

                                    <div class="col-sm-6">
                                        <div class="form-group">

                                            <label>Apellido Paterno</label>

                                            <input type="text"
                                                   name="persona.paterno"
                                                   v-bind:value="persona.paterno"
                                                   v-on:change="nombrePersona"
                                                   th:value="${alumnoVisitante.persona.paterno}"
                                                   class="form-control"/>

                                        </div>
                                    </div>

                                    <div class="col-sm-6">
                                        <div class="form-group">

                                            <label>Apellido Materno</label>

                                            <input type="text"
                                                   name="persona.materno"
                                                   v-bind:value="persona.materno"
                                                   v-on:change="nombrePersona"
                                                   th:value="${alumnoVisitante.persona.materno}"
                                                   class="form-control"/>

                                        </div>
                                    </div>

                                    <div class="col-sm-6">
                                        <div class="form-group">
                                            <label>Nombres</label>

                                            <input type="text"
                                                   name="persona.nombres"
                                                   required="true"
                                                   v-bind:value="persona.nombres"
                                                   v-on:change="nombrePersona"
                                                   th:value="${alumnoVisitante.persona.nombres}"
                                                   class="form-control"/>

                                        </div>
                                    </div>

                                    <div class="col-sm-6">
                                        <div class="form-group">
                                            <label>Sexo</label>

                                            <div class="form-group">
                                                <div class="col-sm-10">
                                                    <div class="col-sm-5">

                                                        <label class="radio inline">

                                                            <input  type="radio"
                                                                    required="true"
                                                                    name="persona.sexo"
                                                                    id="inlineCheckbox1"
                                                                    value="M"
                                                                    v-model="persona.sexo"
                                                                    th:checked="${alumnoVisitante.persona.sexo=='M'}" /> Masculino
                                                        </label>

                                                    </div>
                                                    <div class="col-sm-5">

                                                        <label class="radio inline">
                                                            <input  type="radio"
                                                                    required="true"
                                                                    name="persona.sexo"
                                                                    id="inlineCheckbox2"
                                                                    value="F"
                                                                    v-model="persona.sexo"
                                                                    th:checked="${alumnoVisitante.persona.sexo=='F'}" /> Femenino
                                                        </label>

                                                    </div>
                                                </div>
                                            </div>

                                        </div>
                                    </div>

                                    <div class="col-xs-12">
                                        <h4  class="m-b-md m-t-md"> Lugar y fecha de nacimiento </h4>
                                    </div>

                                    <div class="col-sm-6">
                                        <div class="form-group">
                                            <label>País</label>
                                            <input id="paisNacimiento" type="text"
                                                   class="form-control input-s-full buscar-pais"
                                                   name="persona.paisNacer.id"
                                                   data-trigger="change"
                                                   v-model="persona.paisNacer.id"
                                                   th:attr="codigo=${helper.showCodigoPais(alumnoVisitante.persona.paisNacer)}"
                                                   th:rel="${alumnoVisitante.persona.paisNacer != null}? ${alumnoVisitante.persona.paisNacer.nombre}"
                                                   th:value="${alumnoVisitante.persona.paisNacer != null}? ${alumnoVisitante.persona.paisNacer.id}"
                                                   required="true"/>
                                        </div>
                                    </div>

                                    <div class="col-sm-6">

                                        <ubicacionnacer 
                                            v-if="persona.ubicacionNacer.id!=null"  
                                            v-model="persona"
                                            v-bind:persona="persona"
                                            />
                                        
                                    </div>

                                    <div class="col-sm-6">
                                        <div class="form-group">

                                            <label>Fecha ( día / mes / año )</label>
                                            <div class="input-group date">

                                                <input type="text"
                                                       data-parsley-errors-container="#errorfechaNacer"
                                                       th:value="${alumnoVisitante.persona.fechaNacer}? ${#dates.format(alumnoVisitante.persona.fechaNacer,'dd/MM/yyyy')}"
                                                       class="form-control"
                                                       v-model="persona.fechaNacer"
                                                       name="persona.fechaNacer" required="true" />

                                                <span class="input-group-addon">
                                                    <i class="fa fa-calendar" aria-hidden="true"></i>
                                                </span>

                                            </div>
                                            <span id="errorfechaNacer"></span>
                                        </div>
                                    </div>

                                    <div class="col-sm-6">
                                        <div class="form-group">

                                            <label>Nacionalidad (Ingresa el país de tu nacionalidad)</label>

                                            <input type="text"
                                                   class="form-control input-s-full buscar-pais"
                                                   name="persona.nacionalidad.id"
                                                   id="nacionalidad"
                                                   data-trigger="change"
                                                   v-model="persona.nacionalidad.id"
                                                   th:rel="${alumnoVisitante.persona.nacionalidad != null}? ${alumnoVisitante.persona.nacionalidad.nombre}"
                                                   th:value="${alumnoVisitante.persona.nacionalidad != null}? ${alumnoVisitante.persona.nacionalidad.id}"
                                                   required="true"/>

                                        </div>
                                    </div>

                                    <div class="col-xs-12">
                                        <h4  class="m-b-md m-t-md">Contacto</h4>
                                    </div>

                                    <div class="col-sm-4">
                                        <div class="form-group">

                                            <label>Teléfono</label>

                                            <input type="text"
                                                   name="persona.telefono"
                                                   v-model="persona.telefono"
                                                   th:value="${alumnoVisitante.persona.telefono}"
                                                   class="form-control sin-espacios numerico"/>

                                        </div>
                                    </div>

                                    <div class="col-sm-4">
                                        <div class="form-group">

                                            <label>Celular</label>

                                            <input type="text"
                                                   name="persona.celular"
                                                   v-model="persona.celular"
                                                   th:value="${alumnoVisitante.persona.celular}"
                                                   class="form-control sin-espacios numerico"/>

                                        </div>
                                    </div>

                                    <div class="col-sm-4">
                                        <div class="form-group">

                                            <label>Correo Electrónico</label>

                                            <input type="text"
                                                   name="persona.email"
                                                   v-model="persona.email"
                                                   th:value="${alumnoVisitante.persona.email}"
                                                   class="form-control verificar-email"/>

                                        </div>
                                    </div>
                                    <div class="col-xs-12">
                                        <h4  class="m-b-md m-t-md">Domicilio</h4>
                                    </div>

                                    <div class="col-sm-6">
                                        <div class="form-group">

                                            <label>País Domicilio</label>

                                            <input type="text"
                                                   id="paisDomicilio"
                                                   class="form-control"
                                                   name="persona.paisDomicilio.id"
                                                   v-model="persona.paisDomicilio.id"
                                                   data-trigger="change"
                                                   th:rel="${helper.getParentTree(alumnoVisitante,'persona.paisDomicilio.nombre')}"
                                                   th:value="${helper.getParentTree(alumnoVisitante,'persona.paisDomicilio.id')}"
                                                   required="true"/>

                                        </div>
                                    </div>

                                    <div v-if="showUbicacionDomicilio"   class="col-sm-6">
                                        <div class="form-group">

                                            <label>Ubicación Domicilio</label>

                                            <input type="text"
                                                   id="ubicacionDomicilio"
                                                   class="form-control buscar-distrito"
                                                   name="persona.ubicacionDomicilio.id"
                                                   data-trigger="change"
                                                   v-model="persona.ubicacionDomicilio.id"
                                                   th:rel="${helper.getParentTree(alumnoVisitante,'persona.ubicacionDomicilio.nombre')}"
                                                   th:value="${helper.getParentTree(alumnoVisitante,'persona.ubicacionDomicilio.id')}"
                                                   required="true"/>

                                        </div>
                                    </div>

                                    <div class="col-sm-6">
                                        <div class="form-group">

                                            <label class="bold">Dirección</label>

                                            <input type="text"
                                                   class="form-control"
                                                   name="persona.direccion"
                                                   v-model="persona.direccion"
                                                   th:value="${alumnoVisitante.persona.direccion}"
                                                   data-trigger="change" required="true" />

                                        </div>
                                    </div>

                                    <div class="col-xs-12">
                                        <h4>Datos de la universidad de procedencia</h4>
                                    </div>


                                    <div class="col-sm-6">
                                        <div class="form-group">

                                            <label>País de la universidad</label>

                                            <input type="text"
                                                   id="paisUniversidad"
                                                   class="form-control buscar-pais"
                                                   name="paisUniversidad.id"
                                                   data-trigger="change"
                                                   th:rel="${helper.getParentTree(alumnoVisitante,'paisUniversidad.nombre')}"
                                                   th:value="${helper.getParentTree(alumnoVisitante,'paisUniversidad.id')}"
                                                   required="true"/>

                                        </div>
                                    </div>

                                    <div v-if="showUniverdidadName"   class="col-sm-6">
                                        <div class="form-group">

                                            <label>Nombre de la Universidad</label>

                                            <input class="form-control"
                                                   name="universidadExtranjera"
                                                   id="universidadExtranjeraName"
                                                   required="true"
                                                   th:value="${alumnoVisitante.universidadExtranjera}"/>

                                        </div>
                                    </div>

                                    <div  v-if="showUniverdidadPeru" class="col-sm-6">
                                        <div class="form-group">

                                            <label>Universidad Peruana</label>

                                            <input class="form-control"
                                                   id="univ-peru"
                                                   required="true"
                                                   th:rel="${alumnoVisitante.universidad != null}? ${alumnoVisitante.universidad.nombre}"
                                                   th:value="${alumnoVisitante.universidad != null}? ${alumnoVisitante.universidad.id}"
                                                   name="universidad.id"/>

                                        </div>
                                    </div>

                                    <div class="col-sm-6">
                                        <div class="form-group">

                                            <label>Ciclo Académico</label>

                                            <select name="cicloEstudia.id"
                                                    class="form-control" required="true">
                                                <option></option>

                                                <option th:each="ciclo : ${ciclos}"
                                                        th:value="${ciclo.id}"
                                                        v-model="alumnoVisitante.cicloEstudia.id"
                                                        th:selected="${alumnoVisitante.cicloEstudia!=null?alumnoVisitante.cicloEstudia.id==ciclo.id:0}"
                                                        th:text="${ciclo.descripcion}"></option>

                                            </select>

                                        </div>
                                    </div>

                                </div>

                                <hr/>

                                <div class="col-md-12 text-center">
                                    <button type="button" class="btn btn-success"  v-on:click.prevent="submitForm">Guardar</button>
                                </div>

                                <input type="hidden" id="mensajeError" th:value='${mensaje}'/>

                            </form>

                        </section>
                    </section>
                </section>

            </div>

            <th:block th:replace="academico/visitante/alumnovisitanteformtemp"/>

            <div th:substituteby="_modules/vue-modal"/>

            <script  th:inline="javascript" >
                /*<![CDATA[*/
                var showLugarNacimiento = /*[[${alumnoVisitante.persona.ubicacionNacer != null}]]*/'';
                var showUniverdidadName = /*[[${alumnoVisitante.universidadExtranjera!=null}]]*/'';
                var showUniverdidadPeru = /*[[${alumnoVisitante.universidad!=null}]]*/ '';
                var codigoPaisUniversidad = /*[[${alumnoVisitante.paisUniversidad!=null?alumnoVisitante.paisUniversidad.codigo:''}]]*/ '';
                var codigoPaisDomicilio = /*[[${alumnoVisitante.persona.paisDomicilio!=null?alumnoVisitante.persona.paisDomicilio.codigo:''}]]*/ '';
                /*]]>*/
            </script>

        </div>

        <div layout:fragment="js">
            <div th:substituteby="_layout/includes :: vuemodal"/>
            <script th:src="@{/app/academico/visitante/alumnoVisitanteUbicacion.js}" charset="utf-8"></script>
            <script th:src="@{/app/academico/visitante/alumnoVisitanteForm.js}" charset="utf-8"></script>
        </div>

    </body>
</html>
