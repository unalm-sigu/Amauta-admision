<template id="dynatableTemplate">
    <transition name="fade">

        <div class="panel padder-v">
            <table id="dynaTable" class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th class="col-xs-4"></th>
                        <th class="col-xs-2 text-center">Carrera</th>
                        <th class="col-xs-4 text-center">Universidad</th>
                        <th class="col-xs-2 text-center">Ciclo visita</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="dynaTbody">
                    <tr></tr>
                </tbody>
            </table>
        </div>

    </transition>
</template>

<template  type="text/x-template" id="dynatableRowTemplate">
    <tr>

        <td class="v-middle">
            <p class="h5 bold text-primary">
                {{visitante.nombre}}
            </p>
            <span class="block"> {{visitante.codigo}}</span>
            <small class="block bold"
                   v-if="visitante.nroDocumento">
                {{visitante.tipoDoc}} {{visitante.nroDocumento}}
            </small>
        </td>

        <td class="v-middle text-center">
            <p class="">{{visitante.carrera}}</p>
            <span v-if="becado.facultad" class="text-muted">Facultad de {{visitante.facultad}}</span>
        </td>

        <td class="v-middle">
            <span class="block">{{visitante.universidad}}</span>
            <span class="bold block text-sm">{{visitante.paisUniversidad}}</span>
        </td>

        <td class="v-middle  text-center">
            <span class="">{{visitante.ciclo}}</span>
        </td>


        <td class="v-middle">
            <div class="dropdown actions">
                <a class="dropdown-toggle" data-toggle="dropdown">
                    <i class="glyphicon glyphicon-option-vertical"></i>
                </a>
                <ul class="dropdown-menu pull-right">
                    <li><a class=""   v-on:click.prevent="editar(visitante.id)"  href="#">Editar Visitante</a></li>
                    <li role="presentation" class="divider"></li>
                    <li><a class=""   v-on:click.prevent="eliminar(visitante.id)"  href="#">Eliminar Visitante</a></li>
                </ul>
            </div>
        </td>

    </tr>
</template>
