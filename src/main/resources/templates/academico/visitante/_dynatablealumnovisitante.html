<template id="dynatableTemplate">
    <transition name="fade">

        <div class="panel padder-v">
            <table id="dynaTable" class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th class="col-xs-4">Alumno</th>
                        <th class="col-xs-2  text-center">Carrera</th>
                        <th class="col-xs-2  text-center">Monto</th>
                        <th class="col-xs-2  text-center">Destino</th>
                        <th class="col-xs-1  text-center">Ciclo</th>
                        <th class="col-xs-1  text-center">Estado</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="dynaTbody">
                    <tr></tr>
                </tbody>
            </table>
        </div>

    </transition>
</template>

<template  type="text/x-template" id="dynatableRowTemplate">
    <tr>

        <td class="v-middle">
            <p class="h5 bold">
                {{ becado.nombre}}
            </p>
            <small class="block  text-muted">
                <span v-if="becado.numeroMatricula">/ &nbsp; Nº Matrícula {{becado.numeroMatricula}} &nbsp; </span>
                {{becado.codigo}} &nbsp; <i class="fa fa-bookmark-o"></i> {{becado.documento}} &nbsp;
            </small>
        </td>

        <td class="v-middle text-center">
            <p class="">{{becado.carrera}}</p>
            <span v-if="becado.facultad" class="text-muted">Facultad de {{becado.facultad}}</span>
        </td>

        <td class="v-middle  text-center">
            <span class="">{{becado.monto}}</span>
        </td>

        <td class="v-middle  text-center">
            <span class="">Facultad: {{becado.destinoFacultad}}</span>
            <span class="bold">{{becado.destinoUniversidad}}</span>
        </td>

        <td class="v-middle  text-center">
            <span class="">{{becado.ciclo}}</span>
        </td>

        <td class="v-middle  text-center">
            <span v-if="becado.estado=='INA'" class="label label-default" >Inactivo</span>
            <span v-if="becado.estado=='ACT'" class="label label-primary" >Activo</span>
        </td>

        <td class="v-middle">
            <div class="dropdown actions">
                <a class="dropdown-toggle" data-toggle="dropdown">
                    <i class="glyphicon glyphicon-option-vertical"></i>
                </a>
                <ul class="dropdown-menu pull-right">
                    <li><a class=""   v-on:click.prevent="editar(becado.id)"  href="#">Editar Becado</a></li>
                    <li role="presentation" class="divider"></li>
                    <li><a class=""   v-on:click.prevent="eliminar(becado.id)"  href="#">Eliminar Becado</a></li>
                </ul>
            </div>
        </td>

    </tr>
</template>
