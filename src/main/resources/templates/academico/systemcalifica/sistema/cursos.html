<html layout:decorator="zlayout/layout">
    <head>
        <title>Cursos del Sistema de Calificación</title>
    </head>

    <body>
        <div layout:fragment="main">
            <header class="page-header">
                <h2>Cursos Asignados</h2>
                <input type="hidden" name="plancalificacion.id" th:value="${planCalificacion.id}"/>
                <span class="block"><strong>Sistema de Calificación:</strong> <span th:text="${planCalificacion.codigo}">SC-004</span></span>
                <span class="block"><strong>Departamento Académico:</strong> <span th:text="${dptoAcad.nombre}">Matematicas</span></span>
                <span class="block"><strong>Formula:</strong> <span th:text="${planCalificacion.formula}">1EP(20) + 1EF(30) + 5(1)PC(40) + 3(1)TA(10)</span></span>
                <span class="block"><strong>Sistema de Notas:</strong> <span th:text="${planCalificacion.sistemaNotas.nombre}">0 al 20</span></span>
                <span class="block m-b"><strong>Nota Base:</strong> <span th:text="${planCalificacion.notaBase}">20</span></span>
            </header>


            <section class="panel">
                <section class="panel-body">
                    <table class="table table-striped" id="dynaTable">
                        <thead>
                            <tr class=""> 
                                <th class="col-md-1 v-middle text-center">Código</th>
                                <th class="col-md-8 v-middle">Curso</th>
                                <th class="col-md-2 v-middle text-center">Fecha de Inclusión</th>
                                <th class="col-md-1 v-middle text-center">TPC</th>
                                <th class=""></th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>

                    <div class="text-center block">
                        <a href="#" class="btn btn-primary" id="btnAddCurso">Agregar curso</a>
                    </div>
                </section>
            </section>



            <div th:substituteby="templates/modal"/> 
            <div th:substituteby="/academico/systemcalifica/sistema/modalCursos"/>
            <script id="templateCursos" type="text/x-jsrender" class="hide"><div th:substituteby="/academico/systemcalifica/sistema/templateCursos"/></script>
        </div>

        <div layout:fragment="js">
            <div th:substituteby="zlayout/includes :: javascript-dynatable"/>
            <script th:src="@{/app/academico/systemcalifica/sistema/cursos.js}" charset="utf-8"></script>
        </div>
    </body>
</html>
