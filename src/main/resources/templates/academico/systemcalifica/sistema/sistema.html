<html layout:decorator="_layout/layout">
    <head>
        <title>Lista de Ciclos</title>
    <div th:substituteby="_layout/includes :: styles-dynatable"></div>
</head>

<body>
    <div layout:fragment="main">
        <header class="header b-b padder-lg">
            <div class="pull-right m-t" >
                <a class="btn btn-success nuevo-sistema" href="#" >Nuevo Sistema</a>
            </div>

            <h2>Sistemas de Calificación</h2>
            <!--<span class="block">Departamento Académico: <span th:text="${dptoAcad.nombre}">dfdf</span></span>-->
        </header>

        <section class="panel">
            <section class="panel-body">

                <div class="hide m-t-lg col-lg-6" id="headDynatable">
                    <div class="">
                        <select class="form-control select2" id="departamento">
                            <option th:each="dpto : ${departamentos}"
                                    th:value="${dpto.id}"
                                    th:text="${dpto.nombre}"></option>
                        </select>
                    </div>
                </div>

                <table class="table table-striped" id="dynaTable">
                    <thead> 
                        <tr class=""> 
                            <th class="col-md-3">Código</th>
                            <th class="col-md-2">Fórmula</th>
                            <th class="col-md-1 text-center">Origen</th>
                            <th class="col-md-1 text-center">Tipo Ciclo</th>
                            <th class="col-md-2 text-center">Fecha Registro</th>
                            <th class="col-md-2 text-center">Cursos Asignados</th>
                            <th class="col-md-1 text-center">Estado</th>
                            <th class=""></th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </section>
        </section>

        <div th:substituteby="templates/modal"/> 
        <div th:substituteby="academico/systemcalifica/sistema/modalSistema"/>
        <script id="templateSistema" type="text/x-jsrender" class="hide"><div th:substituteby="academico/systemcalifica/sistema/templateSistema"/></script>
    </div>

    <div layout:fragment="js">
        <div th:substituteby="_layout/includes :: javascript-dynatable"/>
        <script th:src="@{/app/academico/systemcalifica/sistema/sistema.js}" charset="utf-8"></script>
    </div>
</body>
</html>
