

<div class="row">
    <div class="col-md-6">
        <div class="block">
            <strong>Descripcion:</strong> 
            <span th:text="${planCalificacion.descripcion}">100</span>
        </div>

        <div>
            <strong>Nota Base:</strong> 
            <span th:text="${planCalificacion.notaBase}">100</span>
        </div>
    </div>
    <div class="col-md-6">
        <div class="block">
            <strong>Formula:</strong> 

            <span th:text="${planCalificacion.formula}">1EP(20) + 1EF(30) + 5(1)PC(40) + 3(1)TA(10)</span>
        </div>
        <div>
            <strong>Sistema de Notas:</strong>

            <span th:text="${planCalificacion.sistemaNotas.nombre}">1 al 20</span>
        </div>
    </div>
</div>

<span class="block m-b">Estado: <span class="label label-success" 
                                      th:text="${planCalificacion.estadoEnum.value}">Creado</span></span>

<table class="table table-striped m-t-lg">
    <thead>
        <tr class=""> 
            <th class="col-md-2 text-center">Código</th>
            <th class="col-md-8">Tipo Calificación</th>
            <!--<th class="col-md-2 text-center">Cantidad</th>-->
            <th class="col-md-2 text-center">Peso Total</th>
            <!--<th class="col-md-2 text-center">Nota Min. Anulable</th>-->
            <!--<th class="col-md-1 text-center">Porcentaje Var.</th>-->
            <!-- 
          <th class="col-md-3 text-center">Profesor</th>
            -->
        </tr>
    </thead>

    <tbody>
        <tr th:each="evas : ${planCalificacion.evaluacionPlan}">
            <td  class="v-middle text-center"><span th:text="${evas.tipoEvaluacion.codigo}">EP</span></td>

            <td  class="v-middle">
                <span th:text="${evas.tipoEvaluacion.nombre}">Examen Parcial</span>
            </td>
<!--            <td class="text-center v-middle">
                <span class="block" th:text="${evas.cantidadEvaluaciones}" >1</span>
            </td>-->
            <td class="text-center v-middle">
                <span class="block"  th:text="${evas.pesoTotal+ ' %'}"  >20 %</span>
            </td>
<!--            <td class="text-center v-middle">
                <span class="block"  th:if='${evas.notaMinimaAnulable==1}'>Si</span>
                <span class="block"  th:if='${evas.notaMinimaAnulable==0}'>No</span>
            </td>-->
<!--            <td class="text-center v-middle">
                <span class="block"  th:if='${evas.porcentajeVariable==1}'>Si</span>
                <span class="block"  th:if='${evas.porcentajeVariable==0}'>No</span>
            </td>-->
            <!-- 
            <td class="text-center v-middle">
                <span class="label label-default" th:text="${evas.tipoSeccionEnum.value}">Teoria</span>
            </td>
            -->
        </tr>

    </tbody>
</table>


<span class="block m-b" th:if="${tieneCursos}">Cursos </span>



<table th:if="${tieneCursos}" class="table table-striped" id="dynaTable">
    <thead>
        <tr class=""> 
            <th class="col-md-1 v-middle text-center">Código</th>
            <th class="col-md-8 v-middle">Curso</th>
            <th class="col-md-2 v-middle text-center">Fecha de Inclusión</th>
            <th class="col-md-1 v-middle text-center">TPC</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="planCurso : ${planCalificacion.planCalificacionCursos}">
            <td class="v-middle text-center">
                <span th:text="${planCurso.curso.codigo}"></span>
            </td>
            <td class="v-middle">
                <span th:text="${planCurso.curso.nombre}"></span>
            </td>
            <td class="v-middle text-center">
                <span th:if="${planCurso.fechaCreacion}" th:text="${#dates.format(planCurso.fechaCreacion, 'dd/MM/yyyy')}"></span>
            </td>
            <td class="v-middle text-center">
                <span th:text="${planCurso.curso.tpc}"></span>
            </td>
        </tr>

    </tbody>
</table>
