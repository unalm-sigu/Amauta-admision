<html layout:decorator="_layout/layout">
    <head>
        <title>Encuesta Docente</title>
    </head>
    <body>

        <div layout:fragment="main">

            <div  id="main" v-cloak="">

                <header class="header b-b padder-lg">

                    <div class="btn-group pull-right"
                         >
                        <button type="button" class="btn btn-primary dropdown-toggle pull-right" data-toggle="dropdown">
                            <i class="fa fa-random fa-lg"/> &nbsp; Acciones &nbsp; <span class="caret"></span>
                        </button>
                        <ul class="dropdown-menu">
                            <li><a class="pointer" v-on:click="openModalSilabo"> Agregar Silabo </a></li>
                        </ul>
                    </div>

                    <h2 th:inline="text" class="m-b-n">Silabus</h2>

                </header>

                <section class="wrapper-lg">


                    <section class="panel">
                        <section class="panel-body">

                            <raptor-table v-bind:url="silaboURL" ref="load">

                                <template scope="props">
                                    <table class="table table-striped table-hover">
                                        <thead>
                                            <tr>
                                                <th class="col-md-4 v-middle">Curso</th>
                                                <th class="col-md-2 text-center v-middle"></th>
                                                <th class="col-md-1 text-center v-middle">Silabo</th>
                                                <th class="col-md-2 text-center v-middle">Archivo</th>
                                                <th class="col-md-1 text-center v-middle">Estado</th>
                                                <th></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr v-for="item in props.data">
                                                <td class="v-middle">


                                                </td>
                                                <td class="v-middle">


                                                </td>
                                                <td class="v-middle">


                                                </td>
                                                <td class="v-middle">


                                                </td>

                                                <td class="v-middle text-center">

                                                    <span v-if="item.estado=='ACT'" class="label pointer label-success" v-bind:title="item.descripcion">{{item.estadoEnum.value}}</span>
                                                    <span v-if="item.estado=='ANU'" class="label pointer label-default" v-bind:title="item.descripcion">{{item.estadoEnum.value}}</span>
                                                    <span v-if="item.estado=='CER'" class="label pointer label-primary" v-bind:title="item.descripcion">{{item.estadoEnum.value}}</span>

                                                </td>

                                                <td class="v-middle">
                                                    <div class="actions">
                                                        <a class="dropdown-toggle" href="#" data-toggle="dropdown"><i class="fa fa-cog" aria-hidden="true"></i></a>
                                                        <ul class="dropdown-menu pull-right">
                                                            <li v-if="item.estado=='ACT' "><a  v-on:click.prevent="estado(item)" href="#">Desactivar</a></li>
                                                        </ul>
                                                    </div>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </template>

                            </raptor-table>

                        </section>
                    </section>
                    <div th:substituteby="academico/silabo/silaboModal"></div>
                </section>

            </div>

            <div th:substituteby="_modules/vue-modal"></div>

        </div>

        <div layout:fragment="js">
            <div th:substituteby="_modules/vue-raptor-table"></div>
            <script th:src="@{/vendor/sweetalert/dist/sweetalert.min.js}" charset="utf-8"></script>
            <script type="text/javascript" th:src="@{/phobos/modules/vue-modal.js}"></script>
            <script th:src="@{/app/academico/silabo/silabo.js}" charset="utf-8"></script>
        </div>

    </body>
</html>
