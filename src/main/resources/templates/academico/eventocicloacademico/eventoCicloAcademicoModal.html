<modal-vik ref="modalAddEventoCicloAcademico"
           v-bind="addEventoCicloAcademicoaModal"
           v-bind:okaction="saveEventoCicloAcademico">

    <div slot="body">


        <form id="formEventoCicloAcademico" class="form-horizontal"  data-parsley-validate="true">

            <input type="hidden"  name="id" v-bind:value="eventoCicloAcademico.id"/>

            <div class="form-group">
                <label class="control-label col-sm-3">Evento Académico</label>
                <div class="col-sm-9">

                    <select class="form-control"    required="true"  name="eventoAcademico.id" >
                        <option></option>
                        <option
                            th:each="item:${eventos}"
                            th:value="${item.id}"
                            th:text="${item.nombre}">
                        </option>
                    </select>

                </div>
            </div>


            <div class="form-group">
                <label class="control-label col-sm-3">Fecha Inicio</label>
                <div class="col-sm-9">
                    <div class="input-group date">
                        <input type="text"
                               class="form-control"
                               name="fechaInicio"
                               data-parsley-errors-container="#errorfechaInicio"
                               v-bind:value="eventoCicloAcademico.fechaInicio"
                               required="true"/>
                        <span class="input-group-addon">
                            <i class="fa fa-calendar" aria-hidden="true"></i>
                        </span>
                    </div>
                    <span id="errorfechaInicio"></span>
                </div>
            </div>


            <div class="form-group">
                <label class="control-label col-sm-3">Fecha Fin</label>
                <div class="col-sm-9">
                    <div class="input-group date">
                        <input type="text"
                               class="form-control"
                               name="fechaFin"
                               data-parsley-errors-container="#errorfechaFin"
                               v-bind:value="eventoCicloAcademico.fechaFin"
                               required="true"/>
                        <span class="input-group-addon">
                            <i class="fa fa-calendar" aria-hidden="true"></i>
                        </span>
                    </div>
                    <span id="errorfechaFin"></span>
                </div>
            </div>



        </form>

    </div>
</modal-vik>
