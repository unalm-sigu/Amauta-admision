<template id="dynatableTemplate">
    <transition name="fade">

        <div class="panel padder-v">

            <table id="dynaTable" class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th class="col-xs-7 v-middle">Nombre</th>
                        <th class="col-xs-2 v-middle">Fecha Inicio</th>
                        <th class="col-xs-2 v-middle">Fecha Fin</th>
                        <th class="col-xs-1 v-middle">Estado</th>
                        <th class="v-middle"></th>
                    </tr>
                </thead>
                <tbody id="dynaTbody"><tr></tr></tbody>
            </table>

        </div>

    </transition>
</template>

<template  type="text/x-template" id="dynatableRowTemplate">
    <tr>


        <td class="v-middle">
            <p class="text-primary"> {{ eventoCicloAcademico.eventoAcademico.nombre}} </p>
        </td>


        <td class="v-middle">
            <p class=""> {{ eventoCicloAcademico.fechaInicio}} </p>
        </td>


        <td class="v-middle">
            <p class=""> {{ eventoCicloAcademico.fechaFin}} </p>
        </td>


        <td class="v-middle  text-center">
            <span v-if="eventoCicloAcademico.estado=='ACT'" class="label label-success" >Activo</span>
            <span v-if="eventoCicloAcademico.estado=='CRE'" class="label label-default" >Creado</span>
            <span v-if="eventoCicloAcademico.estado=='ANU'" class="label label-danger" >Anulado</span>
        </td>


        <td class="v-middle">
            <div class="dropdown actions">

                <a class="dropdown-toggle" data-toggle="dropdown">
                    <i class="glyphicon glyphicon-option-vertical"></i>
                </a>

                <ul class="dropdown-menu pull-right">
                    <li>
                        <a v-on:click.prevent="editar(eventoCicloAcademico.id)"  href="#">Editar evento</a>
                    </li>
                    <li class="divider"></li>
                    <li>
                        <a v-on:click.prevent="eliminar(eventoCicloAcademico.id)"  href="#">Eliminar evento</a>
                    </li>
                </ul>

            </div>
        </td>

    </tr>
</template>
