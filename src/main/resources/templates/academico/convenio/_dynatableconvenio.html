<template id="dynatableTemplate">
    <transition name="fade">

        <div class="panel padder-v">
            <table id="dynaTable" class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th class="col-xs-4"></th>
                        <th class="col-xs-1 text-center">Vigencia</th>
                        <th class="col-xs-1 text-center">Carreras</th>
                        <th class="col-xs-5 text-center">Descripción</th>
                        <th class="col-xs-1 text-center">Estado</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="dynaTbody">
                    <tr></tr>
                </tbody>
            </table>
        </div>

    </transition>
</template>

<template  type="text/x-template" id="dynatableRowTemplate">
    <tr>

        <td class="v-middle">
            <p class="h5 bold">{{convenio.nombre}}</p>
            <span class="block text-sm text-primary"> {{convenio.institucion}}</span>
            <span class="block text-sm text-primary"> {{convenio.pais}}</span>

            <small class="block  text-sm  text-warning" v-if="convenio.nameDocumento">
                <a v-bind:href="convenio.linkDocumento" class="btn btn-link btn-sm">{{convenio.nameDocumento}}</a>
            </small>

        </td>

        <td class="v-middle text-center">
            <p><b class="text-sm">Inicio:</b>{{convenio.inicio}}</p>
            <p><b class="text-sm">Fin:</b>{{convenio.fin}}</p>
        </td>

        <td class="v-middle">
            <span class="badge block m-t-xxs" v-for="carrera in convenio.carreras">
                {{ carrera.nombre }}
            </span>
        </td>

        <td class="v-middle  text-center">
            {{convenio.descripcion}}
        </td>

        <td class="v-middle  text-center">
            <span v-if="convenio.estado=='DES'" class="label label-danger" >Desactivado</span>
            <span v-if="convenio.estado=='PEN'" class="label label-default" >Pendiente</span>
            <span v-if="convenio.estado=='ACT'" class="label label-primary" >Activo</span>
        </td>

        <td class="v-middle">
            <div class="dropdown actions">
                <a class="dropdown-toggle" data-toggle="dropdown">
                    <i class="glyphicon glyphicon-option-vertical"></i>
                </a>
                <ul class="dropdown-menu pull-right">
                    <li><a v-on:click.prevent="editar(convenio.id)"  href="#">Editar</a></li>
                    <li role="presentation" class="divider"></li>
                    <li><a v-on:click.prevent="eliminar(convenio.id)"  href="#">Eliminar</a></li>
                </ul>
            </div>
        </td>

    </tr>
</template>
