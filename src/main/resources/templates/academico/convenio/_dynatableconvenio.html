<template id="dynatableTemplate">
    <transition name="fade">

        <div class="panel padder-v">
            <table id="dynaTable" class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th class="col-xs-4"></th>
                        <th class="col-xs-2 text-center">Vigencia</th>
                        <th class="col-xs-4 text-center">Carreras</th>
                        <th class="col-xs-2 text-center">Descripción</th>
                        <th class="col-xs-2 text-center">Estado</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="dynaTbody">
                    <tr></tr>
                </tbody>
            </table>
        </div>

    </transition>
</template>

<template  type="text/x-template" id="dynatableRowTemplate">
    <tr>

        <td class="v-middle">

            <p class="h5 bold text-primary">
                {{convenio.nombre}}
            </p>

            <span class="block text-sm text-primary"> {{convenio.universidad}}</span>

            <span class="block text-sm text-primary"> {{convenio.pais}}</span>

            <small class="block  text-sm  text-warning" v-if="convenio.rutaDocumento">
                {{convenio.rutaDocumento}}
            </small>

        </td>

        <td class="v-middle text-center">
            <p class="">{{convenio.carrera}}</p>
            <span v-if="becado.facultad" class="text-muted">Facultad de {{convenio.facultad}}</span>
        </td>

        <td class="v-middle">
            carreras
        </td>

        <td class="v-middle  text-center">
            <span class="">{{convenio.descripcion}}</span>
        </td>
        <td class="v-middle  text-center">
            <span class="">{{convenio.estado}}</span>
        </td>


        <td class="v-middle">
            <div class="dropdown actions">
                <a class="dropdown-toggle" data-toggle="dropdown">
                    <i class="glyphicon glyphicon-option-vertical"></i>
                </a>
                <ul class="dropdown-menu pull-right">
                    <li><a class=""   v-on:click.prevent="editar(convenio.id)"  href="#">Editar Convenio</a></li>
                    <li role="presentation" class="divider"></li>
                    <li><a class=""   v-on:click.prevent="eliminar(convenio.id)"  href="#">Eliminar Convenio</a></li>
                </ul>
            </div>
        </td>

    </tr>
</template>
