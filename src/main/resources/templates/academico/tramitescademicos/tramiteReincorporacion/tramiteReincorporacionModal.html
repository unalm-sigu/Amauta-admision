<modal-simple ref="modalRincorporacion"
           okbtn="Guardar"
           v-bind:okaction="saveRincorporacion">
    <div slot="header">
        <h4 class="modal-title">Agregar Reincorporación</h4>
    </div>
    <div slot="body">
        <div class="modal-body">
            <form id="form" data-parsley-validate="true">
                <div class="row m-b-md">
                    <div class="form-group row">
                        <div class="col-md-12">
                            <label>Alumno</label>
                            <multiselect v-model="reincorporacion.alumno" 
                                         v-bind:options='alumnos'
                                         v-on:search-change="loadAlumno"
                                         track-by='id'
                                         v-bind:show-labels="false"
                                         v-bind:allow-empty="false"
                                         v-bind:internal-search='false'
                                         placeholder=" "                                         
                                         required="true" >
                                <template slot="option" slot-scope="props">
                                    <div class="option__desc">
                                        <span class="option__title block bold">{{ props.option.persona.nombreCompleto }} </span>
                                        <span class="option__small">{{ props.option.persona.tipoDocumento.simbolo }} - {{ props.option.persona.numeroDocIdentidad }}</span>
                                    </div>
                                </template>

                                <template slot="singleLabel" slot-scope="props">
                                    <span class="option__title">
                                        {{ props.option.codigo }} -   {{ props.option.persona.nombreCompleto }}
                                    </span>
                                </template>

                            </multiselect>
                            <input v-model="reincorporacion.alumno" required="true" type="text" class="hide"/>
                        </div>
                    </div>
                    <div class="form-group row">
                        <div class="col-md-12">
                            <label>Ciclo de Reincorporación</label>
                            <multiselect v-model="reincorporacion.cicloReincorporacion" 
                                         v-bind:options='ciclos'
                                         track-by='id'
                                         v-bind:allow-empty="false"
                                         v-bind:show-labels="false"
                                         placeholder=" "      
                                         label="descripcion"
                                         required="true" >
                            </multiselect>
                            <input v-model="reincorporacion.cicloReincorporacion" required="true" type="text" class="hide"/>
                        </div>
                    </div>
                    <div class="form-group row">
                        <div class="col-md-12">
                            <label>Motivo de deserción</label>
                            <textarea class="form-control textarea" v-model="reincorporacion.motivoDesercion" minlength="15" required=""></textarea>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</modal-simple>
