<html layout:decorator="_layout/layout">
    <head>
        <title>Procesar Tramties Academicos</title>
    <div th:replace="_layout/includes :: styles-dynatable"></div>
    <style>
        .td-vacio {
            padding-right: 4px !important;
            padding-left: 4px !important;
        }
        .bg-row {
            background-color: #f9fafc;
        }
    </style>
</head>

<body>
    <div layout:fragment="main">

        <header class="header b-b padder-lg">
            <h2 >Procesar Tramites Academicos</h2>
            <div class="pull-right m-t-md">
                <a class="btn btn-default"   th:href="@{/academico/tramiteacademico}">Regresar</a>
            </div>
        </header>
        <div id="procesarTramitesAcademicos">
            <div v-cloak="">
                <section class="wrapper-lg">
                    <form id="frmEditGpoSeccion">
                        <section class="panel m-b-xs">
                            <section class="panel-body">
                                <section class="panel-body">
                                    <tramite-detalle v-if="tramite" v-bind:tramite="tramite"></tramite-detalle>  
                                </section>
                            </section>
                        </section>
                        <section class="panel m-b-xs">
                            <section class="panel m-b-xs">
                                <section class="panel-body">
                                    <!--<keep-alive> -->
                                    <component ref="procesarComponent" 
                                               v-bind:is="componentForm" 
                                               v-bind="compomentProps" 
                                               v-if="compomentProps"></component> 
                                </section>
                            </section>
                        </section>
                        <section class="panel m-b-xs">
                            <section class="panel-body text-center">
                                <a class="btn btn-success m-r-md"
                                   v-if="tramite"
                                   v-for="accion in tramite.accionesTramitesAcademico"
                                   v-text="accion.opcion"
                                   v-on:click.prevent="procesarTramite(accion)"
                                   >
                                </a>
                                <a class="btn btn-success m-r-md"
                                   v-if="tramite"
                                   v-for="accion in tramite.accionesTramitesDocumentos"
                                   v-text="accion.opcion"
                                   v-on:click.prevent="procesarTramite(accion)"
                                   >
                                </a>
                                <!-- 
                                <a class="btn btn-success" id="cmbAceptar">Revisar Historial</a> -->
                            </section>
                        </section>
                    </form>
                </section>
            </div>
        </div>
        <div th:replace="templates/modal"/>
        <div th:replace="academico/tramitescademicos/component/revisarHistorialComponent"/>
        <div th:replace="academico/tramitescademicos/component/confirmarHistorialComponent"/>
        <div th:replace="academico/alumno/includes/headerInfo"/>
        <div th:replace="academico/alumno/includes/inicio"/>
        <div th:replace="academico/alumno/includes/avance"/>
        <div th:replace="academico/alumno/includes/horario"/>
        <div th:replace="academico/alumno/includes/matricula"/>
        <div th:replace="academico/alumno/includes/malla"/>
        <div th:replace="academico/alumno/includes/historial"/>

    </div>

    <div layout:fragment="js">
        <script th:inline="javascript">

            var tramiteJson = /*[[${tramite.toString()}]]*/ 'json';
            var horasJson = /*[[${horasBD}]]*/ 'json';
        </script>
        
        
        <div th:replace="_modules/vue-raptor-table"/>
        <div th:replace="academico/tramitescademicos/component/tramiteDetalleComponent"/>
        <script th:src="@{/app/academico/tramitesacademicos/component/revisarHistorialComponent.js}" charset="utf-8"></script>
        <script th:src="@{/app/academico/tramitesacademicos/component/confirmarHistorialComponent.js}" charset="utf-8"></script>
        <div th:replace="academico/tramitescademicos/component/agendarComponent"/>
        <div th:replace="academico/tramitescademicos/component/cursoDirigidoComponent"/>
        <div th:replace="_layout/includes :: javascript-dynatable"/>
        <script type="text/javascript" th:src="@{/vue/vue-generalComponents.js}"></script>
        <script th:src="@{/app/academico/alumno/historialComponent.js}" charset="utf-8"></script>
        <script th:src="@{/app/academico/alumno/avanceComponent.js}" charset="utf-8"></script>
        <script th:src="@{/app/academico/alumno/horarioComponent.js}" charset="utf-8"></script>
        <script th:src="@{/app/academico/alumno/matriculaComponent.js}" charset="utf-8"></script>
        <script th:src="@{/app/academico/alumno/mallaComponent.js}" charset="utf-8"></script>

        <script th:src="@{/app/academico/tramitesacademicos/proceso/procesarTramite.js}" charset="utf-8"></script>


    </div>


</body>
</html>
