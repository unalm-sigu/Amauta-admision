<html layout:decorator="_layout/layout">
    <head>
        <link rel="stylesheet" href="../../../public/bootstrap/css/bootstrap.css" type="text/css"/>

        <title>Tramites Titulo</title>
    <div th:substituteby="_layout/includes :: styles-dynatable"></div>
    <style>
        .td-vacio {
            padding-right: 4px !important;
            padding-left: 4px !important;
        }
        .bg-row {
            background-color: #f9fafc;
        }
    </style>
</head>

<body>
    <div layout:fragment="main">
        <div id="tramitesAcademicos">
            <header class="header b-b padder-lg">
                <h2 >Tramite Titulo</h2>
                <div class="pull-right m-t-md">  
                    <a class="btn btn-info" type="button" v-on:click.prevent="nuevo" href="#" >Nuevo</a>
                </div> 
            </header>
            <section  class="wrapper-lg">
                <section class="panel">
                    <section class="panel-body">
                        <raptor-table ref="tblTramitesAcademicos"
                                      v-bind:url="URL_TRAMITES" >
                            <template scope="props">
                                <table class="table table-striped">
                                    <thead>
                                        <tr>
                                            <th class="col-md-2">Trámite</th>
                                            <th class="col-md-col-md-3">Persona</th>
                                            <th class="c">Tipo Tramite</th>
                                            <th class="">Estado</th>
                                            <th class="col-md-3">Registro</th>
                                            <th class="text-center"></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr v-for="item in props.data"> 
                                            <td> 
                                                <small class="block text-muted">Serie: {{item.tramite.serie}}</small>
                                                <small class="block text-muted">Número: {{item.tramite.numero}}</small>
                                            </td>
                                            <td class="v-middle text-left">
                                                <div class="bock ">
                                                    {{ item.tramite.persona.apellidosNombres}}

                                                </div>
                                                <div class="bock bold text-primary">
                                                    {{ item.tramite.alumno.codigo}}
                                                </div>
                                                <div class="bock " v-if="item.tramite.alumno.carrera != null">
                                                    <span class="bold">Facultad</span>
                                                    {{ item.tramite.alumno.carrera.facultad.nombre}}

                                                </div>

                                            </td>
                                            <td class="v-middle text-left">
                                                {{ item.tramite.tipoTramite.nombre}}
                                            </td>
                                            <td class="v-middle text-left">
                                                <small class="block text-muted">Tramite:  {{ item.tramite.estadoEnum.value}}</small>
                                            </td>
                                            <td class="v-middle text-left">
                                                {{item.tramite.userRegistro.persona.apellidosNombres}}
                                                <small class="block text-muted">
                                                    <format-date v-bind:datetext="item.tramite.fechaRegistro"></format-date>
                                                </small>
                                            </td>
                                            <td>
                                                <div class="dropdown actions" >
                                                    <a class="dropdown-toggle" data-toggle="dropdown">
                                                        <i class="fa fa-cog"></i>
                                                    </a> 
                                                    <ul class="dropdown-menu pull-right" > 
                                                        <li><a v-bind:href="urlAcademico(item)">Información académica</a></li>
                                                        <li v-if="item.tramite.tipoTramite.codigo == 'TIT'"><a v-bind:href="urlReporteBachiller(item)">Reporte</a></li>
                                                    </ul>

                                                </div>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </template>
                        </raptor-table>

                    </section>
                </section>
            </section>
            <div th:substituteby="academico/tramitescademicos/tramiteTitulo/tramiteTituloModal"></div>

        </div>
    </div>

    <div layout:fragment="js">

        <div th:substituteby="_modules/vue-raptor-table"></div>
        <script th:src="@{/app/academico/tramitesacademicos/tramiteTitulo/tramitesTitulo.js}" charset="utf-8"></script>

    </div>
</body>
</html>
