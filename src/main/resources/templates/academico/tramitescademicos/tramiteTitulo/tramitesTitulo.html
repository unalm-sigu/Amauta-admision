<html layout:decorator="_layout/layout">

    <head>
        <title>Tramites Titulo</title>
    </head>

    <body>
        <div layout:fragment="main">
            <div id="tramitesAcademicos" v-cloak="">
                <header class="header b-b padder-lg">
                    <h2 th:inline="text">Tramite Titulo  [[${session.SESSION_USUARIO.cicloAcademico!=null?session.SESSION_USUARIO.cicloAcademico.descripcion:''} ]]</h2>
                    <div class="pull-right m-t-md">  
                        <a class="btn btn-info" type="button" v-on:click.prevent="nuevo" href="#" >Nuevo</a>
                    </div> 
                </header>
                <section  class="wrapper-lg">
                    <section class="panel">
                        <section class="panel-body">
                            <raptor-table ref="tblTramitesAcademicos"
                                          v-bind:url="URL_TRAMITES" >
                                <template scope="props">
                                    <table class="table table-striped">
                                        <thead>
                                            <tr>
                                                <th class="col-xs-3">Trámite</th>
                                                <th class="col-xs-2">Persona</th>
                                                <th class="col-xs-2">Resolución</th>
                                                <th class="col-xs-2">Registrado</th>
                                                <th class="col-xs-2">Anulado</th>
                                                <th class="col-xs-1">Estado</th>
                                                <th></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr v-for="item in props.data">
                                                <td class="v-middle">
                                                    <p class="block text-muted">Serie: {{item.tramite.serie}}</p>
                                                    <p class="block text-muted">Número: {{item.tramite.numero}}</p>
                                                </td>
                                                <td class="v-middle text-left">
                                                    <div class="bock ">
                                                        {{ item.tramite.persona.apellidosNombres}}

                                                    </div>
                                                    <div class="bock bold text-primary">
                                                        {{ item.tramite.alumno.codigo}}
                                                    </div>
                                                    <div class="bock " v-if="item.tramite.alumno.carrera">
                                                        <span class="bold">Facultad</span>
                                                        {{ item.tramite.alumno.carrera.facultad.nombre}}

                                                    </div>

                                                </td>

                                                <td class="v-middle text-left">
                                                    <p v-if="item.resolucion" class="text-primary h5">{{item.resolucion.descripcion}}</p>
                                                </td>

                                                <td class="v-middle text-left">
                                                    <p class="bold">{{item.tramite.cicloAcademico.descripcion}}</p>
                                                    {{item.tramite.userRegistro.persona.apellidosNombres}}
                                                    <small class="block text-muted">
                                                        {{item.tramite.fechaRegistro}}
                                                    </small>
                                                </td>

                                                <td class="v-middle text-left">
                                                    <span class="block bold" v-if="item.tramite.estado == 'ANU'"> Motivo </span>
                                                    <span class="block" v-if="item.tramite.estado == 'ANU'"> {{item.motivo}} </span>
                                                    <small class="block text-muted" v-if="item.tramite.estado == 'ANU'">
                                                        <b>{{item.usuarioAnulaTramite.persona.apellidosNombres}}</b>
                                                    </small>
                                                    <small class="block text-muted" v-if="item.tramite.estado == 'ANU'">
                                                        <b>{{item.fechaAnulacion}}</b>
                                                    </small>
                                                </td>

                                                <td class="v-middle text-left">
<!--                                                    <span v-bind:class="labelColor(item.tramite.estado)">Tramite: {{ item.tramite.estadoEnum.value}}</span>-->
                                                    <span v-bind:class="labelColor(item.estado)">C.U.:  {{ getEstadoNombre(item.estado) }}</span>
                                                    <span v-bind:class="labelColor(item.estadoTitulo)">Facultad: {{ getEstadoNombre(item.estadoTitulo) }}</span>
                                                </td>

                                                <td class="v-middle">
                                                    <div class="dropdown actions" >
                                                        <a class="dropdown-toggle" data-toggle="dropdown">
                                                            <i class="fa fa-cog"></i>
                                                        </a> 
                                                        <ul class="dropdown-menu pull-right" > 
                                                            <li><a v-bind:href="urlAcademico(item)">Información académica</a></li>
                                                            <li v-if="item.tramite.tipoTramite.codigo == 'TIT'"><a v-on:click.prevent="urlReporteBachiller(item)" href="#">Reporte</a></li>
                                                            <li v-if="item.estado == 'SOL'" class="pointer"><a v-on:click="anular(item)">Anular</a></li>
                                                        </ul>
                                                    </div>
                                                </td>

                                            </tr>
                                        </tbody>
                                    </table>
                                </template>
                            </raptor-table>

                        </section>
                    </section>
                </section>
                <div th:replace="academico/tramitescademicos/tramiteTitulo/tramiteTituloModal"></div>

            </div>
        </div>

        <div layout:fragment="js">

            <script th:src="@{/app/academico/tramitesacademicos/tramiteTitulo/tramitesTitulo.js}" charset="utf-8"></script>

        </div>
    </body>
</html>
