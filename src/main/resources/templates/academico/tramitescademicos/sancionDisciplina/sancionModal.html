<modal-simple ref="modalNuevo"
              v-bind:okaction="saveSancion"
              v-bind:okbtn="isEditing ? 'Actualizar' : 'Guardar'" >

    <div slot="header">
        <h1>{{ isEditing ? 'Editar Sanción Disciplina' : 'Agregar Sanción Disciplina' }}</h1>
    </div>

    <div slot="body">
        <div class="modal-body">
            <form id="form" data-parsley-validate="true"><!-- method="POST" th:action="@{/academico/matriculable/save}"-->
                <div class="row m-b-md">
                    <div class="form-group row">
                        <div class="col-md-12">
                            <label>Alumno</label>
                            <multiselect v-model="sancionDisciplina.alumno"
                                         v-bind:options='alumnos'
                                         v-on:search-change="loadAlumno"
                                         v-bind:custom-label='customLabel'
                                         track-by='id'
                                         v-bind:show-labels="false"
                                         v-bind:allow-empty="false"
                                         v-bind:internal-search='false'
                                         v-bind:disabled="isEditing"
                                         placeholder="Ingresa un caracter como mínimo"
                                         required="true" >
                                <template slot="option" slot-scope="props">
                                    <div class="option__desc">
                                        <span class="option__title block bold">
                                          {{ props.option.nombreCompleto || props.option.persona?.nombreCompleto }}
                                        </span>
                                        <span class="option__small">
                                             DNI - {{ props.option.numeroDocumento || props.option.persona?.numeroDocIdentidad }}
                                        </span>
                                    </div>
                                </template>
                            </multiselect>
                            <input v-model="sancionDisciplina.alumno" required="true" type="text" class="hide"/>
                        </div>
                    </div>
                    <div class="form-group row">
                        <div class="col-md-12">
                            <label>Ciclo a sancionar</label>
                            <multiselect v-model="sancionDisciplina.cicloAcademico"
                                         v-bind:options='ciclos'
                                         v-bind:multiple="true"
                                         track-by='id'
                                         v-bind:allow-empty="false"
                                         placeholder="Seleccione un ciclo"
                                         label="descripcion"
                                         required="true" >
                            </multiselect>
                            <input v-model="sancionDisciplina.cicloAcademico" required="true" type="text" class="hide"/>
                        </div>
                    </div>
                    <div class="form-group row">
                        <div class="col-md-12">
                            <label>Motivo</label>
                            <textarea class="form-control textarea" v-model="sancionDisciplina.motivo" minlength="15" required=""></textarea>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</modal-simple>

<modal-simple ref="modalEliminarTramite"  okbtn="Anular" okclass="btn-danger"
              v-bind:okaction="anularActionHandler">
    <div slot="body">

        ¿Desea anular el tramite retiro excepcional del alumno?

    </div>
</modal-simple>
