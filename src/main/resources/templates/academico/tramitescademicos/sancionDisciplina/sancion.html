<html layout:decorator="_layout/layout">
<head>
    <title>Tramite Retiro Excepcional</title>
</head>

<body>
<div layout:fragment="main">
    <div id="main" v-cloak="">



        <header class="header b-b padder-lg">

            <h2 th:inline="text">Tramite Sancion Discilplinaria  [[${session.SESSION_USUARIO.cicloAcademico!=null?session.SESSION_USUARIO.cicloAcademico.descripcion:''} ]]</h2>

            <div class="pull-right m-t-md">
                <a class="btn btn-info" type="button"    v-on:click.prevent="nuevo"   href="#" >Nuevo</a>
            </div>
        </header>


        <section  class="wrapper-lg">
            <section class="panel">
                <section class="panel-body">
                    <raptor-table ref="load"
                                  v-bind:url="URL_TRAMITES" >
                        <template scope="props">
                            <table class="table table-striped table-hover">
                                <thead>
                                <tr>
                                    <th class="col-md-2">Trámite</th>
                                    <th class="col-md-4">Persona</th>
                                    <th class="col-md-2">Ciclos Sancionados</th>
                                    <th class="col-md-2">Estado</th>
                                    <th></th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr v-for="item in props.data">
                                    <td class="v-middle text-left">
                                        <span class="block text-muted">Serie: {{item.tramite.serie}}</span>
                                        <span class="block text-muted">Número: {{item.tramite.numero}}</span>
                                    </td>
                                    <td class="v-middle text-left">
                                        <div class="bock " >
                                            {{ item.tramite.persona.apellidosNombres}}

                                        </div>
                                        <div class="bock bold text-primary">
                                            {{ item.tramite.alumno.codigo}}
                                        </div>
                                        <div class="bock " v-if="item.tramite.alumno.carrera != null">
                                            <span class="bold">Facultad</span>
                                            {{ item.tramite.alumno.carrera.facultad.nombre}}

                                        </div>

                                    </td>
                                    <td>
                                        <div>
                                            <span class="small label label-default" v-for="ciclo in item.tramite.ciclos" :key="ciclo.id"  style="margin-right: 5px; margin-bottom: 5px; display: inline-block;">
                                                {{ ciclo.descripcion }}
                                            </span>

                                        </div>
                                    </td>
                                    <td class="text-left">
                                        <div>
                                            Estado Sanción: <span class="label" v-bind:class="labelColor(item.tramite.estadoSancion)">
                                            {{ item.tramite.estadoEnum.value}}
                                            </span>
                                        </div>
                                        <div style="margin-top: 8px;">
                                                        Estado Trámite: <span class="label" v-bind:class="labelColor(item.tramite.estadoTramite)">
                                            {{ item.tramite.estadoTramiteEnum.value}}
                                            </span>
                                        </div>
                                    </td>
                                    <td class="v-middle text-left">
                                        <div class="dropdown actions" >
                                            <a class="dropdown-toggle" data-toggle="dropdown">
                                                <i class="fa fa-cog"></i>
                                            </a>
                                            <ul class="dropdown-menu pull-right" >
                                                <li><a v-bind:href="urlAcademico(item)">Información académica</a></li>
<!--                                                <li ><a target="_blank" >Reporte</a></li>-->
<!--                                                <li role="separator" class="divider"></li>-->
                                                <li><a href="#" v-on:click.prevent="anularSancion(item)">Anular</a></li>
                                            </ul>

                                        </div>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </template>
                    </raptor-table>

                </section>
            </section>
        </section>

        <div th:replace="academico/tramitescademicos/sancionDisciplina/sancionModal"/>

    </div>

</div>

<div layout:fragment="js">

    <script th:inline="javascript">
        var ciclosJson = /*[[${ciclos.toString()}]]*/ '';
    </script>

    <script th:src="@{/app/academico/tramitesacademicos/sancionDisciplina/sancion.js}" charset="utf-8"></script>

</div>

</body>
</html>
