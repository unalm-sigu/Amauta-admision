<template id="dynatableTemplate">
    <transition name="fade">

        <div class="panel padder-v">
            <table id="dynaTable" class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th class="col-xs-2">Carrera</th>
                        <th class="col-xs-2  text-center">Ingresantes</th>
                        <th class="col-xs-2  text-center">Sin Horario</th>
                        <th class="col-xs-2  text-center">Con Horario</th>
                        <th class="col-xs-2  text-center">Matriculados</th>
                        <th class="col-xs-2  text-center">Suspendidos</th>
                    </tr>
                </thead>

                <tbody id="dynaTbody">
                    <tr></tr>
                </tbody>

            </table>
        </div>

    </transition>
</template>

<template  type="text/x-template" id="dynatableRowTemplate">
    <tr>

        <td class="v-middle">
            <a href="#" class="h5 text-muted">
                {{ carrera.nombre}}
            </a>
        </td>

        <td class="v-middle text-center">
            <span class="badge">{{carrera.ingresantes}}</span>
        </td>

        <td class="v-middle  text-center">
            <span class="badge">{{carrera.conHorario}}</span>
        </td>

        <td class="v-middle  text-center">
            <span class="badge">{{carrera.sinHorario}}</span>
        </td>

        <td class="v-middle text-center">
            <span class="badge">{{carrera.matriculados}}</span>
        </td>

        <td class="v-middle text-center">
            <span class="badge">{{carrera.suspendidos}}</span>
        </td>

    </tr>
</template>
