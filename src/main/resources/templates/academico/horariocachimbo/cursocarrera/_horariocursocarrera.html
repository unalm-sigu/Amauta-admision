<modal-vik ref="modalAddCursoCarrera"
           v-bind="addCursoCarreraModal"
           v-bind:okaction="createCursoCarrera">


    <div slot="body">
        <form id="formCursoCarrera"  data-parsley-validate="true">

            <div class="form-group">
                <label>Carrera</label>
                <input type="text"
                       class="form-control"
                       name="carrera.id"
                       v-model="carrera.id"
                       required="true"/>
            </div>

            <table class="table table-condensed" id="tableCurso">
                <thead>
                    <tr>
                        <th class="col-xs-10">Curso</th>
                        <th class="col-xs-1">Créditos</th>
                        <th class="col-xs-1"></th>
                    </tr>
                </thead>
                <tbody>

                </tbody>
                <tfoot>
                    <tr>
                        <td class="text-right v-middle">Total</td>
                        <td class="text-center v-middle">{{total}}</td>
                        <td></td>
                    </tr>
                </tfoot>

            </table>

            <div class="text-center m-t-lg">
                <button type="button" v-on:click.prevent="agregarItem" class="btn btn-sm btn-default">Agregar ítem</button>
            </div>

        </form>
    </div>
</modal-vik>

<modal-vik ref="modalAddSeleccionarClave"
           v-bind="addSeleccionarClaveModal"
           v-bind:okaction="createSeleccionarClave">

    <div slot="body">
        <div class="panel-body">
            
            <div class="block text-primary bold h4 m-t-xs m-b-xs">{{curso.nombre}}</div>
            <small class="block m-t-xs m-b-xs">{{curso.codigo}} &nbsp; <i class="fa fa-bookmark-o"></i> {{curso.tpc}}</small>
            <span class="block m-t-xs m-b text-primary">Carrera: {{curso.carrera}}</span>

            <form id="formSeleccionarClave" >

                <input v-bind:value="curso.id"  name="curso.id"  type="hidden"  />

                <div v-for="gpoSeccion  in grupoSecciones" class="alg-ewer" >

                    <div v-for="seccion  in gpoSeccion.secciones"
                         class="col-xs-1 m-b" v-bind:class="seccion.classTipo">
                        <div class="checkbox ver-anexo"
                             v-on:mouseover="verAnexoSeccion(seccion.anexo)"
                             v-on:mouseleave="verAnexo=false"
                              >
                            <label>
                                <input 
                                    type="checkbox"
                                    v-model="checkedSeccion"
                                    v-bind:name="seccion.id"
                                    v-bind:value="seccion.id"
                                    v-bind:disabled="seccion.tipo=='TCUR'" />

                                <span class="" > {{seccion.codigo}}</span>
                            </label>
                        </div>
                    </div>
                </div>

                <div v-for="( hellSeccion , index  )  in checkedSeccion" >
                    <input type="hidden"  v-bind:name="'secciones['+index+'].id'"    v-bind:value="hellSeccion" />
                </div>
                
                <div class="text-center col-xs-12 alert alert-warning" v-if="verAnexo">{{anexo}}</div>

            </form>

        </div>
    </div>

</modal-vik>
