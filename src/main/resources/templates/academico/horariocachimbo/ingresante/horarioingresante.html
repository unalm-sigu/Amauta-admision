<html layout:decorator="_layout/layout">
    <head>
        <title>Tipo Grupos</title>
    <div th:substituteby="_layout/includes :: styles-dynatable"></div>
</head>

<body>
    <div layout:fragment="main">

        <div  id="main">
            <header class="header b-b padder-lg">
                <div class="btn-group pull-right">
                    <button type="button" class="btn btn-primary dropdown-toggle pull-right" data-toggle="dropdown">
                        <i class="fa fa-random fa-lg"/> &nbsp; Acciones &nbsp; <span class="caret"></span>
                    </button>
                    <ul class="dropdown-menu">
                        <li><a href="#" v-on:click="nuevo" >Agregar Alumno</a></li>
                        <li><a href="#" v-on:click="cargarIngresantes" >Cargar Ingresantes</a></li>
                        <li><a href="#" v-on:click.prevent="eliminarHorarios" >Eliminar Horarios</a></li>
                    </ul>
                </div>

                <h2 th:inline="text">Ingresantes con Horario [[${cicloAcademico.descripcion}]] </h2>
            </header>
            <section class="wrapper-lg">
                <section class="panel">
                    <section class="panel-body">

                        <dynatable />

                    </section>
                </section>
            </section>

            <div th:substituteby="academico/horariocachimbo/ingresante/_horarioingresante"/>

        </div>


        <div th:substituteby="_modules/vue-modal"/>

        <th:block th:replace="academico/horariocachimbo/ingresante/_dynatable"/>

    </div>

    <div layout:fragment="js">
        <div th:substituteby="_layout/includes :: javascript-dynatable"/>
        <script th:src="@{/vendor/sweetalert/dist/sweetalert.min.js}" charset="utf-8"></script>
        <script th:src="@{/vendor/vuejs/vue.js}" charset="utf-8"></script>
        <script type="text/javascript" th:src="@{/phobos/modules/vue-modal.js}"></script>
        <script th:src="@{/app/academico/horariocachimbo/ingresante/horarioingresante.js}" charset="utf-8"></script>
    </div>

</body>
</html>
