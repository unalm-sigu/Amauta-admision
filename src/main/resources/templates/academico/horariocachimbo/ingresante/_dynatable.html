<template id="dynatableTemplate">
    <transition name="fade">

        <div class="panel padder-v">
            <table id="dynaTable" class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th class="col-xs-8">Estudiante</th>
                        <th class="col-xs-2  text-center">Carrera</th>
                        <th class="col-xs-1  text-center">Horario</th>
                        <th class="col-xs-1  text-center">Estado</th>
                        <th></th>
                    </tr> 
                </thead>
                <tbody id="dynaTbody">
                    <tr></tr>
                </tbody>
            </table>
        </div>

    </transition>
</template>

<template  type="text/x-template" id="dynatableRowTemplate">
    <tr>

        <td class="v-middle">
            <a  href="#"
                class="h5 text-muted"> 
                {{ horario.estudiante}}
            </a>
        </td>

        <td class="v-middle text-center">
            <p>{{horario.carrera}}</p> 
            <span>{{horario.facultad}}</span> 
        </td>

        <td class="v-middle  text-center">
            <span>{{horario.horario}}</span> 
            <p v-if="horario.horario!=''" class="text-sm">{{horario.numCurso}}  cursos</p> 
        </td>

        <td class="v-middle  text-center">
            <span v-if="horario.estado=='PEND'" class="label label-default" >{{horario.estadoName}}</span> 
            <span v-if="horario.estado=='MATR'" class="label label-primary" >{{horario.estadoName}}</span> 
        </td>

        <td class="v-middle"> 
            <div class="dropdown actions">
                <a class="dropdown-toggle" data-toggle="dropdown">
                    <i class="glyphicon glyphicon-option-vertical"></i>
                </a> 
                <ul class="dropdown-menu pull-right">
                    <li><a class=""   v-on:click.prevent="buscarHorario(horario.id)"  href="#">Buscar Horario</a></li>
                    <li class="divider"></li>
                    <li><a class=""  v-if="horario.horario==''"   v-on:click.prevent="asignarHorario(horario.id)"  href="#">Asignar horario</a></li>
                    <li><a class=""  v-if="horario.horario!=''"  v-on:click.prevent="retirarHorario(horario.id)"  href="#">Retirar de horario</a></li>
                    <li class="divider"></li>
                    <li><a class=""  v-if="horario.estado=='MATR'"  v-on:click.prevent="suspenderMatricula(horario.id)"  href="#">Suspender matricula</a></li>
                    <li><a class=""  v-if="horario.estado=='PEND'"   v-on:click.prevent="activarMatricula(horario.id)"   href="#">Activar  matricula</a></li>
                </ul>
            </div>
        </td>

    </tr>
</template>
