<template id="dynatableTemplate">
    <transition name="fade">

        <div class="panel padder-v">
            <table id="dynaTable" class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th class="col-md-8">Estudiante</th>
                        <th class="col-md-2">Carrera</th>
                        <th class="col-md-1">Horario</th>
                        <th class="col-md-1">Estado</th>
                        <th></th>
                    </tr> 
                </thead>
                <tbody>
                    <tr></tr>
                </tbody>
            </table>
        </div>

    </transition>
</template>

<script id="dynatableRowTemplate">
    <div>
        <tr>

            <td class="v-middle">
                <a :rel="horario.id" 
                   href="#"
                   class="h5 text-muted"> 
                   {{ horario.estudiante}}
                </a>
            </td>

            <td class="v-middle text-center">
                    <p>{{horario.carrera}}</p> 
                    <span>{{horario.facultad}}</span> 
            </td>

            <td class="v-middle">
                    <span>{{horario.horario}}</span> 
            </td>

            <td class="v-middle">
                    <span>{{horario.estado}}</span> 
            </td>

            <td class="v-middle"> 
                <div class="dropdown actions">
                    <a class="dropdown-toggle" data-toggle="dropdown">
                        <i class="glyphicon glyphicon-option-vertical"></i>
                    </a> 

                    <ul class="dropdown-menu pull-right">
                        <li><a class="buscarHorario" :rel="horario.id" href="#">Buscar Horario</a></li>
                        <li><a class="buscarHorario" :rel="horario.id" href="#">Retirar de horario</a></li>
                        <li><a class="buscarHorario" :rel="horario.id" href="#">Asignar horario</a></li>
                        <li class="divider"></li>
                        <li><a class="buscarHorario"  :rel="horario.id" href="#">Suspender matricula</a></li>
                        <li><a class="buscarHorario"  :rel="horario.id"  href="#">Activar  matricula</a></li>
                    </ul>

                </div>
            </td>

        </tr>
    </div>
</script>
