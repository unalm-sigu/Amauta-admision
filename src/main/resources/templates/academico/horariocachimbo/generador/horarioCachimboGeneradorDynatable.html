<template id="dynatableTemplate">
    <transition name="fade">

        <div class="panel padder-v">
            <table id="dynaTable" class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th v-if="showTitle" class="headcollateral">Curso</th>
                        <th v-for="h in horarios"  class="text-center">
                            <span class="pointer text-nowrap" v-on:click="openHorario(h.id)">{{ h.codigo }}</span>
                        </th>
                    </tr>
                </thead>
                <tbody></tbody>
                <tfoot>
                    <tr>
                        <th v-if="showTitle" class="headcollateral">Capacidad</th>
                        <td  v-for="h in horarios"  class="text-center">
                            <span>{{ h.capacidad }}</span>
                        </td>
                    </tr>
                </tfoot>
            </table>
        </div>

    </transition>
</template>

<template  type="text/x-template" id="horarioTemplate">
    <transition name="fade">

        <div class="panel padder-v m-b-n-lg">

            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th></th>
                        <th  v-for="dia in dias"  class="text-center">
                            <span class="pointer" >{{ dia.dia }}</span>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="item in horarios" >
                        <th class="v-middle text-center">{{item.hora}}</th>
                        <td  v-for="dia in item.dias"  class="text-center">
                            <span class="pointer secciones"  v-for="seccion in dia.secciones"  >
                                <span class="text-primary block">{{ seccion.seccion }}</span>
                                <small class="text-muted block">{{ seccion.grupo }}</small>
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>

        </div>

    </transition>
</template>


<script  type="text/x-template" id="dynatableRowTemplate">

    <tr>
    <td class="v-middle headcollateral">
    {{:curso}}
    </td>
    {{for horario }}
    <td class="v-middle text-center">
    {{for horarios }}
    <span class="text-primary block">{{:seccion}}</span>
    <span class="text-muted block">{{:grupo}}</span>
    {{/for}}
    </td>
    {{/for}}
    </tr>

</script>
