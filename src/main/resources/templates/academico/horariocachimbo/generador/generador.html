<html layout:decorator="_layout/layout">
    <head>
        <title> Generador</title>
    <div th:substituteby="_layout/includes :: styles-dynatable"></div>
</head>

<body>
    <div layout:fragment="main">

        <div  id="main">

            <header class="page-header">
                <div class="pull-right">                
                    <button class="btn btn-info" type="button"  v-on:click.prevent="generarHorario"  >Generar Horarios</button>
                </div>  
                <h2 th:inline="text">Generador  de Horarios  [[${cicloAcademico.descripcion}]] </h2>
            </header>

            <section class="panel">
                <section class="panel-body">

                    <div class="col-sm-4 col-xs-12  buscar-curso">
                        <select name="carrera" 
                                required="true" 
                                class="form-control   input-sm " >
                            <option></option>
                            <option th:each="item : ${carreras}"  
                                    th:text="${item.nombre}"
                                    th:value="${item.id}" ></option>
                        </select>
                    </div>

                    <dynatable/>           

                </section>
            </section>

        </div>

        <th:block th:replace="academico/horariocachimbo/generador/_generador"/>

    </div>

    <div layout:fragment="js">
        <div th:substituteby="_layout/includes :: javascript-dynatable"/>
        <script th:src="@{/vendor/sweetalert/dist/sweetalert.min.js}" charset="utf-8"></script>
        <script th:src="@{/vendor/vuejs/vue.js}" charset="utf-8"></script>
        <script type="text/javascript" th:src="@{/phobos/modules/vue-modal.js}"></script>
        <script th:src="@{/app/academico/horariocachimbo/generador/generador.js}" charset="utf-8"></script>
    </div>

</body>
</html>
