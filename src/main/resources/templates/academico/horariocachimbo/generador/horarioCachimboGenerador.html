<html layout:decorator="_layout/layout">
    <head>
        <title> Generador</title>
    <div th:substituteby="_layout/includes :: styles-dynatable"></div>
    <style>
        div.table-scroll-horario {
            width: auto;
            overflow-x:scroll;
            margin-left:300px;
            overflow-y:visible;
        }
        .headcollateral {
            position:absolute;
            width: 300px;
            left:20.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>

<body>
    <div layout:fragment="main">

        <div  id="main">

            <header class="header b-b padder-lg">
                <div class="pull-right m-t-md">
                    <a class="btn btn-link" type="button"    th:href="@{/academico/horariocachimbo/generar}" >Regresar</a>
                    <button class="btn btn-info" type="button"  v-on:click.prevent="generarHorario"  >Generar Horarios</button>
                </div>
                <h2 th:inline="text">Generador  de Horarios  [[${cicloAcademico.descripcion}]] </h2>
            </header>
            <section class="wrapper-lg">
                <section class="panel">
                    <section class="panel-body">

                        <div class="row  m-b-lg m-t-lg">
                            <div class="m-l-md col-md-4  col-xs-12 ">
                                <select name="carrera"
                                        required="true"
                                        class="form-control   input-sm " >
                                    <option></option>
                                    <option th:each="item : ${carreras}"
                                            th:text="${item.nombre}"
                                            th:value="${item.id}" ></option>
                                </select>
                            </div>
                        </div>

                        <div class="col-xs-12" >
                            <div class="table-scroll-horario">
                                <dynatable/>
                            </div>
                        </div>

                    </section>
                </section>
            </section>

        </div>

        <th:block th:replace="academico/horariocachimbo/generador/horarioCachimboGeneradorDynatable"/>

    </div>

    <div layout:fragment="js">
        <div th:substituteby="_layout/includes :: javascript-dynatable"/>
        <script th:src="@{/vendor/sweetalert/dist/sweetalert.min.js}" charset="utf-8"></script>
        <script type="text/javascript" th:src="@{/phobos/modules/vue-modal.js}"></script>
        <script th:src="@{/app/academico/horariocachimbo/generador/horarioCachimboGenerador.js}" charset="utf-8"></script>
    </div>

</body>
</html>
