<modal-vik ref="modalAddAlumno"
           v-bind="addAlumnoModal"
           v-bind:okaction="addAlumno">

    <div slot="body">

        <form id="formAlumno"  data-parsley-validate="true">


            <div class="form-group">
                <label>Alumno</label>
                <input type="text" 
                       class="form-control"
                       name="alumno.id"
                       v-model="alumno.id"
                       required="true"/>
            </div>

            <div v-if="alumno.id">

                <span class="block">
                    <b>Carrera </b>:{{alumno.carrera}}
                </span>
                <span class="block">
                    <b>Facultad </b>:{{alumno.facultad}}
                </span>
                <span class="block">
                    <b>{{alumno.tipo}} </b>:{{alumno.numero}}
                </span>
                <span class="block">
                    <b>Nro Mat. </b>:{{alumno.codigoMatricula}}
                </span>

            </div>

        </form>

    </div>
</modal-vik>
