<template id="dynatableTemplate">
    <transition name="fade">

        <div class="panel padder-v">
            <table id="dynaTable" class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th class="col-xs-1">Código</th>
                        <th class="col-xs-4  text-center">Carrera</th>
                        <th class="col-xs-2  text-center">Cursos</th>
                        <th class="col-xs-2  text-center">Capacidad</th>
                        <th class="col-xs-2  text-center">Suscritos</th>
                        <th class="col-xs-2  text-center">Matriculados</th>
                        <th></th>
                    </tr> 
                </thead>

                <tbody id="dynaTbody">
                    <tr></tr>
                </tbody>

            </table>
        </div>

    </transition>
</template>

<template  type="text/x-template" id="dynatableRowTemplate">
    <tr>

        <td class="v-middle">
            <span class="">{{horario.codigo}}</span>
        </td>

        <td class="v-middle text-center">
            <span class="">{{horario.carrera}}</span>
        </td>

        <td class="v-middle  text-center">
            <span class="">{{horario.cursos}}</span>
        </td>

        <td class="v-middle  text-center">
            <span class="">{{horario.capcidad}}</span>
        </td>

        <td class="v-middle text-center">
            <span class="">{{horario.suscritos}}</span>
        </td>

        <td class="v-middle text-center">
            <span class="">{{horario.matriculados}}</span>
        </td>

        <td class="v-middle"> 
            <div class="dropdown actions">
                <a class="dropdown-toggle" data-toggle="dropdown">
                    <i class="glyphicon glyphicon-option-vertical"></i>
                </a> 
                <ul class="dropdown-menu pull-right">
                    <li><a  href="#"  v-on:click.prevent="incluirAlumno(horario.id)" >Incluir Alumno</a></li>
                    <li class="divider"></li>
                    <li><a  href="#"  v-on:click.prevent="verHorario(horario.id)" >Ver Horario</a></li>
                    <li><a  href="#"  v-on:click.prevent="verCurso(horario.id)"  >Ver Cursos</a></li>
                    <li><a  href="#"  v-on:click.prevent="verAlumno(horario.id)" >Ver Alumnos</a></li>
                    <li class="divider"></li>
                    <li><a  href="#"  v-on:click.prevent="eliminar(horario.id)" >Eliminar</a></li>
                </ul>
            </div>
        </td>

    </tr>
</template>
