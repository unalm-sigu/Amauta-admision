<div class="row">
    <div class="col-md-0">
        <span class="v-middle"> 
            <label class="switch">
                <input type="checkbox" v-model="habilDep" />
                <span></span>
            </label>
        </span>
    </div>
    <div class="col-md-2 bold">Busqueda por departamento</div>
</div>



<table class="table">
    <thead> 
        <tr > 
            <th class="col-md-3">Docente</th>
            <th class="col-md-1 text-center">Principal</th>
            <th class="col-md-1 text-center">%Carga</th>
            <th class="col-md-4 text-center">Periodo clases</th>
            <th class="col-md-2 text-center">Situación Laboral</th>
            <th class="col-md-1 text-center">Estado</th>
            <th class=""></th>
            <th class=""></th>
        </tr>
    </thead>
    <tbody>
        <tr v-for="(docSeccion, index) in docentesSeccion">
            <td class="v-middle">
                <div class="col-md-12" v-if="docSeccion.docenteNN">

                    <multiselect  
                        v-bind:options='docentes'
                        label="apellidosNombres"
                        track-by='id'
                        placeholder="Desconocido"
                        v-bind:internal-search="false"
                        v-on:search-change="buscarDocente"
                        v-on:input="indexSelect(index)"
                        v-on:select="docenteSelected"
                        >
                        <template slot="option" slot-scope="props">
                            <div class="option__desc">
                                <span class="option__title bold block">{{ props.option.apellidosNombres }}</span>
                                <small class="option__small block">{{ props.option.departamento }}</small>
                                <span class="option__small bold">{{ props.option.codigo }}</span>
                            </div>
                        </template>
                    </multiselect>
                </div>
                <span v-if="docSeccion.docente.persona.id != ''">
                    <span class="block bold">{{docSeccion.docente.persona.apellidosNombres}}</span>
                    <span class="block">{{docSeccion.docente.codigo}}</span>
                </span>
            </td>
            <td class="text-center">
                <label class="switch"
                       v-if="docSeccion.estado == 'ACT'">
                    <input type="checkbox" 
                           value="1" 
                           v-model="docSeccion.principal" 
                           v-bind:disabled="docSeccion.principal==1"
                           v-on:change="cambiarDocPrincipal(docSeccion)"/>
                    <span></span>
                </label>
                <i class="fa fa-check-square-o fa-2x text-dark"
                   v-if="docSeccion.estado != 'ACT'"></i>
            </td>
            <td>
                <input v-model="docSeccion.porcentajeCarga"
                       name="porcentajeCarga"
                       v-on:blur ="cambiarPorcentajeCarga(docSeccion,$event)"
                       v-on:keyup.enter="cambiarPorcentajeCarga(docSeccion,$event)"
                       class="form-control text-right"
                       required="true"
                       min="1"
                       v-bind:readonly="docSeccion.estado != 'ACT'"
                       data-parsley-group="porcentaje-car"
                       data-parsley-type="number"
                       />
            </td>
            <td class="text-center">

                <div class="col-md-12">
                    <v-date-picker v-model="docSeccion.fechaInicio"
                                   v-bind:id="'fechaInicio'+index"
                                   v-bind:startdate="docSeccion.fechaInicioMin"
                                   v-bind:enddate="docSeccion.fechaFinMax" 
                                   v-on:changedate="cambiarFechaIniPeriodo(docSeccion,$event)"
                                   v-if="docSeccion.estado == 'ACT'"
                                   required="true"
                                   class="col-md-6"
                                   ></v-date-picker>

                    <v-date-picker v-model="docSeccion.fechaFin"
                                   v-bind:id="'fechaFin'+index"
                                   v-bind:startdate="docSeccion.fechaInicioMin"
                                   v-bind:enddate="docSeccion.fechaFinMax" 
                                   v-on:changedate="cambiarFechaFinPeriodo(docSeccion,$event)"
                                   v-if="docSeccion.estado == 'ACT'"
                                   required="true"
                                   class="col-md-6"
                                   ref="datePicker"
                                   ></v-date-picker>
                    <div v-if="docSeccion.estado != 'ACT'" class="col-md-6">
                        <input type="text" readonly="" class="form-control" 
                               v-model="docSeccion.fechaInicio"/>
                    </div>
                    <div v-if="docSeccion.estado != 'ACT'" class="col-md-6">
                        <input type="text" readonly="" class="form-control" 
                               v-model="docSeccion.fechaFin"/>
                    </div>

                </div>
            </td>

            <td></td>

            <td class="text-center v-middle">
                <span class="label" v-bind:class="getEstadoClass(docSeccion.estado)">
                    {{ docSeccion.estadoEnum.value }}
                </span>
            </td>

            <td class="v-middle">
                <template v-if="docSeccion.principal == 1 &amp;&amp; docSeccion.estado == 'ACT' "></template>
                <a v-else=""
                   v-on:click="deleteDocSeccion(docSeccion)"
                   class="delete-tipo-evaluacion pointer"><i class="fa fa-trash-o fa-lg text-danger"></i></a>
            </td>

            <td class="v-middle">
                <div class="dropdown actions">
                    <a class="dropdown-toggle" data-toggle="dropdown">
                        <i class="glyphicon glyphicon-option-vertical"></i>
                    </a>
                    <ul class="dropdown-menu pull-right">
                        <li>
                            <a v-on:click.prevent="generarPagoDocente(docSeccion)" href="#">Generar Pago Docente</a>
                        </li>
                    </ul>
                </div>
            </td>


        </tr>
    </tbody>
</table>

<a class="btn btn-info btn-sm pull-right m-t-xs"
   v-if="grupoSeccion.estado == 'ACT' "
   v-on:click="addDocSeccion">
    <i class="fa fa-plus add-seccion" aria-hidden="true"></i> <strong> Agregar Docente</strong>
</a>
