<html layout:decorator="_layout/layout">
    <head>
        <title>Grupo Sección Reporte</title>
        <style>
            .btn {
                height: 60px;
            }
        </style>
    </head>

    <body>
        <div layout:fragment="main">
            <div id="main" v-cloak="">

                <header class="header b-b padder-lg m-b-xs">
                    <h2 v-text="'Reportes ' + ciclo.descripcion">Reportes xyz</h2>
                </header>

                <section class="wrapper-md">
                    <section class="panel">
                        <section class="panel-body">

                            <div v-for="rep in reportes" class="col-sm-4 m-t-sm">
                                <button-download v-bind:urldownload="rep.ruta" class="btn btn-primary form-control">
                                    <span v-if="rep.tipo == 'XLSX'" class="fa-stack fa-lg text-success">
                                        <i class="fa fa-circle fa-stack-2x"></i>
                                        <i class="fa fa-file-excel-o fa-stack-1x fa-inverse"></i>
                                    </span>
                                    <span v-if="rep.tipo == 'XLS'" class="fa-stack fa-lg text-success">
                                        <i class="fa fa-circle fa-stack-2x"></i>
                                        <i class="fa fa-file-excel-o fa-stack-1x fa-inverse"></i>
                                    </span>
                                    <span v-if="rep.tipo == 'PDF'" class="fa-stack fa-lg ">
                                        <i class="fa fa-circle fa-stack-2x"></i>
                                        <i class="fa fa-file-pdf-o fa-stack-1x fa-inverse text-danger"></i>
                                    </span> &nbsp;
                                    <span v-text="rep.nombre">Reporte xyz</span>
                                </button-download>
                            </div>

                        </section>
                    </section>
                </section>

            </div>

        </div>

        <div layout:fragment="js">
            <script  th:inline="javascript" >
                /*<![CDATA[*/
                var cicloJson = /*[[${cicloJson}]]*/ '';
                var resumenJson = /*[[${resumenJson}]]*/ '';
                var reportesJson = /*[[${reportesJson}]]*/ '';
                /*]]>*/
            </script>
            <div th:substituteby="_layout/includes :: sweetalert"/>
            <div th:substituteby="_modules/vue-raptor-table"></div>
            <div th:substituteby="_layout/includes :: vue-loader"/>
            <script type="text/javascript" th:src="@{/phobos/modules/vue-btn-download.js}"></script>
            <script type="text/javascript" th:src="@{/phobos/modules/vuelect2.js}"></script>
            <div th:substituteby="_modules/vue-modal"/>
            <script th:src="@{/app/gposeccion/reporte/reporte.js}" charset="utf-8"></script>
        </div>

    </body>
</html>
