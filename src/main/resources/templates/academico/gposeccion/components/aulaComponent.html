<template id="modalAulaComp"> 
    <div> 
        <seccion-det-component v-bind:seccion="seccionModal"></seccion-det-component>

        <div id="tab-aula" class="tabbable-line m-b-sm">	
            <ul class="nav nav-tabs">
                <li v-bind:class="{active : tabAulas.aulaSel.tabAula=='oera'}">
                    <a href="#TabAula1" data-toggle="tab">OERA</a>
                </li>
                <li v-bind:class="{active : tabAulas.aulaSel.tabAula=='oficina'}">
                    <a href="#TabAula2" data-toggle="tab">Dpto. Acad.</a>
                </li>
                <li v-bind:class="{active : tabAulas.aulaSel.tabAula=='especifica'}">
                    <a href="#TabAula3" data-toggle="tab">Específica</a>
                </li>
            </ul>
            <section class="panel m-b-xs">
                <div class="tab-content m-b-xs">

                    <div class="tab-pane" id="TabAula1"
                         v-bind:class="{active : tabAulas.aulaSel.tabAula=='oera'}">
                        <section class="panel-body m-b-xs">
                            <div class="form-group">   

                                <multiselect  v-model="tabAulas['oera'].moduloSel"
                                              track-by="id"
                                              v-bind:options="tabAulas['oera'].modulosOera"
                                              label='nombre'
                                              v-on:input="cambiarModulo"
                                              placeholder="Seleccione un módulo">

                                </multiselect>

                            </div>

                            <div class="table-responsive" >

                                <div class="col-md-12">
                                    <div class="col-sm-2 m-b-sm" 
                                         v-if="tabAulas['oera'].tblAulas!=null"
                                         v-for="aula in tabAulas['oera'].tblAulas">
                                        <span  class="form-control pointer"
                                               v-on:click="selectAula(aula)"
                                               v-bind:class="getClassAula(aula)">
                                            {{aula.codigo}}
                                            <small v-if="aula.capacidadAula != '' ">({{aula.capacidadAula}})</small>
                                        </span>
                                    </div>
                                </div>

                            </div>


                        </section>
                    </div>

                    <div class="tab-pane" id="TabAula2" 
                         v-bind:class="{active : tabAulas.aulaSel.tabAula=='oficina'}">
                        <section class="panel-body">
                            <div class="form-group">   
                                <multiselect  v-model="tabAulas['oficinas'].oficinaSel"
                                              track-by="id"
                                              v-bind:options="tabAulas['oficinas'].oficinasDisponibles"
                                              label='nombre'
                                              v-on:input="cambiarOficina"
                                              placeholder="Seleccione un departamento o facultad">
                                </multiselect>
                            </div>

                            <div class="table-responsive" >

                                <div class="col-md-12">
                                    <div class="col-sm-2 m-b-sm" 
                                         v-if="tabAulas['oficinas'].tblAulas!=null"
                                         v-for="aula in tabAulas['oficinas'].tblAulas">
                                        <span  class="form-control pointer"
                                               v-on:click="selectAula(aula)"
                                               v-bind:class="getClassAula(aula)">
                                            {{aula.codigo}}
                                            <small v-if="aula.capacidadAula != '' ">({{aula.capacidadAula}})</small>
                                        </span>
                                    </div>
                                </div>

                            </div>
                        </section>
                    </div>

                    <div class="tab-pane" id="TabAula3" 
                         v-bind:class="{active : tabAulas.aulaSel.tabAula=='especifica'}">
                        <section class="panel-body">
                            <div class="form-group">

                                <multiselect v-model="tabAulas['especificas'].aulasEspecificaSel"
                                             track-by="id"
                                             v-bind:internal-search="false"
                                             v-bind:limit="15"
                                             v-on:search-change="asyncFindAulas"
                                             v-on:input="seleccionarAulaEspecifica"
                                             v-bind:options="tabAulas['especificas'].aulasEspecificas"
                                             v-bind:custom-label="labelAula"
                                             placeholder="Seleccione un edificio">
                                    <template slot="option" slot-scope="props">    
                                        <span v-if="props.option.nombre != ''" class="block">
                                            {{ props.option.nombre }}
                                        </span>
                                        <div class="block">
                                            {{ props.option.codigo }}
                                            <span v-if="props.option.capacidadAula != ''">
                                                - Capacidad: {{ props.option.capacidadAula }}
                                            </span>
                                            <small v-if="props.option.aulaSuperior.nombre != ''" class="bold">
                                                - {{ props.option.aulaSuperior.nombre }}
                                            </small>
                                        </div>
                                        <span v-if="!props.option.isDisponible" class="label label-danger">
                                            Con cruce horarios
                                        </span>
                                        <div class="block">
                                            <span v-if="props.option.isDisponible" class="label label-primary">
                                                Disponible
                                            </span>
                                        </div>
                                    </template>
                                </multiselect>

                            </div>
                            <div>
                                <ul class="list-group">
                                    <li class="list-group-item list-group-item-danger"
                                        v-for="err in tabAulas['especificas'].errores">
                                        {{err}}
                                    </li>
                                </ul>
                            </div>
                        </section>
                    </div>

                </div>
            </section>
        </div>
    </div> 
</template>
