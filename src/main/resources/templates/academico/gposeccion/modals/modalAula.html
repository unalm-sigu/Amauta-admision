<modal-vik ref="modalAula"
           v-bind="aulaModal"
           v-bind:okaction="saveAula">

    <div slot="body">

        <template v-if="seccionModal!=null">
            <div class="row">
                <div class="form-group">
                    <label for="docIdentidad" class="col-md-2 control-label">Curso</label>

                    <div class="col-md-10">
                        <span> {{seccionModal.cursoCodigo}} {{seccionModal.cursoNombre}} </span>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="form-group">
                    <label class="col-md-2 control-label">Dpto. Academicos</label>

                    <div class="col-md-10">
                        <span> {{seccionModal.depAcadNombre}} </span>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="form-group">
                    <label class="col-md-2 control-label">Clave</label>

                    <div class="col-md-4">
                        <span> {{seccionModal.seccionCodigo}}</span>
                    </div>

                    <label class="col-md-2 control-label">Vacantes</label>

                    <div class="col-md-4">
                        <span> {{seccionModal.seccionCodigo}} </span>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="form-group">
                    <label class="col-md-2 control-label">Grupo</label>

                    <div class="col-md-4">
                        {{seccionModal.grupoHora.codigo}}
                    </div>

                    <label class="col-md-2 control-label">Horas</label>

                    <div class="col-md-4">
                        <span>{{seccionModal.horasSemanales}}</span>
                    </div>
                </div>
            </div>
        </template>

        <div id="exTab2" class="tabbable-line m-b-sm">	
            <ul class="nav nav-tabs">
                <li class="active">
                    <a  href="#1" data-toggle="tab" >OERA</a>
                </li>
                <li >
                    <a href="#2" data-toggle="tab" >Dpto. Acad.</a>
                </li>
                <li>
                    <a href="#3" data-toggle="tab">Zetas</a>
                </li>
            </ul>
            <section class="panel">
                <div class="tab-content">
                    <div class="tab-pane active" id="1">
                        <section class="panel-body">

                            <div class="form-group">   
                                <multiselect  v-model="tabAulas['oera'].moduloSel"
                                              track-by="id"
                                              v-bind:options="tabAulas['oera'].modulosCombo"
                                              label='nombre'
                                              v-on:input="cambiarModulo"
                                              >
                                </multiselect>
                            </div>

                            <div class="table-responsive" >

                                <div class="col-md-12">
                                    <div class="col-sm-2 m-b-sm" 
                                         v-if="tabAulas['oera'].tblAulas!=null"
                                         v-for="aula in tabAulas['oera'].tblAulas">
                                        <span  class="form-control pointer"
                                               v-on:click="selectAula(aula)"
                                               v-bind:class="getClassAula(aula)">
                                            {{aula.codigo}}
                                        </span>
                                    </div>
                                </div>

                            </div>


                        </section>
                    </div>
                    <div class="tab-pane" id="2" >
                        2
                    </div>
                    <div class="tab-pane" id="3" >
                        3
                    </div>
                </div>
            </section>
        </div>

    </div>
</modal-vik>
