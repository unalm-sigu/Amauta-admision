<modal-vik ref="modalAgregarAlumno"
           v-bind="modalAgregarAlumno"
           v-bind:okaction="saveEgresado">
    <div slot="body">   
        <form  method="post" v-bind:id="modalAgregarAlumno.form" data-parsley-validate="true">
            <div class="form-group">
                <label>Alumno</label>
                <multiselect 
                    v-model="alumno"
                    v-bind:options='listAlumno'
                    v-bind:custom-label="nombreforShow"
                    label="nombres"
                    track-by='id'
                    deselect-label=""
                    select-label=""
                    placeholder="Ingrese y seleccione un alumno"
                    v-bind:internal-search="false"
                    v-on:search-change="searchAlumno"
                    v-bind:allow-empty="false"
                    >
                    <template slot="option" slot-scope="props">
                        <span class="option__title">{{ props.option.persona.nombreCompleto }}</span>
                        <div class="option__desc">
                            <span   class="option__small text-primary">Facultad: <b>{{ props.option.carrera.facultad.nombre }}</b></span>
                            <p  class="option__small text-primary">Carrera: <b>{{ props.option.carrera.nombre }}</b></p>
                        </div>
                    </template>
                    <template slot="noOptions">La lista se encuentra vacía</template>
                    <template slot="noResult">No se encontraron resultados</template>
                </multiselect>
                <input type="text" v-model="alumno.id" class="form-control hidden" required="true"/>
            </div>

            <div class="form-group">
                <label>Ciclo Ingreso</label>
                <input type="text" v-model="cicloSelected.descripcion" disabled="true" class="form-control" />
            </div>
            <div class="form-group">
                <label>Carrera</label>
                <input type="text" v-model="alumno.carrera.nombre" disabled="true" class="form-control" />
            </div>
            <div class="form-group">
                <label>Facultad</label>
                <input type="text" v-model="alumno.carrera.facultad.nombre" disabled="true" class="form-control" />
            </div>
        </form>
    </div>
</modal-vik>
