<tr>
    <td class="v-middle text-center">
        {{:codigo}}
    </td>
    <td class="v-middle">
        {{:nombre}}
    </td>
    <td class="v-middle text-center">
        {{:codigoCurso}}
    </td>
    <td class="v-middle text-center" id="">
        {{:simbolo}}
    </td>
    <td class="v-middle text-center">
        {{if consejeriaRequerida}}
        <input type="checkbox" id="chkboxInput" checked="checked" value="true" onclick="return false;"  class="estadoConsejeroRequerido" rel="{{:id}}" />
        {{else}}
        <input type="checkbox" id="chkboxInput" value="true" onclick="return false;"  class="estadoConsejeroRequerido" rel="{{:id}}" />
        {{/if}}
    </td>
    <td class="v-middle text-center">
        {{if estado == 'DES'}}
        <label class="label label-{{:colorEstado}}" data-toggle="tooltip" title="{{:motivoDesactivacion}}"  >{{:estadoEnum}}</label>
        {{else}}
        <label class="label label-{{:colorEstado}}">{{:estadoEnum}}</label>
        {{/if}}
    </td>
    <td>
        <div class="dropdown actions">
            <a class="dropdown-toggle" href="#" data-toggle="dropdown">
                <i class="fa fa-cog" aria-hidden="true"></i>
            </a>
            <ul class="dropdown-menu pull-right" aria-labelledby="dropdownMenu1" role="menu">

                <li role="presentation">
                    <a class="btn-link" th:href="@{'/academico/facultad/{{:id}}/update'}">Editar</a>
                </li>

                <li role="presentation" class="divider"></li>

                <li role="presentation">
                    {{if estado == 'ACT'}}
                    <a class="btn-link estado" rel="{{:id}}" rev="{{:estado}}" href="#">Desactivar</a>
                    {{/if}}
                    {{if estado == 'DES'}}
                    <a class="btn-link estado" rel="{{:id}}" rev="{{:estado}}" href="#">Activar</a>
                    {{/if}}
                    {{if estado == 'CRE'}}
                    <a class="btn-link estado" rel="{{:id}}" rev="{{:estado}}" href="#">Activar</a>
                    {{/if}}
                </li>

                <li role="presentation" class="divider"></li>

                <li role="presentation">
                    <a class="btn-link delete" rel="{{:id}}" href="#">Eliminar</a>
                </li>

            </ul>
        </div>
    </td>
</tr>
