<html layout:decorator="_layout/layout">
    <head>
        <title>Tramite Condicional</title>
    </head>

    <body>
        <div layout:fragment="main">
            <div id="condicional">
                <header class="header b-b padder-lg">
                    <h2 th:text="| Tramite Condicional ${ciclo.descripcion}|"></h2>
                    <div class="btn-group pull-right">
                        <button type="button" class="btn btn-success btn-sm dropdown-toggle" data-toggle="dropdown">
                            <i class="fa fa-file-text-o" /> &nbsp; Acciones &nbsp; <span class="caret"></span>
                        </button>
                        <ul class="dropdown-menu">
                            <li ><a  v-on:click="modal" >Tramite Condicional</a></li>
                        </ul>
                    </div>
                </header>

                <section class="wrapper-lg ">
                    <section class="panel">
                        <section class="panel-body ">
                            <raptor-table v-bind:url="URL_RETIROS" ref="load" class="col-md-8 col-md-offset-2">

                                <template scope="props">
                                    <table class="table table-striped " >
                                        <thead>
                                            <tr>
                                                <th class="col-md-6" colspan="2"></th>
                                                <th class="col-md-3">Tipo Tramite </th>
                                                <th class="col-md-2">Ciclo </th>
                                                <th class="col-md-1">Estado</th>
                                                <th></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr v-for="item in props.data">
                                                <td class="v-middle">
                                                    <div class="pull-left">
                                                        <div v-if="item.alumno.persona.tipoFoto == 'POSTUL'"
                                                             class="img-responsive img-thumbnail img-circle div-foto-list">
                                                            <img class="img-foto-list" v-bind:src="item.alumno.persona.rutaFoto" />
                                                        </div>

                                                        <img v-else-if="item.alumno.persona.tipoFoto == 'COMUN'"
                                                             class="img-responsive img-thumbnail img-circle div-foto-alumno-list" 
                                                             v-bind:src="item.alumno.persona.rutaFoto" />
                                                        <img v-else=""
                                                             class="img-foto-tempo img-responsive img-thumbnail img-circle" 
                                                             v-bind:src="item.alumno.persona.rutaFoto" />
                                                    </div>
                                                </td>
                                                <td class="v-middle">
                                                    <div class="v-middle clear">
                                                        <a href="#"><span class="block text-primary bold detallePostulante" v-text="item.alumno.persona.apellidosNombres"></span></a>
                                                        <span class="block" >
                                                            Matrícula: {{item.alumno.codigo}} 
                                                        </span>
                                                        <span class="block" v-if="item.alumno.carrera.codigo != item.alumno.carrera.facultad.codigo">
                                                            {{item.alumno.carrera.nombre}}
                                                        </span>
                                                        <span class="block">
                                                            {{item.alumno.carrera.facultad.nombre}}
                                                        </span>
                                                        <small class="block">
                                                            {{item.alumno.persona.emailCompania}}
                                                        </small>
                                                        <small class="block">
                                                            <smal>DNI: </smal>{{item.alumno.persona.numeroDocIdentidad}}
                                                        </small>
                                                    </div>
                                                </td>
                                                <td  class="v-middle">
                                                    <span class="block" >
                                                        {{item.tipoTramite.nombre}}
                                                    </span>
                                                    <span class="bold block" v-if ="item.cursoResolucion.id!=null" v-text="'Curso: ' + item.cursoResolucion.nombre"></span>
                                                    <span class="bold" v-if ="item.notaResolucion!=null" v-text="'Nota: ' + item.notaResolucion"></span>
                                                </td> 
                                                <td  class="v-middle">
                                                    {{item.cicloAcademicoResolucion.descripcion}}
                                                </td> 
                                                <td  class="v-middle">
                                                    <span v-if="item.estado == 'PEND'" class="label label-warning">{{item.estadoEnum.value}}</span>
                                                    <span v-if="item.estado == 'ACEP'" class="label label-primary">{{item.estadoEnum.value}}</span>
                                                    <span v-if="item.estado == 'RCHZ'" class="label label-danger">{{item.estadoEnum.value}}</span>

                                                </td> 
                                                <td class="v-middle">
                                                    <div class="actions">
                                                        <a class="dropdown-toggle" href="#" data-toggle="dropdown"><i class="glyphicon glyphicon-cog"></i></a>
                                                        <ul class="dropdown-menu pull-right">
                                                            <li v-if="item.estado == 'PEND'" ><a class=" pointer" v-on:click="openTramiteResol(item,1)" >Aceptar</a></li><!--rel="{{:id}}"-->
                                                            <li v-if="item.estado == 'PEND'" ><a class=" pointer" v-on:click="openTramiteResol(item,0)" >Rechazar</a></li><!--rel="{{:id}}"-->

                                                        </ul>
                                                    </div>
                                                </td> 
                                            </tr>
                                        </tbody>
                                    </table>
                                </template>
                            </raptor-table>

                        </section>
                    </section>
                </section>
                <div th:substituteby="academico/tramiteCondicional/tramiteCondicionalModal"/>
                <div th:substituteby="academico/tramiteCondicional/tramiteResolucionModal"/>

            </div>
            <div th:substituteby="_modules/vue-modal"/>
        </div>

        <div layout:fragment="js">
            <script th:inline="javascript">
                /*<![CDATA[*/
                var ciclosJson = /*[[${ciclos.toString()}]]*/ 'json';
                var tipoTramiteJson = /*[[${tipoTramite.toString()}]]*/ 'json';
                var oficinasJson = /*[[${oficinas.toString()}]]*/ 'json';
                /*]]>*/
            </script>
            <div th:substituteby="_modules/vue-raptor-table"/>
            <script type="text/javascript" th:src="@{/phobos/modules/vue-modal.js}"></script>
            <div th:substituteby="_layout/includes :: javascript-bootstrap-datetimepicker"></div>
            <div th:substituteby="_layout/includes :: javacsript-vue-bootstrap-datetimepicker"></div>
            <script th:src="@{/app/academico/tramiteCondicional/tramiteCondicional.js}" charset="utf-8"></script>
        </div>

    </body>
</html>
