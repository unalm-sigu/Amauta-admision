<html layout:decorator="_layout/layout">
<head>
    <title>Tipos Evaluacion</title>
</head>
​
<body>
<div layout:fragment="main">
    <div id="tipoevaluacionVUE">
        <header class="header b-b padder-lg">

            <div class="pull-right m-t-md">
                <div class="btn-group">
                    <a type="button" class="btn btn-success" v-on:click="openModal()">Nuevo</a>
                </div>
            </div>
            <h2>Tipos Evaluacion</h2>
        </header>
        <section class="wrapper-lg">
            <section class="panel">
                <section class="panel-body">
                    <raptor-table v-bind:url="URL" ref="raptorTiposEvaluacion" v-bind:timesleep="1000">
                        <template  scope="props" >
                            <table class="table table-striped">
                                <thead>
                                <tr>
                                    <th class="col-md-5">Nombre</th>
                                    <th class="col-md-5">Codigo</th>
                                    <th class="col-md-5">Orden</th>
                                    <th></th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr v-for="(item, index) in props.data" :key="item.id" :class="{'bg-success': item.id === getLastItemId(props.data)}">
                                    <td class="v-middle">
                                        <span class="block text-primary">{{item.nombre}}</span>
                                        <span class="block"></span>
                                    </td>
                                    <td class="v-middle">
                                        <span class="block text-primary">{{item.codigo}}</span>
                                        <span class="block"></span>
                                    </td>
                                    <td class="v-middle">
                                        <span class="block text-primary">{{item.orden}}</span>
                                        <span class="block"></span>
                                    </td>
                                    <td class="v-middle">
                                        <div class="actions">
                                            <a class="dropdown-toggle pointer" href="#" data-toggle="dropdown"> <i class="fa fa-ellipsis-v fa-lg"> </i></a>

                                            <ul class="dropdown-menu pull-right" >
                                                <li role="presentation"><a class="btn-link" v-on:click="openEditar(item)">Editar</a></li>
<!--                                                <li role="presentation"><a class="btn-link" v-on:click="">Eliminar</a></li>-->
                                            </ul>

                                        </div>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </template>
                    </raptor-table>

                </section>
            </section>
        </section>

        <modal-vik ref="modalNuevo" v-bind="modalNuevo"
                   v-bind:okaction="save">

            <div slot="body">
                <form id="formNuevo" data-parsley-validate="true">
                    <div class="form-group">
                        <label> Nombre </label>
                        <input class="form-control col-md-4 m-b-xs"  v-model="tiposEv.nombre" required=""/>
                    </div>
<!--                    <div class="form-group">-->
<!--                        <label> Codigo </label>-->
<!--                        <input class="form-control col-md-4 m-b-xs"  v-model="tiposEv.codigo" required=""/>-->
<!--                    </div>-->

                </form>
            </div>
        </modal-vik>
        <modal-vik ref="modalEditar" v-bind="modalEditar"
                   v-bind:okaction="editar">

            <div slot="body">
                <form id="formNuevo" data-parsley-validate="true">
                    <div class="form-group">
                        <label> Nombre </label>
                        <input class="form-control col-md-4 m-b-xs"  v-model="tiposEditar.nombre" required=""/>
                    </div>
                    <div class="form-group">
                        <label> Codigo </label>
                        <input class="form-control col-md-4 m-b-xs"  v-model="tiposEditar.codigo" required=""/>
                    </div>

                </form>
            </div>
        </modal-vik>
    </div>

</div>
<div layout:fragment="js">
    <div th:substituteby="_modules/vue-raptor-table"/>

    <script th:src="@{/app/docente/notasacademica/tipoevaluacion/tipo.js}" charset="utf-8"></script>
</div>
</body>
</html>
