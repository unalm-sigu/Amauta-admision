<html layout:decorator="_layout/layout">
    <head>
        <title>Carga Académica</title>
    <div th:substituteby="_layout/includes :: styles-dynatable"></div>
</head>

<body>
    <div layout:fragment="main">
        <header class="header b-b padder-lg">        
            <h2>Notas Académicas <span th:text="${cicloAcademico.descripcion}">2016-II</span></h2>
            <span class="block h4 text-primary m-t-xxs m-b-xxs"><strong>Docente:</strong> <span  th:text="${docente.persona.nombreCompleto}">Juan Perez</span></span>    
            <span class="block m-b"><strong >Departamento Académico:</strong> <span th:text="${dptoAcad.nombre}">Matematicas</span></span>
        </header>
        
        <section class="wrapper-lg">
            <section class="panel">
                <section class="panel-body">
                    <table class="table table-striped" id="dynaTable">
                        <thead> 
                            <tr class=""> 
                                <th class="col-md-4">Curso</th>
                                <th class="col-md-1 text-center">Tipo Ciclo</th>
                                <th class="col-md-3 text-center">Claves</th>
                                <th class="col-md-2 text-center">Sistema de Calificación</th>
                                <th class="col-md-1 text-center">Estado Plan</th>
                                <th class="col-md-1 text-center">Estado Acta</th>
                                <th class="col-md-1"></th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </section>
            </section>
        </section>

        <div th:substituteby="templates/modal"/>
        <script id="templateCargaAcademica" type="text/x-jsrender" class="hide"><div th:substituteby="docente/notaacademica/templateCargaAcademica"/></script>
    </div>
    <div layout:fragment="js">
        <div th:substituteby="_layout/includes :: javascript-dynatable"/>
        <script th:src="@{/app/docente/notasacademica/cargaAcademica.js}" charset="utf-8"></script>
    </div>
</body>
</html>
