<html layout:decorator="_layout/layout">
    <head>
        <title>Encuesta Docente</title>
    </head>
    <body>

        <div layout:fragment="main">

            <div  id="docentemodalidadVUE" v-cloak="">

                <header class="header b-b padder-lg">
                    <div class="btn-group pull-right">
                        <button type="button" class="btn btn-primary dropdown-toggle pull-right" data-toggle="dropdown">
                            <i class="fa fa-random fa-lg"/> &nbsp; Acciones &nbsp; <span class="caret"></span>
                        </button>
                        <ul class="dropdown-menu">
                            <li><a v-bind:href="`${url}/reporte/todos`"> Reporte general </a></li>
                        </ul>
                    </div>
                    <h2 th:inline="text">Resultado de Encuestas [[${cicloAcademico.descripcion}]] </h2>
                </header>

                <section class="wrapper-lg">
                    <section class="panel">
                        <section class="panel-body">
                            <raptor-table v-bind:url="`${url}/list`" ref="load">
                                <template scope="props">
                                    <table class="table table-striped table-hover">
                                        <thead>
                                            <tr>
                                                <th class="col-md-3 v-middle">Docente</th>
                                                <th class="col-md-3 text-center v-middle">Modalidad</th>
                                                <th class="col-md-3 text-center v-middle">Puntaje</th>
                                                <th class="col-md-2 text-center v-middle">Reporte</th>
                                                <th class="col-md-1 text-center v-middle">Estado</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr v-for="item in props.data">
                                                <td class="v-middle">
                                                    <span class="block text-primary h4 bold m-t-xs m-b-xs">
                                                        {{item.docente.persona.apellidosNombres}}
                                                        <span class="text-muted" style="font-size: 6px;">{{item.id}}</span>
                                                    </span>
                                                    <small class="block text-muted">
                                                        Departamento Académico: 
                                                        {{item.docente.departamentoAcademico.nombre}}
                                                    </small>
                                                    <small class="block text-muted">
                                                        Facultad: 
                                                        {{item.docente.departamentoAcademico.facultad.nombre}}
                                                    </small>
                                                    <small class="block text-muted">
                                                        Código: 
                                                        {{item.docente.codigo}}
                                                    </small>
                                                    <span class="block text-dark">

                                                    </span>
                                                </td>
                                                <td class="v-middle text-center">
                                                    <span class="block m-b-xs">{{ item.modalidadEstudio.nombre }}</span>
                                                </td>
                                                <td class="v-middle text-center">
                                                    <span class="block"> <b>Base 5:</b> {{item.puntajeBase5.toFixed(2)}} </span>
                                                    <span class="block"> <b>Base 10:</b> {{item.puntajeBase10.toFixed(2)}} </span>
                                                    <span class="block"> <b>Encuestados:</b> {{item.alumnosEncuestados}} </span>
                                                </td>
                                                <td class="v-middle text-center">
                                                    <span>
                                                        <span class="pointer m-r-xs text-primary"><i class="fa fa-list-ul"></i></span>
                                                        <span class="pointer m-r-xs text-success"><i class="fa fa-comments"></i></span>
                                                        <span class="pointer text-warning" v-on:click="findTemas(item)"><i class="fa fa-bar-chart"></i></span>
                                                    </span>
                                                    <a class="block" v-bind:href="`${url}/${item.id}/reporte`"> Reporte </a>
                                                    <span class="block m-t-xs" v-if="item.codigo"> {{ item.codigo }}</span>
                                                </td>
                                                <td class="v-middle text-center">
                                                    <span class="label" v-bind:class="label[item.estado]"> {{ labelText[item.estado] }}</span>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </template>

                            </raptor-table>

                        </section>
                    </section>
                    <div th:substituteby="academico/encuestaestudiantil/docentemodalidad/encuestadocentemodalidadModal"></div>
                </section>

            </div>

        </div>

        <div layout:fragment="js">
            <div th:substituteby="_modules/vue-modal"></div>
            <div th:substituteby="_modules/vue-raptor-table"></div>
            <script type="text/javascript" th:src="@{/phobos/modules/vue-modal.js}"></script>
            <script th:src="@{/app/docente/resumenencuesta.js}" charset="utf-8"></script>
        </div>

    </body>
</html>
