<html layout:decorator="_layout/layout">
    <head>
        <title>Carga Académica</title>
        <style>
            .avatar-gposecc {
                display: block;
                position: relative;
                border-radius: 50%;
                width: 54px;
                height: 54px;
                overflow: hidden;
                line-height: 54px;
                background-color: #F5B041;
                color: #fff;
                text-align: center;
                font-size: 24px;
                text-indent: 0;
                margin: auto;
                margin-top: 10px;
            }
        </style>
    </head>

    <body>
        <div layout:fragment="main">
            <div id="main">

                <header class="header b-b padder-lg">        
                    <h2>Ampliación de Vacante    <span th:text="${cicloAcademico.descripcion}">2016-II</span></h2>
                    <span class="block"><strong>Docente:</strong> <span  th:text="${docente.persona.nombreCompleto}">Juan Perez</span></span>
                    <span class="block"><strong >Departamento Académico:</strong> <span th:text="${dptoAcad.nombre}">Matematicas</span></span>
                </header>

                <section class="wrapper-lg">
                    <section class="panel">
                        <section class="panel-body">

                            <raptor-table v-bind:url="raptorurl" ref="raptor">

                                <div slot="header">

                                </div>

                                <template scope="props" >
                                    <table class="table table-striped table-hover">
                                        <thead> 
                                            <tr class=""> 
                                                <th class="col-md-3"></th>
                                                <th class="col-md-1 text-center">Grupo</th>
                                                <th class="col-md-1 text-center">Sección</th>
                                                <th class="col-md-1 text-center">Grupo</th>
                                                <th class="col-md-1 text-center">Aula</th>
                                                <th class="col-md-1 text-center">Vac</th>
                                                <th class="col-md-1 text-center">Mat</th>
                                                <th class="col-md-2 text-center">Ampliación de Vacante</th>
                                                <th class="col-md-2 text-center">Docente</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr v-for="gposeccion in props.data">

                                                <td class="v-middle padder-v" >

                                                    <p class="h4 text-info">{{gposeccion.curso.nombre}}</p>
                                                    <div class="row m-b-xs">
                                                        <div class="col-md-11">
                                                            <span class="block bold">
                                                                <span v-text="gposeccion.curso.codigo"></span>
                                                                <i class="fa fa-bookmark text-primary"></i>
                                                                <span v-text="gposeccion.curso.tpc"></span> &nbsp;
                                                            </span>
                                                            <small class="block text-muted">Departamento Académico: {{gposeccion.curso.departamentoAcademico.nombre}}</small>
                                                            <div v-if="gposeccion.responsable != null" class="block"><strong>Responsable:</strong>{{gposeccion.responsable}}</div>
                                                            <div v-else="" class="text-danger block">Sin responsable</div>
                                                        </div>
                                                    </div>

                                                </td>

                                                <td class="v-middle text-center">

                                                    <div class="col-md-1 text-center">
                                                        <div class="avatar-gposecc" v-text='gposeccion.codigo2'>999</div>
                                                    </div>

                                                </td>

                                                <td class="v-middle text-center">

                                                    <small v-for="seccion in gposeccion.secciones " class="block text-muted"> {{seccion.codigo2}}</small>

                                                </td>

                                                <td class="text-center v-middle">

                                                    <small v-for="seccion in gposeccion.secciones " class="block text-muted"> {{seccion.grupoHoras.codigo}}</small>

                                                </td>

                                                <td class="text-center v-middle">

                                                    <small v-for="seccion in gposeccion.secciones " class="block text-muted"> {{seccion.aula.codigo}}  ({{seccion.aula.aforo}}) </small>

                                                </td>

                                                <td class="text-center v-middle">

                                                    <small v-for="seccion in gposeccion.secciones " class="block text-muted"> {{seccion.vacantes}}  </small>

                                                </td>

                                                <td class="text-center v-middle">

                                                    <small v-for="seccion in gposeccion.secciones " class="block text-muted"> {{seccion.matriculados}}  </small>

                                                </td>

                                                <td class="text-center v-middle">

                                                    <small v-for="seccion in gposeccion.secciones " class="block text-muted"> {{seccion.ampliacion}} <span v-on:click.prevent="changeVacante(seccion)" class="label label-success pointer">Agregar</span>  </small>

                                                </td>

                                                <td class="text-center v-middle">
                                                    {{gposeccion.id}}
                                                </td>

                                            </tr>
                                        </tbody>
                                    </table>
                                </template>
                            </raptor-table>


                        </section>
                    </section>
                </section>
                
                <modal-vik ref="modalAmpliacionVacante"
                           v-bind="dataModalAmpliacionVacante"
                           v-bind:okaction="saveModalAmpliacionVacante"  >
                    <div slot="body">

                    </div>
                </modal-vik>

            </div>

            <div th:substituteby="_modules/vue-modal"/>

        </div>
        <div layout:fragment="js">
            <div th:substituteby="_modules/vue-raptor-table"></div>
            <div th:substituteby="_layout/includes :: vuemodal"/>
            <script th:src="@{/app/docente/ampliacionvacante/ampliacionvacante.js}" charset="utf-8"></script>
        </div>
    </body>
</html>
