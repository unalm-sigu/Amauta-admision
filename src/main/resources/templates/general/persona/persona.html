<html layout:decorator="zlayout/layout">
    <head>
        <title>Administración de Personas</title>
    <div th:substituteby="zlayout/includes :: styles-dynatable"></div>
</head>

<body>
    <div layout:fragment="main">

        <header class="page-header">

            <div class="pull-right">                
                <a th:href="@{${origen}}" class="btn btn-primary btn-sm" type="button" id="btnAddPersona">Nuevo</a>
            </div>  

            <h2>Administración de Personas</h2>
        </header>

        <section class="panel">

            <section class="panel-body">

                <table id="dynaTable" class="table table-striped">
                    <thead class="panel panel-heading">
                        <tr>
                            <th class="v-middle"></th>                    
                            <th class="col-md-4 v-middle">Nombre</th>                    
                            <th class="col-md-4 text-center"><span>Correo Principal</span></th>
                            <th class="col-md-4 v-middle">Contacto</th>                    
                            <th></th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </section>
        </section>

        <form id="formPersonaEdit"  action="" method="POST">
            <input type="hidden" name="origen" value="" id="origenUrl"/>
        </form>

        <div th:substituteby="/templates/modal"></div>
        <script id="templatePersona" type="text/x-jsrender" class="hide" ><div th:substituteby="general/persona/templatePersona"/></script>
    </div>

    <div layout:fragment="js">
        <div th:substituteby="zlayout/includes :: javascript-dynatable"/>
        <script th:src="@{/app/general/persona/persona.js}" charset="utf-8"></script>
    </div>

</body>
</html>
