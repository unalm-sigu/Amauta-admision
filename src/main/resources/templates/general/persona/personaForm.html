<html layout:decorator="zlayout/layout">
    <head>
        <title> Usuario </title>
    </head>
    <body>
        <section layout:fragment="main">

             <header class="header b-b padder-lg">                
                <a th:href="@{${origen}}" class="btn btn-default btn-sm pull-right">Regresar</a>
                <h2 th:text="${ persona.id!=null ? persona.apellidosNombres : 'Nueva Persona' }" id="nombreCompleto">Nuevo Persona</h2> 

            </header>

            <section class="panel">

                <section class="panel-body bg-white b">


                    <form th:action="@{/general/persona/save}" method="post" id="formPersonaEdit" class="form-horizontal m-t-lg" data-parsley-validate="true">

                        <input type="hidden" name="persona.id" id="personaId"  th:value="${persona}? ${persona.id}"/>
                        <input type="hidden" name="id" id="personaId" th:value="${persona.id}"/>

                        <div class="form-group">

                            <label for="docIdentidad" class="col-sm-2 control-label">N° documento</label>
                            <div class="col-sm-4">
                                <select name="tipoDocumento.id" required="true" class="form-control select2 buscar-persona" id="tipoDNI">
                                    <option></option>
                                    <option th:each="item : ${documentos}"  
                                            th:text="${item.nombre}"
                                            th:selected="${persona.tipoDocumento!=null} ? ${persona.tipoDocumento.id==item.id}"
                                            th:value="${item.id}" ></option>
                                </select>
                            </div>

                            <div class="col-sm-3">
                                <input  type="text" class="inline numeric form-control sin-espacios buscar-persona" required="true" name="numeroDocIdentidad" 
                                        id="numeroDocIdentidad" 
                                        th:value="${persona!=null} ? ${persona.numeroDocIdentidad}"/>           
                            </div>

                        </div>

                        <div class="form-group">
                            <label for="emailEmpresa" class="col-sm-2 control-label">Email Principal</label>
                            <div class="col-sm-6">

                                <input  class="inline form-control validar-email-empresa" 
                                        data-trigger="change" required="true" type="email" 
                                        data-trim-value="true"
                                        name="emailCompania" id="emailCompania" th:value="${persona!=null} ? ${persona.emailCompania}"
                                        /> 

                            </div>
                        </div>

                        <div class="form-group">
                            <label for="paterno" class="col-sm-2 control-label">Nombre</label>
                            <div class="col-sm-3">
                                <input  type="text" name="paterno" required="true" class="form-control nombre-persona" 
                                        th:value="${persona!=null} ? ${persona.paterno}" placeholder="Paterno"/>
                            </div>
                            <div class="col-sm-3">
                                <input  type="text" name="materno" required="true" class="form-control nombre-persona" 
                                        th:value="${persona!=null} ? ${persona.materno}" placeholder="Materno"/>
                            </div>
                            <div class="col-sm-3">
                                <input  type="text" name="nombres" required="true" class="form-control nombre-persona" 
                                        th:value="${persona!=null} ? ${persona.nombres}" placeholder="Nombres"/>
                            </div>
                        </div>


                        <div class="form-group">
                            <label for="sexo" class="col-sm-2 control-label">Sexo</label>
                            <div class="col-sm-5">
                                <div class="col-sm-6">
                                    <label class="radio inline">
                                        <input  type="radio" required="true" name="sexo" id="sexoM" value="M" 
                                                th:checked="${persona!=null} ? ${persona.sexo=='M'}" /> Masculino
                                    </label>
                                </div>
                                <div class="col-sm-6">
                                    <label class="radio inline">
                                        <input  type="radio" required="true" name="sexo" id="sexoF" value="F" 
                                                th:checked="${persona!=null} ? ${persona.sexo=='F'}" /> Femenino
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="fechaNacimiento" class="col-sm-2 control-label">Fecha de Nacimiento</label>
                            <div class="col-sm-4">
                                <div class="input-group date" >
                                    <input  type="text" class="form-control" data-parsley-errors-container="#errorfechaNacimiento" 
                                            name="fechaNacer" id="fechaNacer" 
                                            th:value="${persona!=null} ? ${persona.fechaNacer!=null ? #dates.format(persona.fechaNacer,'dd/MM/yyyy'):''}"/>
                                    <span class="input-group-addon pointer"><i class="fa fa-calendar" aria-hidden="true"></i></span>
                                </div>
                                <span id="errorfechaNacimiento"></span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="distrito" class="col-sm-2 control-label">Distrito</label>
                            <div class="col-sm-4">
                                <input type="text" class="form-control input-s-full buscar-distrito" id="buscarDistrito" name="ubicacionDomicilio.id" data-trigger="change" 
                                       th:rel="${persona.ubicacionDomicilio != null}? ${persona.ubicacionDomicilio.distrito}"
                                       th:value="${persona.ubicacionDomicilio != null}? ${persona.ubicacionDomicilio.id}"
                                       required="true" />
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="direccion" class="col-sm-2 control-label">Dirección</label>
                            <div class="col-sm-9">
                                <input  type="text" name="direccion" class="input-xxlarge form-control domicilio"  th:value="${persona.direccion}"/>
                            </div>
                        </div>


                        <div class="form-group">
                            <label for="email" class="col-sm-2 control-label">Email Personal</label>
                            <div class="col-sm-4">
                                <input  type="email" class="inline form-control validar-email" data-type="email" name="email" id="email" 
                                        th:value="${persona!=null} ? ${persona.email}"/>                                  
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="celular" class="col-sm-2 control-label">Celular</label>
                            <div class="col-sm-4">
                                <input  type="text" class="form-control sin-espacios"  name="celular" 
                                        th:value="${persona!=null} ? ${persona.celular}"/>
                            </div>
                        </div>


                        <div class="form-group">
                            <label for="telefono" class="col-sm-2 control-label">Teléfono</label>
                            <div class="col-sm-4">
                                <input  type="text" class="form-control sin-espacios" name="telefono" id="telefono"
                                        th:value="${persona!=null} ? ${persona.telefono}"/>
                            </div>
                        </div>                                 

                        <div class="form-group m-t-xxlg">
                            <label class="col-sm-2 control-label"></label>
                            <div id="footerUsuario" class="col-sm-10">
                                <a class="btn btn-primary"  id="btnSavePersona">Guardar</a>                                        
                                <a th:href="@{${origen}}" class="btn btn-link" >Cancelar</a>
                            </div>
                        </div>

                    </form>

                </section>


                <div th:substituteby="templates/modal"/>

            </section>

        </section>

        <div layout:fragment="js">
            <script type="text/javascript" th:src="@{/phobos/js/wizard/jquery.bootstrap.wizard.js}"/>  
            <script th:src="@{/app/general/persona/personaForm.js}" charset="utf-8"></script>
        </div>

    </body>
</html>
