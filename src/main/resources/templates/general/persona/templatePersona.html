<tr rel="{{:index}}">
    <td>
        <a href="#" class="thumb-sm pull-center">
            <img src="{{:rutaFoto}}" alt="..." class="img-circle"/>
        </a>
    </td>

    <td>
        <div class="clear">
            <a rel="{{:id}}" class="info-persona pointer"><strong>{{:nombre}}</strong></a>
            <small class="block text-muted">{{:simbolo}}: {{:documento}}</small>
        </div>
    </td>
    <td class="text-left-xs">{{:emailEmpresa}}</td>
    <td class="text-left-xs">
        {{if tieneCelular}}
        <small class="block text-muted"><i class="fa fa-mobile"></i> {{:celular}}</small>
        {{/if}}
        {{if tieneTelefono}}
        <small class="block text-muted"><i class="fa fa-phone"></i> {{:telefono}}</small>
        {{/if}}
        {{if tieneEmail}}
        <small class="block text-muted"><i class="fa fa-envelope"></i> {{:email}}</small>
        {{/if}}
    </td>
    <td class="v-middle">
        <div class="actions">
            <a class="dropdown-toggle" href="#" data-toggle="dropdown"><i class="glyphicon glyphicon-cog"></i></a>
            <ul class="dropdown-menu pull-right" >
                <li><a class="btn-link modificar" href="#" rel="{{:id}}">Editar</a></li>  
            </ul>
        </div>
    </td>
</tr>
