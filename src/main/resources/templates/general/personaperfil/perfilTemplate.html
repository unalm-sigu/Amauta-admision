<tr rel="{{:index}}">
    <td class="text-left v-middle ">
        {{:personaNombre}}
        <small class="text-muted block"> Fecha de Ingreso:  {{:fechaIngreso}} </small>
    </td>

    <td class="text-center v-middle">
        {{:perfilNombre}} 
    </td>

    <td class="text-center v-middle">
        Oficina
        <small class="text-muted block"> Compañia</small>
    </td>

    <td class="text-center v-middle">
        <span class="label label-{{:estado}}">{{:estadoPersonaPerfil}}</span>        
    </td>

    <td class="v-middle"> 
        <div class="actions">
            <a class="dropdown-toggle" href="#" data-toggle="dropdown"><i class="glyphicon glyphicon-cog"></i></a>

            <ul class="dropdown-menu pull-right">
                <li><a th:href="@{'/general/personaperfil/{{:id}}/update'}">Editar</a></li>
                {{if esCreado || esInactivo}}
                <li><a class="activar" rel="{{:id}}" href="#">Activar</a></li>
                {{/if}}
                {{if esCreado || esActivo}}
                <li><a class="inactivar" rel="{{:id}}" href="#">Desactivar</a></li>
                {{/if}}
            </ul>
        </div>
    </td>
</tr>
