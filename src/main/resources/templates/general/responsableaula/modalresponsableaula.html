<modal-vik ref="modalResponsableAula" v-bind="modalResponsableAula" v-bind:okaction="saveResponsableAula">
    <div slot="body" id="modalResponsableAula" data-parsley-validate="true">

        <form v-bind:id="modalResponsableAula.form">
            <div class="row">
                <div class="col-md-12" >
                    <div class="form-group">
                        <label> Tipo Responsable </label>
                        <!--                       <multiselect v-model='responsableAula.jTipo'
                                                             label='value'
                                                             placeholder=""
                                                             deselect-label=""
                                                             select-label=""
                                                             track-by='name'
                                                             v-bind:internal-search="false"
                                                             v-bind:allow-empty="true"
                                                             v-bind:options='tiposResposablesAulas'
                                                             v-bind:hide-selected="true"
                                                             v-on:search-change="changeTurnoAtencion">
                                                </multiselect>-->

                        <select class="form-control"    
                                required="true"  
                                v-model="responsableAula.tipo"
                                v-bind:disabled="responsableAula.id!=null &amp;&amp; responsableAula.id!=''">

                            <option v-for="tipo in tiposResposablesAulas" v-bind:value="tipo.name">
                                {{ tipo.value }}
                            </option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label> Responsable </label>
                        <multiselect v-model='responsableAula.persona'
                                     v-bind:disabled="responsableAula.tipo==null"
                                     label='apellidosNombres'
                                     placeholder=""
                                     deselect-label=""
                                     select-label=""
                                     track-by='id'
                                     v-bind:internal-search="false"
                                     v-bind:allow-empty="true"
                                     v-bind:options='personas'
                                     v-bind:hide-selected="true"
                                     v-on:search-change="searchPersona"
                                     v-on:input="changePersonaResponsable">

                            <template slot="option" slot-scope="props">

                                <span class="row">
                                    <div class="col-sm-12">
                                        <p class="text-primary block">{{props.option.apellidosNombres}}</p> 
                                        <p class="block">DNI: {{props.option.numeroDocIdentidad}}</p>
                                        <p class="block">Telefono: {{props.option.telefono}}</p>
                                        <p class="block">Celular: {{props.option.celular}}</p>
                                    </div>
                                </span>

                            </template>
                        </multiselect>
                    </div>
                    <div class="form-group">
                        <label> Turno Atención </label>

                        <multiselect v-model='turnoAtencionSeleccionado'
                                     label='descripcion'
                                     placeholder=""
                                     deselect-label=""
                                     select-label=""
                                     track-by='id'
                                     v-bind:internal-search="false"
                                     v-bind:allow-empty="true"
                                     v-bind:options='turnosAtencionAula'
                                     v-bind:hide-selected="true"
                                     v-on:search-change="changeTurnoAtencion">
                        </multiselect>
                    </div>
                    <div class="form-group">
                        <label> Aulas </label>
                        <multiselect v-model='turnoAtencionSeleccionado.aulas'
                                     label='codigo'
                                     v-bind:custom-label='labelAula'
                                     v-bind:multiple="true" 
                                     placeholder=""
                                     deselect-label=""
                                     select-label=""
                                     track-by='id'
                                     v-bind:internal-search="true"
                                     v-bind:allow-empty="true"
                                     v-bind:options='aulas'
                                     v-bind:hide-selected="true">
                        </multiselect>
                    </div>
                </div>
            </div>
        </form>

    </div>
</modal-vik>
