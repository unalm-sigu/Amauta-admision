<html layout:decorator="_layout/layout">
    <head>
        <title>Inventario Aula</title>
        <link th:substituteby="_layout/includes :: styles-dynatable"></link>
    </head>

    <body>
        <div layout:fragment="main">
            <div id="main" v-cloak="">

                <header class="header b-b padder-lg">
                    <a href="#" v-on:click.prevent="nuevoInventario()" class="btn btn-primary btn-sm pull-right m-l-sm">Nuevo</a>
                    <a th:href="@{/general/aula}" class="btn btn-default btn-sm pull-right">Regresar</a>
                    <h2 th:inline="text" >Ambiente: [[${aula.tipoAula.nombre}]]   [[${aula.tipoAula.codigo}]] -  [[${aula.nombre}]]  </h2>
                </header>

                <section  v-if="activonuevo" class="wrapper-lg">
                    <section class="panel m-b-xs">
                        <section class="panel-body">
                            <section class="col-xs-12" >

                                <input class="hidden" id="fileupload" type="file" name="file"/>

                                <form class="form" data-parsley-validate="true" 
                                      method="post" 
                                      id='formInventario'
                                      accept-charset="UTF-8">

                                    <input type='hidden' name="almacen.aula.id" th:value="${aula.id}"    /> 

                                    <input type='hidden' name="id" v-bind:value="inventario.id"    /> 
                                    <input type='hidden' name="imagentemporal"  v-bind:value="imagentemporal"   /> 

                                    <input type="hidden" id="avatar" name="avatar" />

                                    <div class="row">

                                        <div class="col-sm-3 text-center">
                                            <div class="v-middle">

                                                <div class="thumb-xl m-t-lg">

                                                    <div v-show="!($refs.upload &amp;&amp; $refs.upload.uploaded)"
                                                         class="progress center-label-preloader" 
                                                         style="height: 4px;">
                                                        <div id="progress-bar" class="progress-bar" 
                                                             role="progressbar" 
                                                             style="width: 0%;" 
                                                             aria-valuenow="25" 
                                                             aria-valuemin="0" 
                                                             aria-valuemax="100"
                                                             ></div>
                                                    </div>

                                                    <img  height="200" width="200"
                                                          id="imagenProfile" 
                                                          v-bind:src="inventario.imagen" 
                                                          th:onerror="|this.src='@{/phobos/images/img.svg}';|"
                                                          v-bind:class="{ 'opacity-3': !($refs.upload &amp;&amp; $refs.upload.uploaded) }"
                                                          class="img-rounded pointer"/>

                                                    <file-upload
                                                        v-show="!isprocess"
                                                        extensions="gif,jpg,jpeg,png,webp"
                                                        accept="image/png,image/gif,image/jpeg,image/webp"
                                                        name="file"
                                                        class="btn btn-link pointer btn-sm"
                                                        post-action="/general/aula/inventario/upload"
                                                        v-model="files"
                                                        chunk-enabled="true"
                                                        v-on:input-filter="inputFilter"
                                                        v-on:input-file="inputFile"
                                                        ref="upload">
                                                        Imagen
                                                    </file-upload>

                                                </div>

                                            </div>
                                        </div>


                                        <div class="col-sm-9">


                                            <div class="col-sm-12">
                                                <div class="form-group">
                                                    <label>Categoria</label>
                                                    <multiselect 
                                                        label="nombre"
                                                        placeholder=""
                                                        required="true"
                                                        v-model="categoria"
                                                        v-on:input="changeCategoria"
                                                        v-bind:options="categorias"
                                                        v-bind:show-labels="false"
                                                        v-bind:limit="15">
                                                    </multiselect>

                                                </div>
                                            </div>

                                            <div class="col-sm-12" >
                                                <div class="form-group">
                                                    <label>Artículo</label>


                                                    <div class="input-group">

                                                        <multiselect 
                                                            label="nombre"
                                                            placeholder=""
                                                            required="true"
                                                            v-model="producto"
                                                            v-bind:options="productos"
                                                            v-bind:show-labels="false"
                                                            v-bind:limit="15">
                                                        </multiselect>


                                                        <div class="input-group-addon">
                                                            <i class="fa fa-plus pointer" v-on:click.prevent="addNuevoProducto()" aria-hidden="true"></i>
                                                        </div>
                                                    </div>

                                                    <input v-if="producto!=null" type='hidden' required="true" name="producto.id" v-bind:value="producto.id"    /> 

                                                </div>
                                            </div>


                                            <div class="row" >
                                                <div class="col-sm-12" >
                                                    <div class="col-sm-2"  v-if="inventario.id==null" >

                                                        <div class="form-group">
                                                            <label>Ingreso Grupal</label>

                                                            <label class="switch">
                                                                <input name="individual" type="checkbox" value="1" v-model="isindividual"/>
                                                                <span></span>
                                                            </label>

                                                        </div>

                                                    </div>


                                                    <div class="col-sm-4"  v-if="inventario.id==null &amp;&amp;  isindividual " >
                                                        <div class="form-group">
                                                            <label>Cantidad</label>
                                                            <input type="text" 
                                                                   class="form-control" 
                                                                   name="times" 
                                                                   required="true"
                                                                   v-bind:value="inventario.times" 
                                                                   v-model="inventario.times" 
                                                                   />
                                                        </div>
                                                    </div>


                                                    <div v-if="!isindividual" class="col-sm-4">
                                                        <div class="form-group">
                                                            <label>Código</label>
                                                            <input type="text" 
                                                                   class="form-control" 
                                                                   name="codigo" 
                                                                   required="true"
                                                                   v-bind:value="inventario.codigo" 
                                                                   v-model="inventario.codigo" 
                                                                   />
                                                        </div>
                                                    </div>


                                                    <div class="col-sm-6">
                                                        <div class="form-group">
                                                            <label>Marca</label>
                                                            <input type="text" 
                                                                   class="form-control" 
                                                                   name='marca' 
                                                                   v-bind:value="inventario.marca"  
                                                                   v-model="inventario.marca"  
                                                                   />
                                                        </div>
                                                    </div> 
                                                </div> 
                                            </div> 


                                            <div v-if="producto != null &amp;&amp; producto.tipo=='EQUIPO' " >

                                                <div class="col-sm-4">
                                                    <div class="form-group">
                                                        <label>Modelo</label>
                                                        <input type='text' name="modelo" 
                                                               class='form-control'
                                                               v-bind:value="inventario.modelo"
                                                               v-model="inventario.modelo"
                                                               />
                                                    </div>
                                                </div>

                                                <div class="col-sm-4">
                                                    <div class="form-group">
                                                        <label>Serie</label>
                                                        <input type='text' 
                                                               name="serie"  
                                                               class='form-control' 
                                                               v-bind:value="inventario.serie" 
                                                               v-model="inventario.serie" 
                                                               />
                                                    </div>
                                                </div>


                                                <div class="col-sm-4">
                                                    <div class="form-group">
                                                        <label>Año Fabricación</label>
                                                        <div class='input-group'>

                                                            <date-picker 
                                                                v-bind:config="configDate" 
                                                                name="anoFabricacion" 
                                                                class='form-control' 
                                                                id="anioFabricacion"
                                                                v-bind:wrap="true" 
                                                                v-model="inventario.anoFabricacion"></date-picker>

                                                            <span class="input-group-addon pointer"><i class="fa fa-calendar"></i></span>
                                                        </div>
                                                    </div>
                                                </div>


                                            </div>  


                                            <div  v-if="producto != null &amp;&amp; producto.tipo=='MUEBLE' " >

                                                <div class="col-sm-3">
                                                    <div class="form-group">
                                                        <label>Material</label>
                                                        <input type="text" 
                                                               class="form-control" 
                                                               name="material" 
                                                               v-bind:value="inventario.material"
                                                               v-model="inventario.material"
                                                               />
                                                    </div>
                                                </div>

                                                <div class="col-sm-3">
                                                    <div class="form-group">
                                                        <label>Largo(cm)</label>
                                                        <input type="text" 
                                                               class="form-control decimal" 
                                                               name="largo" 
                                                               v-bind:value="inventario.largo" 
                                                               v-model="inventario.largo" 
                                                               />
                                                    </div>
                                                </div>

                                                <div class="col-sm-3">
                                                    <div class="form-group">
                                                        <label>Ancho(cm)</label>
                                                        <input type="text" 
                                                               class="form-control decimal" 
                                                               name="ancho" 
                                                               v-bind:value="inventario.ancho"
                                                               v-model="inventario.ancho"
                                                               />
                                                    </div>
                                                </div>

                                                <div class="col-sm-3">
                                                    <div class="form-group">
                                                        <label>Altura(cm)</label>
                                                        <input type="text" 
                                                               class="form-control decimal" 
                                                               name="alto" 
                                                               v-bind:value="inventario.alto"
                                                               v-model="inventario.alto"
                                                               />
                                                    </div>
                                                </div>


                                            </div>


                                        </div>    


                                        <div class='col-sm-12'>



                                            <div class="col-sm-3">
                                                <div class="form-group">
                                                    <label>Color</label>
                                                    <div class="form-group">
                                                        <input type="text" 
                                                               class="form-control" 
                                                               name='color'
                                                               v-bind:value="inventario.color"  
                                                               v-model="inventario.color"  
                                                               />

                                                    </div>
                                                </div>
                                            </div> 

                                            <div class="col-sm-3">
                                                <div class="form-group">
                                                    <label>Condición</label>
                                                    <select class="form-control custom-select" 
                                                            name="condicion" 
                                                            required="true"
                                                            v-bind:value="inventario.condicion"
                                                            v-model="inventario.condicion"
                                                            data-trigger="change">

                                                        <option></option>

                                                        <option th:each="item : ${condiciones}"
                                                                th:value="${item.name()}"
                                                                th:text="${item.getValue()}" >
                                                        </option>

                                                    </select>
                                                </div>
                                            </div>


                                            <div class="col-sm-3">
                                                <div class="form-group">
                                                    <label>Fecha Ingreso </label>
                                                    <div class='input-group date'>

                                                        <date-picker 
                                                            v-bind:config="configDate" 
                                                            name="fechaIngreso" 
                                                            class='form-control' 
                                                            id="fechaIngreso"
                                                            required="true"
                                                            v-bind:wrap="true" 
                                                            v-model="inventario.fechaIngreso"></date-picker>

                                                        <span class="input-group-addon pointer"><i class="fa fa-calendar"></i></span>
                                                    </div>
                                                </div>
                                            </div>


                                            <div class="col-sm-3">
                                                <div class="form-group">
                                                    <label>Fecha Baja </label>
                                                    <div class='input-group date'>

                                                        <date-picker 
                                                            v-bind:config="configDate" 
                                                            name="fechaBaja" 
                                                            class='form-control' 
                                                            id="fechaBaja"

                                                            v-bind:wrap="true" 
                                                            v-model="inventario.fechaBaja"></date-picker>


                                                        <span class="input-group-addon pointer"><i class="fa fa-calendar"></i></span>
                                                    </div>
                                                </div>
                                            </div>








                                            <div class="col-sm-3">
                                                <div class="form-group">
                                                    <label>Proveedor</label>
                                                    <input type='text' 
                                                           name="proveedor" 
                                                           class='form-control' 
                                                           v-bind:value="inventario.proveedor" 
                                                           v-model="inventario.proveedor" 
                                                           data-trigger="change" />
                                                </div>
                                            </div>


                                            <div class="col-sm-3">
                                                <div class="form-group">
                                                    <label>Fecha de vencimiento de la Garantia</label>
                                                    <div class='input-group date'>

                                                        <date-picker 
                                                            v-bind:config="configDate" 
                                                            name="fechaVencimientoGarantia" 
                                                            class='form-control' 
                                                            id="fechaVencimientoGarantia"
                                                            required="true"
                                                            v-bind:wrap="true" 
                                                            v-model="inventario.fechaVencimientoGarantia"></date-picker>

                                                        <span class="input-group-addon pointer"><i class="fa fa-calendar"></i></span>
                                                    </div>
                                                </div>
                                            </div>


                                            <div class="col-sm-3">
                                                <div class="form-group">
                                                    <label>Vida Util</label>
                                                    <input type="text" 
                                                           class="form-control numerico" 
                                                           name="vidaUtil" 
                                                           v-bind:value="inventario.vidaUtil" 
                                                           v-model="inventario.vidaUtil" 
                                                           />
                                                </div>
                                            </div>

                                            <div class="col-sm-12">
                                                <div class="form-group">
                                                    <label>Descripcíon</label>
                                                    <textarea type="text" 
                                                              class="form-control" 
                                                              name="comentario" 
                                                              v-text="inventario.comentario"
                                                              v-bind:value="inventario.comentario"
                                                              v-model="inventario.comentario"
                                                              ></textarea>
                                                </div>
                                            </div>

                                        </div>

                                    </div>  

                                    <div class="line line-dashed b-b line-lg pull-in"></div>

                                    <div class="col-sm-12 text-center" >    

                                        <a class='btn btn-danger btn-bg' v-on:click.prevent="cancelarUpdate" href="#"> Cancelar</a>


                                        <button class="btn btn-primary"
                                                v-bind:disabled="isprocess" 
                                                v-on:click.prevent="guardarInventario()"  
                                                type="button" > 

                                            <i v-if="isprocess" class="fa fa-spinner fa-spin"></i>

                                            {{inventario.id!=null?'Actualizar':'Guardar'}}

                                        </button> 


                                    </div>

                                </form>


                            </section>
                        </section>
                    </section>
                </section>

                <section class="wrapper-lg">
                    <section class="panel m-b-xs">
                        <section class="panel-body">


                            <raptor-table 
                                v-bind:url="inventarioURL" 
                                v-bind:preload="true" ref="load">

                                <div slot="header">

                                    <div class="form-inline">
                                        <div class="form-group">
                                            <label class="text-sm">Editar Número de Inventario</label>
                                            <label class="switch">
                                                <input type="checkbox" 
                                                       v-model="verTablaEditable"/>
                                                <span></span>
                                            </label>
                                        </div>
                                        <div class="form-group"  v-if="verTablaEditable">
                                            <label></label>
                                            <a href="#" class="btn btn-success btn-xs" v-on:click.prevent="confirmUpdateCodigoInventario()" >Actualizar Número de Inventario</a>                            
                                        </div>
                                    </div>

                                </div>


                                <template scope="props" >
                                    <table class="table table-striped table-hover">
                                        <thead> 
                                            <tr>
                                                <th class="col-sm-5 v-middle">Artículo</th>
                                                <th class="col-sm-3 v-middle">Número</th>
                                                <th class="col-sm-3 v-middle">Característica</th>
                                                <th class="col-sm-1 text-center v-middle">Condicíon</th>
                                                <th></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr v-for="(item,indexxx) in props.data">

                                                <td class="v-middle">
                                                    <p class="bold">{{item.producto.nombre}}</p>
                                                    {{item.producto.productoSuperior.nombre}}
                                                </td>

                                                <td class="v-middle">
                                                    <input v-bind:ref="'fild-editable-'+indexxx" v-on:keyup.enter="nextEditable($event,indexxx)" v-if="verTablaEditable &amp;&amp; item.codeEdit " type="text"
                                                           class="form-control" v-model="item.codigo"/>
                                                    {{item.codigo}}
                                                </td>

                                                <td class="v-middle">
                                                    <p v-if="item.marca" class="block text-sm"><b>Marca : </b>{{item.marca}}</p>
                                                    <p v-if="item.modelo" class="block text-sm"><b>Modelo : </b>{{item.modelo}}</p>
                                                    <p v-if="item.serie" class="block text-sm"><b>Serie : </b>{{item.serie}}</p>
                                                    <p v-if="item.anoFabricacion" class="block text-sm"><b>Fabricación : </b>{{item.anoFabricacion}}</p>
                                                    <p v-if="item.color" class="block text-sm"><b>Color : </b>{{item.color}}</p>
                                                    <p v-if="item.material" class="block text-sm"><b>Material : </b>{{item.material}}</p>
                                                    <p v-if="item.largo &amp;&amp; item.alto  &amp;&amp;  item.ancho" class="block text-sm"><b>Medida : </b>{{item.largo}}x{{item.alto}}x{{item.ancho}}</p>
                                                </td>

                                                <td class="v-middle text-center">
                                                    <span v-if="item.condicion=='NUEVO' " class=" label label-success">{{item.condicionEnum.value}}</span>
                                                    <span v-if="item.condicion=='VIEJO' " class=" label label-danger">{{item.condicionEnum.value}}</span>
                                                    <span v-if="item.condicion=='MEDIO' " class=" label label-warning">{{item.condicionEnum.value}}</span>
                                                </td>

                                                <td class="v-middle">
                                                    <div class="actions">
                                                        <a class="dropdown-toggle" href="#" data-toggle="dropdown"><i class="glyphicon glyphicon-cog"></i></a>
                                                        <ul class="dropdown-menu pull-right">
                                                            <li><a href="#" v-on:click.prevent="editarInventario(item)">Editar</a></li>
                                                            <li><a href="#"  v-on:click.prevent="eliminarInventario(item)">Eliminar</a></li>
                                                        </ul>
                                                    </div>
                                                </td>


                                            </tr>
                                        </tbody>
                                    </table>
                                </template>


                            </raptor-table>


                        </section>
                    </section>
                </section>




                <modal-vik ref="nuevoProducto"
                           v-bind="dataNuevoProducto"
                           v-bind:okaction="saveNuevoProducto" >

                    <div slot="body" vclass="panel">

                        <div>
                            <h4 class="text-center">Registrar Nuevo Artículo</h4>
                            <h4  class="text-center bold text-primary" v-if='categoria != null'> {{categoria.nombre}}</h4>
                        </div>

                        <div class="panel-body">

                            <form id='formNuevoProducto' class="form-horizontal" data-parsley-validate="true">

                                <input v-if='categoria != null' type="hidden" name="productoSuperior.id" v-bind:value="categoria.id" />

                                <div class="form-group">
                                    <label>Nombre</label>
                                    <input type="text"
                                           class="form-control input-sm"
                                           name="nombre"
                                           v-model="nuevoproducto.nombre"
                                           v-bind:value="nuevoproducto.nombre"
                                           required="true"/>
                                </div>

                                <div class="form-group">
                                    <label>Tipo</label>
                                    <select name="tipo"
                                            v-bind:valor="nuevoproducto.tipo"
                                            class="form-control" 
                                            required="true">
                                        <option></option>

                                        <option th:each="item : ${tipos}"
                                                th:value="${item.name()}"
                                                th:text="${item.value}"></option>

                                    </select>               
                                </div>

                            </form>

                        </div>


                    </div>
                </modal-vik>

            </div>

            <div th:substituteby="_modules/vue-modal"/>

        </div>

        <div layout:fragment="js">
            <script  th:inline="javascript" >
                /*<![CDATA[*/
                var idaula = /*[[${aula.id}]]*/ '';
                /*]]>*/
            </script>
            <div th:substituteby="_modules/vue-raptor-table"></div>
            <div th:substituteby="_layout/includes :: vue-loader"/>
            <div th:substituteby="_layout/includes :: javascript-vue-upload"></div>
            <div th:substituteby="_layout/includes :: javascript-bootstrap-datetimepicker"></div>
            <div th:substituteby="_layout/includes :: javacsript-vue-bootstrap-datetimepicker"></div>
            <script th:src="@{/vendor/sweetalert/dist/sweetalert.min.js}" charset="utf-8"></script>
            <script th:src="@{/phobos/modules/vue-modal.js}" charset="utf-8" type="text/javascript" ></script>
            <script th:src="@{/app/general/inventarioaula/inventarioaula.js}" charset="utf-8"></script>
        </div>

    </body>
</html>
