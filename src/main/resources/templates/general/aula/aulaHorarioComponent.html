<template id="modalAulaHorarioComp"> 
    <div> 
        <section class="panel-body">
            <div class="table-responsive" >
                <table class="table table-bordered" v-if="aula!=null">

                    <thead>
                        <tr>
                            <th style="width: 12.5%" class="text-center">Hora</th>
                            <th style="width: 12.5%" class="text-center" 
                                v-for="dia in dias">
                                {{dia.nombre}}
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="hora in horas">
                            <td class="v-middle">
                                <span class="bold"
                                      >
                                    {{hora.descripcion}}
                                </span>

                            </td>
                            <td  v-for="dia in dias" class="text-center"> 

                                <div v-if="jsonHorarioAula[dia.id+'_'+hora.id]"  class="dropdown notas-cepre">

                                    <a v-on:mouseover="onmousein($event)" v-on:mouseleave="onmouseout($event)" class="dropdown-toggle" href="#" data-toggle="dropdown" >
                                        <strong>{{jsonHorarioAula[dia.id+'_'+hora.id].seccion.codigo2}}</strong>  <b class="caret"></b> 
                                    </a>

                                    <div class="dropdown-menu dropdown-menu-right">
                                        <div class="row m-l-xs m-r-xs">

                                            <span class="disabled block">
                                                <strong> {{jsonHorarioAula[dia.id+'_'+hora.id].seccion.grupoSeccion.curso.codigo}}</strong>
                                                {{jsonHorarioAula[dia.id+'_'+hora.id].seccion.grupoSeccion.curso.nombre}}
                                            </span>

                                            <span class="block" style="margin-top:5px;margin-bottom:5px;">

                                                <strong  > Docentes </strong> 


                                                <ul class="otros-docente">
                                                    <li v-for="(item, index )  in jsonHorarioAula[dia.id+'_'+hora.id].seccion.docenteSeccion" class="prof">
                                                        <p>
                                                            <strong>
                                                                <i  v-if="index==0" class="fa fa-shield" aria-hidden="true"></i> 
                                                                <i  v-else="index==0" class="fa fa-user" aria-hidden="true"></i> 
                                                                {{item.docente.codigo}} 
                                                            </strong> 
                                                            {{item.docente.persona.letraNomPaterno}} 
                                                        </p>
                                                    </li>
                                                    <li v-if="jsonHorarioAula[dia.id+'_'+hora.id].seccion.sizeDocente>2" class="prof"><span>Otros...</span></li>
                                                </ul>

                                            </span>

                                            <span class="block">
                                                <strong> Sección </strong> {{jsonHorarioAula[dia.id+'_'+hora.id].seccion.codigo2}}
                                            </span>

                                            <span class="block">
                                                <strong> Grupo </strong>  {{jsonHorarioAula[dia.id+'_'+hora.id].seccion.grupoHoras.codigo}}
                                            </span>


                                        </div>
                                    </div>

                                </div>

                                <span v-if="jsonHorarioAula[dia.id+'_'+hora.id]"
                                      class="text-muted block">
                                    {{jsonHorarioAula[dia.id+'_'+hora.id].seccion.grupoHoras.codigo}}
                                </span>
                            </td>
                        </tr>
                        <tr v-if="horas.length == 0">
                            <td v-bind:colspan="1+dias.length" class="text-left">
                                Sin horario.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div> 
</template>
<script>
    var AulaHorarioVue = Vue.component("aula-horario-component", {
        template: "#modalAulaHorarioComp",
        props: {

        },
        data: function () {
            return {
                aula: null,
                dias: null,
                horas: null,
                jsonHorarioAula: null
            }
        },
        mounted: function () {
            let $vue = this;
            $vue.loadComponent($vue, $vue.aula);
        },
        methods: {
            loadComponent($vue, aula) {
                $.ajax({
                    method: 'POST',
                    url: APP.url('academico/gposeccion/loadModalAulaHorario'),
                    data: {
                        aula: aula.id
                    },
                    success: function (response) {
                        if (response.success) {
                            $vue.dias = response.data.dias;
                            $vue.horas = response.data.horas;
                            $vue.aula = response.data.aula;
                            $vue.jsonHorarioAula = response.data.jsonHorarioAula;
                            console.dir($vue.jsonHorarioAula);
                        } else {
                            notify(MESSAGES.errorComunicacion, "error");
                        }
                    }, error: function () {
                        notify(MESSAGES.errorComunicacion, "error");
                    }
                });


            },
            onmousein(e) {
                $(e.target).parents('.dropdown:first').find('.dropdown-menu').stop(true, true).delay(20).slideDown(500);
            },
            onmouseout(e) {
                $(e.target).parents('.dropdown:first').find('.dropdown-menu').stop(true, true).delay(20).slideUp(500);
            }
        }
    });

</script>
