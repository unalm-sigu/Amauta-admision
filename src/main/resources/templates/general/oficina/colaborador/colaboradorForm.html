<html layout:decorator="_layout/layout">
    <head>
        <title>Administración de Oficinas</title>
    <div th:substituteby="_layout/includes :: styles-dynatable"></div>
</head>
<body>
    <div layout:fragment="main">
        <div id="colaboradorFormVue">

            <header class="header b-b padder-lg">

                <div class="btn-group pull-right">
                    <a href="#" v-on:click="regresar" class="btn btn-default btn-sm pull-right">Regresar</a>
                </div>

                <h2 v-if="!newCola" v-text="'Nuevo Colaborador'"></h2>
                <h2 v-if="newCola"  v-text="'Funciones y Cargos del colaborador'"></h2>

            </header>

            <section class="wrapper-lg m-b-xs ">
                <section class="panel">     
                    <section class="panel-body" v-if="newCola">
                        <div>
                            <div class="pull-left m-r" >
                                <img class="img-responsive img-thumbnail img-circle" src="/phobos/images/unalm/male.png" />
                            </div>
                            <div >
                                <h4 class="block text-primary bold">{{colaborador.persona.tituloAcademico}} {{colaborador.persona.nombreCompleto}}</h4>
                                <spam class="block bold" v-text="colaborador.persona.tipoDocumento.simbolo + ': '+ colaborador.persona.numeroDocIdentidad"></spam>
                                <spam class="bold" v-text="'Código colaborador: '+ colaborador.codigo"></spam>
                            </div>
                        </div>
                    </section>
                    <section class="panel-body">
                        <div v-if="!newCola" > 

                            <h2>Información Personal
                                <div class="btn-group pull-right">
                                    <button href="#" v-on:click="searchPerson" class="btn btn-success btn-sm pull-right">Buscar Persona</button>
                                </div>
                            </h2>
                            <div class="col-sm-12">
                                <hr/>
                            </div>
                        </div>  
                        <form data-parsley-validate="true" id="formConfig"  method="post">
                            <div class="row" v-if="!newCola" >
                                <div class="col-sm-6">
                                    <label>Tipo de Documento</label>                                   
                                    <div   class="form-group">  
                                        <multiselect v-model="persona.tipoDocumento" 
                                                     required="true"
                                                     v-bind:options='tipoDoc'
                                                     label='nombre'
                                                     track-by='id'
                                                     v-on:input="verificarDoc"
                                                     v-bind:hide-selected="true"
                                                     placeholder="Seleccione un tipo de documento"
                                                     >
                                        </multiselect>
                                    </div>
                                </div>      
                                <div class="col-sm-6">
                                    <label>Número de Documento</label>
                                    <div class="form-group">              

                                        <input type="text" required="true" class="inline numeric form-control"  maxlength="15" v-model="persona.numeroDocIdentidad" v-on:change="verificarDoc"/>
                                    </div>
                                </div>  
                            </div>
                            <div class="row" v-if="!newCola">
                                <div class="col-sm-6">
                                    <label>Paterno</label>
                                    <div class="form-group">                                
                                        <input type="text"  v-bind:disabled="personaValidTemp.paterno"  required="true" class="inline form-control"  maxlength="200" v-model="persona.paterno" />
                                    </div>
                                </div>      
                                <div class="col-sm-6">
                                    <label>Materno</label>
                                    <div class="form-group">    
                                        <input type="text"  v-bind:disabled="personaValidTemp.materno"     required="true" class="inline form-control"  maxlength="200" v-model="persona.materno"/>
                                    </div>
                                </div>      
                            </div>
                            <div class="row" v-if="!newCola">
                                <div class="col-sm-6">
                                    <label>Nombres</label>
                                    <div class="form-group">     
                                        <input type="text"  v-bind:disabled="personaValidTemp.nombres" required="true" class="inline form-control"  maxlength="200" v-model="persona.nombres"/>
                                    </div>
                                </div>  
                                <div class="col-sm-6">
                                    <label>Correo Institucional</label>
                                    <div class="form-group">          
                                        <input type="text"  id="email" v-bind:disabled="personaValidTemp.emailCompania"  class="inline form-control" name="emailCompania" maxlength="200" v-model="persona.emailCompania" v-on:change="verificarEmail"/>
                                    </div>
                                </div> 

                            </div>
                            <div  class="row" v-if="!newCola">
                                <div class="col-sm-6" v-if="!newCola">
                                    <label class="block">Sexo</label>

                                    <div class="form-group" v-if="!personaValidTemp.sexo"> 
                                        <div class="col-sm-10">
                                            <div class="col-sm-5">
                                                <label class="radio inline">
                                                    <input  type="radio" required="true" name="persona.sexo" v-model="persona.sexo" id="inlineCheckbox1" value="M" /> Masculino
                                                </label>
                                            </div>
                                            <div class="col-sm-5">
                                                <label class="radio inline">
                                                    <input  type="radio" required="true" name="persona.sexo" v-model="persona.sexo" id="inlineCheckbox2" value="F" /> Femenino
                                                </label>
                                            </div>
                                        </div>
                                    </div>

                                    <!--div class="form-group" v-if="!personaValidTemp.sexo" > 
    
                                        <label >Femenino</label>
                                        <input  type="radio" id ="F" value="F"  v-model="persona.sexo"  />
                                        <label >Masculino</label>
                                        <input  type="radio"   id ="M" value="M" v-model="persona.sexo"  />
    
                                    </div-->
                                    <div class="form-group" v-if="personaValidTemp.sexo">
                                        <span v-text="persona.sexo == 'M' ? 'Masculino' : 'Femenino'"></span>
                                    </div>
                                </div>                                
                            </div>
                            <div> 
                                <h2>Información laboral</h2>
                            </div>  
                            <hr/>
                            <div class="row">
                                <div class="col-sm-6">
                                    <label>Área</label>
                                    <div class="form-group">                                
                                        <multiselect v-model="colaborador.oficina" 
                                                     v-bind:options='area'
                                                     label='nombre'
                                                     track-by='id'
                                                     required="true"
                                                     placeholder="Seleccione un tipo de documento"
                                                     v-bind:hide-selected="true"
                                                     >
                                        </multiselect>

                                    </div>
                                </div>     
                                <div class="col-sm-6">
                                    <label >Fecha Inicio  {{colaborador.fechaInicio}}</label>
                                        <div class="input-group">
                                            <date-picker v-bind:config="configDate" v-bind:wrap="false" v-model="colaborador.fechaInicio"></date-picker>
                                            <div class="input-group-addon">
                                                <span class="fa fa-calendar"></span>
                                            </div>
                                    </div>
                                </div>                                
                            </div>
                            <div class="row">
                                <div class="col-sm-6">
                                    <label>Cargo</label>
                                    <div class="form-group">                                
                                        <multiselect v-model="colaborador.cargo" 
                                                     v-bind:options='compania'
                                                     label='nombre'
                                                     track-by='id'
                                                     required="true"
                                                     placeholder="Seleccione un cargo"
                                                     v-bind:hide-selected="true"
                                                     >
                                        </multiselect>
                                    </div>
                                </div>      
                                <div class="col-sm-6">                                    
                                    <label>Funciones</label>
                                    <div class="form-group">                                
                                        <multiselect v-model="colaborador.funcionColaborador" 
                                                     v-bind:options='funciones'
                                                     label='nombre'
                                                     track-by='id'
                                                     v-bind:multiple="true" 
                                                     required="true"
                                                     placeholder="Seleccione una funcion"
                                                     v-bind:taggable="true"
                                                     >
                                        </multiselect>
                                    </div>
                                </div>                                  
                            </div>
                            <div class="form-group m-t-xxlg">
                                <div id="footerOficina" class="col-sm-10 col-sm-offset-4">
                                    <button class="btn btn-primary" 
                                            type="submit"
                                            v-on:click.prevent="save"     
                                            v-if="!newCola" v-text="'Guardar'"
                                            ></button>            
                                    <button class="btn btn-primary" 
                                            type="submit"
                                            v-on:click.prevent="update"      
                                            v-if="newCola" v-text="'Actualizar'"
                                            ></button>    
                                    <a v-on:click="regresar" class="btn btn-link" >Cancelar</a>
                                </div>
                            </div>

                        </form>
                    </section>
                </section>
            </section>

            <!--MODAL INICIO-->
            <div class="modal fade" id="myModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
                <div class="modal-dialog modal-lg" role="document">
                    <div class="modal-content">
                        <div class="modal-header">
                            <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                            <h4 class="modal-title" >Buscar Personas </h4>
                        </div>
                        <div class="modal-body">
                            <div class="col-md-offset-1 ">                                  
                                <div class=' form-group row'>
                                    <div class="col-sm-8">
                                        <div class="form-group">    
                                            <search-person v-model="seleccionado" ></search-person>
                                        </div> 
                                    </div>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-link" data-dismiss="modal">Close</button>
                                    <button type="button" class="btn btn-success" v-on:click.prevent="seleccionar" >Seleccionar</button>
                                </div>
                            </div>
                        </div>
                    </div>         
                </div>
            </div>
            <!--MODAL FIN-->
        </div>
        <div th:substituteby="_modules/vue-searchPerson"></div>
    </div>

</body>
<div layout:fragment="js">
    <script th:inline="javascript">
        /*<![CDATA[*/
        var oficinaId = /*[[${oficina}]]*/ 'json';
        var colaboradorJson = /*[[${colaborador.toString()}]]*/ 'json';
        var tipoDocumentoJson = /*[[${tipoDocumento.toString()}]]*/ 'json';
        var sexoJson = /*[[${sexo}]]*/ 'json';
        var areaJson = /*[[${area.toString()}]]*/ 'json';
        var companiaJson = /*[[${compania.toString()}]]*/ 'json';
        var funcionesJson = /*[[${funciones.toString()}]]*/ 'json';
        /*]]>*/
    </script>
    <div th:substituteby="_layout/includes :: javascript-dynatable"/>
    <div th:substituteby="_layout/includes :: javascript-bootstrap-datetimepicker"></div>
    <div th:substituteby="_layout/includes :: javacsript-vue-bootstrap-datetimepicker"></div>
    <script type="text/javascript" th:src="@{/phobos/modules/vue-searchPerson.js}"></script>
    <script th:src="@{/app/general/oficina/colaborador/colaboradorForm.js}" charset="utf-8"></script>
</div>
</html>
