<template id="dynatableTemplate">
    <transition >
        <div class="panel padder-v">
            <table id="dynaTable" class="table table-striped table-hover">
                <thead> 
                    <tr>
                        <th class="text-center v-middle">Persona</th>
                        <th class="text-center">Área</th>
                        <th class="text-center">Funciones</th>
                        <th class="text-center">Estado</th>
                        <th class="text-center">Editar</th>
                    </tr> 
                </thead>
                <tbody></tbody>
            </table>
        </div>

    </transition>
</template>

<template id="dynatableRowTemplate">

    <tr>
        <td class="v-middle text-left">
            <a class="block text-primary bold ">{{:persona}}</a> 
            {{if codigo != ""}}
            <small class="block bold">Código: {{:codigo}}</small> 
            {{/if}}
            {{if dni != ""}}
            <small class="block bold">DNI: {{:dni}}</small> 
            {{/if}}
        </td>
        <td class="v-middle text-center">
            <span class="block">Oficina: {{:area}}</span> 
            <span>Cargo: {{:cargo}}</span> 
        </td>
        <td class="v-middle text-center">
            <span class="estado-blue">{{:funciones}}</span> 
        </td>
        <td class="v-middle text-center col-md-1">
            {{if estado != "Despedido"}}
            <span class="label label-success">{{:estado}}</span> 
            {{/if}}
            {{if estado == "Despedido"}}
            <span class="label label-danger">{{:estado}}</span> 
            {{/if}}
        </td>

        <td class="v-middle"> 

            <div class="dropdown actions">
                <a class="dropdown-toggle" data-toggle="dropdown">
                    <i class="glyphicon glyphicon-option-vertical"></i>
                </a> 
                <ul class="dropdown-menu pull-right" >
                    <li >
                        {{for estados}}
                        <a class="updateEstado" rel="{{:id}}" href="#">{{:value}}</a>
                        {{/for}}
                    </li>
                    <li  class="divider"></li>
                    <li><a  rel="{{:id}}" class="updateColaborador" >Editar Funciones</a></li>
                    <li><a  rel="{{:id}}" href="#" >Editar Info personal</a></li>
                </ul>
            </div>
        </td>
    </tr>
</template>
