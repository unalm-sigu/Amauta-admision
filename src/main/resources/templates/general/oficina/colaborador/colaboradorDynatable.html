<template id="dynatableTemplate">
    <transition >
        <div class="panel padder-v">
            <table id="dynaTable" class="table table-striped table-hover">
                <thead> 
                    <tr>
                        <th class="col-md-4 v-middle">Persona</th>
                        <th class="col-md-4 text-center">Área</th>
                        <th class="col-md-2 text-center">Funciones</th>
                        <th class="col-md-2 text-center">Estado</th>
                        <th></th>
                    </tr> 
                </thead>
                <tbody></tbody>
            </table>
        </div>

    </transition>
</template>

<template id="dynatableRowTemplate">

    <tr>
        <td class="v-middle text-left">
            <a class="block text-primary bold ">{{:persona}}</a> 
            {{if codigo != ""}}
            <small class="block bold">Código: {{:codigo}}</small> 
            {{/if}}
            {{if dni != ""}}
            <small class="block bold">DNI: {{:dni}}</small> 
            {{/if}}
        </td>
        <td class="v-middle text-center">
            <span class="block">Oficina: {{:area}}</span> 
            <span>Cargo: {{:cargo}}</span> 
        </td>
        <td class="v-middle text-center">
            <span class="estado-blue pointer showFuncionesColaborador" rel="{{:id}}">{{:funciones}}</span> 
        </td>
        <td class="v-middle text-center">
            {{if estado == "Despedido"}}
            <span class="label label-danger">{{:estado}}</span> 
            {{/if}}
            {{if estado == "Descanso"}}
            <span class="label label-warning">{{:estado}}</span> 
            {{/if}}
            {{if estado == "Activo"}}
            <span class="label label-success">{{:estado}}</span> 
            {{/if}}
        </td>

        <td class="v-middle"> 

            <div class="dropdown actions">
                <a class="dropdown-toggle" data-toggle="dropdown">
                    <i class="glyphicon glyphicon-option-vertical"></i>
                </a> 
                <ul class="dropdown-menu pull-right" >
                    <li >
                        {{for estados}}
                        <a class="updateEstado" rel="{{:id}}" href="#" value="{{:estado}}">{{:value}}</a>
                        {{/for}}
                    </li>
                    <li  class="divider"></li>
                    <li><a  rel="{{:id}}" class="updateColaborador" href="#" >Editar Funciones</a></li>
                    <li><a  rel="{{:personaId}}" class="updatePersona" href="#" >Editar Info personal</a></li>
                </ul>
            </div>
            
        </td>
    </tr>
</template>
