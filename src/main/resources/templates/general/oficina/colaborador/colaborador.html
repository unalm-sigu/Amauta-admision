<html layout:decorator="_layout/layout">
    <head>
        <title>Administración de Oficinas</title>
    <div th:substituteby="_layout/includes :: styles-dynatable"></div>
</head>
<body>
    <div layout:fragment="main">
        <div id="colaboradorVue">

            <header class="header b-b padder-lg">

                <div class="pull-right m-t-md">
                    <button type="button" class="btn btn-success btn-sm dropdown-toggle" data-toggle="dropdown">
                        <i class="fa fa-file-text-o"/> &nbsp; Acciones &nbsp; <span class="caret"></span>
                    </button>
                    <ul class="dropdown-menu">
                        <li ><a href="#" v-on:click="nuevoColaborador()" >Nuevo Colaborador</a></li>
                        <li><a href="#"  v-on:click="nuevoCargos()">Agregar Cargo</a></li>
                        <li><a href="#"  v-on:click="nuevaFuncion()">Agregar Función</a></li>
                        <li class="divider"></li>
                        <li><a href="#" v-on:click="verCargo()">Ver Cargos</a></li>
                        <li><a href="#" v-on:click="verFuncion()">Ver Funciones</a></li>
                    </ul>
                    <a href="#" v-on:click="regresar" class="btn btn-default btn-sm m-l-sm">Regresar</a>
                </div>
                <h2>Colaboradores</h2>
            </header>
            <section class="wrapper-lg m-b-xs">
                <section class="panel m-b-xs">
                    <section class="panel-body">
                        <div class="row">
                            <div class="col-md-2 text-center" >
                                <a class="verModalidades text-success pointer" value="1" rel="ACT" >
                                    <span class="h1 block bold" th:text="${resumen.activos}"></span>
                                    <small class="block m-b-xs">Activos</small>
                                </a>
                            </div>
                            <div class="col-md-2 text-center">
                                <a class="verModalidades ext-black pointer" value="2" rel="VAC" >
                                    <span class="h1 block bold" th:text="${resumen.vacaciones}"></span>
                                    <small class="block m-b-xs">Vacaciones</small>
                                </a>
                            </div>
                            <div class="col-md-2 text-center">
                                <a class="verModalidades text-black pointer" value="3" rel="RET" >
                                    <span class="h1 block bold" th:text="${resumen.retirado}"></span>
                                    <small class="block m-b-xs">Retirados</small>
                                </a>
                            </div>
                            <div class="col-md-2 text-center">
                                <a class="verModalidades text-warning pointer" value="4" rel="DSC"  >
                                    <span class="h1 block bold" th:text="${resumen.descanso}" ></span>
                                    <small class="block m-b-xs">Descanso</small>
                                </a>
                            </div>
                            <div class="col-md-2 text-center">
                                <a class="verModalidades text-warning pointer" value="5" rel="PER" >
                                    <span class="h1 block bold" th:text="${resumen.permiso}" ></span>
                                    <small class="block m-b-xs">Permiso</small>
                                </a>
                            </div>
                            <div class="col-md-2 text-center">
                                <a class="verModalidades text-danger pointer" value="6" rel="DESP" >
                                    <span class="h1 block bold" th:text="${resumen.despedido}" ></span>
                                    <small class="block m-b-xs">Despedidos</small>
                                </a>
                            </div>
                        </div>
                    </section>
                </section>

                <section class="panel">            
                    <section class="panel-body">
                        <div class="col-sm-6">
                            <div class="form-group">                                
                                <multiselect 
                                    v-model="oficina" 
                                    v-bind:options='oficinas'
                                    label='nombre'
                                    track-by='id'
                                    v-bind:hide-selected="true"
                                    placeholder="Seleccione una oficina"
                                    v-on:input="oficinaSeleccionada()" >
                                </multiselect>
                            </div>
                        </div>                        
                        <dynatable/>
                    </section>
                </section>
                
            </section>

            <!--MODAL INICIO-->
            <div class="modal fade" id="myModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
                <div class="modal-dialog modal-lg" role="document">
                    <form data-parsley-validate="true" id="formConfig"  method="post">
                        <div class="modal-content">
                            <div class="modal-header">
                                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                                <h4 class="modal-title" id="myModalLabel"> Agregar cargos </h4>
                            </div>
                            <div class="modal-body">
                                <div class="col-md-offset-1 ">                                  
                                    <div class='row'>
                                        <div class="col-sm-10">
                                            <label >Nombre Cargo</label>
                                            <div class="form-group">
                                                <input   required="true" type="text" class="inline form-control" placeholder="Ingrese nombre de cargo" list="listaCargos" v-model="perfilCompania.nombre" />                                                
                                            </div>
                                            <datalist  id="listaCargos" >
                                                <option class="inline form-control" v-for="cargo in listaCargos" v-bind:value="cargo.nombre" v-text="cargo.nombre" readonly=""> </option>
                                            </datalist>
                                        </div>
                                    </div>
                                    <div class='row'>
                                        <div class="col-sm-10">
                                            <label >Nombre Documento Cargo</label>
                                            <div class="form-group">
                                                <input   required="true" type="text" class="inline form-control" placeholder="Ingrese nombre documento"  v-model="perfilCompania.nombreDocumento" />                                                
                                            </div>                                         
                                        </div>
                                    </div>

                                    <div class="modal-footer">
                                        <button type="button" class="btn btn-link" data-dismiss="modal">Close</button>
                                        <button type="button" class="btn btn-success" v-on:click.prevent="addCargo" >Guardar</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
            <!--MODAL FIN-->

            <th:block th:replace="general/oficina/colaborador/colaboradorTemplate"/>

        </div>

        <th:block th:replace="general/oficina/colaborador/colaboradorDynatable"/>

    </div>

</body>
<div layout:fragment="js">
    <script th:inline="javascript">
        /*<![CDATA[*/
        var oficinaId = /*[[${oficina}]]*/ 'json';
        var oficinasJson = /*[[${oficinas.toString()}]]*/ 'json';
        var cargosJson = /*[[${cargos.toString()}]]*/ 'json';
        /*]]>*/
    </script>
    <div th:substituteby="_modules/vue-modal2"></div>
    <div th:substituteby="_layout/includes :: vue-loader"/>
    <div th:substituteby="_layout/includes :: javascript-dynatable"/>
    <script th:src="@{/app/general/oficina/colaborador/colaborador.js}" charset="utf-8"></script>
</div>
</html>
