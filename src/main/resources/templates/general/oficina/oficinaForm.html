<html layout:decorator="zlayout/layout">
    <head>
        <title> Oficina </title>
    </head>
    <body>
        <section layout:fragment="main">

             <header class="header b-b padder-lg">                
                <a th:href="@{/general/oficina}" class="btn btn-default btn-sm pull-right">Regresar</a>
                <h2  id="nombreDocente" th:text="${ oficina.id!=null ? oficina.nombre : 'Nueva Oficina' }" >Nuevo Oficina</h2> 
            </header>

            <section class="panel">

                <section class="panel-body bg-white b">


                    <form th:action="@{/general/oficina/save}" method="post"  class="form-horizontal m-t-lg" data-parsley-validate="true">

                        <input type="hidden" name="id" th:value="${oficina.id}"/>

                        <div class="form-group">

                            <label for="docIdentidad" class="col-sm-3 control-label">Nombre</label>

                            <div class="col-sm-9">

                                <input  type="text" 
                                        class="inline numeric form-control" 
                                        required="true" 
                                        name="nombre"
                                        maxlength="200"
                                        th:value="${oficina.nombre}"/>

                            </div>

                        </div>

                        <div class="form-group">

                            <label for="codigo" class="col-sm-3 control-label">Código</label>

                            <div class="col-sm-4">

                                <input  type="text" 
                                        class="inline numeric form-control sin-espacios" 
                                        required="true" 
                                        name="codigo" 
                                        maxlength="20"
                                        th:value="${oficina.codigo}"/>

                            </div>

                        </div>

                        <div class="form-group">

                            <label for="docIdentidad" class="col-sm-3 control-label">Tipo</label>

                            <div class="col-sm-4">
                                <select name="tipoOficina" 
                                        required="true" 
                                        class="form-control" >
                                    <option></option>
                                    <option th:each="item : ${tipos}"  
                                            th:text="${item.value}"
                                            th:selected="${oficina.tipoOficina == item.name()}"
                                            th:value="${item.name()}" ></option>
                                </select>
                            </div>
                            
                            <input id="tipoOficina" type="hidden" th:value="${oficina.tipoOficina}"/>

                        </div>

                        <div class="form-group" id="placeReferencia">

                        </div>


                        <div class="form-group">
                            <label for="oficinaSuperior.id" class="col-sm-3 control-label">Unidad Superior</label>
                            <div class="col-sm-4">
                                <input  type="text" 
                                        class="inline form-control" 
                                        th:value="${oficina.oficinaSuperior!=null?oficina.oficinaSuperior.id:''}"
                                        th:rel="${oficina.oficinaSuperior!=null?oficina.oficinaSuperior.nombre:''}"
                                        th:rev="${oficina.oficinaSuperior!=null?oficina.oficinaSuperior.codigo:''}"
                                        name="oficinaSuperior.id"/>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="cargoJefe.id" class="col-sm-3 control-label">Cargo Jefe</label>
                            <div class="col-sm-4">
                                <input  type="text" 
                                        class="inline form-control" 
                                        required="true"
                                        th:value="${oficina.cargoJefe!=null?oficina.cargoJefe.id:''}"
                                        th:rel="${oficina.cargoJefe!=null?oficina.cargoJefe.nombreDocumento:''}"
                                        name="cargoJefe.id"/>
                            </div>
                        </div>

                        <div class="form-group m-t-xxlg">
                            <div id="footerOficina" class="col-sm-10 col-sm-offset-4">
                                <button class="btn btn-primary" 
                                        type="submit"
                                        th:text="${oficina.id!=null?'Actualizar':'Guardar'}"
                                        id="btnSave">Guardar</button>                                        
                                <a th:href="@{/general/oficina}" class="btn btn-link" >Cancelar</a>
                            </div>
                        </div>

                    </form>

                    <div id="referenciaTemplate" type="text/x-jsrender" class="hide" >
                        <label for="instanciaOficina" class="col-sm-3 control-label">Referencia</label>
                        <div class="col-sm-4">
                            <input  type="text" 
                                    class="inline form-control" 
                                    th:value="${oficina.instanciaOficina!=null?oficina.instanciaOficina:''}"
                                    th:rel="${oficina.instanciaOficina!=null?oficina.instanciaOficinaNombre:''}"
                                    th:rev="${oficina.instanciaOficina!=null?oficina.instanciaOficinaCodigo:''}"
                                    name="instanciaOficina"/>
                        </div>
                    </div>

                    <!--div id="oficinaTemplate" type="text/x-jsrender" class="hide" >
                        <div th:substituteby="general/oficina/oficinaTemplate"/>
                    </div-->

                </section>

            </section>

        </section>

        <div layout:fragment="js">
            <script th:src="@{/app/general/oficina/oficinaForm.js}" charset="utf-8"></script>
        </div>

    </body>
</html>
