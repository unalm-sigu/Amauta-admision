<html layout:decorator="_layout/layout">
    <head>
        <title> Oficina </title>
    </head>
    <body>
        <section layout:fragment="main" >
            <div id="oficinaFormVUE" >
                <header class="header b-b padder-lg">                
                    <a th:href="${origen}" class="btn btn-default btn-sm pull-right">Regresar</a>
                    <h2 v-text="oficina.id != null ? oficina.nombre : 'Nueva Oficina' " >Nuevo Oficina</h2> 
                </header>

                <section class="panel">
                    <section class="panel-body bg-white b">
                        <!--<pre>{{oficina}}</pre>-->

                        <form id="formControl" class="form-horizontal m-t-lg" data-parsley-validate="true">
                            
                            <div class="form-group">
                                <label class="col-sm-3 control-label">Nombre</label>
                                <div class="col-sm-9">
                                    <input  type="text" 
                                            class="inline numeric form-control" 
                                            required="true" 
                                            maxlength="200"
                                            v-model="oficina.nombre"/>
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="codigo" class="col-sm-3 control-label">Código</label>
                                <div class="col-sm-4">
                                    <input  type="text" 
                                            class="inline numeric form-control " 
                                            required="true" 
                                            name="codigo" 
                                            maxlength="20"
                                            v-model="oficina.codigo"/>
                                </div>
                            </div>

                            <div class="form-group ">
                                <label class="col-sm-3 control-label"> Tipo</label>
                                <div class="col-sm-4">
                                    <multiselect v-model="oficina.tipoOficina" 
                                                 v-bind:options='tiposOficina'
                                                 label='nombre'
                                                 track-by='id'
                                                 v-bind:allow-empty="false"
                                                 v-on:input ="loadReferencias"
                                                 placeholder="Seleccione tipo de oficina">

                                    </multiselect>
                                    <input type="text" v-model="oficina.tipoOficina.id" class="hide" required="true" />
                                </div>
                            </div>
                            
                            <div class="form-group" v-if="hayInstancia">
                                <label class="col-sm-3 control-label">Referencia</label>
                                <div class="col-sm-4">
                                    <multiselect v-model="oficina.instanciaReferencia" 
                                                 v-bind:options='referencias'
                                                 label='descripcion'
                                                 track-by='id'
                                                 v-bind:allow-empty="false"
                                                 v-on:input ="verRef"
                                                 placeholder="Seleccione Referencia">
                                        <template slot="option" slot-scope="props">    
                                            <div class="option__desc">
                                                <span class="bold block" > {{ props.option.codigo }} - {{ props.option.nombre }}</span>
                                                <small v-if="props.option.modalidad == 'EPG' " class="block">{{props.option.tipoEnum.value}}</small>
                                                <div class="block"><span class="label" v-bind:class="classLabel(props.option)">  {{props.option.estadoEnum.value}}  </span></div>
                                            </div>                                 
                                        </template>
                                    </multiselect>
                                    <input type="text" v-model="oficina.instanciaReferencia.id" class="hide" required="true" />
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label class="col-sm-3 control-label">Unidad Superior</label>
                                <div class="col-sm-4">
                                    <multiselect v-model="oficina.oficinaSuperior" 
                                                 v-on:search-change="findOficinaSuperior"
                                                 v-bind:options='oficinaSuperior'
                                                 label='nombre'
                                                 track-by='id'
                                                 v-bind:allow-empty="false"
                                                 placeholder="Seleccione Unidad superior">
                                    </multiselect>
                                    <input type="text" v-model="oficina.oficinaSuperior.id" class="hide" required="true" />
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-3 control-label">Cargo Jefe</label>
                                <div class="col-sm-4">
                                    <multiselect v-model="oficina.cargoJefe" 
                                                 v-bind:options='cargosJefe'
                                                 v-on:search-change="allCargoJefe"
                                                 label='nombre'
                                                 track-by='id'
                                                 v-bind:allow-empty="false"
                                                 placeholder="Seleccione Cargo">
                                    </multiselect>
                                    <input type="text" v-model="oficina.cargoJefe" class="hide"   required="true" />
                                </div>
                            </div>

                            <div class="form-group m-t-xxlg">
                                <div id="footerOficina" class="col-sm-10 col-sm-offset-4">
                                    <a class="btn btn-primary"
                                       v-text="oficina.id != null ? 'Actualizar' :'Guardar'" v-on:click='save'></a>                                        
                                    <a th:href="${origen}" class="btn btn-link" >Regresar</a>
                                </div>
                            </div>

                        </form>

                    </section>

                </section>
            </div>
        </section>

        <div layout:fragment="js" >
            <script  th:inline="javascript" >
                /*<![CDATA[*/
                var oficinaJson = /*[[${oficina}]]*/'';
                var tiposOficinaJson = /*[[${tiposOficina}]]*/'';
                var rutaModulo = 'general/oficina';
                /*]]>*/
            </script>
            <script th:src="@{/app/general/oficina/oficinaForm.js}" charset="utf-8"></script>
        </div>

    </body>
</html>
