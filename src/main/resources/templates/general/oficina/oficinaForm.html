<html layout:decorator="_layout/layout">
    <head>
        <title> Oficina </title>
    </head>
    <body>
        <section layout:fragment="main" >
            <div id="oficinaFormVUE" >
                <header class="header b-b padder-lg">                
                    <a href="/general/oficina" class="btn btn-default btn-sm pull-right">Regresar</a>
                    <h2   v-text="'Nueva Oficina' " >Nuevo Oficina</h2> 
                </header>

                <section class="panel">
                    <section class="panel-body bg-white b">
                        <form id="formOficina" class="form-horizontal m-t-lg" data-parsley-validate="true">
                            <div class="form-group">

                                <label class="col-sm-3 control-label">Nombre</label>

                                <div class="col-sm-9">

                                    <input  type="text" 
                                            class="inline numeric form-control" 
                                            required="true" 
                                            maxlength="200"
                                            v-model="oficina.nombre"/>
                                </div>

                            </div>

                            <div class="form-group">

                                <label for="codigo" class="col-sm-3 control-label">Código</label>

                                <div class="col-sm-4">

                                    <input  type="text" 
                                            class="inline numeric form-control " 
                                            required="true" 
                                            name="codigo" 
                                            maxlength="20"
                                            v-model="oficina.codigo"/>
                                </div>

                            </div>

                            <div class="form-group ">
                                <label>Tipo</label>
                                <div class="col-sm-4">
                                    <multiselect v-model="tipoOficina" 
                                                 v-bind:options='tipos'
                                                 label='nombre'
                                                 track-by='id'
                                                 v-bind:allow-empty="false"
                                                 v-on:select ="tipoSelect"
                                                 placeholder="Seleccione tipo de oficina">
                                    
                                    </multiselect>
                                    <input type="text" v-model="oficina.tipoOficina" class="hide"/>
                                </div>
                            </div>
                            <div class="form-group" v-if="hayInstancia">

                                <label>Referencia</label>
                                <multiselect v-model="oficina.instanciaOficina" 
                                             v-bind:options='instanciaOficina'
                                             label='nombre'
                                             track-by='id'
                                             v-bind:allow-empty="false"
                                             placeholder="Seleccione Referencia">
                                </multiselect>
                                <input type="text" v-model="oficina.instanciaOficina" class="hide"/>
                            </div>
                            <div class="form-group">

                                <label>Unidad Superior</label>
                                <multiselect v-model="oficina.oficinaSuperior" 
                                             v-on:search-change="findOficinaSuperior"
                                             v-bind:options='oficinaSuperior'
                                             label='nombre'
                                             track-by='id'
                                             v-bind:allow-empty="false"
                                             placeholder="Seleccione Unidad superior">
                                </multiselect>
                                <input type="text" v-model="oficina.oficinaSuperior" class="hide"/>
                            </div>

                            <div class="form-group">

                                <label>Cargo Jefe</label>
                                <multiselect v-model="oficina.cargoJefe" 
                                             v-bind:options='cargosJefe'
                                             v-on:search-change="allCargoJefe"
                                             label='nombre'
                                             track-by='id'
                                             v-bind:allow-empty="false"
                                             placeholder="Seleccione Cargo">
                                </multiselect>
                                <input type="text" v-model="oficina.cargoJefe" class="hide"/>
                            </div>

                            <div class="form-group m-t-xxlg">
                                <div id="footerOficina" class="col-sm-10 col-sm-offset-4">
                                    <a class="btn btn-primary"
                                       v-text="'Guardar'"></a>                                        
                                    <a href="/general/oficina" class="btn btn-link" >Cancelar</a>
                                </div>
                            </div>

                        </form>

                    </section>

                </section>
            </div>
        </section>

        <div layout:fragment="js" >
            <script  th:inline="javascript" >
                /*<![CDATA[*/
                var oficinaJson = /*[[${oficina}]]*/'';
                var tiposJson = /*[[${tipos}]]*/'';
                /*]]>*/
            </script>
            <script th:src="@{/app/general/oficina/oficinaForm.js}" charset="utf-8"></script>
        </div>

    </body>
</html>
