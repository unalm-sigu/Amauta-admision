<html layout:decorator="_layout/layout">
    <head>
        <title>Administración de Oficinas</title>
    <div th:substituteby="_layout/includes :: styles-dynatable"></div>
</head>
<body>
    <div layout:fragment="main">

         <header class="header b-b padder-lg">

            <div class="pull-right m-t-md">                 
                <a class="btn btn-primary btn-sm" type="button" th:href="@{/general/oficina/nuevo}" >Nuevo</a>
            </div>  

            <h2>Oficinas de la Institución</h2>

        </header>

        <section class="panel">

            <section class="panel-body">

                <table id="dynaTable" class="table table-striped">
                    <thead class="panel panel-heading">
                        <tr>
                            <th class="col-xs-5 v-middle">Unidad</th>                    
                            <th class="col-xs-2 v-middle">Dependencia</th>                    
                            <th class="col-xs-3 text-center"><span>Jefatura</span></th>
                            <th class="col-xs-1 text-center"><span>Colaboradores</span></th>
                            <th class="col-xs-1 text-center"><span>Estado</span></th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>

            </section>
            
        </section>
        
        <div th:substituteby="templates/modal"/> 
        <div th:substituteby="general/oficina/oficinaModals"/>
        <script id="oficinaTemplate" type="text/x-jsrender" class="hide" ><div th:substituteby="general/oficina/oficinaTemplate"/></script>

    </div>

    <div layout:fragment="js">
        <div th:substituteby="_layout/includes :: javascript-dynatable"/>
        <script th:src="@{/app/general/oficina/oficina.js}" charset="utf-8"></script>
    </div>

</body>
</html>
