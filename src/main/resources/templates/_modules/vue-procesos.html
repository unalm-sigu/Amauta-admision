<div id="vue-procesos">
    <modal-vik ref="modalProcesos"
               v-bind="modalProcesos"
               v-bind:footer="false">
        <div slot="body">
            <h5>{{messageAvance}}</h5>
            <div class="progress">
                <div class="progress-bar progress-bar-primary progress-bar-striped active" role="progressbar" v-bind:style="{width: porcentajeAvance +'%'}">
                    {{porcentajeAvance}}% Completado..
                </div>
            </div>
        </div>

    </modal-vik>
</div> 
<script>
    Vue.component('vue-procesos', {
        template: '#vue-procesos',
        data: {
            modalProcesos: {
                id: 'modalProcesos',
                styleModal: {'background-color': '#D8D8D8'},
                dataBackdrop: 'static',
                dataKeyboard: 'false',
                header: false,
                footer: false
            }
        },
        props: {
            messageAvance: {type: String, default: ""},
            porcentajeAvance: {type: Number, default: 0},
        },
        mounted() {
            let vue = this;
            $global.$on('MODAL-PROCESS-OPEN', () => {
                vue.$refs.modalProcesos.open();
            });
            $global.$on('MODAL-PROCESS-CLOSE', () => {
                vue.$refs.modalProcesos.close();
            });
        },
        methods: {
            repreload() {
                this.search = this.getParameterByName('queries[search]');
                this.search = (this.search == null) ? '' : this.search;
                if (this.getParameterByName('page')) {
                    this.page.currentPage = parseInt(this.getParameterByName('page'));
                } else {
                    this.loadRemoteData();
                }
            }
        }
    });
</script>
