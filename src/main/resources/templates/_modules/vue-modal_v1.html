<div  id="vue-modal_v1">
    <template>
        <transition name="modal">

            <div class="modal fade" tabindex="-1" role="dialog" data-backdrop="static" data-keyboard="false"  >

                <div class="modal-dialog" v-bind:class="modalsize" role="document">

                    <div class="modal-content" >

                        <div v-if="header" class="modal-header">
                            <slot name="header">

                                <h4 class="modal-title text-white">{{ title }}</h4>

                            </slot>
                        </div>

                        <div class="modal-body" v-bind:class="{'modal-scrollbar':scrollable}" >
                            <slot name="body">
                                <p>Modal Body</p>
                            </slot>
                        </div>

                        <div v-if="footer"  class="modal-footer">
                            <slot name="footer">
                                <button v-on:click="close" type="button" class="btn" v-bind:class="cancelclass" data-dismiss="modal" v-bind:disabled="processing">{{cancelbtn}}</button>
                                <button v-if="showaccept" 
                                        v-on:click.prevent="execute" 
                                        type="button" 
                                        class="btn" 
                                        v-bind:class="okclass" 
                                        v-bind:disabled="processing" >
                                    <span v-if="processing"><i class="fa fa-spinner fa-pulse fa-fw"></i></span>
                                    {{okbtn}}
                                </button>
                            </slot>
                        </div>

                    </div>
                </div>

            </div>
        </transition>
    </template>
</div>
<script>
    Vue.component('modal-simple', {
        template: '#vue-modal_v1',
        props: {
            header: {type: Boolean, default: true},
            footer: {type: Boolean, default: true},
            scrollable: {type: Boolean, default: false},
            btnclose: {type: Boolean, default: true},
            title: {type: String, default: 'Modal'},
            okbtn: {type: String, default: 'Aceptar'},
            okaction: {type: Function, default: () => {
                }},
            okclass: {type: String, default: 'btn-info'},
            cancelbtn: {type: String, default: 'Cerrar'},
            cancelaction: {type: Function, default: () => {
                }},
            cancelclass: {type: String, default: 'btn-default'},
            modalsize: {type: String, default: "modal-md"},
            showaccept: {type: Boolean, default: true},
            disabledok: {type: Boolean, default: false},
            bodyblocker: {type: Boolean, default: true},
            showbody: {type: Boolean, default: true},
        },
        data() {
            return {
                processing: false
            }
        },
        methods: {
            open() {

                let $vue = this;
                $vue.processing = false;
                $($vue.$el).modal('show');
            },
            close() {

                let $vue = this;
                $($vue.$el).modal('hide');
                $vue.processing = false;
            },
            stop() {
                let $vue = this;
                $vue.processing = false;
            },
            play() {
                let $vue = this;
                $vue.processing = true;
            },
            execute() {

                let $vue = this;

                if ($($vue.$el).find('form[data-parsley-validate="true"]')) {
                    if ($($vue.$el).find('form[data-parsley-validate="true"]').length) {
                        if (!$($vue.$el).find('form[data-parsley-validate="true"]').parsley().validate()) {
                            return;
                        }
                    }
                }

                $vue.processing = true;

                $vue.okaction();
            },
        }
    });
</script>
