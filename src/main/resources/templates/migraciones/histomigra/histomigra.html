<html layout:decorator="_layout/layout">
    <head>
        <title>Historial Oracle</title>
        <style>
            b-b-histo {
                border-bottom: 1px solid #90A7B4 !important;
            }
            .b-t-histo {
                border-top: 1px solid #90A7B4 !important;
            }
            .bg-info-histo {
                background-color: #F3F6F6 !important;
            }
        </style>
    </head>

    <body>
        <div layout:fragment="main">
            <div id="histoVUE" v-cloak="">

                <header class="header b-b padder-lg">
                    <div class="btn-group pull-right">
                        <a th:href="${origen}" class="btn btn-default">Regresar</a>
                    </div>
                    <h2>Historial Oracle - {{alumno.codigo}} {{alumno.persona.apellidosNombres}}</h2>
                </header>

                <section class="wrapper-lg">
                    <section class="panel">
                        <section class="panel-body">
                            <raptor-table 
                                v-bind:url="histoURL" 
                                v-bind:pagination="pagination" 
                                v-bind:paginate="false" 
                                v-bind:searcher="false" 
                                ref="histoRaptor">
                                <div slot="header"></div>

                                <template scope="props" >
                                    <table class="table table-striped table-hover">
                                        <thead> 
                                            <tr>
                                                <th class="col-md-1 text-center v-middle">Ciclo</th>
                                                <th class="col-md-1 text-center v-middle">Código Antiguo</th>
                                                <th class="col-md-6 text-center v-middle">Curso</th>
                                                <th class="col-md-1 text-center v-middle">MOV</th>
                                                <th class="col-md-1 text-center v-middle">Créditos</th>
                                                <th class="col-md-1 text-center v-middle">Nota</th>
                                                <th class="col-md-1 text-center v-middle">Tipo Mov Oracle</th>
                                                <th></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr v-for="item in props.data">
                                                <td class="v-middle text-center bg-info-histo b-t-histo b-b-histo" 
                                                    v-if="item.rowspan > 0"
                                                    v-bind:rowspan="item.rowspan">
                                                    <span v-text="item.ciclo" class="block text-primary"></span>
                                                    <span v-if="item.estadoCiclo == 'MAT' " v-text="item.estadoCiclo" class="block text-success"></span>
                                                    <span v-else="" v-text="item.estadoCiclo" class="block text-danger"></span>
                                                </td>
                                                <td class="v-middle text-center" v-text="item.curCodigo"></td>
                                                <td class="v-middle">
                                                    <div class="block text-primary">{{item.curso.nombre}}</div>
                                                    <div class="block">
                                                        <span v-text="item.curso.codigo"></span> &nbsp;
                                                        <span v-text="item.curso.tpc"></span> &nbsp;
                                                        (<span v-text="item.aluciclocurso.id"></span>)
                                                    </div>
                                                </td>
                                                <td class="v-middle text-center">
                                                    <span v-text="item.mov" class="text-primary"></span> |
                                                    <span v-text="item.aluciclocurso.estado" class="text-success"></span> |
                                                    <i v-if="item.movOk" class="fa fa-check-circle text-success"></i>
                                                    <i v-else="" class="fa fa-exclamation-circle text-danger"></i>
                                                </td>
                                                <td class="v-middle text-center" >
                                                    <span v-text="item.curCredit" class="text-primary"></span> |
                                                    <span v-text="item.aluciclocurso.creditos" class="text-success"></span> |
                                                    <i v-if="item.creditosOk" class="fa fa-check-circle text-success"></i>
                                                    <i v-else="" class="fa fa-exclamation-circle text-danger"></i>
                                                </td>
                                                <td class="v-middle text-center">
                                                    <span v-text="item.nota" class="text-primary"></span> |
                                                    <span v-text="item.aluciclocurso.nota" class="text-success"></span> |
                                                    <i v-if="item.notaOk" class="fa fa-check-circle text-success"></i>
                                                    <i v-else="" class="fa fa-exclamation-circle text-danger"></i>
                                                </td>
                                                <td class="v-middle text-center text-primary bold" v-text="item.tMov"></td>
                                                <td>
                                                    <button v-if="item.algoFalta &amp;&amp; !item.migrando" v-on:click="migrarItem(item)"
                                                            class="btn btn-sm btn-warning">Migrar</button>
                                                    <button v-if="item.algoFalta &amp;&amp; item.migrando"
                                                            class="btn btn-sm btn-danger">
                                                        <i class="fa fa-spinner fa-spin"></i> Migrando
                                                    </button>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </template>
                            </raptor-table>

                        </section>
                    </section>
                </section>
            </div>
        </div>
        <div layout:fragment="js">
            <script th:inline="javascript">
                var alumnoJson = /*[[${alumno.toString()}]]*/ {};
                var rutaModulo = 'migraciones/histomigra';
            </script>
            <div th:replace="_modules/vue-modal"></div>
            <div th:substituteby="_modules/vue-raptor-table"></div>
            <script th:src="@{/app/migraciones/histomigra/histomigra.js}" charset="utf-8"></script>
        </div>
    </body>

</html>
