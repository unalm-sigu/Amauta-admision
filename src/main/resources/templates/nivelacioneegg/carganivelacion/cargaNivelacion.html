        <style>
            .circle-recorrido {
                display: block;
                border-radius: 50%;
                width: 50px;
                height: 50px;
                overflow: hidden;
                margin: 0 auto;
                line-height: 50px;
                /*                text-align: center;*/
                font-size: 16px;
                /*                margin-left: 49px;*/
                text-indent: 0;
                vertical-align: middle;
                margin-top: 2px;
                margin-bottom: 2px;
            }

            .circle-recorrido.bgr-success {
                background-color: #2ECC71;
                color: #fff;
            }

            .circle-recorrido.bgr-danger {
                background-color: #E74C3C;
                color: #fff;
            }

            .circle-recorrido.bgr-warning {
                background-color: #F1B41E;
                color: #fff;
            }

            .circle-recorrido.bgr-black {
                background-color: #3C4043;
                color: #fff;
            }

            .circle-recorrido.bgr-default {
                background-color: #EBEDEF;
                color: #000;
            }
        </style>
    </head>
