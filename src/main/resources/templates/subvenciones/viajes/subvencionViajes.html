                                                </td>

                                                </td>

                                                            <i class="fa fa-cog"></i>
                                                        </a> 
                                                        <ul class="dropdown-menu pull-right">
                                                            <li><a href="#" >Editar</a></li>
                                                        </ul>

                                                </td>        
                                            </tr>
                                        </tbody>
                                    </table>
                                </template>
                            </raptor-table>

                        </section>
                    </section>

                <div th:substituteby="_modules/vue-modal-confirm"></div>
