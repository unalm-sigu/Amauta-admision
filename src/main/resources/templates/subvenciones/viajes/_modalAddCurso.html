<modal-vik ref="modalAddCurso"
           v-bind="modalAddCurso"
           v-bind:okaction="saveViaje">
    <div slot="body">
        <form v-bind:id="modalAddCurso.form">
            <h4>Ingreso los datos para crear el viaje de curso</h4>

            <div class="form-group">
                <label>Curso</label>
                <multiselect v-model='viajeCursoSelect.curso'               
                             v-bind:options='cursos'
                             v-on:input="loadSecciones"
                             placeholder="Elija un curso"
                             label='nombre'
                             track-by='id'>
                    <template slot="option" slot-scope="props">
                        <span class="block bold text-primary">{{props.option.nombre}}</span> 
                        <span class="block">{{props.option.codigo}} | {{props.option.tpc}}</span> 
                        <span class="block">Dpto: {{props.option.departamentoAcademico.nombre}}</span> 
                    </template>
                    <template slot="noOptions">La lista se encuentra vacía</template>
                    <template slot="noResult">No se encontraron resultados</template>
                </multiselect>
                <input class="hide" v-bind:value="getObjectId(viajeCursoSelect.curso)" required="yes"/>
            </div>

            <div class="form-group">
                <label>Sección</label>
                <multiselect v-model='viajeCursoSelect.seccion'               
                             v-bind:options='secciones'
                             v-on:input="loadAlumnos"
                             placeholder="Elija una sección"
                             label='codigo2'
                             track-by='id'>
                    <template slot="option" slot-scope="props">
                        <span class="block text-primary"><strong>{{props.option.codigo2}}</strong> Gpo: {{props.option.grupoHoras.codigo}}</span> 
                        <span class="block">{{props.option.tipoSeccionEnum.value}}</span> 
                    </template>
                    <template slot="noOptions">La lista se encuentra vacía</template>
                    <template slot="noResult">No se encontraron resultados</template>
                </multiselect>
                <input class="hide" v-bind:value="getObjectId(viajeCursoSelect.seccion)" required="yes"/>
            </div>

            <div class="form-group">
                <label>Alumno delegado</label>
                <multiselect v-model='viajeCursoSelect.alumnoDelegado'               
                             v-bind:options='alumnos'
                             placeholder="Elija un alumno"
                             label='apellidosNombres'
                             track-by='id'>
                    <template slot="option" slot-scope="props">
                        <span class="block text-primary bold">{{props.option.persona.apellidosNombres}}</span> 
                        <span class="block bold">Matrícula: {{props.option.codigo}}</span> 
                    </template>
                    <template slot="noOptions">La lista se encuentra vacía</template>
                    <template slot="noResult">No se encontraron resultados</template>
                </multiselect>
                <input class="hide" v-bind:value="getObjectId(viajeCursoSelect.alumnoDelegado)" required="yes"/>
            </div>
        </form>
    </div>
</modal-vik>
