spring.profiles.active: devel

server.session.timeout: 7200


oauth:
    google:
        api: pe.albatross.zelpers.security.oauth.Google2Api


spring.thymeleaf.cache: false

spring.resources.chain.cache=false


persistence:
    driver: com.mysql.jdbc.Driver
    dialect: org.hibernate.dialect.MySQLDialect
    model: pe.edu.lamolina.pivot


task:
    corePoolSize: 3
    threadName: Spring-Task-


error:
    whitelabel:
        enabled: false


multipart.maxFileSize: 80MB
multipart.maxRequestSize: 80MB


logging.level.org.springframework.web: INFO
logging.level.org.hibernate: INFO
logging.level.pe.edu.lamolina: INFO


despliegue:
    activo: false
    mailer: false


spring.redis.database: 4
spring.redis.host: localhost
spring.redis.port: 6379

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
